openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: A-NAS Product API
  version: 1.0.1-rc.1
  description: >-
    Local-only authenticated product API for A-NAS storage, files, accounts, recycle bin, manual and scheduled snapshots,
    the managed photo library, the media center, the in-place music library, the shared feedback list, resumable uploads and followed downloads (the transfer center), an opt-in administrator terminal, container lifecycle actions that go through the separate
    container agent, and each member's AI assistant (proposed in ADR 0024).
servers:
  - url: http://127.0.0.1:8080
security:
  - cookieAuth: []
paths:
  /healthz:
    get:
      security: []
      operationId: getHealth
      summary: Report whether the API process is alive
      responses:
        "200":
          description: The API process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/system:
    get:
      operationId: getSystemState
      summary: Read the latest observed host system state
      responses:
        "200":
          description: The observed system state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemResponse"
        "503":
          $ref: "#/components/responses/StateUnavailable"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/disks:
    get:
      operationId: listDisks
      summary: List disks by stable resource ID
      responses:
        "200":
          description: Disks ordered by stable resource ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisksResponse"
        "503":
          $ref: "#/components/responses/StateUnavailable"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/host-state:
    get:
      operationId: getHostState
      summary: Read one atomic host system and disk snapshot
      responses:
        "200":
          description: The observed host state and its data source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostStateResponse"
        "503":
          $ref: "#/components/responses/StateUnavailable"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/setup/status:
    get:
      security: []
      operationId: getSetupStatus
      responses:
        "200": { description: Setup state, content: { application/json: { schema: { $ref: "#/components/schemas/SetupStatus" } } } }
  /api/v1/setup/admin:
    post:
      security: []
      operationId: setupAdministrator
      description: Create the first administrator. Only a direct loopback connection may (403 setup_local_only otherwise); a concurrent or later setup answers 409 setup_complete.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SetupRequest" } } } }
      responses:
        "201": { description: Administrator created, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "403": { $ref: "#/components/responses/ProductError" }
        "409": { $ref: "#/components/responses/ProductError" }
        "422": { $ref: "#/components/responses/ProductError" }
  /api/v1/session:
    post:
      security: []
      operationId: createSession
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LoginRequest" } } } }
      responses:
        "200": { description: Authenticated session, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "401": { $ref: "#/components/responses/ProductError" }
    get:
      operationId: getSession
      responses:
        "200": { description: Current session, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "401": { $ref: "#/components/responses/ProductError" }
    delete:
      operationId: deleteSession
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "204": { description: Session ended }
  /api/v1/session/password:
    post:
      operationId: changePassword
      description: Replace the signed-in user's password. Required before anything else after an administrator reset it.
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PasswordChange" } } } }
      responses:
        "204": { description: Password changed and SMB re-enabled }
        "403": { $ref: "#/components/responses/ProductError" }
        "422": { $ref: "#/components/responses/ProductError" }
  /api/v1/session/profile:
    patch:
      operationId: updateProfile
      description: >-
        Change the name the signed-in user is shown by. Pages show the nickname instead of the username everywhere
        except where the account name itself matters (sign-in, SMB, the terminal). An empty nickname shows the
        username again.
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProfileChange" } } } }
      responses:
        "200": { description: The updated account, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { $ref: "#/components/responses/ProductError" }
        "409": { $ref: "#/components/responses/ProductError" }
        "422": { $ref: "#/components/responses/ProductError" }
  /api/v1/session/avatar:
    put:
      operationId: setAvatar
      description: >-
        Replace the signed-in user's avatar with the picture in the body. The server turns it upright, crops the
        centre square, scales it to at most 256 pixels and stores it as a JPEG of a few dozen kilobytes; the
        original is not kept. Clients crop first and send the square they want.
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/gif: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        "200": { description: The updated account with its new avatarVersion, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "413": { description: "image_too_large: more than 12 MiB or 25 million pixels", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "415": { description: "unsupported_image: not a JPEG, PNG, GIF or WebP picture", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    delete:
      operationId: removeAvatar
      description: Go back to the initial on a coloured disc.
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "200": { description: The updated account, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
  /api/v1/profiles:
    get:
      operationId: listProfiles
      description: >-
        How every account appears, disabled ones included, for any signed-in user: the name to show and the avatar.
        Role and status stay with listUsers, which only administrators may call.
      responses:
        "200": { description: Profiles, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Profile" } } } } } } }
  /api/v1/users/{userId}/avatar:
    get:
      operationId: getAvatar
      description: >-
        An account's avatar for any signed-in user. Ask with v set to the account's avatarVersion: that URL never
        changes content and is cached for a year; without it the answer must be revalidated (ETag).
      parameters:
        - { $ref: "#/components/parameters/UserID" }
        - { name: v, in: query, schema: { type: string } }
      responses:
        "200": { description: Square JPEG avatar, content: { image/jpeg: { schema: { type: string, format: binary } } } }
        "304": { description: The cached avatar is current }
        "404": { $ref: "#/components/responses/ProductError" }
  /api/v1/notifications:
    get:
      operationId: listNotifications
      description: Unacknowledged notices such as an administrator viewing the user's private space or resetting the password.
      responses:
        "200": { description: Notifications, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Notification" } } } } } } }
  /api/v1/notifications/{notificationId}/acknowledge:
    post:
      operationId: acknowledgeNotification
      parameters: [{ name: notificationId, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "204": { description: Notification acknowledged }
        "404": { $ref: "#/components/responses/ProductError" }
  /api/v1/users/{userId}/viewing:
    post:
      operationId: startViewing
      description: Administrative Viewing Mode. An administrator re-enters their password and a reason to read another account's private space for 24 hours; the access is audited and the owner is notified.
      parameters: [{ $ref: "#/components/parameters/UserID" }, { $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ViewingRequest" } } } }
      responses:
        "201": { description: Read-only access granted, content: { application/json: { schema: { $ref: "#/components/schemas/ViewingGrant" } } } }
        "403": { $ref: "#/components/responses/ProductError" }
        "409": { $ref: "#/components/responses/ProductError" }
        "422": { $ref: "#/components/responses/ProductError" }
        "423": { $ref: "#/components/responses/ProductError" }
  /api/v1/viewing/{grantId}:
    delete:
      operationId: endViewing
      parameters: [{ name: grantId, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "204": { description: Viewing ended and access revoked }
        "404": { $ref: "#/components/responses/ProductError" }
  /api/v1/users:
    get:
      operationId: listUsers
      responses:
        "200": { description: Users, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/User" } } } } } } }
        "403": { $ref: "#/components/responses/ProductError" }
    post:
      operationId: createUser
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CredentialInput" } } } }
      responses:
        "201": { description: Member created, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "409": { $ref: "#/components/responses/ProductError" }
        "422": { $ref: "#/components/responses/ProductError" }
  /api/v1/users/{userId}:
    delete:
      operationId: disableUser
      parameters: [{ $ref: "#/components/parameters/UserID" }, { $ref: "#/components/parameters/CSRFToken" }]
      description: Disable an account. Web sign-in ends first; when the Host Agent then fails to disable the SMB credential the answer is 503 smb_disable_pending, and disabling again retries only that step.
      responses:
        "204": { description: User disabled }
        "403": { $ref: "#/components/responses/ProductError" }
        "503": { $ref: "#/components/responses/ProductError" }
  /api/v1/users/{userId}/credential:
    patch:
      operationId: resetUserCredential
      parameters: [{ $ref: "#/components/parameters/UserID" }, { $ref: "#/components/parameters/CSRFToken" }]
      description: Choose a temporary password for another account; administrators change their own with changePassword.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [password], properties: { password: { $ref: "#/components/schemas/NewPassword" } } } } } }
      responses:
        "204": { description: Credential reset }
        "403": { $ref: "#/components/responses/ProductError" }
        "422": { $ref: "#/components/responses/ProductError" }
  /api/v1/volumes:
    get:
      operationId: listVolumes
      responses:
        "200": { description: Data volumes, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Volume" } } } } } } }
  /api/v1/storage/plans:
    post:
      operationId: createStoragePlan
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [diskId], properties: { diskId: { $ref: "#/components/schemas/StableResourceID" } } } } } }
      responses:
        "201": { description: Destructive storage plan, content: { application/json: { schema: { $ref: "#/components/schemas/StoragePlan" } } } }
        "422": { $ref: "#/components/responses/ProductError" }
  /api/v1/storage/plans/{planId}/confirm:
    post:
      operationId: confirmStoragePlan
      parameters: [{ $ref: "#/components/parameters/PlanID" }, { $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [confirmationPhrase], properties: { confirmationPhrase: { type: string } } } } } }
      responses:
        "200": { description: Confirmed plan, content: { application/json: { schema: { $ref: "#/components/schemas/StoragePlan" } } } }
        "410": { $ref: "#/components/responses/ProductError" }
  /api/v1/storage/plans/{planId}/execute:
    post:
      operationId: executeStoragePlan
      parameters: [{ $ref: "#/components/parameters/PlanID" }, { $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "200": { description: Executed plan, content: { application/json: { schema: { $ref: "#/components/schemas/StoragePlan" } } } }
        "409": { $ref: "#/components/responses/ProductError" }
        "503": { $ref: "#/components/responses/ProductError" }
  /api/v1/operations/{operationId}:
    get:
      operationId: getOperation
      parameters: [{ name: operationId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Operation state, content: { application/json: { schema: { $ref: "#/components/schemas/StoragePlan" } } } }
  /api/v1/audit:
    get:
      operationId: listAuditEvents
      responses:
        "200": { description: Administrator audit export, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } } } } } } }
        "403": { $ref: "#/components/responses/ProductError" }
  /api/v1/activity:
    get:
      operationId: listActivity
      summary: Page through the activity log, newest first
      description: >-
        Merges the account, sign-in, file, storage and photo audit trails. Administrators see every account's events,
        members only their own and what was done to their account or private space. File names in another member's
        private space are left out (redacted), and photo events are only shown to the account that made them.
      parameters:
        - { name: before, in: query, description: The next value of the previous page., schema: { type: string } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - { name: category, in: query, schema: { $ref: "#/components/schemas/ActivityCategory" } }
        - { name: actor, in: query, description: "Administrators only: an account ID, or system for what the device did on its own; members always get their own events.", schema: { type: string } }
        - { name: q, in: query, description: "Matches file and photo names, action codes, client addresses and account names.", schema: { type: string, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200": { description: One page of events, content: { application/json: { schema: { $ref: "#/components/schemas/ActivityPage" } } } }
        "400": { $ref: "#/components/responses/ProductError" }
        "401": { $ref: "#/components/responses/ProductError" }
  /api/v1/system-logs:
    get:
      operationId: listSystemLogs
      summary: Read A-NAS service logs from the systemd journal through the Host Agent, newest first
      description: >-
        Administrators only. The Host Agent reads only the allowlisted A-NAS services (ADR 0020); levels, messages
        and fields of JSON log lines come from the line itself. A page stops after 20,000 scanned lines; next then
        continues from the last line scanned.
      parameters:
        - { name: service, in: query, schema: { $ref: "#/components/schemas/SystemLogService" } }
        - { name: level, in: query, description: The least severe level to include., schema: { type: string, enum: [error, warning, info, debug] } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - { name: q, in: query, description: "Plain text matched against messages and fields, case-insensitively.", schema: { type: string, maxLength: 200 } }
        - { name: before, in: query, description: Continue with lines older than this cursor (the next value of the previous page)., schema: { type: string } }
        - { name: after, in: query, description: "Only lines newer than this cursor, for following the log.", schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
      responses:
        "200": { description: One page of log lines, content: { application/json: { schema: { $ref: "#/components/schemas/SystemLogPage" } } } }
        "400": { $ref: "#/components/responses/ProductError" }
        "401": { $ref: "#/components/responses/ProductError" }
        "403": { $ref: "#/components/responses/ProductError" }
        "503": { $ref: "#/components/responses/ProductError" }
  /api/v1/spaces:
    get:
      operationId: listSpaces
      responses:
        "200": { description: Visible spaces only, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Space" } } } } } } }
  /api/v1/spaces/{spaceId}/entries:
    get:
      operationId: listEntries
      parameters: [{ $ref: "#/components/parameters/SpaceID" }, { name: parentId, in: query, schema: { type: string } }]
      responses:
        "200": { description: Directory entries, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/FileEntry" } } } } } } }
        "423": { $ref: "#/components/responses/ProductError" }
  /api/v1/spaces/{spaceId}/directories:
    post:
      operationId: createDirectory
      parameters: [{ $ref: "#/components/parameters/SpaceID" }, { $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FileDestination" } } } }
      responses:
        "201": { description: Directory created, content: { application/json: { schema: { $ref: "#/components/schemas/FileEntry" } } } }
        "409": { $ref: "#/components/responses/ProductError" }
        "507": { $ref: "#/components/responses/ProductError" }
  /api/v1/spaces/{spaceId}/uploads:
    post:
      operationId: uploadFile
      parameters: [{ $ref: "#/components/parameters/SpaceID" }, { $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [file], properties: { parentId: { type: string }, file: { type: string, format: binary } } } } } }
      responses:
        "201": { description: File uploaded, content: { application/json: { schema: { $ref: "#/components/schemas/FileEntry" } } } }
        "507": { $ref: "#/components/responses/ProductError" }
  /api/v1/files/{fileId}/content:
    get:
      operationId: downloadFile
      parameters: [{ $ref: "#/components/parameters/FileID" }, { name: Range, in: header, schema: { type: string } }, { name: disposition, in: query, description: Use inline for browser-previewable raster images and PDF documents; other files remain attachments., schema: { type: string, enum: [inline] } }]
      responses:
        "200": { description: File content, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "206": { description: Partial file content, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
  /api/v1/files/{fileId}/preview:
    get:
      operationId: renderFilePreview
      summary: Render a video frame or a HEIC/HEIF image after checking source-file access
      description: Returns JPEG for videos and PNG for HEIC/HEIF. Each request reopens the source as the signed-in user, including cache hits. Browser caching is disabled. Originals are unchanged.
      parameters:
        - { $ref: "#/components/parameters/FileID" }
        - { name: size, in: query, schema: { type: string, enum: [thumbnail, preview], default: thumbnail } }
      responses:
        "200":
          description: A bounded image; thumbnail is 320 pixels and preview is 1600 pixels (HEIF longest edge, video width).
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        "206":
          description: Partial rendered image
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        "400": { $ref: "#/components/responses/ProductError" }
        "401": { $ref: "#/components/responses/ProductError" }
        "403": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
        "422": { $ref: "#/components/responses/ProductError" }
        "423": { $ref: "#/components/responses/ProductError" }
        "503": { $ref: "#/components/responses/ProductError" }

  /api/v1/files/{fileId}:
    patch:
      operationId: moveFile
      parameters: [{ $ref: "#/components/parameters/FileID" }, { $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FileTransfer" } } } }
      responses:
        "200": { description: File moved, content: { application/json: { schema: { $ref: "#/components/schemas/FileEntry" } } } }
    delete:
      operationId: trashFile
      parameters: [{ $ref: "#/components/parameters/FileID" }, { $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "200": { description: Trash item, content: { application/json: { schema: { $ref: "#/components/schemas/TrashItem" } } } }
  /api/v1/files/{fileId}/versions:
    get:
      operationId: listFileVersions
      summary: List the versions of a file or folder that the snapshots of its space hold at its path
      description: >-
        Versions are newest first. Snapshots holding a file of the same size and modification time are merged into
        one version; the version equal to the file as it is now is marked current.
      parameters: [{ $ref: "#/components/parameters/FileID" }]
      responses:
        "200": { description: The path and its versions, content: { application/json: { schema: { $ref: "#/components/schemas/SnapshotMatch" } } } }
        "403": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
  /api/v1/files/{fileId}/copies:
    post:
      operationId: copyFile
      parameters: [{ $ref: "#/components/parameters/FileID" }, { $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FileTransfer" } } } }
      responses:
        "201": { description: File copied, content: { application/json: { schema: { $ref: "#/components/schemas/FileEntry" } } } }
  /api/v1/trash:
    get:
      operationId: listTrash
      responses:
        "200": { description: Visible recycle-bin items, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/TrashItem" } } } } } } }
  /api/v1/trash/{trashId}/restore:
    post:
      operationId: restoreTrash
      summary: Restore an item; without a parentId it goes back to its original folder, or to the space root when that folder is gone. What happens to a taken name is the request's conflict; nothing is overwritten.
      parameters: [{ $ref: "#/components/parameters/TrashID" }, { $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TrashRestore" } } } }
      responses:
        "200": { description: Restored entry, content: { application/json: { schema: { $ref: "#/components/schemas/RestoredEntry" } } } }
        "400": { $ref: "#/components/responses/ProductError" }
        "409": { $ref: "#/components/responses/ProductError" }
        "422": { $ref: "#/components/responses/ProductError" }
  /api/v1/trash/{trashId}:
    delete:
      operationId: purgeTrash
      parameters: [{ $ref: "#/components/parameters/TrashID" }, { $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "204": { description: Item permanently removed }
  /api/v1/spaces/{spaceId}/snapshots:
    get:
      operationId: listSnapshots
      parameters: [{ $ref: "#/components/parameters/SpaceID" }]
      responses:
        "200": { description: Snapshots, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Snapshot" } } } } } } }
    post:
      operationId: createSnapshot
      parameters: [{ $ref: "#/components/parameters/SpaceID" }, { $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string } } } } } }
      responses:
        "201": { description: Snapshot created, content: { application/json: { schema: { $ref: "#/components/schemas/Snapshot" } } } }
        "403": { $ref: "#/components/responses/ProductError" }
  /api/v1/spaces/{spaceId}/snapshot-schedule:
    get:
      operationId: getSnapshotSchedule
      summary: Read the snapshot schedule of a space
      description: >-
        Spaces without a stored schedule report a disabled default. The schedule is read from the catalog on the
        system disk and is available while the data volume is offline.
      parameters: [{ $ref: "#/components/parameters/SpaceID" }]
      responses:
        "200": { description: The schedule and its latest run, content: { application/json: { schema: { $ref: "#/components/schemas/SnapshotSchedule" } } } }
        "403": { $ref: "#/components/responses/ProductError" }
    put:
      operationId: updateSnapshotSchedule
      summary: Change the snapshot schedule of a space
      description: >-
        Only the owner of a personal space and administrators for the shared space may change it. Times are local
        to the device. After each successful scheduled snapshot, scheduled snapshots the retention no longer keeps
        are deleted: beyond the newest keep under count retention, or outside every tier under tiered retention.
        Manual snapshots are never deleted by a schedule.
      parameters: [{ $ref: "#/components/parameters/SpaceID" }, { $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SnapshotScheduleSettings" } } } }
      responses:
        "200": { description: The updated schedule, content: { application/json: { schema: { $ref: "#/components/schemas/SnapshotSchedule" } } } }
        "403": { $ref: "#/components/responses/ProductError" }
        "422": { $ref: "#/components/responses/ProductError" }
  /api/v1/spaces/{spaceId}/snapshot-search:
    get:
      operationId: searchSnapshots
      summary: Find files and folders by name in all snapshots of a space
      parameters: [{ $ref: "#/components/parameters/SpaceID" }, { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }]
      responses:
        "200":
          description: Matching paths, exact names first, each with its distinct versions newest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, truncated]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/SnapshotMatch" } }
                  truncated: { type: boolean, description: More paths matched than were returned. }
        "422": { $ref: "#/components/responses/ProductError" }
  /api/v1/spaces/{spaceId}/removed-entries:
    get:
      operationId: listRemovedEntries
      summary: List what the snapshots of a space hold that the space no longer lists, most recently removed first
      description: >-
        The space is reconciled first, so deletions over SMB are included. Only the topmost removed item of a removed
        folder is listed. Moved or renamed items are listed under their old path.
      parameters: [{ $ref: "#/components/parameters/SpaceID" }]
      responses:
        "200":
          description: Removed items
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, truncated]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RemovedEntry" } }
                  truncated: { type: boolean, description: The list stopped at 200 items or before the oldest snapshot was compared. }
        "403": { $ref: "#/components/responses/ProductError" }
        "423": { $ref: "#/components/responses/ProductError" }
  /api/v1/snapshots/{snapshotId}/restore:
    post:
      operationId: restoreSnapshot
      summary: Copy everything a snapshot holds into a new folder of its space
      parameters: [{ $ref: "#/components/parameters/SnapshotID" }, { $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FileDestination" } } } }
      responses:
        "201": { description: The new folder holding the snapshot's files, content: { application/json: { schema: { $ref: "#/components/schemas/FileEntry" } } } }
        "409": { $ref: "#/components/responses/ProductError" }
  /api/v1/snapshots/{snapshotId}/entries:
    get:
      operationId: listSnapshotEntries
      description: Each entry is compared with the space as it is now; opening the top level reconciles the space first.
      parameters: [{ $ref: "#/components/parameters/SnapshotID" }, { name: parentId, in: query, schema: { type: string } }]
      responses:
        "200": { description: Snapshot entries, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/SnapshotEntry" } } } } } } }
  /api/v1/snapshots/{snapshotId}/entries/{entryId}/restore:
    post:
      operationId: restoreSnapshotEntry
      parameters: [{ $ref: "#/components/parameters/SnapshotID" }, { name: entryId, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SnapshotRestore" } } } }
      responses:
        "201": { description: File or folder restored as a new entry; a folder brings everything below it, content: { application/json: { schema: { $ref: "#/components/schemas/FileEntry" } } } }
        "409": { $ref: "#/components/responses/ProductError" }
  /api/v1/snapshots/{snapshotId}/entries/{entryId}/content:
    get:
      operationId: downloadSnapshotFile
      summary: Download one file from a snapshot
      description: The content is streamed from the snapshot and cannot be requested in ranges.
      parameters: [{ $ref: "#/components/parameters/SnapshotID" }, { name: entryId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: File content, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/ProductError" }
        "422": { $ref: "#/components/responses/ProductError" }
  /api/v1/snapshots/{snapshotId}/keep:
    post:
      operationId: keepSnapshot
      summary: Turn a scheduled snapshot into a manual one that schedules never delete
      parameters: [{ $ref: "#/components/parameters/SnapshotID" }, { $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "200": { description: The kept snapshot, content: { application/json: { schema: { $ref: "#/components/schemas/Snapshot" } } } }
        "403": { $ref: "#/components/responses/ProductError" }
  /api/v1/snapshots/{snapshotId}:
    delete:
      operationId: deleteSnapshot
      parameters: [{ $ref: "#/components/parameters/SnapshotID" }, { $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "204": { description: Snapshot deleted }
  /api/v1/task-manager/device:
    get:
      operationId: getTaskManagerDevice
      summary: Read device utilisation and accelerator availability
      description: >-
        Every signed-in account, including members, can read this snapshot. This API is read-only.
        Rates use the shared Host Agent sampling window; CPU percentages use whole-machine capacity.
        Unknown metrics are present as null. Partial or unavailable groups retain explicit status and arrays.
        No command lines, environment variables or host paths are exposed.
      responses:
        "200":
          description: The latest observation and its data source.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskManagerDeviceResponse"
        "401":
          description: A valid signed-in session is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          description: The observation cannot currently be read (task_manager_unavailable).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/task-manager/tasks:
    get:
      operationId: getTaskManagerTasks
      summary: Read running services and processes
      description: >-
        Every signed-in account, including members, can read this snapshot. This API is read-only.
        Rates use the shared Host Agent sampling window; CPU percentages use whole-machine capacity.
        Unknown metrics are present as null. Partial or unavailable groups retain explicit status and arrays.
        No command lines, environment variables or host paths are exposed.
      responses:
        "200":
          description: The latest observation and its data source.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskManagerTasksResponse"
        "401":
          description: A valid signed-in session is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          description: The observation cannot currently be read (task_manager_unavailable).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/metrics:
    get:
      operationId: getHostMetrics
      summary: Read current CPU, memory and network utilisation
      description: >-
        CPU usage and network rates cover the interval since the previous sample (at least 0.5 seconds);
        polls arriving sooner receive the previous result. Network rates sum physical interfaces and exclude
        loopback and virtual links. Memory counts MemTotal minus MemAvailable as used.
      responses:
        "200":
          description: The latest utilisation observation.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsResponse"
        "503":
          description: Host metrics cannot currently be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/containers:
    get:
      operationId: getContainerSnapshot
      summary: List containers and images from the container engine
      description: >-
        Administrators only; container actions also need the session CSRF token. Running containers include CPU
        and memory usage sampled over about one second. Responses are not cacheable. ANAS_CONTAINERS_MODE
        selects simulated, live (container agent) or disabled management.
      responses:
        "200":
          description: One snapshot of the container engine.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContainerSnapshotResponse"
        "503":
          $ref: "#/components/responses/ContainersUnavailable"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/containers/{containerId}/actions:
    post:
      operationId: applyContainerAction
      summary: Start, stop or restart one container
      description: >-
        Only lifecycle actions are accepted; creating, removing or reconfiguring containers is not part of this
        API. Requests must name this device by localhost or IP address in the Host header, use a JSON body and,
        when an Origin is sent, come from the same origin. Stop and restart give the container ten seconds to exit before it is killed.
      parameters:
        - $ref: "#/components/parameters/ContainerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action:
                  type: string
                  enum: [start, stop, restart]
      responses:
        "204":
          description: The engine applied the action.
        "400":
          $ref: "#/components/responses/ContainerRequestInvalid"
        "403":
          description: The request did not come from the local desktop.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/ContainerNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "502":
          $ref: "#/components/responses/ContainerEngineError"
        "503":
          $ref: "#/components/responses/ContainersUnavailable"
  /api/v1/containers/{containerId}/logs:
    get:
      operationId: getContainerLogs
      summary: Read the latest lines a container wrote to stdout and stderr
      parameters:
        - $ref: "#/components/parameters/ContainerId"
        - name: tail
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 500
      responses:
        "200":
          description: Log lines in the order the container wrote them.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContainerLogsResponse"
        "400":
          $ref: "#/components/responses/ContainerRequestInvalid"
        "404":
          $ref: "#/components/responses/ContainerNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "502":
          $ref: "#/components/responses/ContainerEngineError"
        "503":
          $ref: "#/components/responses/ContainersUnavailable"
  /api/v1/apps:
    get:
      operationId: listApps
      summary: List App Center catalog apps with their install state
      responses:
        "200":
          description: Every catalog app; installed apps report running and total containers, and the latest job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppListResponse"
        "503":
          $ref: "#/components/responses/AppsUnavailable"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/apps/{appId}/icon:
    get:
      operationId: getAppIcon
      summary: Read an app icon from the catalog
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: PNG or SVG icon, served with a sandboxing Content-Security-Policy.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/AppNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/AppsUnavailable"
  /api/v1/app-shortcuts:
    get:
      operationId: listAppShortcuts
      summary: List the installed apps every signed-in user opens from the desktop
      description: >-
        Installed App Center apps that have a web interface, for every signed-in user. Each opens in a new window
        at <scheme>://<the host the desktop was opened from>:<webPort><path>. Installing, uninstalling and
        available apps have none; the list is empty while the App Center is disabled.
      responses:
        "200":
          description: Desktop shortcuts, in catalog order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppShortcutListResponse"
        "401":
          $ref: "#/components/responses/ProductError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/AppsUnavailable"
  /api/v1/app-shortcuts/{appId}/icon:
    get:
      operationId: getAppShortcutIcon
      summary: Read an app icon for the desktop
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: PNG or SVG icon, served with a sandboxing Content-Security-Policy.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/ProductError"
        "404":
          $ref: "#/components/responses/AppNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/apps/{appId}/plan:
    get:
      operationId: getAppInstallPlan
      summary: Render the install plan the owner must confirm
      description: >-
        Administrators only. The plan lists the app's Linux identity, images, containers, published host ports and
        host folders, plus the rendered Compose file and its SHA-256 digest. App data lives in the app's own
        folder on the data volume; shared mounts resolve inside the Shared folder. Manifests that violate the
        install policy answer 422.
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: The install plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppPlan"
        "404":
          $ref: "#/components/responses/AppNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "422":
          $ref: "#/components/responses/AppConflict"
        "503":
          $ref: "#/components/responses/AppsUnavailable"
  /api/v1/apps/{appId}/install:
    post:
      operationId: installApp
      summary: Start installing an app from a confirmed plan
      description: >-
        Administrators only, with the session CSRF token. The plan is re-rendered for the app identity and
        refused with plan_changed unless the digest matches; the Host Agent then creates the mounted folders
        (Docker never creates host folders) and grants Shared access if the plan mounts from it. Refused with 423
        volume_unavailable while the data volume is offline. Only one install or uninstall runs at a time.
        Requests must also name this device by localhost or IP address in the Host header, use a JSON body and,
        when an Origin is sent, come from the same origin.
      parameters:
        - $ref: "#/components/parameters/AppId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [digest]
              properties:
                digest:
                  type: string
                  pattern: "^[a-f0-9]{64}$"
      responses:
        "202":
          description: The install job started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppJob"
        "400":
          $ref: "#/components/responses/AppRequestInvalid"
        "403":
          $ref: "#/components/responses/AppRequestInvalid"
        "404":
          $ref: "#/components/responses/AppNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/AppConflict"
        "422":
          $ref: "#/components/responses/AppConflict"
        "423":
          $ref: "#/components/responses/ProductError"
        "502":
          $ref: "#/components/responses/AppConflict"
        "503":
          $ref: "#/components/responses/AppsUnavailable"
  /api/v1/apps/{appId}/uninstall:
    post:
      operationId: uninstallApp
      summary: Start removing an installed app while keeping its data
      description: Administrators only, with the session CSRF token. The app identity's Shared access is withdrawn at once.
      parameters:
        - $ref: "#/components/parameters/AppId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "202":
          description: The uninstall job started; containers and the project network are removed, app data is kept.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppJob"
        "400":
          $ref: "#/components/responses/AppRequestInvalid"
        "403":
          $ref: "#/components/responses/AppRequestInvalid"
        "404":
          $ref: "#/components/responses/AppNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/AppConflict"
        "502":
          $ref: "#/components/responses/AppConflict"
        "503":
          $ref: "#/components/responses/AppsUnavailable"
  /api/v1/photos/libraries:
    get:
      operationId: listPhotoLibraries
      summary: List the caller's private library, the shared library and any member library being viewed
      responses:
        "200": { description: Visible photo libraries, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/PhotoLibrary" } } } } } } }
        "503": { description: The photo library is not available on this device (photos_unavailable), content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /api/v1/photos/ai:
    get:
      operationId: getPhotoAIStatus
      summary: Report local AI progress over the caller's visible photos; polling it does not count as activity
      responses:
        "200": { description: Local AI status, content: { application/json: { schema: { $ref: "#/components/schemas/PhotoAIStatus" } } } }
        "503": { description: The photo library is not available on this device (photos_unavailable), content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /api/v1/photos/search:
    get:
      operationId: searchPhotos
      summary: Find untrashed photos in the caller's private and the shared library by name or meaning, name and user tag matches first and then every photo by similarity; closest says where the closest group ends
      parameters:
        - { name: q, in: query, required: true, description: "1 to 200 characters, such as 海边的猫.", schema: { type: string, minLength: 1, maxLength: 200 } }
        - { name: viewing, in: query, description: "A member's private library the caller is viewing through Administrative Viewing Mode, to search it as well.", schema: { type: string } }
        - { name: library, in: query, description: "One library of the search's scope (the caller's private library, the shared library or the viewed one) to search alone; any other answers 404.", schema: { type: string } }
        - { name: cursor, in: query, description: The next value of the previous page., schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200": { description: One page of results, content: { application/json: { schema: { $ref: "#/components/schemas/PhotoSearchResults" } } } }
        "400": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
        "503": { description: The photo library is not available on this device (photos_unavailable), content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /api/v1/photos/image-searches:
    post:
      operationId: searchPhotosByImage
      summary: Search by an image that is not in the library; local AI encodes it and looks for objects in it at once, the image itself is never stored, and its results stay listed under the returned ID until 30 minutes after their last use
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [file], properties: { file: { type: string, format: binary, description: "A JPEG or PNG of at most 32 MiB and 2^26 (about 67 million) pixels. The Web client sends it upright, scaled to at most 1600 px." } } } } } }
      responses:
        "201": { description: The image was encoded, content: { application/json: { schema: { $ref: "#/components/schemas/PhotoImageSearch" } } } }
        "400": { $ref: "#/components/responses/ProductError" }
        "413": { $ref: "#/components/responses/ProductError" }
        "415": { $ref: "#/components/responses/ProductError" }
        "503": { description: "Local AI cannot read the image now (ai_unavailable), or the photo library is not available on this device (photos_unavailable)", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /api/v1/photos/image-searches/{searchId}/assets:
    get:
      operationId: listImageSearchResults
      summary: The untrashed photos in the caller's search scope most like an image search's image, closest first, by image vectors and the objects found in both, as for similar photos
      parameters:
        - { name: searchId, in: path, required: true, schema: { type: string } }
        - { name: viewing, in: query, description: "A member's private library the caller is viewing through Administrative Viewing Mode, to look in it as well.", schema: { type: string } }
        - { name: cursor, in: query, description: The next value of the previous page., schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200": { description: One page of results, content: { application/json: { schema: { $ref: "#/components/schemas/PhotoTimeline" } } } }
        "400": { $ref: "#/components/responses/ProductError" }
        "404": { description: "search_expired when the search is no longer kept or was started by someone else, so the image is to be sent again; not_found for a viewed library the caller cannot see", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "503": { description: The photo library is not available on this device (photos_unavailable), content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /api/v1/photos/labels:
    get:
      operationId: listPhotoLabels
      summary: List the AI clusters of untrashed photos in the caller's private and the shared library, most photos first; clusters never take part in search
      parameters:
        - { name: viewing, in: query, description: "A member's private library the caller is viewing through Administrative Viewing Mode, to count it as well.", schema: { type: string } }
      responses:
        "200": { description: Cluster counts, content: { application/json: { schema: { $ref: "#/components/schemas/PhotoLabelCounts" } } } }
        "404": { $ref: "#/components/responses/ProductError" }
        "503": { description: The photo library is not available on this device (photos_unavailable), content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /api/v1/photos/labels/{labelId}/assets:
    get:
      operationId: listPhotoLabelCluster
      summary: List the photos in an AI cluster within the caller's private and the shared library, clearest match first; empty while AI clusters are not available
      parameters:
        - { name: labelId, in: path, required: true, description: "A label that has a cluster, such as cat.", schema: { type: string } }
        - { name: viewing, in: query, description: "A member's private library the caller is viewing through Administrative Viewing Mode, to list it as well.", schema: { type: string } }
        - { name: cursor, in: query, description: The next value of the previous page., schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200": { description: One page of the cluster, content: { application/json: { schema: { $ref: "#/components/schemas/PhotoTimeline" } } } }
        "400": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
        "503": { description: The photo library is not available on this device (photos_unavailable), content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /api/v1/photos/tags:
    get:
      operationId: listPhotoTagGroups
      summary: List the users' own tags on untrashed photos in the caller's private and the shared library as groups, most photos first
      parameters:
        - { name: viewing, in: query, description: "A member's private library the caller is viewing through Administrative Viewing Mode, to count it as well.", schema: { type: string } }
      responses:
        "200": { description: Tag groups, content: { application/json: { schema: { $ref: "#/components/schemas/PhotoTagCounts" } } } }
        "404": { $ref: "#/components/responses/ProductError" }
        "503": { description: The photo library is not available on this device (photos_unavailable), content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /api/v1/photos/tags/{name}/assets:
    get:
      operationId: listPhotoTagGroup
      summary: List the untrashed photos in the caller's private and the shared library that carry a user tag, newest first
      parameters:
        - { name: name, in: path, required: true, description: "A user tag, such as 小橘.", schema: { type: string } }
        - { name: viewing, in: query, description: "A member's private library the caller is viewing through Administrative Viewing Mode, to list it as well.", schema: { type: string } }
        - { name: cursor, in: query, description: The next value of the previous page., schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200": { description: One page of the group, content: { application/json: { schema: { $ref: "#/components/schemas/PhotoTimeline" } } } }
        "400": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
        "503": { description: The photo library is not available on this device (photos_unavailable), content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /api/v1/photos/people:
    get:
      operationId: listPhotoPeople
      summary: List the people and pets of the caller's private and the shared library, named ones first, then by photos; someone seen in fewer than two photos is listed once named
      parameters:
        - { name: viewing, in: query, description: "A member's private library the caller is viewing through Administrative Viewing Mode, to list its people as well (read-only).", schema: { type: string } }
        - { name: hidden, in: query, description: "1 to include people the members hid.", schema: { type: string, enum: ["1"] } }
      responses:
        "200": { description: People, content: { application/json: { schema: { $ref: "#/components/schemas/PhotoPeople" } } } }
        "404": { $ref: "#/components/responses/ProductError" }
        "503": { description: The photo library is not available on this device (photos_unavailable), content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /api/v1/photos/people/{personId}:
    patch:
      operationId: changePhotoPerson
      summary: Name, hide or show a person, or choose the face that stands for them; the owner of a private library and every member in the shared library may
      parameters: [{ $ref: "#/components/parameters/PhotoPersonID" }, { $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 160, description: "At most 40 characters; empty clears the name." }
                hidden: { type: boolean }
                coverId: { type: string, description: "One of the person's occurrences." }
      responses:
        "200": { description: The person, content: { application/json: { schema: { $ref: "#/components/schemas/PhotoPerson" } } } }
        "400": { $ref: "#/components/responses/ProductError" }
        "403": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
        "409": { $ref: "#/components/responses/ProductError" }
        "422": { $ref: "#/components/responses/ProductError" }
  /api/v1/photos/people/{personId}/assets:
    get:
      operationId: listPhotoPersonPhotos
      summary: List the untrashed photos of a person, newest first
      parameters:
        - { $ref: "#/components/parameters/PhotoPersonID" }
        - { name: cursor, in: query, description: The next value of the previous page., schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200": { description: One page of the person's photos, content: { application/json: { schema: { $ref: "#/components/schemas/PhotoTimeline" } } } }
        "400": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
  /api/v1/photos/people/{personId}/merge:
    post:
      operationId: mergePhotoPeople
      summary: Move every face of a person into another person of the same library and kind; the merged person is gone afterwards
      parameters: [{ $ref: "#/components/parameters/PhotoPersonID" }, { $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [into], properties: { into: { type: string } } } } }
      responses:
        "200": { description: The person the faces moved into, content: { application/json: { schema: { $ref: "#/components/schemas/PhotoPerson" } } } }
        "400": { $ref: "#/components/responses/ProductError" }
        "403": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
        "409": { $ref: "#/components/responses/ProductError" }
  /api/v1/photos/people/{personId}/assets/{assetId}:
    delete:
      operationId: removePhotoFromPerson
      summary: Take a photo out of a person; clustering never gives it back to that person
      parameters: [{ $ref: "#/components/parameters/PhotoPersonID" }, { $ref: "#/components/parameters/PhotoAssetID" }, { $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "204": { description: Taken out }
        "403": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
  /api/v1/photos/assets/{assetId}/people/{occurrenceId}:
    put:
      operationId: assignPhotoFace
      summary: Say who a face or pet in a photo is, an existing person of the photo's library or a new one by name; clustering never changes it
      parameters: [{ $ref: "#/components/parameters/PhotoAssetID" }, { $ref: "#/components/parameters/PhotoOccurrenceID" }, { $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                personId: { type: string }
                name: { type: string, maxLength: 160, description: "A new person's name when personId is absent." }
      responses:
        "200": { description: The photo's details, content: { application/json: { schema: { $ref: "#/components/schemas/PhotoAsset" } } } }
        "400": { $ref: "#/components/responses/ProductError" }
        "403": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
        "409": { $ref: "#/components/responses/ProductError" }
        "422": { $ref: "#/components/responses/ProductError" }
  /api/v1/photos/occurrences/{occurrenceId}/avatar:
    get:
      operationId: getPhotoOccurrenceAvatar
      summary: The square crop of a face or pet in a photo the caller can see; the ID changes whenever the photo is scanned again
      parameters: [{ $ref: "#/components/parameters/PhotoOccurrenceID" }]
      responses:
        "200": { description: JPEG, content: { image/jpeg: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/ProductError" }
  /api/v1/photos/libraries/{libraryId}:
    patch:
      operationId: changePhotoLibrary
      summary: Turn a library's people and pets on or off; the owner of a private library and an administrator for the shared library may. Off clears the faces, pets and automatic people found there and keeps names and what members decided; on scans the library again
      parameters: [{ $ref: "#/components/parameters/PhotoLibraryID" }, { $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [people]
              properties:
                people: { type: boolean }
      responses:
        "200": { description: The library, content: { application/json: { schema: { $ref: "#/components/schemas/PhotoLibrary" } } } }
        "400": { $ref: "#/components/responses/ProductError" }
        "403": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
  /api/v1/photos/libraries/{libraryId}/albums:
    get:
      operationId: listPhotoAlbums
      summary: List a library's albums, newest first
      parameters: [{ $ref: "#/components/parameters/PhotoLibraryID" }]
      responses:
        "200": { description: Albums, content: { application/json: { schema: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/PhotoAlbum" } } } } } } }
        "404": { $ref: "#/components/responses/ProductError" }
    post:
      operationId: createPhotoAlbum
      summary: Create an album in a library the caller may add to
      parameters: [{ $ref: "#/components/parameters/PhotoLibraryID" }, { $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PhotoNameRequest" } } } }
      responses:
        "201": { description: Album created, content: { application/json: { schema: { $ref: "#/components/schemas/PhotoAlbum" } } } }
        "403": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
        "409": { $ref: "#/components/responses/ProductError" }
        "422": { $ref: "#/components/responses/ProductError" }
  /api/v1/photos/albums/{albumId}:
    patch:
      operationId: renamePhotoAlbum
      summary: Rename an album; its creator, the library owner or an administrator of the shared library may
      parameters: [{ $ref: "#/components/parameters/PhotoAlbumID" }, { $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PhotoNameRequest" } } } }
      responses:
        "200": { description: Album renamed, content: { application/json: { schema: { $ref: "#/components/schemas/PhotoAlbum" } } } }
        "403": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
        "409": { $ref: "#/components/responses/ProductError" }
        "422": { $ref: "#/components/responses/ProductError" }
    delete:
      operationId: deletePhotoAlbum
      summary: Delete an album; its photos stay in the library
      parameters: [{ $ref: "#/components/parameters/PhotoAlbumID" }, { $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "204": { description: Album deleted }
        "403": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
  /api/v1/photos/albums/{albumId}/assets:
    get:
      operationId: listPhotoAlbumAssets
      summary: List an album's photos outside the trash, newest capture time first
      parameters:
        - { $ref: "#/components/parameters/PhotoAlbumID" }
        - { name: cursor, in: query, description: The next value of the previous page., schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200": { description: One page, content: { application/json: { schema: { $ref: "#/components/schemas/PhotoTimeline" } } } }
        "400": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
    post:
      operationId: addPhotoToAlbum
      summary: Add a photo to an album; a photo of another library is copied into the album's library first
      parameters: [{ $ref: "#/components/parameters/PhotoAlbumID" }, { $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [assetId], properties: { assetId: { type: string } } } } } }
      responses:
        "200": { description: "The photo the album now holds, with its details", content: { application/json: { schema: { $ref: "#/components/schemas/PhotoAsset" } } } }
        "403": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
        "409": { $ref: "#/components/responses/ProductError" }
  /api/v1/photos/albums/{albumId}/assets/{assetId}:
    delete:
      operationId: removePhotoFromAlbum
      summary: Take a photo out of an album without deleting it
      parameters: [{ $ref: "#/components/parameters/PhotoAlbumID" }, { $ref: "#/components/parameters/PhotoAssetID" }, { $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "204": { description: Photo removed from the album }
        "403": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
  /api/v1/photos/assets/{assetId}/tags:
    post:
      operationId: addPhotoTag
      summary: Add a user tag of at most 30 characters; whoever may rename the photo may tag it
      parameters: [{ $ref: "#/components/parameters/PhotoAssetID" }, { $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PhotoNameRequest" } } } }
      responses:
        "200": { description: The photo's details, content: { application/json: { schema: { $ref: "#/components/schemas/PhotoAsset" } } } }
        "403": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
        "422": { $ref: "#/components/responses/ProductError" }
  /api/v1/photos/assets/{assetId}/tags/{name}:
    delete:
      operationId: removePhotoTag
      summary: Remove a user tag
      parameters: [{ $ref: "#/components/parameters/PhotoAssetID" }, { name: name, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "200": { description: The photo's details, content: { application/json: { schema: { $ref: "#/components/schemas/PhotoAsset" } } } }
        "403": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
  /api/v1/photos/assets/{assetId}/ai-labels/{labelId}:
    delete:
      operationId: hidePhotoAILabel
      summary: Take this photo out of an AI cluster; the correction holds for this photo only and outlives model upgrades
      parameters: [{ $ref: "#/components/parameters/PhotoAssetID" }, { name: labelId, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "200": { description: The photo's details, content: { application/json: { schema: { $ref: "#/components/schemas/PhotoAsset" } } } }
        "403": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
  /api/v1/photos/libraries/{libraryId}/timeline:
    get:
      operationId: listPhotoTimeline
      summary: List available photo assets, newest capture time first
      parameters:
        - { $ref: "#/components/parameters/PhotoLibraryID" }
        - { name: month, in: query, description: "Only this month (YYYY-MM) of the device's time zone.", schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" } }
        - { name: cursor, in: query, description: The next value of the previous page., schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200": { description: One timeline page, content: { application/json: { schema: { $ref: "#/components/schemas/PhotoTimeline" } } } }
        "400": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
  /api/v1/photos/libraries/{libraryId}/timeline/months:
    get:
      operationId: listPhotoTimelineMonths
      summary: Count available photo assets by month of the device's time zone, newest month first
      parameters:
        - { $ref: "#/components/parameters/PhotoLibraryID" }
      responses:
        "200": { description: Months with photos, content: { application/json: { schema: { $ref: "#/components/schemas/PhotoTimelineMonths" } } } }
        "404": { $ref: "#/components/responses/ProductError" }
  /api/v1/photos/libraries/{libraryId}/entries:
    get:
      operationId: listPhotoEntries
      summary: List one level of the library projection; assets by name, a page at a time
      parameters:
        - { $ref: "#/components/parameters/PhotoLibraryID" }
        - { name: directoryId, in: query, description: Empty or absent for the library root., schema: { type: string } }
        - { name: cursor, in: query, description: The next value of the previous page., schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200": { description: Virtual directories and photo assets, content: { application/json: { schema: { $ref: "#/components/schemas/PhotoDirectoryListing" } } } }
        "404": { $ref: "#/components/responses/ProductError" }
  /api/v1/photos/libraries/{libraryId}/uploads:
    post:
      operationId: uploadPhoto
      summary: Import one photo or video original; returns once the original is durable
      description: "A photo (JPEG, PNG, HEIC; at most 256 MiB) or a video (MP4, MOV, M4V, 3GP, MKV, WebM, AVI, MTS/M2TS; at most 4 GiB) that the Media Worker can read. A Live Photo's MOV, short and carrying Apple's content identifier, whose stills in the library are still waiting for it completes them instead and answers 200; without such stills it is imported as a video. 503 media_unavailable when a video cannot be read because the Media Worker is unavailable."
      parameters: [{ $ref: "#/components/parameters/PhotoLibraryID" }, { $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [file], properties: { directoryId: { type: string, description: "Must precede the file part, which is streamed as it arrives; parts after the file are not read." }, file: { type: string, format: binary } } } } } }
      responses:
        "200": { description: The Live Photos a MOV completed; no asset was created, content: { application/json: { schema: { type: object, additionalProperties: false, required: [completed], properties: { completed: { type: array, items: { $ref: "#/components/schemas/PhotoAsset" } } } } } } }
        "201": { description: Photo asset created, content: { application/json: { schema: { $ref: "#/components/schemas/PhotoAsset" } } } }
        "404": { $ref: "#/components/responses/ProductError" }
        "413": { $ref: "#/components/responses/ProductError" }
        "415": { $ref: "#/components/responses/ProductError" }
        "422": { $ref: "#/components/responses/ProductError" }
        "503": { $ref: "#/components/responses/ProductError" }
        "507": { $ref: "#/components/responses/ProductError" }
  /api/v1/photos/libraries/{libraryId}/directories:
    post:
      operationId: createPhotoDirectory
      parameters: [{ $ref: "#/components/parameters/PhotoLibraryID" }, { $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [name], properties: { parentId: { type: string }, name: { type: string, minLength: 1 } } } } } }
      responses:
        "201": { description: Virtual directory created, content: { application/json: { schema: { $ref: "#/components/schemas/PhotoDirectory" } } } }
        "409": { $ref: "#/components/responses/ProductError" }
        "422": { $ref: "#/components/responses/ProductError" }
  /api/v1/photos/libraries/{libraryId}/trash:
    get:
      operationId: listPhotoTrash
      summary: List trashed photo assets the caller may restore or purge
      parameters: [{ $ref: "#/components/parameters/PhotoLibraryID" }]
      responses:
        "200": { description: Trashed photo assets, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/PhotoAsset" } } } } } } }
    delete:
      operationId: emptyPhotoTrash
      summary: Permanently delete every trashed photo asset the caller may purge
      parameters: [{ $ref: "#/components/parameters/PhotoLibraryID" }, { $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "200": { description: Number of purged assets, content: { application/json: { schema: { type: object, additionalProperties: false, required: [purged], properties: { purged: { type: integer, minimum: 0 } } } } } }
  /api/v1/photos/directories/{directoryId}:
    patch:
      operationId: changePhotoDirectory
      parameters: [{ $ref: "#/components/parameters/PhotoDirectoryID" }, { $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, minProperties: 1, properties: { name: { type: string, minLength: 1 }, parentId: { type: string, description: Empty for the library root. } } } } } }
      responses:
        "200": { description: Virtual directory changed, content: { application/json: { schema: { $ref: "#/components/schemas/PhotoDirectory" } } } }
        "403": { $ref: "#/components/responses/ProductError" }
        "409": { $ref: "#/components/responses/ProductError" }
    delete:
      operationId: deletePhotoDirectory
      parameters: [{ $ref: "#/components/parameters/PhotoDirectoryID" }, { $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "204": { description: Empty virtual directory removed }
        "409": { $ref: "#/components/responses/ProductError" }
  /api/v1/photos/assets/{assetId}:
    get:
      operationId: getPhotoAsset
      parameters: [{ $ref: "#/components/parameters/PhotoAssetID" }]
      responses:
        "200": { description: Photo asset, content: { application/json: { schema: { $ref: "#/components/schemas/PhotoAsset" } } } }
        "404": { $ref: "#/components/responses/ProductError" }
    patch:
      operationId: changePhotoAsset
      summary: Rename an asset and/or move it to another virtual directory of its library
      parameters: [{ $ref: "#/components/parameters/PhotoAssetID" }, { $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, minProperties: 1, properties: { name: { type: string, minLength: 1 }, directoryId: { type: string, description: Empty for the library root. } } } } } }
      responses:
        "200": { description: Photo asset changed, content: { application/json: { schema: { $ref: "#/components/schemas/PhotoAsset" } } } }
        "403": { $ref: "#/components/responses/ProductError" }
        "409": { $ref: "#/components/responses/ProductError" }
    delete:
      operationId: trashPhotoAsset
      parameters: [{ $ref: "#/components/parameters/PhotoAssetID" }, { $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "200": { description: Photo asset moved to trash, content: { application/json: { schema: { $ref: "#/components/schemas/PhotoAsset" } } } }
        "403": { $ref: "#/components/responses/ProductError" }
  /api/v1/photos/libraries/{libraryId}/live-photos:
    post:
      operationId: uploadLivePhoto
      summary: Atomically import a same-name still and MOV as one asset
      description: Stream directoryId (optional), file, then motion in that order. Each original is at most 256 MiB. Available Apple content identifiers must match. No other parts are accepted after motion.
      parameters: [{ $ref: "#/components/parameters/PhotoLibraryID" }, { $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, motion]
              properties:
                directoryId: { type: string }
                file: { type: string, format: binary }
                motion: { type: string, format: binary }
      responses:
        "201": { description: One complete photo asset, content: { application/json: { schema: { $ref: "#/components/schemas/PhotoAsset" } } } }
        "400": { $ref: "#/components/responses/ProductError" }
        "403": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
        "413": { $ref: "#/components/responses/ProductError" }
        "415": { $ref: "#/components/responses/ProductError" }
        "422": { $ref: "#/components/responses/ProductError" }
        "503": { $ref: "#/components/responses/ProductError" }
  /api/v1/photos/libraries/{libraryId}/live-videos:
    post:
      operationId: attachLivePhotoVideo
      summary: Complete Live Photos whose still was imported without its MOV
      description: "One file part, a MOV of at most 256 MiB and 30 seconds that carries Apple's content identifier. Every photo of the library the caller may change whose still carries the same identifier and has no video yet gets this video; nothing is matched by name. 422 live_photo_not_found when no photo of the library is waiting for it, 422 invalid_motion_photo when the MOV has no identifier or is not a short, complete video."
      parameters: [{ $ref: "#/components/parameters/PhotoLibraryID" }, { $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } } } } }
      responses:
        "200": { description: The photos now complete, content: { application/json: { schema: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/PhotoAsset" } } } } } } }
        "400": { $ref: "#/components/responses/ProductError" }
        "403": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
        "413": { $ref: "#/components/responses/ProductError" }
        "422": { $ref: "#/components/responses/ProductError" }
        "503": { $ref: "#/components/responses/ProductError" }
  /api/v1/photos/assets/{assetId}/preview:
    get:
      operationId: previewPhoto
      summary: Display a compatible JPEG for HEIC, a video's poster frame, or the original for JPEG and PNG
      parameters: [{ $ref: "#/components/parameters/PhotoAssetID" }]
      responses:
        "200": { description: Compatible still image, content: { image/jpeg: { schema: { type: string, format: binary } }, image/png: { schema: { type: string, format: binary } } } }
        "304": { description: ETag still matches after authorization }
        "404": { $ref: "#/components/responses/ProductError" }
        "503": { $ref: "#/components/responses/ProductError" }
  /api/v1/photos/assets/{assetId}/video/playback:
    get:
      operationId: getPhotoVideoPlayback
      summary: Decide how this browser plays a video asset
      description: "direct plays video/original; remux and transcode play video/stream, whose fragmented MP4 has the type mime. 404 not_video for a photo."
      parameters:
        - { $ref: "#/components/parameters/PhotoAssetID" }
        - { name: caps, in: query, description: "What the browser decodes beyond H.264, AAC, MP3, Opus, Vorbis and FLAC in MP4, comma-separated: hevc, av1, vp9, webm, mkv, ac3, eac3.", schema: { type: string } }
      responses:
        "200":
          description: How to play the video
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [mode, duration]
                properties:
                  mode: { type: string, enum: [direct, remux, transcode] }
                  duration: { type: number, exclusiveMinimum: 0 }
                  mime: { type: string, description: "Type of the converted stream, for Media Source Extensions; absent for direct play." }
        "403": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
  /api/v1/photos/assets/{assetId}/video/original:
    get:
      operationId: playPhotoVideoOriginal
      summary: Read a video's original for direct play, typed as browsers accept it
      parameters: [{ $ref: "#/components/parameters/PhotoAssetID" }]
      responses:
        "200": { description: Original video, content: { video/mp4: { schema: { type: string, format: binary } }, video/webm: { schema: { type: string, format: binary } }, video/x-matroska: { schema: { type: string, format: binary } } } }
        "206": { description: Range of the original video }
        "304": { description: ETag still matches after authorization }
        "403": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
  /api/v1/photos/assets/{assetId}/video/stream:
    get:
      operationId: streamPhotoVideo
      summary: Convert a video for this browser from a start time; disconnect cancels conversion
      description: "Remuxes or transcodes to H.264/AAC (at most 1080 lines) as the playback decision says, or always transcodes with transcode=1. The stream cannot seek; a player restarts it at a new start. At most two conversions run at once: 503 media_busy after a short wait."
      parameters:
        - { $ref: "#/components/parameters/PhotoAssetID" }
        - { name: start, in: query, schema: { type: number, minimum: 0 }, description: Seconds into the video; before its end. }
        - { name: transcode, in: query, schema: { type: string, enum: ["1"] } }
        - { name: caps, in: query, schema: { type: string }, description: As for the playback decision. }
      responses:
        "200": { description: Fragmented MP4, content: { video/mp4: { schema: { type: string, format: binary } } } }
        "400": { $ref: "#/components/responses/ProductError" }
        "403": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
        "503": { $ref: "#/components/responses/ProductError" }
  /api/v1/photos/assets/{assetId}/motion:
    get:
      operationId: openPhotoMotion
      summary: Read the untouched motion component under the asset's Policy
      parameters: [{ $ref: "#/components/parameters/PhotoAssetID" }]
      responses:
        "200": { description: Original video, content: { video/quicktime: { schema: { type: string, format: binary } }, video/mp4: { schema: { type: string, format: binary } } } }
        "206": { description: Range of the original video }
        "304": { description: ETag still matches after authorization }
        "404": { $ref: "#/components/responses/ProductError" }
  /api/v1/photos/assets/{assetId}/motion/play:
    get:
      operationId: playPhotoMotion
      summary: Stream an on-demand H.264/AAC preview; disconnect cancels decoding
      parameters: [{ $ref: "#/components/parameters/PhotoAssetID" }]
      responses:
        "200": { description: Fragmented MP4, content: { video/mp4: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/ProductError" }
        "503": { $ref: "#/components/responses/ProductError" }
  /api/v1/photos/assets/{assetId}/download:
    get:
      operationId: downloadPhotoAsset
      summary: Download an original or a ZIP containing both Live Photo originals
      description: Android Motion Photo downloads retain the embedded video in the unchanged original.
      parameters: [{ $ref: "#/components/parameters/PhotoAssetID" }]
      responses:
        "200": { description: Complete original asset, content: { application/zip: { schema: { type: string, format: binary } }, image/jpeg: { schema: { type: string, format: binary } }, image/png: { schema: { type: string, format: binary } }, image/heic: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/ProductError" }
  /api/v1/photos/assets/{assetId}/original:
    get:
      operationId: getPhotoOriginal
      parameters: [{ $ref: "#/components/parameters/PhotoAssetID" }, { name: download, in: query, schema: { type: string, enum: ["1"] } }, { name: Range, in: header, schema: { type: string } }]
      responses:
        "200": { description: "The primary original, inline unless download=1; use /download for both Live Photo originals", content: { image/heic: { schema: { type: string, format: binary } }, image/jpeg: { schema: { type: string, format: binary } }, image/png: { schema: { type: string, format: binary } } } }
        "206": { description: Part of the original, content: { image/heic: { schema: { type: string, format: binary } }, image/jpeg: { schema: { type: string, format: binary } }, image/png: { schema: { type: string, format: binary } } } }
        "304": { description: The client's copy still matches the ETag }
        "404": { $ref: "#/components/responses/ProductError" }
  /api/v1/photos/assets/{assetId}/thumbnail:
    get:
      operationId: getPhotoThumbnail
      parameters: [{ $ref: "#/components/parameters/PhotoAssetID" }]
      responses:
        "200": { description: Upright JPEG thumbnail at most 512 pixels on its longer side, content: { image/jpeg: { schema: { type: string, format: binary } } } }
        "304": { description: The client's copy still matches the ETag }
        "404": { description: "Not found, or thumbnail_unavailable while it is pending or failed (use the original)", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /api/v1/photos/assets/{assetId}/similar:
    get:
      operationId: listSimilarPhotos
      summary: The untrashed photos in the caller's search scope most like this one, closest first, by image vectors and the objects found in both; never its copies or duplicates
      parameters:
        - { $ref: "#/components/parameters/PhotoAssetID" }
        - { name: viewing, in: query, description: "A member's private library the caller is viewing through Administrative Viewing Mode, to look in it as well.", schema: { type: string } }
        - { name: cursor, in: query, description: The next value of the previous page., schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200": { description: One page of similar photos, content: { application/json: { schema: { $ref: "#/components/schemas/PhotoSimilarResults" } } } }
        "400": { $ref: "#/components/responses/ProductError" }
        "404": { description: "Not found: missing, trashed, or outside the caller's search scope", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "503": { description: The photo library is not available on this device (photos_unavailable), content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /api/v1/photos/assets/{assetId}/copies:
    post:
      operationId: copyPhotoAsset
      summary: Create an independent photo asset that reuses the original's bytes
      parameters: [{ $ref: "#/components/parameters/PhotoAssetID" }, { $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [libraryId], properties: { libraryId: { type: string }, directoryId: { type: string } } } } } }
      responses:
        "201": { description: Photo asset copied, content: { application/json: { schema: { $ref: "#/components/schemas/PhotoAsset" } } } }
        "403": { $ref: "#/components/responses/ProductError" }
        "409": { $ref: "#/components/responses/ProductError" }
  /api/v1/photos/assets/{assetId}/restore:
    post:
      operationId: restorePhotoAsset
      parameters: [{ $ref: "#/components/parameters/PhotoAssetID" }, { $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "200": { description: Photo asset restored, content: { application/json: { schema: { $ref: "#/components/schemas/PhotoAsset" } } } }
        "409": { $ref: "#/components/responses/ProductError" }
  /api/v1/photos/trash/{assetId}:
    delete:
      operationId: purgePhotoAsset
      parameters: [{ $ref: "#/components/parameters/PhotoAssetID" }, { $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "204": { description: Photo asset permanently deleted }
        "409": { $ref: "#/components/responses/ProductError" }
  /api/v1/music/library:
    get:
      operationId: getMusicLibraryStatus
      summary: Report the caller's library size, version and latest scan
      responses:
        "200": { description: Library status, content: { application/json: { schema: { $ref: "#/components/schemas/MusicStatus" } } } }
        "503": { $ref: "#/components/responses/ProductError" }
  /api/v1/music/library/scan:
    post:
      operationId: scanMusicLibrary
      summary: Bring the caller's library up to date in the background
      description: Scans the caller's music folders as the caller. Asking while a scan runs schedules one more pass.
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "202": { description: Scan started or rescheduled, content: { application/json: { schema: { $ref: "#/components/schemas/MusicStatus" } } } }
  /api/v1/music/tracks:
    get:
      operationId: listMusicTracks
      summary: List every track in the caller's music folders
      responses:
        "200": { description: The caller's library, content: { application/json: { schema: { $ref: "#/components/schemas/MusicLibrary" } } } }
  /api/v1/music/tracks/{trackId}/stream:
    get:
      operationId: streamMusicTrack
      description: >-
        Serves a track browsers play directly with Range support. A track marked transcode is decoded to FLAC by the
        media worker from the start position instead; that stream cannot seek, so players request a new start.
      parameters:
        - { $ref: "#/components/parameters/TrackID" }
        - { name: Range, in: header, schema: { type: string } }
        - { name: start, in: query, description: Seconds to start a decoded track from; ignored for other tracks., schema: { type: number, minimum: 0 } }
      responses:
        "200": { description: Audio content, content: { audio/*: { schema: { type: string, format: binary } } } }
        "206": { description: Partial audio content, content: { audio/*: { schema: { type: string, format: binary } } } }
        "400": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
        "422": { description: "The start is past the end (validation_failed), or FFmpeg cannot decode the file (undecodable).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "503": { description: The media worker that decodes this format is unavailable (decoder_unavailable)., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /api/v1/music/tracks/{trackId}/lyrics:
    get:
      operationId: getMusicLyrics
      description: Lyrics from a .lrc file of the same name beside the track, or else embedded in its tags. LRC time tags are kept.
      parameters: [{ $ref: "#/components/parameters/TrackID" }]
      responses:
        "200": { description: Lyrics text, content: { application/json: { schema: { type: object, additionalProperties: false, required: [text], properties: { text: { type: string } } } } } }
        "404": { $ref: "#/components/responses/ProductError" }
  /api/v1/music/covers/{coverId}:
    get:
      operationId: getMusicCover
      parameters: [{ $ref: "#/components/parameters/CoverID" }, { name: size, in: query, schema: { type: string, enum: [small, large], default: small } }]
      responses:
        "200": { description: Square JPEG album art, content: { image/jpeg: { schema: { type: string, format: binary } } } }
        "400": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
  /api/v1/music/sources:
    get:
      operationId: listMusicSources
      summary: List the caller's music folders
      responses:
        "200": { description: Music folders, content: { application/json: { schema: { $ref: "#/components/schemas/MusicSources" } } } }
    put:
      operationId: setMusicSources
      summary: Replace the caller's music folders, or return to the whole personal and shared spaces
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [custom]
              properties:
                custom: { type: boolean }
                items: { type: array, maxItems: 32, items: { type: object, additionalProperties: false, required: [spaceId], properties: { spaceId: { type: string }, folderId: { type: string } } } }
      responses:
        "200": { description: Music folders, content: { application/json: { schema: { $ref: "#/components/schemas/MusicSources" } } } }
        "404": { $ref: "#/components/responses/ProductError" }
        "422": { $ref: "#/components/responses/ProductError" }
  /api/v1/music/favorites:
    get:
      operationId: listMusicFavorites
      responses:
        "200": { description: "Favorites, newest first", content: { application/json: { schema: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/MusicFavorite" } } } } } } }
  /api/v1/music/favorites/{trackId}:
    put:
      operationId: addMusicFavorite
      parameters: [{ $ref: "#/components/parameters/TrackID" }, { $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "204": { description: The track is a favorite }
        "404": { $ref: "#/components/responses/ProductError" }
    delete:
      operationId: removeMusicFavorite
      parameters: [{ $ref: "#/components/parameters/TrackID" }, { $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "204": { description: The track is not a favorite }
  /api/v1/music/recent:
    get:
      operationId: listRecentMusic
      responses:
        "200": { description: "Play history, most recent first", content: { application/json: { schema: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/MusicPlay" } } } } } } }
    delete:
      operationId: clearRecentMusic
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "204": { description: Play history cleared }
  /api/v1/music/plays:
    post:
      operationId: recordMusicPlay
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [trackId], properties: { trackId: { type: string, minLength: 1 } } } } } }
      responses:
        "204": { description: Play recorded }
        "404": { $ref: "#/components/responses/ProductError" }
  /api/v1/music/playlists:
    get:
      operationId: listMusicPlaylists
      responses:
        "200": { description: The caller's playlists, content: { application/json: { schema: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/MusicPlaylist" } } } } } } }
    post:
      operationId: createMusicPlaylist
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [name], properties: { name: { type: string, minLength: 1, maxLength: 80 }, trackIds: { type: array, items: { type: string } } } } } } }
      responses:
        "201": { description: Playlist created, content: { application/json: { schema: { $ref: "#/components/schemas/MusicPlaylist" } } } }
        "422": { $ref: "#/components/responses/ProductError" }
  /api/v1/music/playlists/{playlistId}:
    patch:
      operationId: updateMusicPlaylist
      description: Renames the playlist and/or replaces its tracks in order.
      parameters: [{ $ref: "#/components/parameters/PlaylistID" }, { $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, properties: { name: { type: string, minLength: 1, maxLength: 80 }, trackIds: { type: array, items: { type: string } } } } } } }
      responses:
        "200": { description: Playlist updated, content: { application/json: { schema: { $ref: "#/components/schemas/MusicPlaylist" } } } }
        "404": { $ref: "#/components/responses/ProductError" }
        "422": { $ref: "#/components/responses/ProductError" }
    delete:
      operationId: deleteMusicPlaylist
      parameters: [{ $ref: "#/components/parameters/PlaylistID" }, { $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "204": { description: Playlist deleted }
        "404": { $ref: "#/components/responses/ProductError" }
  /api/v1/music/playlists/{playlistId}/tracks:
    post:
      operationId: addMusicPlaylistTracks
      parameters: [{ $ref: "#/components/parameters/PlaylistID" }, { $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [trackIds], properties: { trackIds: { type: array, minItems: 1, items: { type: string } } } } } } }
      responses:
        "200": { description: Tracks appended, content: { application/json: { schema: { $ref: "#/components/schemas/MusicPlaylist" } } } }
        "404": { $ref: "#/components/responses/ProductError" }
  /api/v1/terminal:
    get:
      operationId: getTerminalStatus
      summary: Report whether interactive terminal sessions are enabled
      responses:
        "200":
          description: Terminal availability configured by ANAS_TERMINAL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalStatusResponse"
        "401":
          $ref: "#/components/responses/ProductError"
        "403":
          $ref: "#/components/responses/ProductError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/terminal/session:
    get:
      operationId: openTerminalSession
      summary: Upgrade to a WebSocket bridged to a login shell on a new PTY
      description: >-
        Only loopback peers (the local console, or the LAN entry proxying a LAN browser) whose Host names this
        device by localhost or IP address and whose browser Origin is the same origin are accepted. Binary
        frames carry raw terminal input and output. The only client text frame is
        `{"type":"resize","cols":N,"rows":N}` with both values between 1 and 1000. When the shell
        exits the server closes with status 1000 and reason `exit <code>`; other endings use 1001.
      responses:
        "101":
          description: Switched to the WebSocket terminal protocol.
        "401":
          $ref: "#/components/responses/ProductError"
        "403":
          description: The terminal is disabled or the request did not come through this device's Web entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "426":
          description: The request is not a WebSocket upgrade.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: The concurrent session limit has been reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The Product Service is shutting down.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/media/libraries:
    get:
      operationId: listMediaLibraries
      summary: List the media libraries the caller can see; libraries not scanned for ten minutes are scanned in the background
      responses:
        "200":
          description: Visible libraries and whether FFmpeg is available to read durations and convert videos
          content: { application/json: { schema: { type: object, additionalProperties: false, required: [items, processing], properties: { items: { type: array, items: { $ref: "#/components/schemas/MediaLibrary" } }, processing: { type: boolean } } } } }
        "503": { $ref: "#/components/responses/ProductError" }
    post:
      operationId: createMediaLibrary
      summary: Create a library over folders of one space and start scanning it; shared-space libraries are for administrators
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MediaLibraryInput" } } } }
      responses:
        "201": { description: The new library, content: { application/json: { schema: { $ref: "#/components/schemas/MediaLibrary" } } } }
        "400": { $ref: "#/components/responses/ProductError" }
        "403": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
        "409": { description: A folder is already part of another library (folders_overlap), content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /api/v1/media/libraries/{libraryId}:
    parameters: [{ $ref: "#/components/parameters/MediaLibraryID" }]
    get:
      operationId: getMediaLibrary
      summary: Describe one library
      responses:
        "200": { description: The library, content: { application/json: { schema: { $ref: "#/components/schemas/MediaLibrary" } } } }
        "404": { $ref: "#/components/responses/ProductError" }
    patch:
      operationId: updateMediaLibrary
      summary: Rename a library or change its kind or folders, then rescan it
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MediaLibraryInput" } } } }
      responses:
        "200": { description: The library, content: { application/json: { schema: { $ref: "#/components/schemas/MediaLibrary" } } } }
        "400": { $ref: "#/components/responses/ProductError" }
        "403": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
        "409": { $ref: "#/components/responses/ProductError" }
    delete:
      operationId: deleteMediaLibrary
      summary: Forget a library with its progress and favorites; no file is touched
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
  /api/v1/media/libraries/{libraryId}/scan:
    post:
      operationId: scanMediaLibrary
      summary: Scan a library the caller manages again, in the background, and retry the videos FFmpeg could not read
      parameters: [{ $ref: "#/components/parameters/MediaLibraryID" }, { $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "202": { description: The library while it is being scanned, content: { application/json: { schema: { $ref: "#/components/schemas/MediaLibrary" } } } }
        "403": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
  /api/v1/media/home:
    get:
      operationId: getMediaHome
      summary: The start page; stale libraries are scanned in the background
      responses:
        "200": { description: Rows of the start page, content: { application/json: { schema: { $ref: "#/components/schemas/MediaHome" } } } }
  /api/v1/media/titles:
    get:
      operationId: listMediaTitles
      summary: List films, shows (one card per show) and other videos
      parameters:
        - { name: category, in: query, schema: { type: string, enum: [all, movie, show, other] } }
        - { name: library, in: query, schema: { type: string } }
        - { name: genre, in: query, schema: { type: string } }
        - { name: sort, in: query, description: Newest added first by default; names sort in pinyin order., schema: { type: string, enum: [added, name, year, rating] } }
        - { name: q, in: query, description: "Matches titles, original titles, file names and episode titles.", schema: { type: string } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200": { description: One page of titles and the genres of all matches, content: { application/json: { schema: { $ref: "#/components/schemas/MediaTitleResults" } } } }
        "400": { $ref: "#/components/responses/ProductError" }
  /api/v1/media/shows/{showId}:
    get:
      operationId: getMediaShow
      summary: A show with its seasons, episodes and the episode to play next
      parameters: [{ name: showId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: The show, content: { application/json: { schema: { $ref: "#/components/schemas/MediaShowDetail" } } } }
        "404": { $ref: "#/components/responses/ProductError" }
    patch:
      operationId: renameMediaShow
      summary: Rename a show as the caller, its own folder and the episode files that carry its title
      description: A show without a folder of its own keeps its folders; only the episode files whose names carry its title are renamed. The show keeps its ID, and the library is rescanned under the new name.
      parameters: [{ name: showId, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [name], properties: { name: { type: string, minLength: 1, maxLength: 255 } } } } } }
      responses:
        "200": { description: The renamed show, content: { application/json: { schema: { $ref: "#/components/schemas/MediaShowDetail" } } } }
        "400": { $ref: "#/components/responses/ProductError" }
        "403": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
        "409": { $ref: "#/components/responses/ProductError" }
  /api/v1/media/videos/{videoId}:
    get:
      operationId: getMediaVideo
      summary: A film, episode or other video with its file, streams and tracks
      parameters: [{ $ref: "#/components/parameters/MediaVideoID" }]
      responses:
        "200": { description: The video, content: { application/json: { schema: { $ref: "#/components/schemas/MediaVideoDetail" } } } }
        "404": { $ref: "#/components/responses/ProductError" }
    patch:
      operationId: renameMediaVideoFile
      summary: Rename the video's file, with the subtitles, NFO and artwork named after it, as the caller
      description: The new name must keep a video extension. Files keep their IDs, so progress and favorites stay; the library is rescanned to read the title from the new name.
      parameters: [{ $ref: "#/components/parameters/MediaVideoID" }, { $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [fileName], properties: { fileName: { type: string, minLength: 1, maxLength: 255 } } } } } }
      responses:
        "200": { description: The renamed video, content: { application/json: { schema: { $ref: "#/components/schemas/MediaVideoDetail" } } } }
        "400": { $ref: "#/components/responses/ProductError" }
        "403": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
        "409": { $ref: "#/components/responses/ProductError" }
  /api/v1/media/videos/{videoId}/playback:
    get:
      operationId: getMediaPlayback
      summary: Decide whether the browser plays the original file or a stream converted by FFmpeg
      parameters:
        - { $ref: "#/components/parameters/MediaVideoID" }
        - { name: caps, in: query, description: "What the browser decodes beyond H.264, AAC, MP3, Opus and FLAC in MP4 and WebM: a comma-separated list of hevc, av1, vp9, ac3, eac3, mkv and webm.", schema: { type: string } }
        - { name: audio, in: query, description: Position among the audio tracks; -1 or absent for the default., schema: { type: integer, minimum: -1 } }
        - { name: quality, in: query, schema: { type: string, enum: [original, 1080p, 720p, 480p] } }
      responses:
        "200": { description: How to play, content: { application/json: { schema: { $ref: "#/components/schemas/MediaPlayback" } } } }
        "400": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
  /api/v1/media/videos/{videoId}/file:
    get:
      operationId: getMediaVideoFile
      summary: The original file, opened as the caller, with range requests for seeking
      parameters: [{ $ref: "#/components/parameters/MediaVideoID" }]
      responses:
        "200": { description: The file, content: { video/*: { schema: { type: string, format: binary } } } }
        "206": { description: Part of the file, content: { video/*: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/ProductError" }
        "503": { $ref: "#/components/responses/ProductError" }
  /api/v1/media/videos/{videoId}/stream:
    get:
      operationId: getMediaVideoStream
      summary: Fragmented MP4 converted by FFmpeg from start seconds on; it cannot seek, so players request a new start
      parameters:
        - { $ref: "#/components/parameters/MediaVideoID" }
        - { name: mode, in: query, schema: { type: string, enum: [remux, transcode] } }
        - { name: start, in: query, schema: { type: number, minimum: 0 } }
        - { name: audio, in: query, schema: { type: integer, minimum: -1 } }
        - { name: quality, in: query, schema: { type: string, enum: [original, 1080p, 720p, 480p] } }
        - { name: caps, in: query, schema: { type: string } }
      responses:
        "200": { description: The stream, content: { video/mp4: { schema: { type: string, format: binary } } } }
        "400": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
        "422": { description: FFmpeg cannot read the file (media_unreadable), content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "503": { description: "Every conversion slot is in use (media_busy), or FFmpeg is unavailable (media_worker_unavailable)", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /api/v1/media/videos/{videoId}/subtitles/{trackId}:
    get:
      operationId: getMediaSubtitle
      summary: A subtitle track converted to WebVTT
      parameters: [{ $ref: "#/components/parameters/MediaVideoID" }, { name: trackId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: WebVTT, content: { text/vtt: { schema: { type: string } } } }
        "404": { $ref: "#/components/responses/ProductError" }
        "422": { $ref: "#/components/responses/ProductError" }
        "503": { $ref: "#/components/responses/ProductError" }
  /api/v1/media/videos/{videoId}/progress:
    put:
      operationId: saveMediaProgress
      summary: Record the caller's position; reaching 90% marks the video watched
      parameters: [{ $ref: "#/components/parameters/MediaVideoID" }, { $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [position], properties: { position: { type: number, minimum: 0 }, duration: { type: number, minimum: 0 } } } } }
      responses:
        "200": { description: The saved progress, content: { application/json: { schema: { $ref: "#/components/schemas/MediaProgress" } } } }
        "400": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
  /api/v1/media/titles/{titleId}/watched:
    put:
      operationId: setMediaWatched
      summary: Mark a video, or every episode of a show, watched or unwatched
      parameters: [{ $ref: "#/components/parameters/MediaTitleID" }, { $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [watched], properties: { watched: { type: boolean } } } } } }
      responses:
        "204": { description: Saved }
        "404": { $ref: "#/components/responses/ProductError" }
  /api/v1/media/favorites:
    get:
      operationId: listMediaFavorites
      summary: The caller's favorite titles, latest first
      responses:
        "200": { description: Favorites, content: { application/json: { schema: { $ref: "#/components/schemas/MediaTitlePage" } } } }
  /api/v1/media/favorites/{titleId}:
    parameters: [{ $ref: "#/components/parameters/MediaTitleID" }, { $ref: "#/components/parameters/CSRFToken" }]
    put:
      operationId: addMediaFavorite
      summary: Add a film, show or video to the caller's favorites
      responses:
        "204": { description: Saved }
        "404": { $ref: "#/components/responses/ProductError" }
    delete:
      operationId: removeMediaFavorite
      summary: Remove a title from the caller's favorites
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/ProductError" }
  /api/v1/media/history:
    get:
      operationId: listMediaHistory
      summary: What the caller played, latest first
      parameters:
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200": { description: History, content: { application/json: { schema: { $ref: "#/components/schemas/MediaTitlePage" } } } }
    delete:
      operationId: clearMediaHistory
      summary: Clear the caller's history; progress and watched marks stay
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "204": { description: Cleared }
  /api/v1/media/history/{videoId}:
    delete:
      operationId: removeMediaHistory
      summary: Remove one video from the caller's history
      parameters: [{ $ref: "#/components/parameters/MediaVideoID" }, { $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/ProductError" }
  /api/v1/media/collections:
    get:
      operationId: listMediaCollections
      summary: The caller's own collections, then the automatic ones NFO files declare
      responses:
        "200": { description: Collections, content: { application/json: { schema: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/MediaCollection" } } } } } } }
    post:
      operationId: createMediaCollection
      summary: Create a collection of the caller's, optionally with titles
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [name], properties: { name: { type: string, minLength: 1, maxLength: 40 }, items: { type: array, items: { type: string } } } } } } }
      responses:
        "201": { description: The collection, content: { application/json: { schema: { $ref: "#/components/schemas/MediaCollection" } } } }
        "400": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
  /api/v1/media/collections/{collectionId}:
    parameters: [{ name: collectionId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getMediaCollection
      summary: A collection with its titles
      responses:
        "200": { description: The collection, content: { application/json: { schema: { $ref: "#/components/schemas/MediaCollectionDetail" } } } }
        "404": { $ref: "#/components/responses/ProductError" }
    patch:
      operationId: renameMediaCollection
      summary: Rename one of the caller's collections
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [name], properties: { name: { type: string, minLength: 1, maxLength: 40 } } } } } }
      responses:
        "204": { description: Renamed }
        "400": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
    delete:
      operationId: deleteMediaCollection
      summary: Delete one of the caller's collections; its titles stay
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/ProductError" }
  /api/v1/media/collections/{collectionId}/items:
    post:
      operationId: addToMediaCollection
      summary: Add titles to one of the caller's collections
      parameters: [{ name: collectionId, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, minItems: 1, items: { type: string } } } } } } }
      responses:
        "204": { description: Added }
        "400": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
  /api/v1/media/collections/{collectionId}/items/{titleId}:
    delete:
      operationId: removeFromMediaCollection
      summary: Remove a title from one of the caller's collections
      parameters: [{ name: collectionId, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/MediaTitleID" }, { $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/ProductError" }
  /api/v1/media/folders:
    get:
      operationId: listMediaFolderRoots
      summary: The folders of every visible library
      responses:
        "200": { description: Library folders, content: { application/json: { schema: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/MediaFolderRoot" } } } } } } }
  /api/v1/media/folders/{entryId}:
    get:
      operationId: getMediaFolder
      summary: One folder of a library, with the subfolders that hold videos and the videos directly in it
      parameters:
        - { name: entryId, in: path, required: true, description: The library folder's file ID., schema: { type: string } }
        - { name: path, in: query, description: Slash-separated path below the library folder., schema: { type: string } }
      responses:
        "200": { description: The folder, content: { application/json: { schema: { $ref: "#/components/schemas/MediaFolderListing" } } } }
        "404": { $ref: "#/components/responses/ProductError" }
  /api/v1/media/artwork/{titleId}/{kind}:
    get:
      operationId: getMediaArtwork
      summary: A title's poster, backdrop or thumbnail as JPEG; the client adds the artwork version to the URL so the response may be cached
      parameters:
        - { $ref: "#/components/parameters/MediaTitleID" }
        - { name: kind, in: path, required: true, schema: { type: string, enum: [poster, backdrop, thumb] } }
      responses:
        "200": { description: JPEG, content: { image/jpeg: { schema: { type: string, format: binary } } } }
        "400": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
  /api/v1/feedback:
    get:
      operationId: listFeedback
      summary: "Every feedback item, newest first; all signed-in accounts read the same list"
      responses:
        "200": { description: Feedback items, content: { application/json: { schema: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/FeedbackItem" } } } } } } }
    post:
      operationId: createFeedback
      summary: File a problem or suggestion with text, images or both
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                text: { type: string, maxLength: 5000 }
                image: { type: array, maxItems: 6, description: "PNG, JPEG, GIF or WebP; at most 10 MiB each. The server sniffs the type.", items: { type: string, format: binary } }
      responses:
        "201": { description: The new item, content: { application/json: { schema: { $ref: "#/components/schemas/FeedbackItem" } } } }
        "400": { $ref: "#/components/responses/ProductError" }
        "413": { $ref: "#/components/responses/ProductError" }
        "415": { $ref: "#/components/responses/ProductError" }
  /api/v1/feedback/{feedbackId}:
    parameters: [{ $ref: "#/components/parameters/FeedbackID" }]
    put:
      operationId: editFeedback
      summary: "Replace an item's text and images; refused with feedback_changed when someone edited it after the given version"
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, minimum: 1, description: The version the edit was made from. }
                text: { type: string, maxLength: 5000 }
                keep: { type: array, description: "IDs of the attached images that stay; the others are removed.", items: { type: string } }
                image: { type: array, description: Images to add., items: { type: string, format: binary } }
      responses:
        "200": { description: The edited item, content: { application/json: { schema: { $ref: "#/components/schemas/FeedbackItem" } } } }
        "400": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
        "409": { $ref: "#/components/responses/ProductError" }
        "413": { $ref: "#/components/responses/ProductError" }
        "415": { $ref: "#/components/responses/ProductError" }
    patch:
      operationId: resolveFeedback
      summary: "Mark an item handled, which strikes it through, or open again; this is not an edit and keeps the version"
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [resolved], properties: { resolved: { type: boolean } } } } } }
      responses:
        "200": { description: The item, content: { application/json: { schema: { $ref: "#/components/schemas/FeedbackItem" } } } }
        "400": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
    delete:
      operationId: deleteFeedback
      summary: Delete an item and its images
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/ProductError" }
  /api/v1/feedback/{feedbackId}/comments:
    post:
      operationId: addFeedbackComment
      summary: "Reply under an item with text, images or both; answers with the item and all its comments"
      parameters: [{ $ref: "#/components/parameters/FeedbackID" }, { $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                text: { type: string, maxLength: 2000 }
                image: { type: array, maxItems: 3, description: "PNG, JPEG, GIF or WebP; at most 10 MiB each.", items: { type: string, format: binary } }
      responses:
        "201": { description: The item with the new comment, content: { application/json: { schema: { $ref: "#/components/schemas/FeedbackItem" } } } }
        "400": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
        "413": { $ref: "#/components/responses/ProductError" }
        "415": { $ref: "#/components/responses/ProductError" }
  /api/v1/feedback/{feedbackId}/comments/{commentId}:
    parameters: [{ $ref: "#/components/parameters/FeedbackID" }, { name: commentId, in: path, required: true, schema: { type: string } }]
    put:
      operationId: editFeedbackComment
      summary: "Replace a comment's text and images; any account may, and comment_changed refuses an edit made from a stale version"
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, minimum: 1, description: The comment version the edit was made from. }
                text: { type: string, maxLength: 2000 }
                keep: { type: array, description: "IDs of the attached images that stay; the others are removed.", items: { type: string } }
                image: { type: array, description: Images to add., items: { type: string, format: binary } }
      responses:
        "200": { description: The item with the edited comment, content: { application/json: { schema: { $ref: "#/components/schemas/FeedbackItem" } } } }
        "400": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
        "409": { $ref: "#/components/responses/ProductError" }
        "413": { $ref: "#/components/responses/ProductError" }
        "415": { $ref: "#/components/responses/ProductError" }
    delete:
      operationId: deleteFeedbackComment
      summary: Delete a comment and its images; any account may
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "200": { description: The item without the comment, content: { application/json: { schema: { $ref: "#/components/schemas/FeedbackItem" } } } }
        "404": { $ref: "#/components/responses/ProductError" }
  /api/v1/feedback/{feedbackId}/images/{imageId}:
    get:
      operationId: getFeedbackImage
      summary: "One image attached to the item or to a comment under it; its content never changes, so it may be cached"
      parameters: [{ $ref: "#/components/parameters/FeedbackID" }, { name: imageId, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: The image
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/ProductError" }
  /api/v1/transfers:
    get:
      operationId: listTransfers
      summary: "The account's transfers, newest first: every unfinished one and the latest finished ones"
      description: "Uploads and downloads of the signed-in account only. A running upload that received nothing for 30 seconds is reported as interrupted."
      responses:
        "200": { description: Transfers, content: { application/json: { schema: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Transfer" } } } } } } }
        "503": { $ref: "#/components/responses/ProductError" }
    delete:
      operationId: clearFinishedTransfers
      summary: Remove the account's finished transfers from the history
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "204": { description: Cleared }
  /api/v1/transfers/downloads:
    post:
      operationId: createDownload
      summary: "Prepare a download: one file as itself, a folder or several entries of one space as a ZIP archive"
      description: "The browser then fetches contentUrl as an ordinary download. A download nobody fetched within 15 minutes fails with not_started."
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [entryIds], properties: { entryIds: { type: array, maxItems: 1000, items: { type: string } } } } } } }
      responses:
        "201": { description: The pending download, content: { application/json: { schema: { $ref: "#/components/schemas/Transfer" } } } }
        "400": { $ref: "#/components/responses/ProductError" }
        "403": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
        "422": { $ref: "#/components/responses/ProductError" }
        "423": { $ref: "#/components/responses/ProductError" }
  /api/v1/transfers/{transferId}:
    parameters: [{ $ref: "#/components/parameters/TransferID" }]
    get:
      operationId: getTransfer
      summary: One of the account's transfers
      responses:
        "200": { description: The transfer, content: { application/json: { schema: { $ref: "#/components/schemas/Transfer" } } } }
        "404": { $ref: "#/components/responses/ProductError" }
    delete:
      operationId: removeTransfer
      summary: Remove a finished transfer from the history; unfinished ones answer transfer_state
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/ProductError" }
        "409": { $ref: "#/components/responses/ProductError" }
  /api/v1/transfers/{transferId}/content:
    get:
      operationId: getDownloadContent
      summary: "A download's content, sent as an attachment and followed as it is sent"
      description: "A single file honours Range and If-Range, so a browser resumes it after a dropped connection; an archive is streamed and starts over. Once the response began, a failure or a cancellation cuts the connection, so the browser never keeps a truncated file as complete. A second request while one is being sent answers transfer_state."
      parameters: [{ $ref: "#/components/parameters/TransferID" }, { name: Range, in: header, required: false, schema: { type: string } }]
      responses:
        "200": { description: The whole file or the ZIP archive, content: { application/octet-stream: { schema: { type: string, format: binary } }, application/zip: { schema: { type: string, format: binary } } } }
        "206": { description: The requested range of a file, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "403": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
        "409": { $ref: "#/components/responses/ProductError" }
        "422": { $ref: "#/components/responses/ProductError" }
        "423": { $ref: "#/components/responses/ProductError" }
  /api/v1/transfers/{transferId}/pause:
    post:
      operationId: pauseUpload
      summary: Record that the browser paused an upload, so other browsers show it paused; the next part resumes it
      parameters: [{ $ref: "#/components/parameters/TransferID" }, { $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "200": { description: The paused upload, content: { application/json: { schema: { $ref: "#/components/schemas/Transfer" } } } }
        "404": { $ref: "#/components/responses/ProductError" }
        "409": { $ref: "#/components/responses/ProductError" }
  /api/v1/transfers/{transferId}/cancel:
    post:
      operationId: cancelTransfer
      summary: "Stop a transfer from any browser: an upload's bytes are discarded, a download's connection is cut"
      parameters: [{ $ref: "#/components/parameters/TransferID" }, { $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "200": { description: "The canceled transfer; a finished one is returned unchanged", content: { application/json: { schema: { $ref: "#/components/schemas/Transfer" } } } }
        "404": { $ref: "#/components/responses/ProductError" }
  /api/v1/uploads:
    post:
      operationId: createUpload
      summary: "tus 1.0 creation (ADR 0019): open an upload of one file whose parts follow by PATCH"
      description: "Upload-Metadata carries base64 values: filename, spaceId, parentId (empty for the space root), relativePath (folders to create below it, separated by /), conflict (ask, rename or replace; default ask), lastModified (milliseconds) and batch. With conflict=ask a taken name answers name_conflict before any byte is sent; a name taken while the bytes arrive keeps both. replace sends the existing file to the trash. The whole file must fit in the volume reserve. An empty file is saved at once."
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
        - { $ref: "#/components/parameters/TusResumable" }
        - { name: Upload-Length, in: header, required: true, schema: { type: integer, minimum: 0 } }
        - { name: Upload-Metadata, in: header, required: true, schema: { type: string } }
      responses:
        "201":
          description: Created; Location is the upload's address
          headers:
            Location: { required: true, schema: { type: string } }
        "400": { $ref: "#/components/responses/ProductError" }
        "403": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
        "409": { $ref: "#/components/responses/ProductError" }
        "422": { $ref: "#/components/responses/ProductError" }
        "423": { $ref: "#/components/responses/ProductError" }
        "429": { $ref: "#/components/responses/ProductError" }
        "507": { $ref: "#/components/responses/ProductError" }
  /api/v1/uploads/{transferId}:
    parameters: [{ $ref: "#/components/parameters/TransferID" }]
    head:
      operationId: getUploadOffset
      summary: "tus offset: where to resume an upload. A completed upload reports its full length, so a browser that missed the final response does not send it again; a lost one answers 404 and starts over."
      parameters: [{ $ref: "#/components/parameters/TusResumable" }]
      responses:
        "200":
          description: The upload's offset and length
          headers:
            Upload-Offset: { required: true, schema: { type: integer, minimum: 0 } }
            Upload-Length: { required: true, schema: { type: integer, minimum: 0 } }
        "404": { description: "The upload is unknown, canceled, failed or lost in a restart" }
    patch:
      operationId: appendUpload
      summary: "tus append: write a part at Upload-Offset. The last part saves the file in its folder."
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
        - { $ref: "#/components/parameters/TusResumable" }
        - { name: Upload-Offset, in: header, required: true, schema: { type: integer, minimum: 0 } }
      requestBody: { required: true, content: { application/offset+octet-stream: { schema: { type: string, format: binary } } } }
      responses:
        "204":
          description: Written; Upload-Offset is the new offset
          headers:
            Upload-Offset: { required: true, schema: { type: integer, minimum: 0 } }
        "400": { $ref: "#/components/responses/ProductError" }
        "403": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
        "409": { $ref: "#/components/responses/ProductError" }
        "410": { $ref: "#/components/responses/ProductError" }
        "423": { $ref: "#/components/responses/ProductError" }
        "507": { $ref: "#/components/responses/ProductError" }
    delete:
      operationId: terminateUpload
      summary: "tus termination: cancel an upload and discard its bytes"
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/TusResumable" }]
      responses:
        "204": { description: Canceled }
        "404": { description: The upload is unknown }
  /api/v1/assistant/status:
    get:
      operationId: getAssistantStatus
      summary: "Whether the signed-in member has an AI assistant instance (ADR 0024)"
      description: "Answers 503 assistant_unavailable when the assistant is not enabled on this device; the desktop then shows the app as planned."
      responses:
        "200": { description: Status, content: { application/json: { schema: { $ref: "#/components/schemas/AssistantStatus" } } } }
        "401": { $ref: "#/components/responses/ProductError" }
        "503": { $ref: "#/components/responses/ProductError" }
  /api/v1/assistant/ws:
    get:
      operationId: openAssistantGateway
      summary: "The member's own assistant over JSON-RPC, as Hermes Desktop talks to hermes serve (ADR 0024 decision 9)"
      description: >-
        A WebSocket (101 Switching Protocols) whose Origin must be this host. Each frame is one JSON-RPC object. The
        product service passes only the allowed methods with their allowed parameters (session.create, session.resume,
        session.activate, session.events.since, session.active_list, prompt.submit, session.interrupt, session.title,
        session.close, gateway.ping, ping) and the allowed events; everything else is refused with -32601 or -32602.
        client.capabilities, approval.pending and approval.received are answered by the product service itself:
        requests from Hermes never reach the window, and approvals arrive as anas.approval events carrying an
        AssistantApproval. The connection reaches the instance through the session gate (decision 10) and closes when
        the member's session ends.
      responses:
        "101": { description: Switched to WebSocket }
        "401": { $ref: "#/components/responses/ProductError" }
        "426": { $ref: "#/components/responses/ProductError" }
        "503": { $ref: "#/components/responses/ProductError" }
  /api/v1/assistant/sessions:
    get:
      operationId: listAssistantSessions
      summary: "The member's conversations with at least one message, newest activity first, from the member's own assistant instance"
      description: "A new conversation is started over the gateway (session.create) and is stored by Hermes with its first message."
      responses:
        "200": { description: Conversations, content: { application/json: { schema: { type: object, additionalProperties: false, required: [sessions], properties: { sessions: { type: array, items: { $ref: "#/components/schemas/AssistantSession" } } } } } } }
        "401": { $ref: "#/components/responses/ProductError" }
        "502": { $ref: "#/components/responses/ProductError" }
        "503": { $ref: "#/components/responses/ProductError" }
  /api/v1/assistant/sessions/{sessionId}:
    parameters: [{ $ref: "#/components/parameters/AssistantSessionID" }]
    patch:
      operationId: renameAssistantSession
      summary: "Rename a stored conversation; title_in_use when another conversation of the member has the title"
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [title], properties: { title: { type: string, minLength: 1, maxLength: 100 } } } } } }
      responses:
        "200": { description: The new title, content: { application/json: { schema: { type: object, additionalProperties: false, required: [id, title], properties: { id: { type: string }, title: { type: string } } } } } }
        "400": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
        "409": { $ref: "#/components/responses/ProductError" }
        "502": { $ref: "#/components/responses/ProductError" }
        "503": { $ref: "#/components/responses/ProductError" }
    delete:
      operationId: deleteAssistantSession
      summary: Delete a conversation and its transcript
      description: "The window first stops and closes the conversation over the gateway when it is live, as Hermes Desktop does."
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/ProductError" }
        "502": { $ref: "#/components/responses/ProductError" }
        "503": { $ref: "#/components/responses/ProductError" }
  /api/v1/assistant/sessions/{sessionId}/messages:
    parameters: [{ $ref: "#/components/parameters/AssistantSessionID" }]
    get:
      operationId: getAssistantMessages
      summary: "A conversation's transcript in Hermes Agent's own message form"
      description: "The desktop folds these rows into chat messages with Hermes Desktop's transcript model (web/src/assistant/hermes), so the rows are passed through as Hermes stores them."
      responses:
        "200": { description: Transcript, content: { application/json: { schema: { type: object, additionalProperties: false, required: [messages], properties: { messages: { type: array, items: { $ref: "#/components/schemas/AssistantMessage" } } } } } } }
        "400": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
        "502": { $ref: "#/components/responses/ProductError" }
        "503": { $ref: "#/components/responses/ProductError" }
  /api/v1/assistant/memory:
    get:
      operationId: getAssistantMemory
      summary: "What the member's assistant remembers and the skills it made, from Hermes's learning graph; A-NAS's own skills are left out"
      responses:
        "200": { description: The memory, content: { application/json: { schema: { $ref: "#/components/schemas/AssistantMemory" } } } }
        "401": { $ref: "#/components/responses/ProductError" }
        "503": { $ref: "#/components/responses/ProductError" }
  /api/v1/assistant/memory/items/{memoryId}:
    parameters: [{ $ref: "#/components/parameters/AssistantMemoryID" }]
    get:
      operationId: getAssistantMemoryItem
      summary: "The whole text of one memory or skill (its SKILL.md)"
      responses:
        "200": { description: The text, content: { application/json: { schema: { type: object, additionalProperties: false, required: [id, kind, content], properties: { id: { type: string }, kind: { type: string, enum: [memory, skill] }, content: { type: string } } } } } }
        "400": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
        "503": { $ref: "#/components/responses/ProductError" }
    delete:
      operationId: deleteAssistantMemoryItem
      summary: "Forget one memory, or move one skill into Hermes's archive; new conversations no longer carry it"
      description: "memory_changed when the memory changed since it was read; read it again."
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "204": { description: Forgotten }
        "400": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
        "409": { $ref: "#/components/responses/ProductError" }
        "503": { $ref: "#/components/responses/ProductError" }
  /api/v1/assistant/memory/clear:
    post:
      operationId: clearAssistantMemory
      summary: "Forget every memory and skill; with conversations, also delete every conversation, which is the only way to clear it for good"
      description: "A conversation with a turn running is kept and counted as busy."
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: false, content: { application/json: { schema: { type: object, additionalProperties: false, properties: { conversations: { type: boolean } } } } } }
      responses:
        "200": { description: What was cleared, content: { application/json: { schema: { type: object, additionalProperties: false, required: [memories, skills, conversations, busy], properties: { memories: { type: integer }, skills: { type: integer }, conversations: { type: integer }, busy: { type: integer } } } } } }
        "400": { $ref: "#/components/responses/ProductError" }
        "503": { $ref: "#/components/responses/ProductError" }
  /api/v1/assistant/approvals:
    get:
      operationId: listAssistantApprovals
      summary: "The member's confirmation cards: the ones awaiting an answer, and those decided in the last hour"
      description: "Each card is one call of 提交更改 that asked for approval in a running turn; nothing outside the assistant's own directory changes until the member confirms it."
      responses:
        "200": { description: Cards, content: { application/json: { schema: { type: object, additionalProperties: false, required: [approvals], properties: { approvals: { type: array, items: { $ref: "#/components/schemas/AssistantApproval" } } } } } } }
        "401": { $ref: "#/components/responses/ProductError" }
        "503": { $ref: "#/components/responses/ProductError" }
  /api/v1/assistant/approvals/{requestId}/confirm:
    parameters: [{ $ref: "#/components/parameters/AssistantRequestID" }]
    post:
      operationId: confirmAssistantApproval
      summary: "Confirm a card: for a change the executor records the member's one-time grant against this session, then the assistant is told yes and applies it as the member; a command runs in the sandbox"
      description: "approval_expired when the assistant no longer waits (the time ran out or the turn was stopped); the grant is then void. A question is answered with /answer instead (invalid_answer)."
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                forSession: { type: boolean, description: "Allow a command (with forSession) for the rest of its conversation." }
      responses:
        "200": { description: The card, content: { application/json: { schema: { $ref: "#/components/schemas/AssistantApprovalEnvelope" } } } }
        "400": { $ref: "#/components/responses/ProductError" }
        "401": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
        "409": { $ref: "#/components/responses/ProductError" }
        "502": { $ref: "#/components/responses/ProductError" }
        "503": { $ref: "#/components/responses/ProductError" }
  /api/v1/assistant/approvals/{requestId}/reject:
    parameters: [{ $ref: "#/components/parameters/AssistantRequestID" }]
    post:
      operationId: rejectAssistantApproval
      summary: Refuse a card; nothing changes and the assistant is told no (a question is skipped)
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "200": { description: The card, content: { application/json: { schema: { $ref: "#/components/schemas/AssistantApprovalEnvelope" } } } }
        "400": { $ref: "#/components/responses/ProductError" }
        "401": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
        "409": { $ref: "#/components/responses/ProductError" }
        "502": { $ref: "#/components/responses/ProductError" }
        "503": { $ref: "#/components/responses/ProductError" }
  /api/v1/assistant/approvals/{requestId}/answer:
    parameters: [{ $ref: "#/components/parameters/AssistantRequestID" }]
    post:
      operationId: answerAssistantQuestion
      summary: "Answer a question card: the answers go back to the assistant as the reply to its question"
      description: "invalid_answer when the card is not a question or an answer names no question of it or is over 4,000 characters; approval_expired when the assistant no longer waits."
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [answers]
              properties:
                answers:
                  type: object
                  description: "Answer by question id; null leaves a question out."
                  additionalProperties: { type: [string, "null"], maxLength: 4000 }
      responses:
        "200": { description: The card, content: { application/json: { schema: { $ref: "#/components/schemas/AssistantApprovalEnvelope" } } } }
        "400": { $ref: "#/components/responses/ProductError" }
        "401": { $ref: "#/components/responses/ProductError" }
        "404": { $ref: "#/components/responses/ProductError" }
        "409": { $ref: "#/components/responses/ProductError" }
        "503": { $ref: "#/components/responses/ProductError" }
  /api/v1/shares:
    get:
      operationId: listMemberShares
      summary: List received or sent member shares
      responses:
        '200':
          description: List received or sent member shares
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MemberShare'
                  nextOffset:
                    type: integer
                    minimum: 0
                required:
                - items
        default:
          $ref: '#/components/responses/ProductError'
      parameters:
      - name: direction
        in: query
        required: false
        schema:
          type: string
          enum:
          - received
          - sent
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
    post:
      operationId: createMemberShare
      summary: Prepare an independent copy for specified NAS members
      responses:
        '202':
          description: Prepare an independent copy for specified NAS members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberShare'
        default:
          $ref: '#/components/responses/ProductError'
      parameters:
      - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMemberShare'
  /api/v1/shares/members:
    get:
      operationId: listShareMembers
      summary: List enabled members excluding the signed-in user
      responses:
        '200':
          description: List enabled members excluding the signed-in user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        id:
                          type: string
                        username:
                          type: string
                        nickname:
                          type: string
                        avatarVersion:
                          type: string
                      required:
                      - id
                      - username
                required:
                - items
        default:
          $ref: '#/components/responses/ProductError'
  /api/v1/shares/notifications:
    get:
      operationId: listShareNotifications
      summary: Catch up on notifications after the per-account cursor
      responses:
        '200':
          description: Catch up on notifications after the per-account cursor
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MemberShareNotification'
                required:
                - items
        default:
          $ref: '#/components/responses/ProductError'
      parameters:
      - name: after
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
  /api/v1/shares/jobs/{jobId}:
    parameters:
    - name: jobId
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getShareSaveJob
      summary: Read own persisted save progress
      responses:
        '200':
          description: Read own persisted save progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberShareJob'
        default:
          $ref: '#/components/responses/ProductError'
  /api/v1/shares/{shareId}:
    parameters:
    - name: shareId
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getMemberShare
      summary: Read share details without marking viewed
      responses:
        '200':
          description: Read share details without marking viewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberShare'
        default:
          $ref: '#/components/responses/ProductError'
  /api/v1/shares/{shareId}/view:
    parameters:
    - name: shareId
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: viewMemberShare
      summary: Mark this recipient as having viewed the share
      responses:
        '200':
          description: Mark this recipient as having viewed the share
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberShare'
        default:
          $ref: '#/components/responses/ProductError'
      parameters:
      - $ref: '#/components/parameters/CSRFToken'
  /api/v1/shares/{shareId}/messages:
    parameters:
    - name: shareId
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: listShareMessages
      summary: Read the private sender-recipient conversation
      responses:
        '200':
          description: Read the private sender-recipient conversation
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MemberShareMessage'
                required:
                - items
        default:
          $ref: '#/components/responses/ProductError'
      parameters:
      - name: recipientId
        in: query
        required: true
        schema:
          type: string
      - name: after
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
    post:
      operationId: sendShareMessage
      summary: Send a private reply supporting Unicode emoji
      responses:
        '201':
          description: Send a private reply supporting Unicode emoji
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberShareMessage'
        default:
          $ref: '#/components/responses/ProductError'
      parameters:
      - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                recipientId:
                  type: string
                requestId:
                  type: string
                text:
                  type: string
              required:
              - recipientId
              - requestId
              - text
  /api/v1/shares/{shareId}/read:
    parameters:
    - name: shareId
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: readShareMessages
      summary: Advance the private conversation read cursor
      responses:
        '204':
          description: Advance the private conversation read cursor
        default:
          $ref: '#/components/responses/ProductError'
      parameters:
      - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                recipientId:
                  type: string
                through:
                  type: integer
                  minimum: 0
              required:
              - recipientId
              - through
  /api/v1/shares/{shareId}/save:
    parameters:
    - name: shareId
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: saveMemberShare
      summary: Save selected entries to a writable destination with conflict renaming
      responses:
        '202':
          description: Save selected entries to a writable destination with conflict renaming
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberShareJob'
        default:
          $ref: '#/components/responses/ProductError'
      parameters:
      - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveMemberShare'
      description: Seven days after publication new saves are refused. Jobs already accepted finish after
        natural expiry; manual revocation fences all further publications immediately. The sender never
        learns the target path.
  /api/v1/shares/{shareId}/jobs:
    parameters:
    - name: shareId
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: listShareSaveJobs
      summary: List own save jobs for this share
      responses:
        '200':
          description: List own save jobs for this share
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MemberShareJob'
                required:
                - items
        default:
          $ref: '#/components/responses/ProductError'
  /api/v1/shares/{shareId}/revoke:
    parameters:
    - name: shareId
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: revokeMemberShare
      summary: Revoke the share and stop ongoing saves before acknowledging
      responses:
        '204':
          description: Revoke the share and stop ongoing saves before acknowledging
        default:
          $ref: '#/components/responses/ProductError'
      parameters:
      - $ref: '#/components/parameters/CSRFToken'
  /api/v1/shares/{shareId}/entries/{entryId}/content:
    parameters:
    - name: shareId
      in: path
      required: true
      schema:
        type: string
    - name: entryId
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getShareContent
      summary: Read authorized content
      responses:
        '200':
          description: Read authorized content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/ProductError'
        '206':
          description: Partial authorized content
        '416':
          description: Unsatisfiable range
      parameters:
      - name: Range
        in: header
        required: false
        schema:
          type: string
  /api/v1/shares/{shareId}/entries/{entryId}/preview:
    parameters:
    - name: shareId
      in: path
      required: true
      schema:
        type: string
    - name: entryId
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getSharePreview
      summary: Convert HEIC preview in the isolated media worker
      responses:
        '200':
          description: Convert HEIC preview in the isolated media worker
          content:
            image/png:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/ProductError'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: anas_session
  parameters:
    CSRFToken: { name: X-CSRF-Token, in: header, required: true, schema: { type: string, minLength: 1 } }
    UserID: { name: userId, in: path, required: true, schema: { type: string } }
    PlanID: { name: planId, in: path, required: true, schema: { type: string } }
    SpaceID: { name: spaceId, in: path, required: true, schema: { type: string } }
    FileID: { name: fileId, in: path, required: true, schema: { type: string } }
    TrashID: { name: trashId, in: path, required: true, schema: { type: string } }
    PhotoLibraryID: { name: libraryId, in: path, required: true, schema: { type: string } }
    PhotoDirectoryID: { name: directoryId, in: path, required: true, schema: { type: string } }
    PhotoAssetID: { name: assetId, in: path, required: true, schema: { type: string } }
    PhotoAlbumID: { name: albumId, in: path, required: true, schema: { type: string } }
    PhotoPersonID: { name: personId, in: path, required: true, schema: { type: string } }
    PhotoOccurrenceID: { name: occurrenceId, in: path, required: true, schema: { type: string } }
    SnapshotID: { name: snapshotId, in: path, required: true, schema: { type: string } }
    MediaLibraryID: { name: libraryId, in: path, required: true, schema: { type: string } }
    MediaVideoID: { name: videoId, in: path, required: true, schema: { type: string } }
    MediaTitleID: { name: titleId, in: path, required: true, description: A video or show ID., schema: { type: string } }
    TrackID: { name: trackId, in: path, required: true, description: The track's stable file ID in its space., schema: { type: string } }
    PlaylistID: { name: playlistId, in: path, required: true, schema: { type: string } }
    CoverID: { name: coverId, in: path, required: true, schema: { type: string, pattern: "^[a-f0-9]{32}$" } }
    FeedbackID: { name: feedbackId, in: path, required: true, schema: { type: string } }
    TransferID: { name: transferId, in: path, required: true, schema: { type: string } }
    AssistantSessionID: { name: sessionId, in: path, required: true, description: "A stored Hermes session id.", schema: { type: string, pattern: "^[0-9]{8}_[0-9]{6}_[0-9a-f]{6}$" } }
    AssistantMemoryID: { name: memoryId, in: path, required: true, description: "A learning-graph id: memory:<store>:<n>:<fingerprint>, or a skill's name.", schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9:_.-]{0,199}$" } }
    AssistantRequestID: { name: requestId, in: path, required: true, description: "The approval's request id from Hermes.", schema: { type: string, pattern: "^[A-Za-z0-9_.:-]{1,64}$" } }
    TusResumable: { name: Tus-Resumable, in: header, required: true, schema: { type: string, enum: ["1.0.0"] } }
    AppId:
      name: appId
      in: path
      required: true
      description: Catalog app ID, also the suffix of its Compose project (a-nas-<appId>).
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]{0,40}$"
    ContainerId:
      name: containerId
      in: path
      required: true
      description: Full 64-character engine container ID; names and short IDs are rejected.
      schema:
        type: string
        pattern: "^[a-f0-9]{64}$"
  responses:
    ProductError:
      description: Product operation error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AppsUnavailable:
      description: The App Center is disabled (apps_disabled) or the container agent cannot be reached (apps_unavailable).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AppNotFound:
      description: No catalog app has this ID (app_not_found).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AppRequestInvalid:
      description: The request is malformed (invalid_request) or did not come from the local desktop (forbidden).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AppConflict:
      description: >-
        The operation cannot run now: plan_changed, app_busy, already_installed, not_installed, port_in_use,
        name_in_use, address_pool_missing (the app creates Docker networks but Docker has no A-NAS address pool),
        docker_runtime_outdated (Docker Compose before 2.30 or an engine API before 1.45 would mount whole
        volumes), policy_violation or app_engine_error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ContainersUnavailable:
      description: Container management is disabled (containers_disabled) or the engine cannot be reached (containers_unavailable).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ContainerRequestInvalid:
      description: The container ID, action or tail is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ContainerNotFound:
      description: No container has this ID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ContainerEngineError:
      description: The container engine rejected the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    StateUnavailable:
      description: Host state cannot currently be read.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    MethodNotAllowed:
      description: The path exists but does not support the request method.
      headers:
        Allow:
          schema:
            type: string
          description: Supported method for this endpoint.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    TaskManagerStatus:
      type: string
      enum: [available, partial, unavailable, unsupported, absent]
      description: Availability of a collection or accelerator; unknown metrics remain null.
    TaskManagerID:
      type: string
      minLength: 1
      maxLength: 512
      description: Opaque observation identity, never a host path. Process identities include PID and start time.
    TaskManagerPercent:
      type: [number, "null"]
      minimum: 0
      maximum: 100
      description: Percentage of whole-machine CPU capacity or of the named accelerator; null when unknown.
    TaskManagerRate:
      type: [number, "null"]
      minimum: 0
      description: Bytes per second during sampleSeconds; null without a valid sampling baseline.
    TaskManagerBytes:
      type: [integer, "null"]
      minimum: 0
      description: Bytes, or null when the observation is unavailable.
    TaskManagerCPU:
      type: object
      additionalProperties: false
      required: [model, logicalCores, usagePercent]
      properties:
        model: { type: string }
        logicalCores: { type: integer, minimum: 1 }
        usagePercent: { $ref: "#/components/schemas/TaskManagerPercent" }
    TaskManagerMemory:
      type: object
      additionalProperties: false
      required: [totalBytes, usedBytes]
      properties:
        totalBytes: { type: integer, minimum: 1 }
        usedBytes:
          type: integer
          minimum: 0
          description: MemTotal minus MemAvailable; reclaimable cache is available memory.
    TaskManagerNetwork:
      type: object
      additionalProperties: false
      required: [id, name, physical, receiveBytes, transmitBytes, receiveBytesPerSecond, transmitBytesPerSecond]
      properties:
        id: { $ref: "#/components/schemas/TaskManagerID" }
        name: { type: string, minLength: 1 }
        physical: { type: boolean }
        receiveBytes: { type: integer, minimum: 0 }
        transmitBytes: { type: integer, minimum: 0 }
        receiveBytesPerSecond: { $ref: "#/components/schemas/TaskManagerRate" }
        transmitBytesPerSecond: { $ref: "#/components/schemas/TaskManagerRate" }
    TaskManagerDisk:
      type: object
      additionalProperties: false
      required: [id, model, capacityBytes, readBytesPerSecond, writeBytesPerSecond]
      properties:
        id: { $ref: "#/components/schemas/TaskManagerID" }
        model: { type: string }
        capacityBytes: { type: integer, minimum: 0 }
        readBytesPerSecond: { $ref: "#/components/schemas/TaskManagerRate" }
        writeBytesPerSecond: { $ref: "#/components/schemas/TaskManagerRate" }
    TaskManagerMetricStatus:
      type: string
      enum: [available, unsupported, unavailable]
      description: Per-metric availability; unsupported means the driver lacks the interface, unavailable means reading failed.
    TaskManagerAccelerator:
      type: object
      additionalProperties: false
      required: [id, name, driver, status, usageStatus, memoryUsedStatus, memoryTotalStatus, usagePercent, memoryUsedBytes, memoryTotalBytes]
      properties:
        id: { $ref: "#/components/schemas/TaskManagerID" }
        name: { type: string, minLength: 1 }
        driver: { type: string }
        usageStatus: { $ref: "#/components/schemas/TaskManagerMetricStatus" }
        memoryUsedStatus: { $ref: "#/components/schemas/TaskManagerMetricStatus" }
        memoryTotalStatus: { $ref: "#/components/schemas/TaskManagerMetricStatus" }
        status: { $ref: "#/components/schemas/TaskManagerStatus" }
        usagePercent: { $ref: "#/components/schemas/TaskManagerPercent" }
        memoryUsedBytes: { $ref: "#/components/schemas/TaskManagerBytes" }
        memoryTotalBytes: { $ref: "#/components/schemas/TaskManagerBytes" }
    TaskManagerTask:
      type: object
      additionalProperties: false
      required: [id, name, pid, state, cpuPercent, memoryBytes, readBytesPerSecond, writeBytesPerSecond]
      properties:
        iconId:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: Content hash referencing an optional installed icon in the snapshot.
        id: { $ref: "#/components/schemas/TaskManagerID" }
        name: { type: string, minLength: 1 }
        pid:
          type: integer
          minimum: 0
          description: Process ID; services use zero because their usage aggregates the cgroup.
        state: { type: string }
        cpuPercent: { $ref: "#/components/schemas/TaskManagerPercent" }
        memoryBytes: { $ref: "#/components/schemas/TaskManagerBytes" }
        readBytesPerSecond: { $ref: "#/components/schemas/TaskManagerRate" }
        writeBytesPerSecond: { $ref: "#/components/schemas/TaskManagerRate" }
    TaskManagerNetworkGroup:
      type: object
      additionalProperties: false
      required: [status, items]
      properties:
        status: { $ref: "#/components/schemas/TaskManagerStatus" }
        items:
          type: array
          maxItems: 4096
          items: { $ref: "#/components/schemas/TaskManagerNetwork" }
    TaskManagerDiskGroup:
      type: object
      additionalProperties: false
      required: [status, items]
      properties:
        status: { $ref: "#/components/schemas/TaskManagerStatus" }
        items:
          type: array
          maxItems: 4096
          items: { $ref: "#/components/schemas/TaskManagerDisk" }
    TaskManagerAcceleratorGroup:
      type: object
      additionalProperties: false
      required: [status, items]
      properties:
        status: { $ref: "#/components/schemas/TaskManagerStatus" }
        items:
          type: array
          maxItems: 4096
          items: { $ref: "#/components/schemas/TaskManagerAccelerator" }
    TaskManagerProcessGroup:
      type: object
      additionalProperties: false
      required: [status, items]
      properties:
        status: { $ref: "#/components/schemas/TaskManagerStatus" }
        items:
          type: array
          maxItems: 4096
          items: { $ref: "#/components/schemas/TaskManagerTask" }
    TaskManagerServiceGroup:
      type: object
      additionalProperties: false
      required: [status, items]
      properties:
        status: { $ref: "#/components/schemas/TaskManagerStatus" }
        items:
          type: array
          maxItems: 1024
          items: { $ref: "#/components/schemas/TaskManagerTask" }
    TaskManagerDeviceResponse:
      type: object
      additionalProperties: false
      required: [observedAt, sampleSeconds, dataSource, cpu, memory, network, disks, gpu, npu]
      properties:
        observedAt: { type: string, format: date-time }
        sampleSeconds:
          type: number
          exclusiveMinimum: 0
          description: Shared sampling window in seconds.
        dataSource: { $ref: "#/components/schemas/DataSource" }
        cpu: { $ref: "#/components/schemas/TaskManagerCPU" }
        memory: { $ref: "#/components/schemas/TaskManagerMemory" }
        network: { $ref: "#/components/schemas/TaskManagerNetworkGroup" }
        disks: { $ref: "#/components/schemas/TaskManagerDiskGroup" }
        gpu: { $ref: "#/components/schemas/TaskManagerAcceleratorGroup" }
        npu: { $ref: "#/components/schemas/TaskManagerAcceleratorGroup" }
    TaskManagerTasksResponse:
      type: object
      additionalProperties: false
      required: [observedAt, sampleSeconds, dataSource, processes, services]
      properties:
        icons:
          type: object
          maxProperties: 64
          description: Deduplicated installed artwork; bounded to 1 MiB total. No host paths or remote URLs.
          additionalProperties:
            type: string
            maxLength: 24576
            pattern: '^data:image/(png|svg\+xml);base64,[A-Za-z0-9+/]+=*$'
        observedAt: { type: string, format: date-time }
        sampleSeconds:
          type: number
          exclusiveMinimum: 0
          description: Shared sampling window in seconds.
        dataSource: { $ref: "#/components/schemas/DataSource" }
        processes: { $ref: "#/components/schemas/TaskManagerProcessGroup" }
        services: { $ref: "#/components/schemas/TaskManagerServiceGroup" }
    Health:
      type: string
      enum: [healthy, warning, critical, unknown]
    DiskRole:
      type: string
      enum: [system, data, unassigned]
    Transport:
      type: string
      enum: [nvme, sata, usb, unknown]
    DataSource:
      type: string
      enum: [simulated, live]
    StableResourceID:
      type: string
      minLength: 1
      pattern: "^[^/\\\\]+$"
      description: Opaque identity that is not a device path or mount point.
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    OperatingSystem:
      type: object
      additionalProperties: false
      required: [name, version]
      properties:
        name:
          type: string
        version:
          type: string
    SystemResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - hostname
        - operatingSystem
        - architecture
        - uptimeSeconds
        - health
        - healthFindings
        - productVersion
        - observedAt
      properties:
        id:
          $ref: "#/components/schemas/StableResourceID"
        hostname:
          type: string
          minLength: 1
        operatingSystem:
          $ref: "#/components/schemas/OperatingSystem"
        architecture:
          type: string
          minLength: 1
        uptimeSeconds:
          type: integer
          format: int64
          minimum: 0
        health:
          $ref: "#/components/schemas/Health"
        healthFindings:
          $ref: "#/components/schemas/HealthFindings"
        productVersion:
          type: string
          minLength: 1
        observedAt:
          type: string
          format: date-time
    SystemState:
      type: object
      additionalProperties: false
      required:
        - id
        - hostname
        - operatingSystem
        - architecture
        - uptimeSeconds
        - health
        - healthFindings
      properties:
        id:
          $ref: "#/components/schemas/StableResourceID"
        hostname:
          type: string
          minLength: 1
        operatingSystem:
          $ref: "#/components/schemas/OperatingSystem"
        architecture:
          type: string
          minLength: 1
        uptimeSeconds:
          type: integer
          format: int64
          minimum: 0
        health:
          $ref: "#/components/schemas/Health"
        healthFindings:
          $ref: "#/components/schemas/HealthFindings"
    HealthFindings:
      type: array
      description: "Why the system is not plainly healthy, most severe first; empty when healthy. The system's health is the severity of the first finding (docs/specs/system-health.md)."
      items:
        $ref: "#/components/schemas/HealthFinding"
    HealthFinding:
      type: object
      additionalProperties: false
      required: [code, severity]
      properties:
        code:
          type: string
          enum: [disk_failing, disk_warning, disk_health_unknown, disk_hot, volume_offline, volume_read_only, volume_full, volume_nearly_full, volume_errors]
        severity:
          type: string
          enum: [warning, critical]
        diskId:
          $ref: "#/components/schemas/StableResourceID"
        value:
          type: integer
          format: int64
          description: "disk_hot: temperature in °C; volume_full and volume_nearly_full: percentage used; volume_errors: errors Btrfs counted."
    Disk:
      type: object
      additionalProperties: false
      required:
        - id
        - model
        - transport
        - capacityBytes
        - rotational
        - removable
        - inUse
        - filesystems
        - role
        - health
        - smartStatus
        - eligibleForDataVolume
        - ineligibleReasons
      properties:
        id:
          $ref: "#/components/schemas/StableResourceID"
        model:
          type: string
          minLength: 1
        transport:
          $ref: "#/components/schemas/Transport"
        capacityBytes:
          type: integer
          format: int64
          minimum: 1
        rotational:
          type: boolean
        removable:
          type: boolean
        inUse:
          type: boolean
        filesystems:
          type: array
          items:
            type: string
        role:
          $ref: "#/components/schemas/DiskRole"
        health:
          $ref: "#/components/schemas/Health"
        smartStatus:
          $ref: "#/components/schemas/Health"
        eligibleForDataVolume:
          type: boolean
        ineligibleReasons:
          type: array
          items:
            type: string
        temperatureCelsius:
          type: integer
          minimum: -273
    DisksResponse:
      type: object
      additionalProperties: false
      required: [observedAt, items]
      properties:
        observedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/Disk"
    HostStateResponse:
      type: object
      additionalProperties: false
      required: [dataSource, productVersion, observedAt, system, disks]
      properties:
        dataSource:
          $ref: "#/components/schemas/DataSource"
        productVersion:
          type: string
          minLength: 1
        observedAt:
          type: string
          format: date-time
        system:
          $ref: "#/components/schemas/SystemState"
        disks:
          type: array
          items:
            $ref: "#/components/schemas/Disk"
    SetupStatus:
      type: object
      additionalProperties: false
      required: [setupRequired, setupAllowed]
      properties:
        setupRequired: { type: boolean }
        setupAllowed:
          type: boolean
          description: Whether this connection may set the device up. Only a direct loopback connection without forwarding headers may (the local console or an SSH tunnel); LAN browsers reach the API through Caddy.
    SetupRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { $ref: "#/components/schemas/NewUsername" }
        password: { $ref: "#/components/schemas/NewPassword" }
        localConsole:
          type: boolean
          description: Requests a local console session that lasts until sign-out. Honoured only for a direct loopback connection without forwarding headers; otherwise the session lasts 12 hours.
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, pattern: "^[a-z][a-z0-9_-]{2,31}$" }
        password: { type: string, minLength: 12 }
        localConsole:
          type: boolean
          description: Requests a local console session that lasts until sign-out. Honoured only for a direct loopback connection without forwarding headers; otherwise the session lasts 12 hours.
    CredentialInput:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { $ref: "#/components/schemas/NewUsername" }
        password: { $ref: "#/components/schemas/NewPassword" }
    NewUsername:
      type: string
      pattern: "^[a-z][a-z0-9_-]{2,31}$"
      description: >-
        The account and Linux user name, after trimming and lowercasing. global, homes, printers, shared, a-nas,
        and names starting a-nas- or app- are reserved (409 username_unavailable), as are names of existing host
        accounts and groups; other malformed names answer 422 invalid_username.
    NewPassword:
      type: string
      minLength: 12
      maxLength: 64
      description: >-
        Counted in Unicode code points, at most 254 UTF-8 bytes, without control characters such as newlines
        (422 invalid_password). Only passwords being set are checked; signing in is not.
    User:
      type: object
      additionalProperties: false
      required: [id, username, role, status, createdAt, mustChangePassword]
      properties:
        id: { type: string }
        username: { type: string }
        role: { type: string, enum: [admin, member] }
        status: { type: string, enum: [pending, active, disabled, error] }
        createdAt: { type: string, format: date-time }
        mustChangePassword: { type: boolean }
        nickname: { type: string, maxLength: 24, description: "The name pages show instead of username; absent when the user has not chosen one." }
        avatarVersion: { type: string, description: "Names the current avatar; absent when the user has none. See getAvatar." }
    Profile:
      type: object
      additionalProperties: false
      required: [id, username]
      properties:
        id: { type: string }
        username: { type: string }
        nickname: { type: string }
        avatarVersion: { type: string }
    ProfileChange:
      type: object
      additionalProperties: false
      required: [nickname]
      properties:
        nickname:
          type: string
          description: >-
            Trimmed, with runs of spaces folded into one; at most 24 Unicode code points without control or invisible
            formatting characters (a zero-width joiner inside emoji is allowed), else 422 invalid_nickname. It must
            not equal, ignoring case, another account's username or nickname (409 nickname_unavailable). Empty
            clears it.
    PasswordChange:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { $ref: "#/components/schemas/NewPassword" }
    Notification:
      type: object
      additionalProperties: false
      required: [id, kind, actorUsername, createdAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [admin_viewing, admin_library_viewing, credential_reset] }
        actorUsername: { type: string }
        reason: { type: string }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    ViewingRequest:
      type: object
      additionalProperties: false
      required: [password, reason]
      properties:
        password: { type: string }
        reason: { type: string, minLength: 1, maxLength: 500 }
        scope: { type: string, enum: [space, library], default: space, description: The member's private space (ACL entries) or private photo library (photo Policy). }
    ViewingGrant:
      type: object
      additionalProperties: false
      required: [id, scope, spaceId, ownerUserId, reason, grantedAt, expiresAt]
      properties:
        id: { type: string }
        scope: { type: string, enum: [space, library] }
        spaceId: { type: string }
        ownerUserId: { type: string }
        reason: { type: string }
        grantedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    Session:
      type: object
      additionalProperties: false
      required: [csrfToken, expiresAt, user]
      properties:
        csrfToken: { type: string }
        expiresAt: { type: string, format: date-time, description: "9999-12-31T23:59:59Z marks a local console session, which lasts until sign-out." }
        user: { $ref: "#/components/schemas/User" }
        credentialReset:
          type: object
          additionalProperties: false
          required: [actorUsername, at]
          description: The latest time an administrator chose this user's password. It stays after the notification is acknowledged.
          properties:
            actorUsername: { type: string }
            at: { type: string, format: date-time }
    Space:
      type: object
      additionalProperties: false
      required: [id, kind, name, createdAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [private, shared] }
        name: { type: string }
        ownerUserId: { type: string }
        createdAt: { type: string, format: date-time }
        writable: { type: boolean, description: Whether this caller can write to this space; child ACLs are checked on save. }
        viewing:
          description: Present when an administrator reads this private space through Administrative Viewing Mode; access is read-only.
          type: object
          additionalProperties: false
          required: [grantId, expiresAt]
          properties:
            grantId: { type: string }
            expiresAt: { type: string, format: date-time }
    FileEntry:
      type: object
      additionalProperties: false
      required: [id, spaceId, name, kind, sizeBytes, modifiedAt]
      properties:
        id: { type: string }
        spaceId: { type: string }
        parentId: { type: string }
        name: { type: string }
        kind: { type: string, enum: [file, directory] }
        sizeBytes: { type: integer, format: int64, minimum: 0 }
        modifiedAt: { type: string, format: date-time }
    FileDestination:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        parentId: { type: string }
        name: { type: string, minLength: 1 }
    FileTransfer:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        spaceId: { type: string, description: Target space; defaults to the entry's own space. A move to another space copies the entry with new IDs and then removes the original. }
        parentId: { type: string, description: Target folder in the target space; empty for its root. }
        name: { type: string, minLength: 1 }
    TrashItem:
      type: object
      additionalProperties: false
      required: [id, entryId, spaceId, name, kind, sizeBytes, originalPath, originalGone, deletedBy, deletedAt, purgeAt]
      properties:
        id: { type: string }
        entryId: { type: string }
        spaceId: { type: string }
        name: { type: string }
        kind: { type: string, enum: [file, directory] }
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
          description: Total size of the files the item holds, as last indexed.
        originalPath:
          type: string
          description: >-
            Folder the item was deleted from, relative to the space root and empty for the root;
            restoring without a parentId puts it back there. When originalGone is true it is where
            the folder was, or empty when that was not recorded.
        originalGone:
          type: boolean
          description: The original folder no longer exists, so restoring without a parentId puts the item at the space root.
        deletedBy: { type: string }
        deletedAt: { type: string, format: date-time }
        purgeAt: { type: string, format: date-time, description: When the recycle bin deletes the item for good. }
    Volume:
      type: object
      additionalProperties: false
      required: [id, diskId, state]
      properties:
        id: { type: string }
        diskId: { $ref: "#/components/schemas/StableResourceID" }
        filesystemUuid: { type: string }
        capacityBytes: { type: integer, format: int64, minimum: 0 }
        availableBytes: { type: integer, format: int64, minimum: 0 }
        state: { type: string, enum: [creating, available, unavailable, read_only] }
    StorageAction:
      type: object
      additionalProperties: false
      required: [kind, description]
      properties:
        kind: { type: string }
        description: { type: string }
    StoragePlan:
      type: object
      additionalProperties: false
      required: [id, diskId, diskModel, capacityBytes, fingerprint, signatures, confirmationPhrase, actions, state, createdAt, expiresAt]
      properties:
        id: { type: string }
        diskId: { $ref: "#/components/schemas/StableResourceID" }
        diskModel: { type: string }
        capacityBytes: { type: integer, format: int64, minimum: 1 }
        fingerprint: { type: string }
        signatures: { type: array, items: { type: string } }
        confirmationPhrase: { type: string }
        actions: { type: array, items: { $ref: "#/components/schemas/StorageAction" } }
        state: { type: string, enum: [planned, confirmed, running, succeeded, failed, needs_attention, expired] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        failure: { type: string }
        volume: { $ref: "#/components/schemas/Volume" }
    Snapshot:
      type: object
      additionalProperties: false
      required: [id, spaceId, name, origin, createdBy, createdAt, fileCount, sizeBytes]
      properties:
        id: { type: string }
        spaceId: { type: string }
        name: { type: string }
        origin: { type: string, enum: [manual, scheduled], description: Scheduled snapshots are deleted by the retention of their schedule; manual ones only by people. }
        createdBy: { type: string, description: "The user who created a manual snapshot, or system for a scheduled one." }
        createdAt: { type: string, format: date-time }
        fileCount: { type: integer, format: int64, minimum: 0 }
        sizeBytes: { type: integer, format: int64, minimum: 0, description: "Total size of the files held, not the space the snapshot takes on disk." }
    SnapshotEntry:
      type: object
      additionalProperties: false
      required: [id, snapshotId, name, kind, sizeBytes]
      properties:
        id: { type: string }
        snapshotId: { type: string }
        parentId: { type: string }
        name: { type: string }
        kind: { type: string, enum: [file, directory] }
        sizeBytes: { type: integer, format: int64, minimum: 0 }
        modifiedAt: { type: string, format: date-time, description: Absent for snapshots taken before modification times were recorded. }
        change:
          type: string
          enum: [removed, modified, inside]
          description: >-
            How the space differs now at the entry's path: removed (deleted, moved or renamed), modified (a file of
            another size or modification time), or inside (a folder still there with something below it removed or
            modified). Absent when the path holds the same thing.
    TrashRestore:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        parentId: { type: string }
        name: { type: string, minLength: 1 }
        conflict:
          type: string
          enum: [ask, rename, replace]
          default: ask
          description: "When the name is taken: ask answers 409 name_conflict; rename keeps both, the item taking the first free \"name (恢复).ext\", \"name (恢复 2).ext\"…; replace, for a file only (422 otherwise), sends the file of that name to the recycle bin and puts the item in its place. A folder in the way is never replaced: the file then comes back beside it."
    RestoredEntry:
      type: object
      additionalProperties: false
      required: [id, spaceId, name, kind, sizeBytes, modifiedAt]
      properties:
        id: { type: string }
        spaceId: { type: string }
        parentId: { type: string }
        name: { type: string, description: The name the item came back under. }
        kind: { type: string, enum: [file, directory] }
        sizeBytes: { type: integer, format: int64, minimum: 0 }
        modifiedAt: { type: string, format: date-time }
        replaced: { type: boolean, description: "The item took the place of a file of its name, which went to the recycle bin." }
    SnapshotRestore:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        parentId: { type: string }
        name: { type: string, minLength: 1 }
        replace: { type: boolean, description: "Files only: a file of that name goes to the recycle bin and the restored file takes its place. Without it a taken name answers 409." }
    SnapshotScheduleSettings:
      type: object
      additionalProperties: false
      required: [enabled, frequency, time, weekday, keep]
      properties:
        enabled: { type: boolean }
        frequency: { type: string, enum: [hourly, daily, weekly] }
        time: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", description: Local time of daily and weekly runs; hourly runs use its minute. }
        weekday: { type: integer, minimum: 0, maximum: 6, description: "Day of weekly runs, 0 for Sunday." }
        keep: { type: integer, minimum: 1, maximum: 100, description: Scheduled snapshots kept after each successful run under count retention. }
        retention: { type: string, enum: [count, tiered], default: count }
        tiers: { $ref: "#/components/schemas/RetentionTiers" }
    RetentionTiers:
      type: object
      additionalProperties: false
      required: [hourly, daily, weekly, monthly]
      description: >-
        Under tiered retention, how many of the latest hours, days, weeks and months keep their newest scheduled
        snapshot; periods without a snapshot do not count. All are zero under count retention. Together they keep at
        most 100; daily schedules keep no hours, weekly ones neither hours nor days.
      properties:
        hourly: { type: integer, minimum: 0, maximum: 100 }
        daily: { type: integer, minimum: 0, maximum: 100 }
        weekly: { type: integer, minimum: 0, maximum: 100 }
        monthly: { type: integer, minimum: 0, maximum: 100 }
    SnapshotSchedule:
      type: object
      additionalProperties: false
      required: [spaceId, enabled, frequency, time, weekday, keep, retention, tiers, canManage]
      properties:
        spaceId: { type: string }
        enabled: { type: boolean }
        frequency: { type: string, enum: [hourly, daily, weekly] }
        time: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        weekday: { type: integer, minimum: 0, maximum: 6 }
        keep: { type: integer, minimum: 1, maximum: 100 }
        retention: { type: string, enum: [count, tiered] }
        tiers: { $ref: "#/components/schemas/RetentionTiers" }
        updatedAt: { type: string, format: date-time }
        lastRun: { $ref: "#/components/schemas/ScheduleRun" }
        nextRunAt: { type: string, format: date-time, description: When the next attempt is expected; absent while disabled. }
        canManage: { type: boolean, description: Whether the caller may change this schedule. }
    ScheduleRun:
      type: object
      additionalProperties: false
      required: [at, status]
      properties:
        at: { type: string, format: date-time }
        status: { type: string, enum: [succeeded, failed] }
        error: { type: string, enum: [volume_unavailable, space_unavailable, snapshot_failed], description: Why a failed run failed; it is retried after 15 minutes until the next run is due. }
        snapshotId: { type: string }
    SnapshotMatch:
      type: object
      additionalProperties: false
      required: [path, name, kind, inSpace, versions]
      properties:
        path: { type: string, description: Slash-separated path inside the space. }
        name: { type: string }
        kind: { type: string, enum: [file, directory] }
        inSpace: { type: boolean, description: Whether the file catalog still lists the path in the space. }
        versions: { type: array, items: { $ref: "#/components/schemas/SnapshotVersion" } }
    SnapshotVersion:
      type: object
      additionalProperties: false
      required: [snapshotId, snapshotName, origin, createdAt, entryId, sizeBytes, snapshots, oldestAt]
      properties:
        snapshotId: { type: string, description: The newest snapshot holding this version. }
        snapshotName: { type: string }
        origin: { type: string, enum: [manual, scheduled] }
        createdAt: { type: string, format: date-time }
        entryId: { type: string }
        sizeBytes: { type: integer, format: int64, minimum: 0 }
        modifiedAt: { type: string, format: date-time }
        snapshots: { type: integer, minimum: 1, description: How many snapshots hold the same version. }
        oldestAt: { type: string, format: date-time, description: When the oldest snapshot holding it was taken. }
        current: { type: boolean, description: The space holds this version of the file now. }
    RemovedEntry:
      type: object
      additionalProperties: false
      required: [path, name, kind, sizeBytes, fileCount, snapshotId, snapshotName, origin, entryId, lastSeenAt]
      properties:
        path: { type: string, description: Slash-separated path the item had in the space. }
        name: { type: string }
        kind: { type: string, enum: [file, directory] }
        sizeBytes: { type: integer, format: int64, minimum: 0, description: "A file's size, or the total of the files in a folder." }
        fileCount: { type: integer, format: int64, minimum: 0, description: 1 for a file; the files in a folder. }
        modifiedAt: { type: string, format: date-time }
        snapshotId: { type: string, description: The newest snapshot holding the item; restores and downloads read it. }
        snapshotName: { type: string }
        origin: { type: string, enum: [manual, scheduled] }
        entryId: { type: string, description: The item's entry in that snapshot. }
        lastSeenAt: { type: string, format: date-time, description: When that snapshot was taken. }
        goneBy: { type: string, format: date-time, description: When the next snapshot was taken without the item; absent when it went after the newest snapshot. }
        inTrash: { type: boolean, description: "The recycle bin holds an item deleted from the same path; restoring it from there brings back its latest version." }
    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, action, resourceType, resourceId, occurredAt]
      properties:
        id: { type: string }
        actorUserId: { type: string }
        action: { type: string }
        resourceType: { type: string }
        resourceId: { type: string }
        occurredAt: { type: string, format: date-time }
        detail: { type: string }
    ActivityCategory:
      type: string
      enum: [session, account, file, storage, photo]
    ActivityAccount:
      type: object
      additionalProperties: false
      required: [id, username]
      properties:
        id: { type: string }
        username: { type: string }
        nickname: { type: string, description: "The account's current nickname, which pages show instead of username." }
    ActivityEvent:
      type: object
      additionalProperties: false
      required: [id, occurredAt, category, action, resourceType]
      properties:
        id: { type: string }
        occurredAt: { type: string, format: date-time }
        category: { type: string, enum: [session, account, file, storage, photo, other] }
        action: { type: string, description: "Action code such as session.signed_in, user.credential_reset, file.uploaded or storage.plan.succeeded." }
        actor: { $ref: "#/components/schemas/ActivityAccount" }
        system: { type: boolean, description: The device did this on its own. }
        subject: { $ref: "#/components/schemas/ActivityAccount" }
        resourceType: { type: string }
        resourceId: { type: string }
        detail:
          type: string
          description: >-
            A file or photo name, a snapshot name, a storage failure, or JSON for session events
            ({via: local-console|lan|loopback, address, username, reason: invalid_password|unknown_user|disabled|unavailable})
            and viewing events ({reason, expiresAt}).
        space:
          type: object
          additionalProperties: false
          required: [id, kind]
          properties:
            id: { type: string }
            kind: { type: string, enum: [private, shared] }
            owner: { $ref: "#/components/schemas/ActivityAccount" }
        redacted: { type: boolean, description: Names in another member's private space were left out. }
    ActivityPage:
      type: object
      additionalProperties: false
      required: [items, scope]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ActivityEvent" } }
        next: { type: string, description: Pass as before to read older events; absent when there are none. }
        scope: { type: string, enum: [all, self] }
        unavailable: { type: array, items: { $ref: "#/components/schemas/ActivityCategory" }, description: Categories whose records could not be read this time. }
    SystemLogService:
      type: string
      enum: [api, host-agent, photos, shares, containers, ai, media, kiosk, samba, caddy]
    SystemLogEntry:
      type: object
      additionalProperties: false
      required: [cursor, time, service, level, message]
      properties:
        cursor: { type: string }
        time: { type: string, format: date-time }
        service: { $ref: "#/components/schemas/SystemLogService" }
        unit: { type: string }
        level: { type: string, enum: [error, warning, info, debug] }
        message: { type: string }
        fields: { type: object, additionalProperties: { type: string } }
        pid: { type: integer }
        truncated: { type: boolean, description: The message was cut at 16 KiB. }
    SystemLogPage:
      type: object
      additionalProperties: false
      required: [items, dataSource]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SystemLogEntry" } }
        next: { type: string, description: Pass as before to continue with older lines; absent at the start of the journal. }
        scannedThrough: { type: string, format: date-time, description: The page stopped at its scan limit before filling; older lines were not checked yet. }
        overflow: { type: boolean, description: An after query found more new lines than one page holds. }
        dataSource: { $ref: "#/components/schemas/DataSource" }
    MetricsResponse:
      type: object
      additionalProperties: false
      required: [dataSource, observedAt, cpu, memory, network]
      properties:
        dataSource:
          $ref: "#/components/schemas/DataSource"
        observedAt:
          type: string
          format: date-time
        cpu:
          type: object
          additionalProperties: false
          required: [usagePercent, logicalCores]
          properties:
            usagePercent:
              type: number
              minimum: 0
              maximum: 100
            logicalCores:
              type: integer
              minimum: 1
        memory:
          type: object
          additionalProperties: false
          required: [totalBytes, usedBytes]
          properties:
            totalBytes:
              type: integer
              format: int64
              minimum: 1
            usedBytes:
              type: integer
              format: int64
              minimum: 0
        network:
          type: object
          additionalProperties: false
          required: [receiveBytesPerSecond, transmitBytesPerSecond]
          properties:
            receiveBytesPerSecond:
              type: integer
              format: int64
              minimum: 0
            transmitBytesPerSecond:
              type: integer
              format: int64
              minimum: 0
    ContainerSnapshotResponse:
      type: object
      additionalProperties: false
      required: [dataSource, observedAt, engine, containers, images]
      properties:
        dataSource:
          $ref: "#/components/schemas/DataSource"
        observedAt:
          type: string
          format: date-time
        engine:
          type: object
          additionalProperties: false
          required: [version, apiVersion]
          properties:
            version:
              type: string
            apiVersion:
              type: string
        containers:
          type: array
          items:
            $ref: "#/components/schemas/Container"
        images:
          type: array
          items:
            $ref: "#/components/schemas/ContainerImage"
    Container:
      type: object
      additionalProperties: false
      required: [id, name, image, state, status, createdAt, ports]
      properties:
        id:
          type: string
          pattern: "^[a-f0-9]{64}$"
        name:
          type: string
          minLength: 1
        image:
          type: string
        imageId:
          type: string
          description: Engine ID of the image the container runs; omitted by container agents that predate it.
        state:
          type: string
          enum: [created, running, paused, restarting, removing, exited, dead]
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        project:
          type: string
          description: Compose project label, omitted for standalone containers.
        ports:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [containerPort, protocol]
            properties:
              hostIp:
                type: string
              hostPort:
                type: integer
                minimum: 1
                maximum: 65535
              containerPort:
                type: integer
                minimum: 0
                maximum: 65535
              protocol:
                type: string
        usage:
          type: object
          additionalProperties: false
          required: [cpuPercent, memoryBytes, memoryLimitBytes]
          properties:
            cpuPercent:
              type: number
              minimum: 0
            memoryBytes:
              type: integer
              format: int64
              minimum: 0
            memoryLimitBytes:
              type: integer
              format: int64
              minimum: 0
    ContainerImage:
      type: object
      additionalProperties: false
      required: [id, tags, sizeBytes, createdAt]
      properties:
        id:
          type: string
          minLength: 1
        tags:
          type: array
          items:
            type: string
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
        createdAt:
          type: string
          format: date-time
    ContainerLogsResponse:
      type: object
      additionalProperties: false
      required: [lines]
      properties:
        lines:
          type: array
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [stream, text]
            properties:
              stream:
                type: string
                enum: [stdout, stderr]
              time:
                type: string
                format: date-time
              text:
                type: string
    AppListResponse:
      type: object
      additionalProperties: false
      required: [dataSource, apps]
      properties:
        dataSource:
          $ref: "#/components/schemas/DataSource"
        apps:
          type: array
          items:
            $ref: "#/components/schemas/AppStatus"
    AppStatus:
      type: object
      additionalProperties: false
      required: [id, title, tagline, description, notes, category, version, author, developer, website, repo, docs, updated, scheme, path, state, running, total]
      properties:
        id:
          type: string
        title:
          type: string
        tagline:
          type: string
        description:
          type: string
          description: Markdown from the vendored manifest.
        notes:
          type: string
          description: Markdown advice for first use, such as a default account; empty when there is none. Written for A-NAS where the manifest's own notes describe CasaOS.
        upstreamNotes:
          type: string
          description: The manifest's own first-use notes, set only when notes replaces them.
        category:
          type: string
          description: A-NAS category; empty when the container agent predates A-NAS categories.
          enum: ["", media, reading, photos, downloads, files, notes, workflow, tools, network, system]
        version:
          type: string
        author:
          type: string
        developer:
          type: string
        website:
          type: string
          description: Absolute http(s) link, or empty.
        repo:
          type: string
          description: Absolute http(s) link, or empty.
        docs:
          type: string
          description: Absolute http(s) link, or empty.
        updated:
          type: string
          description: Upstream date of the vendored manifest (YYYY-MM-DD), or empty.
        webPort:
          type: integer
          minimum: 1
          maximum: 65535
        scheme:
          type: string
        path:
          type: string
        state:
          type: string
          enum: [available, installed, installing, uninstalling]
        running:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        job:
          $ref: "#/components/schemas/AppJob"
        problems:
          type: array
          description: The app's containers that are not running, with their state and last exit code.
          items:
            type: object
            additionalProperties: false
            required: [service, state, exitCode]
            properties:
              service: { type: string }
              state: { type: string }
              exitCode: { type: integer }
        credentials:
          type: array
          description: The app's logins, shown to the owner.
          items: { $ref: "#/components/schemas/AppCredential" }
        runtimeOutdated:
          type: boolean
          description: >-
            The app's containers were created under older runtime rules (ADR 0022) and keep running as they
            were; uninstalling (which keeps app data) and installing again applies the current rules.
    AppShortcutListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AppShortcut"
    AppShortcut:
      type: object
      additionalProperties: false
      required: [id, title, webPort, scheme, path, running, total]
      properties:
        id:
          type: string
        title:
          type: string
        webPort:
          type: integer
          minimum: 1
          maximum: 65535
        scheme:
          type: string
          description: http or https; empty means http.
        path:
          type: string
        running:
          type: integer
          minimum: 0
          description: Running containers; 0 means the app is not running.
        total:
          type: integer
          minimum: 0
    AppCredential:
      type: object
      additionalProperties: false
      required: [label, secret]
      properties:
        label: { type: string }
        username: { type: string }
        secret: { type: string }
        upstream:
          type: boolean
          description: The manifest's published value, still used by an app installed before A-NAS generated its logins.
    AppJob:
      type: object
      additionalProperties: false
      required: [appId, action, state, startedAt, output]
      properties:
        appId:
          type: string
        action:
          type: string
          enum: [install, uninstall]
        state:
          type: string
          enum: [running, succeeded, failed]
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        output:
          type: array
          maxItems: 40
          items:
            type: string
        error:
          type: string
    AppPlan:
      type: object
      additionalProperties: false
      required: [appId, title, version, project, identity, images, containers, ports, mounts, networks, addressPools, digest, compose]
      properties:
        appId:
          type: string
        title:
          type: string
        version:
          type: string
        project:
          type: string
        identity:
          description: >-
            The Linux account app-<appId> allocated for the app. How each service uses it is in services.
          type: object
          additionalProperties: false
          required: [username, uid, gid]
          properties:
            username:
              type: string
              pattern: "^app-[a-z0-9][a-z0-9-]*$"
            uid:
              type: integer
              minimum: 30000
              maximum: 30999
            gid:
              type: integer
              minimum: 30000
              maximum: 30999
        services:
          description: >-
            How each service runs (ADR 0022). app starts as the app identity with no capabilities; app-after-init
            starts as root, prepares itself and switches to the app identity from PUID/PGID, while its init
            processes stay root; image keeps the image's own user, which may be root, and may only mount its
            app's data. Only app and app-after-init services mount Shared folders, through the a-nas-users group
            (20000). Every service has no-new-privileges. Absent from a container agent that predates runtime rules.
          type: array
          items:
            type: object
            additionalProperties: false
            required: [service, runAs]
            properties:
              service:
                type: string
              runAs:
                type: string
                enum: [app, app-after-init, image]
              user:
                type: string
                description: The Compose user, uid:gid; set for app services.
              groups:
                type: array
                description: Supplementary groups Docker adds.
                items:
                  type: string
              capDrop:
                type: array
                items:
                  type: string
              shared:
                type: string
                description: Access to the Shared folder; absent when the service mounts none.
                enum: [read, write]
        images:
          type: array
          items:
            type: string
        containers:
          type: array
          items:
            type: string
        ports:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [hostPort, containerPort, protocol]
            properties:
              hostPort:
                type: integer
                minimum: 1024
                maximum: 65535
              containerPort:
                type: integer
                minimum: 0
                maximum: 65535
              protocol:
                type: string
              purpose:
                type: string
        mounts:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [hostPath, containerPath, kind, readOnly]
            properties:
              hostPath:
                type: string
              containerPath:
                type: string
              kind:
                type: string
                enum: [appdata, shared, system]
              readOnly:
                type: boolean
                description: Shared folders are read-only unless the app exists to write them (downloads, sync, backups, uploads).
              purpose:
                type: string
        networks:
          description: >-
            Compose networks the install creates, including the implicit default network; empty when every
            service uses Docker's default bridge. An install whose network Docker places outside addressPools
            is rolled back.
          type: array
          items:
            type: string
        addressPools:
          description: The Docker address pools the networks come from, as CIDR prefixes; empty when there are no networks.
          type: array
          items:
            type: string
        digest:
          type: string
          pattern: "^[a-f0-9]{64}$"
        compose:
          type: string
        credentials:
          type: array
          description: Logins generated for this app at its first plan and kept, shown to the owner.
          items: { $ref: "#/components/schemas/AppCredential" }
    PhotoLibrary:
      type: object
      additionalProperties: false
      required: [id, kind, createdAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [private, shared] }
        ownerUserId: { type: string }
        ownerName: { type: string }
        createdAt: { type: string, format: date-time }
        people: { type: boolean, description: Whether the library recognises people and pets. }
        canSetPeople: { type: boolean, description: "Whether the caller may turn people and pets on or off: the owner of a private library, an administrator for the shared library." }
        viewing:
          description: Present when the caller sees this member library only through Administrative Viewing Mode; access is read-only.
          type: object
          additionalProperties: false
          required: [grantId, expiresAt]
          properties:
            grantId: { type: string }
            expiresAt: { type: string, format: date-time }
    PhotoDirectory:
      type: object
      additionalProperties: false
      required: [id, libraryId, name, createdBy, createdAt]
      properties:
        id: { type: string }
        libraryId: { type: string }
        parentId: { type: string }
        name: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    PhotoAsset:
      type: object
      additionalProperties: false
      required: [id, libraryId, name, mediaType, sizeBytes, uploadedBy, importedAt, width, height, thumbnail]
      properties:
        id: { type: string }
        libraryId: { type: string }
        directoryId: { type: string }
        name: { type: string }
        mediaType: { type: string, enum: [image/jpeg, image/png, image/heic, video/mp4, video/quicktime, video/3gpp, video/webm, video/x-matroska, video/x-msvideo, video/mp2t] }
        video:
          description: Set for a video, which plays in the viewer and takes no part in local AI.
          type: object
          additionalProperties: false
          required: [duration]
          properties:
            duration: { type: number, exclusiveMinimum: 0, description: Seconds. }
        motion:
          type: object
          additionalProperties: false
          required: [kind, duration]
          properties:
            kind: { type: string, enum: [live-photo, motion-photo] }
            duration: { type: number, exclusiveMinimum: 0, maximum: 30 }
        liveVideoMissing: { type: boolean, description: "True for the still of an Apple Live Photo imported without its MOV; uploading that MOV to live-videos completes it." }
        sizeBytes: { type: integer, format: int64, minimum: 0 }
        uploadedBy: { type: string }
        importedAt: { type: string, format: date-time }
        takenAt: { type: string, format: date-time, description: "Capture time from the original's EXIF, or a video's recording time." }
        width: { type: integer, minimum: 0, description: Upright display width; 0 when unknown. }
        height: { type: integer, minimum: 0, description: Upright display height; 0 when unknown. }
        thumbnail: { type: string, enum: [ready, pending, failed] }
        duplicate: { type: string, enum: [first, duplicate], description: Role among assets of the same library with identical originals. }
        alsoKeptBy:
          description: Names of other members whose private libraries hold the same original; only the owner of a private library sees it.
          type: array
          items: { type: string }
        trash:
          type: object
          additionalProperties: false
          required: [trashedAt, trashedBy, purgeAfter]
          properties:
            trashedAt: { type: string, format: date-time }
            trashedBy: { type: string }
            purgeAfter: { type: string, format: date-time }
        tags:
          description: User tags; only a single photo's details carry them.
          type: array
          items: { type: string }
        albums:
          description: Albums the photo is in; only a single photo's details carry them.
          type: array
          items: { type: object, additionalProperties: false, required: [id, name], properties: { id: { type: string }, name: { type: string } } }
        people:
          description: The faces and pets in the photo with who each is in the photo's library; only a single photo's details carry them.
          type: array
          items:
            type: object
            additionalProperties: false
            required: [occurrenceId, kind]
            properties:
              occurrenceId: { type: string, description: "Its avatar is at occurrences/{occurrenceId}/avatar." }
              kind: { type: string, enum: [face, cat, dog] }
              personId: { type: string, description: "Absent while the face is nobody yet." }
              name: { type: string }
    PhotoTimeline:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PhotoAsset" } }
        next: { type: string, description: Cursor for the next page; absent on the last page. }
    PhotoTimelineMonths:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [month, photos]
            properties:
              month: { type: string, description: "YYYY-MM in the device's time zone." }
              photos: { type: integer, minimum: 1 }
    PhotoLabelCounts:
      type: object
      additionalProperties: false
      required: [items, ready]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, category, photos, coverId]
            properties:
              id: { type: string }
              name: { type: string }
              category: { type: string, description: "animal, food, object, vehicle, activity, nature, scene, people or document." }
              photos: { type: integer, minimum: 1 }
              coverId: { type: string, description: The photo that matches the label most clearly. }
        ready: { type: boolean, description: "False while AI clusters are not available; there are no items then." }
    PhotoPerson:
      type: object
      additionalProperties: false
      required: [id, libraryId, kind, name, hidden, photos, coverId, canChange]
      properties:
        id: { type: string }
        libraryId: { type: string }
        kind: { type: string, enum: [person, cat, dog] }
        name: { type: string, description: "Empty until a member names the person." }
        hidden: { type: boolean }
        photos: { type: integer, minimum: 0, description: "Untrashed photos of the person." }
        coverId: { type: string, description: "The occurrence whose avatar stands for the person; empty when none is left." }
        canChange: { type: boolean, description: "Whether the caller may name, merge, hide and correct the person." }
    PhotoPeople:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PhotoPerson" } }
    PhotoTagCounts:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, photos, coverId]
            properties:
              name: { type: string }
              photos: { type: integer, minimum: 1 }
              coverId: { type: string, description: The photo most recently given the tag. }
    PhotoAlbum:
      type: object
      additionalProperties: false
      required: [id, libraryId, name, createdBy, createdAt, photos]
      properties:
        id: { type: string }
        libraryId: { type: string }
        name: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        photos: { type: integer, minimum: 0, description: Photos outside the trash. }
        coverId: { type: string, description: The newest of them. }
    PhotoNameRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string }
    PhotoSearchResults:
      type: object
      additionalProperties: false
      required: [items, semantic, closest]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PhotoAsset" } }
        next: { type: string }
        semantic: { type: boolean, description: "False when local AI could not encode the query and only names and user tags were matched." }
        closest:
          type: integer
          minimum: 0
          description: "How many results, counted over all pages, make up the closest group: the name and user tag matches, then the photos the object detector found the query's things in or, without those, the photos within a small similarity of the best match. The results after them are less related; every page carries the same count."
        objects:
          type: object
          additionalProperties: false
          required: [words, detected, undetected]
          description: "Present when the query is about things the object detector finds reliably, such as 手机: the closest group is then the photos it found them in, and detected 0 means none was found."
          properties:
            words: { type: array, items: { type: string }, description: The query's class words. }
            detected: { type: integer, minimum: 0, description: Photos over all pages in which the detector found them. }
            undetected: { type: integer, minimum: 0, description: Photos in the search's scope the detector has not processed yet. }
        people:
          type: array
          items: { type: string }
          description: "Full names of people in the search's scope that the query contains, such as 小明 in 小明 海边: the results keep to their photos and the rest of the query ranks them; a name alone lists them newest first."
    PhotoSimilarResults:
      type: object
      additionalProperties: false
      required: [items, ready]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PhotoAsset" } }
        next: { type: string }
        ready: { type: boolean, description: "False while local AI has not organised the photo yet; there are no results then." }
    PhotoImageSearch:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: { type: string, description: "Lists the results under image-searches/{id}/assets." }
    PhotoAIStatus:
      type: object
      additionalProperties: false
      required: [state, ready, pending, failed]
      properties:
        state: { type: string, enum: [unavailable, paused, working, idle], description: "unavailable: the AI Worker is not installed or not running; paused: waiting for the device to be idle" }
        reason: { type: string, description: "Why work is paused, such as foreground or cpu_pressure." }
        model: { type: string }
        objectModel: { type: string, description: The object detector's model while the AI Worker has one. }
        faceModel: { type: string, description: "The face models while the AI Worker has them; a photo then also counts as ready once its faces are scanned." }
        animalModel: { type: string, description: "The animal model while the AI Worker has it; a photo with a dog then also counts as ready once its dogs are scanned." }
        ready: { type: integer, minimum: 0, description: "Originals with a vector of the current pipeline and, while the AI Worker has a detector, its detection." }
        pending: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        clusters: { type: string, enum: [ready, preparing], description: "Whether AI 聚合 can list its groups; preparing while label texts wait for the Worker, which runs only once the photo library has been idle for a while. Absent when the Worker's model has no calibrated clusters." }
    PhotoDirectoryListing:
      type: object
      additionalProperties: false
      required: [directories, assets]
      properties:
        directories: { type: array, description: Every subdirectory on the first page; empty on later pages., items: { $ref: "#/components/schemas/PhotoDirectory" } }
        assets: { type: array, items: { $ref: "#/components/schemas/PhotoAsset" } }
        next: { type: string, description: Pass as cursor for the next page; absent on the last page. }
    TerminalStatusResponse:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
    MusicStatus:
      type: object
      additionalProperties: false
      required: [version, tracks, scan]
      properties:
        version: { type: integer, format: int64, description: Changes whenever a scan changes any track. }
        tracks: { type: integer, minimum: 0 }
        scan:
          type: object
          additionalProperties: false
          required: [state, done, total]
          properties:
            state: { type: string, enum: [idle, scanning] }
            phase: { type: string, enum: [listing, reading, measuring] }
            done: { type: integer, minimum: 0 }
            total: { type: integer, minimum: 0 }
            startedAt: { type: string, format: date-time }
            finishedAt: { type: string, format: date-time }
            error: { type: string, enum: [volume_unavailable, failed] }
    MusicLibrary:
      type: object
      additionalProperties: false
      required: [version, items]
      properties:
        version: { type: integer, format: int64 }
        items: { type: array, items: { $ref: "#/components/schemas/MusicTrack" } }
    MusicTrack:
      type: object
      additionalProperties: false
      required: [id, spaceId, folder, name, sizeBytes, format, title, albumId, addedAt]
      properties:
        id: { type: string }
        spaceId: { type: string }
        folder: { type: string, description: Folder path relative to the space root; empty at the root. }
        name: { type: string }
        sizeBytes: { type: integer, format: int64, minimum: 0 }
        format: { type: string, enum: [mp3, flac, m4a, aac, ogg, opus, wav, ape, wma, wv, aiff, dsf, dff] }
        codec: { type: string, description: "The audio codec, when the file's container can hold several (aac or alac in m4a), or as FFmpeg names it." }
        title: { type: string }
        artist: { type: string }
        artists: { type: array, items: { type: string } }
        album: { type: string }
        albumArtist: { type: string }
        albumId: { type: string }
        genres: { type: array, items: { type: string } }
        year: { type: integer }
        trackNo: { type: integer }
        discNo: { type: integer }
        durationMs: { type: integer, format: int64, minimum: 0 }
        coverId: { type: string }
        lyrics: { type: boolean }
        transcode: { type: boolean, description: "The media worker decodes this track to FLAC while it plays; its stream starts at the start parameter instead of seeking." }
        addedAt: { type: string, format: date-time }
    MusicSources:
      type: object
      additionalProperties: false
      required: [custom, items]
      properties:
        custom: { type: boolean, description: False while the library covers the whole personal and shared spaces. }
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [spaceId, spaceKind, path]
            properties:
              spaceId: { type: string }
              spaceKind: { type: string, enum: [private, shared] }
              folderId: { type: string }
              path: { type: string }
    MusicFavorite:
      type: object
      additionalProperties: false
      required: [trackId, addedAt]
      properties:
        trackId: { type: string }
        addedAt: { type: string, format: date-time }
    MusicPlay:
      type: object
      additionalProperties: false
      required: [trackId, playedAt, plays]
      properties:
        trackId: { type: string }
        playedAt: { type: string, format: date-time }
        plays: { type: integer, minimum: 1 }
    MusicPlaylist:
      type: object
      additionalProperties: false
      required: [id, name, trackIds, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        trackIds: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
    AssistantStatus:
      type: object
      additionalProperties: false
      required: [available]
      properties:
        available: { type: boolean, description: The member has an assistant instance. }
    AssistantSession:
      type: object
      additionalProperties: false
      required: [id, title, preview, startedAt, messageCount]
      properties:
        id: { type: string }
        title: { type: string, description: Empty until the member or the assistant names the conversation. }
        preview: { type: string }
        startedAt: { type: number, description: Unix seconds. }
        lastActive: { type: number, description: Unix seconds. }
        messageCount: { type: integer, minimum: 0 }
    AssistantMessage:
      type: object
      description: "One transcript row as Hermes Agent stores it; fields beyond role and content vary with the row (tool_calls, tool_call_id, reasoning, finish_reason, timestamp, display_metadata and others)."
      required: [role]
      properties:
        role: { type: string, enum: [user, assistant, tool, system] }
        content: {}
      additionalProperties: true
    AssistantMemory:
      type: object
      additionalProperties: false
      required: [memories, skills]
      properties:
        memories:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, store, text]
            properties:
              id: { type: string }
              store: { type: string, enum: [memory, profile], description: "memory for the assistant's notes, profile for what it noted about the member." }
              text: { type: string, description: "The memory, at most its first 1,200 characters." }
              updatedAt: { type: integer, description: Unix seconds. }
        skills:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, useCount]
            properties:
              id: { type: string, description: "The skill's name." }
              category: { type: string }
              createdBy: { type: string, description: "learn when the member asked for it, agent when the assistant made it itself; absent when it only used it." }
              useCount: { type: integer, minimum: 0 }
              updatedAt: { type: integer, description: Unix seconds. }
    AssistantApprovalEnvelope:
      type: object
      additionalProperties: false
      required: [approval]
      properties:
        approval: { $ref: "#/components/schemas/AssistantApproval" }
    AssistantApproval:
      type: object
      description: "One thing the assistant asked the member in a running turn (ADR 0024 decisions 3 and 4)."
      additionalProperties: false
      required: [requestId, kind, sessionId, status, createdAt]
      properties:
        requestId: { type: string }
        kind:
          type: string
          enum: [change, command, question]
          description: "change: a call of 提交更改 the executor carries out as the member (change). command: a dangerous command or a script the assistant runs in its sandbox, which reaches nothing outside its own folder (command). question: the clarify tool's questions (questions), answered with /answer."
        sessionId: { type: string, description: "The live conversation (Hermes's runtime id) it was asked in." }
        storedSessionId: { type: string, description: "The stored conversation, when known." }
        status: { type: string, enum: [awaiting, deciding, approved, answered, applied, failed, rejected, expired, stopped], description: "Only awaiting can be confirmed, rejected or answered; a rejected question was skipped." }
        createdAt: { type: integer, description: Unix seconds. }
        change: { $ref: "#/components/schemas/AssistantChange" }
        command:
          type: object
          additionalProperties: false
          required: [text]
          properties:
            text: { type: string, description: "The command, or the whole script, as it will run." }
            description: { type: string, description: "Why Hermes asks, as it names the pattern." }
            script: { type: boolean, description: "An execute_code script, approved as a whole." }
            forSession: { type: boolean, description: "It may be allowed for the rest of the conversation." }
        questions:
          type: array
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [id, text]
            properties:
              id: { type: string }
              text: { type: string }
              choices: { type: array, items: { type: string } }
              multiSelect: { type: boolean }
        answers:
          type: object
          description: "The member's answers by question id; null for one left out."
          additionalProperties: { type: [string, "null"] }
    AssistantChange:
      type: object
      description: "The change as the executor prepared it: each operation, with the text before and after each write."
      additionalProperties: true
      required: [id, summary, status, operations]
      properties:
        id: { type: string }
        summary: { type: string }
        status: { type: string, enum: [awaiting, approved, applying, applied, failed, rejected, expired] }
        error: { type: string, description: Why a confirmed change failed. }
        operations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [op, path]
            properties:
              op: { type: string, enum: [write, copy, delete, move, mkdir] }
              path: { type: string, description: "Path as the assistant sees it, under /nas." }
              to: { type: string, description: Destination of a move. }
              from: { type: string, description: "What a copy copies: a file or folder the assistant reads (personal space, Shared, its own folder)." }
              size: { type: integer, description: "Bytes a copy copies; a folder's files together." }
              folder: { type: boolean, description: A copy of a whole folder. }
              exists: { type: boolean, description: The target existed when the card was made. }
              before: { type: string, description: "Text of a written file when the card was made; absent when it is new or not text." }
              after: { type: string, description: "Text the write leaves; absent when it is not text." }
    MediaLibraryInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        kind: { type: string, enum: [movies, shows, mixed, other], description: Required when creating. }
        spaceId: { type: string, description: Required when creating; ignored when updating. }
        folderIds: { type: array, minItems: 1, maxItems: 16, items: { type: string }, description: Folder file IDs of the space; required when creating. }
    MediaLibrary:
      type: object
      additionalProperties: false
      required: [id, name, kind, spaceId, spaceKind, createdBy, createdAt, folders, counts, scan, canManage, covers]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [movies, shows, mixed, other] }
        spaceId: { type: string }
        spaceKind: { type: string, enum: [private, shared] }
        ownerUserId: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        folders:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [entryId, name, path]
            properties:
              entryId: { type: string }
              name: { type: string }
              path: { type: string }
              missing: { type: boolean }
        counts:
          type: object
          additionalProperties: false
          required: [movies, shows, episodes, others, sizeBytes]
          properties:
            movies: { type: integer }
            shows: { type: integer }
            episodes: { type: integer }
            others: { type: integer }
            sizeBytes: { type: integer }
        scan:
          type: object
          additionalProperties: false
          required: [state, pending]
          properties:
            state: { type: string, enum: [idle, scanning, processing] }
            pending: { type: integer, description: Videos whose durations or frames FFmpeg has yet to read. }
            scannedAt: { type: string, format: date-time }
            error: { type: string }
        canManage: { type: boolean }
        covers: { type: array, maxItems: 4, items: { type: string }, description: "Title IDs with artwork, for the library card." }
    MediaArtwork:
      type: object
      additionalProperties: false
      required: [poster, backdrop, thumb]
      properties:
        poster: { type: boolean }
        backdrop: { type: boolean }
        thumb: { type: boolean }
        version: { type: string }
    MediaProgress:
      type: object
      additionalProperties: false
      required: [position, duration, watched]
      properties:
        position: { type: number }
        duration: { type: number }
        watched: { type: boolean }
        playedAt: { type: string, format: date-time }
    MediaTitle:
      type: object
      description: A card for a film, a show, an episode or another video.
      required: [id, type, libraryId, title, addedAt, artwork, favorite]
      properties:
        id: { type: string }
        type: { type: string, enum: [movie, show, episode, other] }
        libraryId: { type: string }
        title: { type: string }
        originalTitle: { type: string }
        year: { type: integer }
        genres: { type: array, items: { type: string } }
        rating: { type: number }
        addedAt: { type: string, format: date-time }
        duration: { type: number }
        resolution: { type: string, enum: [4K, 1080p, 720p, SD] }
        hdr: { type: string }
        artwork: { $ref: "#/components/schemas/MediaArtwork" }
        favorite: { type: boolean }
        progress: { $ref: "#/components/schemas/MediaProgress" }
        seasons: { type: integer }
        episodes: { type: integer }
        watchedEpisodes: { type: integer }
        showId: { type: string }
        showTitle: { type: string }
        season: { type: integer }
        episode: { type: integer }
    MediaTitlePage:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/MediaTitle" } }
        total: { type: integer }
    MediaTitleResults:
      type: object
      additionalProperties: false
      required: [items, total, genres]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/MediaTitle" } }
        total: { type: integer }
        genres: { type: array, items: { type: string } }
    MediaHome:
      type: object
      additionalProperties: false
      required: [featured, continue, recent, movies, shows, others, favorites, libraries, scanning]
      properties:
        featured: { type: array, items: { $ref: "#/components/schemas/MediaTitle" } }
        continue: { type: array, items: { $ref: "#/components/schemas/MediaTitle" } }
        recent: { type: array, items: { $ref: "#/components/schemas/MediaTitle" } }
        movies: { type: array, items: { $ref: "#/components/schemas/MediaTitle" } }
        shows: { type: array, items: { $ref: "#/components/schemas/MediaTitle" } }
        others: { type: array, items: { $ref: "#/components/schemas/MediaTitle" } }
        favorites: { type: array, items: { $ref: "#/components/schemas/MediaTitle" } }
        libraries: { type: integer }
        scanning: { type: boolean }
    MediaCollectionRef:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    MediaEpisode:
      type: object
      additionalProperties: false
      required: [id, season, episode, title, addedAt, artwork]
      properties:
        id: { type: string }
        season: { type: integer }
        episode: { type: integer }
        title: { type: string }
        plot: { type: string }
        duration: { type: number }
        addedAt: { type: string, format: date-time }
        artwork: { $ref: "#/components/schemas/MediaArtwork" }
        progress: { $ref: "#/components/schemas/MediaProgress" }
        file: { type: string, description: The episode's file name. }
    MediaShowDetail:
      allOf:
        - { $ref: "#/components/schemas/MediaTitle" }
        - type: object
          required: [seasonList, collections]
          properties:
            plot: { type: string }
            next: { $ref: "#/components/schemas/MediaEpisode" }
            seasonList:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [number, episodes]
                properties:
                  number: { type: integer }
                  episodes: { type: array, items: { $ref: "#/components/schemas/MediaEpisode" } }
            collections: { type: array, items: { $ref: "#/components/schemas/MediaCollectionRef" } }
            folder: { type: string, description: Name of the folder the show has to itself; absent when it has none. }
            namedByNfo: { type: boolean, description: "tvshow.nfo gives the title, so renaming the show's files leaves it." }
    MediaVideoDetail:
      allOf:
        - { $ref: "#/components/schemas/MediaTitle" }
        - type: object
          required: [file, probeState, audio, subtitles, collections]
          properties:
            plot: { type: string }
            episodeTitle: { type: string }
            file:
              type: object
              additionalProperties: false
              required: [name, folder, sizeBytes, modifiedAt]
              properties:
                name: { type: string }
                folder: { type: string }
                sizeBytes: { type: integer }
                modifiedAt: { type: string, format: date-time }
            media:
              type: object
              additionalProperties: false
              required: [container]
              properties:
                container: { type: string }
                videoCodec: { type: string }
                audioCodec: { type: string }
                width: { type: integer }
                height: { type: integer }
                frameRate: { type: number }
                bitrate: { type: integer }
            namedByNfo: { type: boolean, description: "An NFO document gives the title, so renaming the file leaves it." }
            probeState: { type: string, enum: [pending, ready, failed] }
            audio:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [index, label, codec]
                properties:
                  index: { type: integer }
                  label: { type: string }
                  language: { type: string }
                  codec: { type: string }
                  channels: { type: integer }
                  default: { type: boolean }
            subtitles:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [id, label, external]
                properties:
                  id: { type: string }
                  label: { type: string }
                  language: { type: string }
                  external: { type: boolean }
                  default: { type: boolean }
            previousId: { type: string }
            nextId: { type: string }
            collections: { type: array, items: { $ref: "#/components/schemas/MediaCollectionRef" } }
            collection: { type: string, description: The automatic collection an NFO file names. }
    MediaPlayback:
      type: object
      additionalProperties: false
      required: [mode, url, audio, quality, qualities]
      properties:
        mode: { type: string, enum: [direct, remux, transcode] }
        url: { type: string }
        duration: { type: number }
        reason: { type: string }
        audio: { type: integer }
        quality: { type: string, enum: [original, 1080p, 720p, 480p] }
        qualities: { type: array, items: { type: string, enum: [original, 1080p, 720p, 480p] } }
        mime: { type: string, description: "A converted stream's MIME type with codecs, for Media Source Extensions; absent for direct play." }
    Transfer:
      type: object
      additionalProperties: false
      required: [id, direction, kind, name, location, totalBytes, transferredBytes, bytesPerSecond, state, createdAt, updatedAt]
      properties:
        id: { type: string }
        direction: { type: string, enum: [upload, download] }
        kind: { type: string, enum: [file, archive], description: "archive downloads files and folders as one ZIP." }
        name: { type: string, description: "The upload's requested name, or the download's file name." }
        location: { $ref: "#/components/schemas/TransferLocation" }
        totalBytes: { type: integer, minimum: 0, description: "For an archive, the size of the files in it." }
        transferredBytes: { type: integer, minimum: 0 }
        bytesPerSecond: { type: integer, minimum: 0, description: Current speed of a running transfer. }
        state: { type: string, enum: [pending, running, paused, interrupted, completed, failed, canceled], description: "pending: a download no browser fetched yet. interrupted: the connection dropped; both directions resume where they stopped." }
        error: { $ref: "#/components/schemas/TransferFailure" }
        batch: { type: string, description: Groups the uploads one action started. }
        relativePath: { type: string, description: Folders a folder upload created below its target. }
        lastModified: { type: integer, description: "The uploaded file's modification time in milliseconds, as its browser saw it." }
        entryId: { type: string, description: The saved file of a completed upload. }
        savedName: { type: string, description: The name an upload was saved under when the requested one was taken. }
        replaced: { type: boolean, description: The upload sent the file it replaced to the trash. }
        skipped: { type: integer, minimum: 0, description: "Files an archive could not read; they are listed in a text file inside it." }
        contentUrl: { type: string, description: Where a download's browser fetches it. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    TransferLocation:
      type: object
      additionalProperties: false
      required: [spaceId, spaceKind, folders]
      properties:
        spaceId: { type: string }
        spaceKind: { type: string, enum: [private, shared] }
        folders:
          type: array
          description: Folders from the space root down to the transfer's folder.
          items: { type: object, additionalProperties: false, required: [id, name], properties: { id: { type: string }, name: { type: string } } }
    TransferFailure:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string, description: "For example forbidden, not_found, folder_blocked, volume_unavailable, insufficient_storage, service_restarted, expired, not_started or internal_error." }
        message: { type: string }
    FeedbackItem:
      type: object
      additionalProperties: false
      required: [id, text, images, version, createdBy, createdAt, resolved, comments]
      properties:
        id: { type: string }
        text: { type: string, maxLength: 5000 }
        images: { type: array, maxItems: 6, items: { $ref: "#/components/schemas/FeedbackImage" } }
        version: { type: integer, minimum: 1, description: "Counts edits to the text and images; resolving does not change it." }
        createdBy: { type: string, description: Username of the account that filed the item. }
        createdAt: { type: string, format: date-time }
        updatedBy: { type: string, description: Username of the latest editor of the text or images. }
        updatedAt: { type: string, format: date-time }
        resolved: { type: boolean }
        resolvedBy: { type: string }
        resolvedAt: { type: string, format: date-time }
        comments: { type: array, description: "Replies under the item, oldest first.", items: { $ref: "#/components/schemas/FeedbackComment" } }
    FeedbackComment:
      type: object
      additionalProperties: false
      required: [id, text, images, version, createdBy, createdAt]
      properties:
        id: { type: string }
        text: { type: string, maxLength: 2000 }
        images: { type: array, maxItems: 3, items: { $ref: "#/components/schemas/FeedbackImage" } }
        version: { type: integer, minimum: 1, description: Counts edits to the comment. }
        createdBy: { type: string, description: Username of the account that wrote the comment. }
        createdAt: { type: string, format: date-time }
        updatedBy: { type: string, description: Username of the latest editor. }
        updatedAt: { type: string, format: date-time }
    FeedbackImage:
      type: object
      additionalProperties: false
      required: [id, contentType, sizeBytes]
      properties:
        id: { type: string }
        contentType: { type: string, enum: [image/png, image/jpeg, image/gif, image/webp] }
        sizeBytes: { type: integer, minimum: 1, maximum: 10485760 }
    MediaCollection:
      type: object
      additionalProperties: false
      required: [id, name, automatic, count, updatedAt, covers]
      properties:
        id: { type: string }
        name: { type: string }
        automatic: { type: boolean }
        count: { type: integer }
        updatedAt: { type: string, format: date-time }
        covers: { type: array, items: { type: string } }
    MediaCollectionDetail:
      type: object
      additionalProperties: false
      required: [id, name, automatic, count, updatedAt, covers, items]
      properties:
        id: { type: string }
        name: { type: string }
        automatic: { type: boolean }
        count: { type: integer }
        updatedAt: { type: string, format: date-time }
        covers: { type: array, items: { type: string } }
        items: { type: array, items: { $ref: "#/components/schemas/MediaTitle" } }
    MediaFolderRoot:
      type: object
      additionalProperties: false
      required: [libraryId, libraryName, entryId, name, path, videos]
      properties:
        libraryId: { type: string }
        libraryName: { type: string }
        entryId: { type: string }
        name: { type: string }
        path: { type: string }
        videos: { type: integer }
        cover: { type: string }
        missing: { type: boolean }
    MediaFolderListing:
      type: object
      additionalProperties: false
      required: [root, path, folders, videos]
      properties:
        root: { $ref: "#/components/schemas/MediaFolderRoot" }
        path: { type: string }
        folders:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, path, videos]
            properties:
              name: { type: string }
              path: { type: string }
              videos: { type: integer }
              cover: { type: string }
        videos: { type: array, items: { $ref: "#/components/schemas/MediaTitle" } }

    MemberShareEntry:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        path:
          type: string
        isDir:
          type: boolean
        size:
          type: integer
          minimum: 0
      required:
      - id
      - path
      - isDir
      - size
    MemberShareRecipient:
      type: object
      additionalProperties: false
      properties:
        userId:
          type: string
        viewedAt:
          type: string
          format: date-time
        readThrough:
          type: integer
          minimum: 0
        senderReadThrough:
          type: integer
          minimum: 0
        saved:
          type: boolean
        saveUncertain:
          type: boolean
          description: Some complete files may exist but publication confirmation was lost.
        savedFiles:
          type: integer
          minimum: 0
        lastMessage:
          type: integer
          minimum: 0
      required:
      - userId
      - readThrough
      - senderReadThrough
      - saved
      - savedFiles
      - lastMessage
    MemberShare:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        sender:
          type: object
          additionalProperties: false
          properties:
            id:
              type: string
            username:
              type: string
          required:
          - id
          - username
        status:
          type: string
          enum:
          - preparing
          - published
          - failed
          - revoked
          - expired
        createdAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        entries:
          type: array
          items:
            $ref: '#/components/schemas/MemberShareEntry'
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/MemberShareRecipient'
        error:
          type: string
        preparedBytes:
          type: integer
          minimum: 0
      required:
      - id
      - sender
      - status
      - createdAt
      - entries
      - recipients
      - preparedBytes
    MemberShareMessage:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          minimum: 0
        sender:
          type: object
          additionalProperties: false
          properties:
            id:
              type: string
            username:
              type: string
          required:
          - id
          - username
        text:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - sender
      - text
      - createdAt
    MemberShareJob:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        shareId:
          type: string
        userId:
          type: string
        status:
          type: string
          enum:
          - running
          - completed
          - failed
          - cancelled
          - interrupted
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        bytesDone:
          type: integer
          minimum: 0
        bytesTotal:
          type: integer
          minimum: 0
        completedIds:
          type: array
          items:
            type: string
        entryIds:
          type: array
          items:
            type: string
        error:
          type: string
      required:
      - id
      - shareId
      - userId
      - status
      - createdAt
      - bytesDone
      - bytesTotal
      - completedIds
      - entryIds
    MemberShareNotification:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          minimum: 0
        shareId:
          type: string
        recipientId:
          type: string
        kind:
          type: string
        messageId:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - shareId
      - recipientId
      - kind
      - createdAt
    CreateMemberShare:
      type: object
      additionalProperties: false
      properties:
        requestId:
          type: string
          minLength: 1
        sourceIds:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
        recipientIds:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
        message:
          type: string
      required:
      - requestId
      - sourceIds
      - recipientIds
    SaveMemberShare:
      type: object
      additionalProperties: false
      properties:
        requestId:
          type: string
          minLength: 1
        entryIds:
          type: array
          items:
            type: string
        target:
          type: object
          additionalProperties: false
          properties:
            rootId:
              type: string
            parentId:
              type: string
          required:
          - rootId
      required:
      - requestId
      - entryIds
      - target
