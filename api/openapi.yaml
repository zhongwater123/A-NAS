# The root of the product API contract. Every path and component lives in a
# file per domain under paths/ and components/, and is named here once.
# `make api` bundles them into openapi.bundle.yaml; how to change the
# contract: docs/development/api-contract.md#接口契约.
openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: A-NAS Product API
  version: 1.0.1-rc.1
  description: >-
    Local-only authenticated product API for A-NAS storage, files, accounts, recycle bin, manual and scheduled snapshots,
    the managed photo library, the media center, the in-place music library, the shared feedback list, resumable uploads and followed downloads (the transfer center), an opt-in administrator terminal, container lifecycle actions that go through the separate
    container agent, and each member's AI assistant (proposed in ADR 0024). Every operation that takes a JSON body
    bounds it and answers 413 request_too_large above the bound: 1 MiB for most, 256 KiB for shares, 65 KiB for
    assistant requests, and 1 KiB for small fixed requests such as container actions, app installs and marking
    feedback resolved.
servers:
  - url: http://127.0.0.1:8080
security:
  - cookieAuth: []
