parameters:
  ScoringBatchID: { name: batchId, in: path, required: true, schema: { type: string, minLength: 1 } }
  ScoringAnchorID: { name: anchorId, in: path, required: true, schema: { type: integer, minimum: 1 } }
  ScoringClaimToken: { name: token, in: path, required: true, schema: { type: string, minLength: 1 } }
  ScoringAccountID: { name: accountId, in: path, required: true, schema: { type: string, minLength: 1 } }
schemas:
  ScoringDimensionID:
    type: string
    enum: [overall, composition, light_color, sharpness, narrative, preference]
    description: "What a photo is scored on (打分项): overall (总分) in every batch, then the others a batch chose, always in this order."
  ScoringDimension:
    type: object
    additionalProperties: false
    required: [id, name]
    properties:
      id: { $ref: "#/schemas/ScoringDimensionID" }
      name: { type: string, description: "The name raters see, such as 构图." }
  ScoringDimensions:
    type: array
    minItems: 1
    maxItems: 6
    items: { $ref: "#/schemas/ScoringDimension" }
    description: "A batch's 打分项 in the order raters score them; the first is always overall."
  ScoringScores:
    type: object
    additionalProperties: false
    description: "Scores on a batch's 打分项 other than overall, 0 to 5 with at most two decimals; overall stays in score."
    properties:
      composition: { type: number, minimum: 0, maximum: 5 }
      light_color: { type: number, minimum: 0, maximum: 5 }
      sharpness: { type: number, minimum: 0, maximum: 5 }
      narrative: { type: number, minimum: 0, maximum: 5 }
      preference: { type: number, minimum: 0, maximum: 5 }
  ScoringMe:
    type: object
    additionalProperties: false
    required: [admin, rater, dimensions]
    properties:
      admin: { type: boolean, description: "The caller is an A-NAS administrator and so administers photo scoring." }
      rater: { type: boolean, description: An administrator chose the caller as a rater. }
      dimensions: { $ref: "#/schemas/ScoringDimensions", description: "Every 打分项 a batch can choose, in order." }
  ScoringRaterBatch:
    type: object
    additionalProperties: false
    required: [id, name, rubric, dimensions, rated, finished]
    properties:
      id: { type: string }
      name: { type: string }
      rubric: { type: string, description: "The administrator's scoring guide." }
      dimensions: { $ref: "#/schemas/ScoringDimensions" }
      rated: { type: integer, minimum: 0, description: "The caller's own answers in the batch, skips and marks included." }
      finished: { type: boolean, description: No photo of the batch is left for the caller. }
  ScoringAnchor:
    type: object
    additionalProperties: false
    required: [id, score, width, height]
    properties:
      id: { type: integer }
      score: { type: number, minimum: 0, maximum: 5, description: "The reference score, 0 to 5 with at most two decimals." }
      width: { type: integer, minimum: 1 }
      height: { type: integer, minimum: 1 }
  ScoringRecentScore:
    type: object
    additionalProperties: false
    required: [token, score, scores, width, height]
    properties:
      token: { type: string, description: "The claim the score answered; its thumbnail and preview are the rater's own." }
      score: { type: number, minimum: 0, maximum: 5, description: The overall score. }
      scores: { $ref: "#/schemas/ScoringScores" }
      width: { type: integer, minimum: 1, description: "The preview's width, for the thumbnail's proportions." }
      height: { type: integer, minimum: 1 }
  ScoringClaim:
    type: object
    additionalProperties: false
    required: [token, expiresAt, width, height]
    properties:
      token: { type: string, description: "All the rater learns about the photo; it is neither the content hash nor the file name." }
      expiresAt: { type: string, format: date-time }
      width: { type: integer, minimum: 1, description: "The preview's width; its longer side is at most 2048." }
      height: { type: integer, minimum: 1 }
  ScoringClaims:
    type: object
    additionalProperties: false
    required: [items, finished]
    properties:
      items: { type: array, maxItems: 3, items: { $ref: "#/schemas/ScoringClaim" } }
      finished: { type: boolean, description: "Nothing is held and nothing is left for the caller, or the batch is closed." }
  ScoringSize:
    type: object
    additionalProperties: false
    required: [width, height]
    properties:
      width: { type: integer, minimum: 0, maximum: 100000 }
      height: { type: integer, minimum: 0, maximum: 100000 }
  ScoringRatingInput:
    type: object
    additionalProperties: false
    required: [submission, kind, viewMs]
    properties:
      submission: { type: string, pattern: "^[A-Za-z0-9-]{8,64}$", description: "Chosen by the page for each answer; retrying the same answer sends the same value." }
      kind: { type: string, enum: [score, skip, flag], description: "skip: cannot judge; flag: something is wrong with the photo." }
      score: { type: number, minimum: 0, maximum: 5, description: "Only with kind score: overall, 0 to 5 with at most two decimals; more decimals are refused (validation_failed)." }
      scores: { $ref: "#/schemas/ScoringScores", description: "Only with kind score: exactly the batch's 打分项 other than overall (validation_failed otherwise)." }
      viewMs: { type: integer, minimum: 0, description: "How long the photo was looked at before the answer: from it appearing, without the time the page was hidden or the scoring guide open." }
      viewport: { $ref: "#/schemas/ScoringSize" }
      display: { $ref: "#/schemas/ScoringSize" }
      pixelRatio: { type: number, minimum: 0, maximum: 16 }
  ScoringBatch:
    type: object
    additionalProperties: false
    required: [id, name, source, required, rubric, dimensions, state, createdAt, import, photos, anchors, complete, started, flagged, answers]
    properties:
      id: { type: string }
      name: { type: string }
      source: { type: string, description: "The folder in 照片打分 the batch was imported from." }
      required: { type: integer, minimum: 1, maximum: 10, description: How many raters each photo needs. }
      rubric: { type: string }
      dimensions: { $ref: "#/schemas/ScoringDimensions" }
      state: { type: string, enum: [importing, open, closed] }
      createdAt: { type: string, format: date-time }
      import:
        type: object
        additionalProperties: false
        required: [files, imported, skipped, skippedBy]
        properties:
          files: { type: integer, minimum: 0, description: "Files found in the folder; 0 until it was scanned." }
          imported: { type: integer, minimum: 0 }
          skipped: { type: integer, minimum: 0 }
          skippedBy:
            type: array
            description: "The skipped files by reason, most first: too_small (a photo to score whose longer side is under 2400 pixels), unsupported_type, undecodable, too_large, unreadable, missing, not_a_file, anchor_name (an anchor without a score in its name)."
            items:
              type: object
              additionalProperties: false
              required: [reason, count]
              properties:
                reason: { type: string, enum: [too_small, unsupported_type, undecodable, too_large, unreadable, missing, not_a_file, anchor_name] }
                count: { type: integer, minimum: 1 }
      photos: { type: integer, minimum: 0, description: "Distinct photos to score, anchors excluded." }
      anchors: { type: integer, minimum: 0 }
      complete: { type: integer, minimum: 0, description: Photos with the required number of scores. }
      started: { type: integer, minimum: 0, description: "Photos with some scores but not all." }
      flagged: { type: integer, minimum: 0, description: Photos a rater marked as having a problem. }
      answers: { type: integer, minimum: 0, description: "Answers of every kind; once there is one, the batch's 打分项 can no longer change." }
  ScoringDimensionChoice:
    type: array
    minItems: 1
    maxItems: 6
    uniqueItems: true
    items: { $ref: "#/schemas/ScoringDimensionID" }
    description: "The 打分项 to score; it must include overall, and the batch keeps the catalogue's order."
  ScoringBatchInput:
    type: object
    additionalProperties: false
    required: [name, source, required, rubric]
    properties:
      name: { type: string, minLength: 1, maxLength: 40 }
      source: { type: string, minLength: 1 }
      required: { type: integer, minimum: 1, maximum: 10 }
      rubric: { type: string, maxLength: 2000 }
      dimensions: { $ref: "#/schemas/ScoringDimensionChoice", description: "Only overall when left out." }
  ScoringBatchPatch:
    type: object
    additionalProperties: false
    properties:
      name: { type: string, minLength: 1, maxLength: 40 }
      rubric: { type: string, maxLength: 2000 }
      required: { type: integer, minimum: 1, maximum: 10 }
      dimensions: { $ref: "#/schemas/ScoringDimensionChoice", description: "Refused with batch_in_use once the batch has an answer." }
      state: { type: string, enum: [open, closed] }
  ScoringPerson:
    type: object
    additionalProperties: false
    required: [id]
    properties:
      id: { type: string }
      username: { type: string, description: Missing once the account is no longer active. }
      nickname: { type: string }
      avatarVersion: { type: string }
  ScoringRaterEntry:
    type: object
    additionalProperties: false
    required: [id, username, rater]
    properties:
      id: { type: string }
      username: { type: string }
      nickname: { type: string }
      avatarVersion: { type: string }
      rater: { type: boolean }
  ScoringDimensionStats:
    type: object
    additionalProperties: false
    required: [dimension, mean, standardDeviation, agreement, agreementPhotos, repeatDifference, longestRun]
    properties:
      dimension: { $ref: "#/schemas/ScoringDimensionID" }
      mean: { type: number, minimum: 0, maximum: 5 }
      standardDeviation: { type: number, minimum: 0 }
      agreement: { type: [number, "null"], minimum: -1, maximum: 1, description: "Correlation with the other raters' mean on the same photos; null below 20 such photos." }
      agreementPhotos: { type: integer, minimum: 0 }
      repeatDifference: { type: [number, "null"], minimum: 0, description: "Mean absolute difference between a repeat and the current score of that photo; null without repeats." }
      longestRun: { type: integer, minimum: 0, description: Longest run of the same score in a row. }
  ScoringRaterStats:
    type: object
    additionalProperties: false
    required: [rater, active, scores, skips, flags, repeats, medianViewMs, fastShare, lastAt, dimensions]
    properties:
      rater: { $ref: "#/schemas/ScoringPerson" }
      active: { type: boolean, description: The account is still active. }
      scores: { type: integer, minimum: 0 }
      skips: { type: integer, minimum: 0 }
      flags: { type: integer, minimum: 0 }
      repeats: { type: integer, minimum: 0, description: Answers to photos shown again to check consistency. }
      medianViewMs: { type: integer, minimum: 0, description: "Over the scored photos, each with every 打分项." }
      fastShare: { type: number, minimum: 0, maximum: 1, description: Share of scored photos answered within a second. }
      lastAt: { type: string, format: date-time }
      dimensions: { type: array, items: { $ref: "#/schemas/ScoringDimensionStats" }, description: "One per 打分项 of the batch, in its order." }
  ScoringExportField:
    type: string
    enum: [nickname, rater_id, image_size, overall, composition, light_color, sharpness, narrative, preference, duration, submitted_at, kind, links, viewport, display, pixel_ratio]
    description: "A choice of columns beside image_id, image_path and rater, which every export has: image_size is image_width and image_height; each 打分项 is its own column in points; duration is duration_s, the seconds spent on the photo (a current answer adds the time of the answer it replaced); kind is kind, repeat and superseded; links is rating_id, replaces and repeat_of; viewport and display are a width and a height each."
  ScoringExportSummary:
    type: object
    additionalProperties: false
    required: [scores, skips, superseded, repeats]
    properties:
      scores: { type: integer, minimum: 0, description: "Current scores of photos handed out the first time: the rows of every export." }
      skips: { type: integer, minimum: 0, description: "Current skips and marks; rows with include skips." }
      superseded: { type: integer, minimum: 0, description: "Answers a later one replaced; rows with include superseded." }
      repeats: { type: integer, minimum: 0, description: "Current answers to photos shown again; rows with include repeats." }
