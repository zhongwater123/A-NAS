schemas:
  MontageProject:
    type: object
    additionalProperties: false
    required: [id, name]
    properties:
      id: { type: string, minLength: 1 }
      name: { type: string }
  MontageProjectList:
    type: object
    additionalProperties: false
    required: [items]
    properties:
      items: { type: array, items: { $ref: "#/schemas/MontageProject" } }
