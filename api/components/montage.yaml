parameters:
  MontageProjectID: { name: projectId, in: path, required: true, schema: { type: string, minLength: 1 } }
  MontageJobID: { name: jobId, in: path, required: true, schema: { type: string, minLength: 1 } }
  MontageCursor: { name: cursor, in: query, required: false, description: The `next` of the previous page., schema: { type: string } }
schemas:
  MontageRequestKey: { type: string, minLength: 1, maxLength: 128, description: "Unique per member: the same key again repeats nothing." }
  MontageAssetIDs: { type: array, minItems: 1, maxItems: 500, items: { type: string, minLength: 1, maxLength: 128 } }
  MontageProjectSummary:
    type: object
    additionalProperties: false
    required: [id, name, assetCount, createdAt]
    properties:
      id: { type: string, minLength: 1 }
      name: { type: string }
      assetCount: { type: integer, minimum: 0 }
      createdAt: { type: string, format: date-time }
  MontageProjectPage:
    type: object
    additionalProperties: false
    required: [items]
    properties:
      items: { type: array, items: { $ref: "#/schemas/MontageProjectSummary" } }
      next: { type: string }
  MontageProjectAsset:
    type: object
    additionalProperties: false
    required: [assetId, status, addedAt]
    properties:
      assetId: { type: string }
      status: { type: string, enum: [available, trashed, missing, unknown], description: "unknown: the photo library did not answer this time." }
      duration: { type: number, minimum: 0 }
      takenAt: { type: string, format: date-time }
      addedAt: { type: string, format: date-time }
  MontageProject:
    type: object
    additionalProperties: false
    required: [id, name, assetCount, createdAt, ask, chronological, assets, versions]
    properties:
      id: { type: string, minLength: 1 }
      name: { type: string }
      assetCount: { type: integer, minimum: 0 }
      createdAt: { type: string, format: date-time }
      ask: { type: string }
      chronological: { type: boolean }
      assets: { type: array, items: { $ref: "#/schemas/MontageProjectAsset" } }
      versions: { type: array, description: "The films saved, newest first.", items: { $ref: "#/schemas/MontageVersion" } }
  MontageVersion:
    type: object
    additionalProperties: false
    required: [number, filmAssetId, createdAt]
    properties:
      number: { type: integer, minimum: 1, description: "Counts from 1 within the project; the film is named \"<project> v<number>.mp4\"." }
      filmAssetId: { type: string, description: "The film in the caller's photo library; play and download it there." }
      createdAt: { type: string, format: date-time }
      gone: { type: boolean, description: "The member deleted the film from the photo library." }
  MontageJobStep:
    type: object
    additionalProperties: false
    required: [name, state]
    properties:
      name: { type: string, enum: [analysis, catalog, song, pick, shots, fill, render, save] }
      state: { type: string, enum: [pending, running, done, queued, waiting, needs_input, failed, cancelled], description: "A step that stopped with the job shows the job's state." }
      startedAt: { type: string, format: date-time }
      finishedAt: { type: string, format: date-time }
  MontageJob:
    type: object
    additionalProperties: false
    required: [id, projectId, state, steps, createdAt]
    properties:
      id: { type: string, minLength: 1 }
      projectId: { type: string, minLength: 1 }
      state: { type: string, enum: [queued, running, waiting, needs_input, done, failed, cancelled] }
      step: { type: string, description: The step the job is at or stopped at. }
      waitReason:
        type: string
        enum: [analysis, asset_trashed, vnas, asset_missing, analysis_failed, no_usable_footage, music_invalid, vnas_unknown, plan_invalid, storage_full]
        description: "Why a waiting job waits, or what a job that needs input needs (docs/specs/montage-center.md)."
      error: { type: string }
      steps: { type: array, items: { $ref: "#/schemas/MontageJobStep" } }
      missingAssetIds: { type: array, description: "The videos missing, or whose analysis failed.", items: { type: string } }
      version: { $ref: "#/schemas/MontageVersion" }
      createdAt: { type: string, format: date-time }
      finishedAt: { type: string, format: date-time }
  MontageNotice:
    type: object
    additionalProperties: false
    required: [kind, jobId, projectId, project, at]
    properties:
      kind: { type: string, enum: [waiting_for_planning, planning, needs_input, saved] }
      jobId: { type: string }
      projectId: { type: string }
      project: { type: string, description: The project's name. }
      reason: { type: string }
      filmAssetId: { type: string, description: "The film saved, for saved." }
      at: { type: string, format: date-time }
  MontageNotices:
    type: object
    additionalProperties: false
    required: [items]
    properties:
      items: { type: array, items: { $ref: "#/schemas/MontageNotice" } }
