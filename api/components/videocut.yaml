# 剪辑中心 as Venus (docs/specs/venus.md, ADR 0041): a project has one film on
# one timeline. Its states, what the server keeps in each and the edit rules
# are the spec's; the descriptions here say only what a field carries.
parameters:
  VideoCutProjectID: { name: projectId, in: path, required: true, schema: { type: string, minLength: 1 } }
  VideoCutFileID: { name: fileId, in: path, required: true, schema: { type: string, minLength: 1 } }
  VideoCutAssetID: { name: assetId, in: path, required: true, schema: { type: string, minLength: 1 } }
  VideoCutSlot: { name: slot, in: path, required: true, description: "The music slot, from 1 to the film's last.", schema: { type: integer, minimum: 1, maximum: 10000 } }
  VideoCutSongID: { name: songId, in: path, required: true, schema: { type: string, minLength: 1 } }
schemas:
  VideoCutRequestKey: { type: string, minLength: 1, maxLength: 128, pattern: "^[!-~]+$", description: "Unique per member: the same key again repeats the same request and nothing more; with another request it is a conflict." }
  VideoCutProjectState:
    type: string
    enum: [importing, pending, uploading, upload_interrupted, queued, generating, ready, exporting, exported, failed]
    description: >-
      导入中, 待生成, 上传中, 上传中断, 排队中, 生成中, 已完成, 导出中, 已导出, 失败 (docs/specs/venus.md#作品状态机).
      importing until every file of the list was read in the browser; pending once all were, until generating is asked for.
  VideoCutFailureReason:
    type: string
    enum: [network, corrupt_file, busy, too_few_assets]
    description: "网络中断, 文件损坏, 服务繁忙, 素材不足: the only four the page names."
  VideoCutFailure:
    type: object
    additionalProperties: false
    required: [step, reason, retries]
    properties:
      step: { type: string, enum: [upload, analysis, generate], description: "The step that failed, which a retry goes back to." }
      reason: { $ref: "#/schemas/VideoCutFailureReason" }
      retries: { type: integer, minimum: 0, maximum: 3, description: "Retries made; at 3 the page says to contact us and offers none." }
  VideoCutExportFailure:
    type: object
    additionalProperties: false
    required: [reason, retries, at]
    properties:
      reason: { $ref: "#/schemas/VideoCutFailureReason" }
      retries: { type: integer, minimum: 0, maximum: 3 }
      at: { type: string, format: date-time, description: "When it failed: the page tells it once, for the failure it has not told yet." }
  VideoCutProgress:
    type: object
    additionalProperties: false
    required: [files, uploaded, analysed, skipped, percent, slow]
    description: "The three bars of 生成中 (M5-1)."
    properties:
      files: { type: integer, minimum: 0, maximum: 200, description: "Files chosen to make the film from." }
      uploaded: { type: integer, minimum: 0, maximum: 200 }
      analysed: { type: integer, minimum: 0, maximum: 200, description: "Analysed or skipped; analysis starts as each file is uploaded." }
      skipped: { type: integer, minimum: 0, maximum: 200, description: "Files analysis could not read and left out: 'N 段无法分析，已跳过' once the film is made." }
      percent: { type: integer, minimum: 0, maximum: 100, description: "How far the film's making is, once uploading and analysis are done." }
      remainingSeconds: { type: integer, minimum: 0, description: "The estimate, renewed every 30 seconds and never growing; absent while there is none." }
      slow: { type: boolean, description: "Past the estimate by half: 比预计慢，仍在处理." }
  VideoCutLocalFile:
    type: object
    additionalProperties: false
    required: [name, size, modifiedAt, read]
    description: >-
      A file as the browser has it. name, size and modifiedAt together tell it: the same three are the same file,
      once in the list, and a file chosen again after a reload is matched to its entry by them. The rest is what the
      browser read from it; the file itself stays in the browser until uploaded.
    properties:
      name: { type: string, minLength: 1, maxLength: 255 }
      size: { type: integer, minimum: 1, maximum: 4294967296, description: "Bytes; 4 GB at most." }
      modifiedAt: { type: string, format: date-time }
      read: { type: boolean, description: "Whether the browser has read it; the rest is there once it has." }
      duration: { type: number, minimum: 0, description: Seconds. }
      width: { type: integer, minimum: 1, description: "As shown, after rotation." }
      height: { type: integer, minimum: 1 }
      takenAt: { type: string, format: date-time, description: "When it was shot; the modification time where the file does not say." }
  VideoCutProjectFile:
    type: object
    additionalProperties: false
    required: [id, name, size, modifiedAt, read, selected, starred, upload, analysis]
    properties:
      id: { type: string, minLength: 1 }
      name: { type: string }
      size: { type: integer, minimum: 1 }
      modifiedAt: { type: string, format: date-time }
      read: { type: boolean }
      duration: { type: number, minimum: 0 }
      width: { type: integer, minimum: 1 }
      height: { type: integer, minimum: 1 }
      takenAt: { type: string, format: date-time }
      selected: { type: boolean, description: "勾选: chosen to be uploaded and made a film of. New files are." }
      starred: { type: boolean, description: "星标: the film puts it in. Five at most." }
      upload: { type: string, enum: [none, done], description: "done once its video is in the photo library and the project has it." }
      assetId: { type: string, description: "The photo library's video, once uploaded." }
      analysis: { type: string, enum: [none, running, done, skipped] }
  VideoCutSongSource: { type: string, enum: [builtin, library, imported], description: "One of the three songs VideoCut has, a track of the member's music library, or a song imported to this project." }
  VideoCutSongRef:
    type: object
    additionalProperties: false
    required: [source, id]
    properties:
      source: { $ref: "#/schemas/VideoCutSongSource" }
      id: { type: string, minLength: 1, description: "A builtin song's id from the catalog, the track's id, or the imported song's id." }
  VideoCutProjectSong:
    type: object
    additionalProperties: false
    required: [source, id, title, status]
    properties:
      source: { $ref: "#/schemas/VideoCutSongSource" }
      id: { type: string, minLength: 1 }
      title: { type: string }
      duration: { type: number, minimum: 0, description: "Seconds of the whole song." }
      status: { type: string, enum: [analysing, ready, unusable], description: "unusable: no beats in it. The page says to choose another and chooses the one before again." }
  VideoCutSettings:
    type: object
    additionalProperties: false
    required: [aspect, style]
    properties:
      song: { $ref: "#/schemas/VideoCutProjectSong" }
      aspect: { type: string, description: "An aspect's id from the catalog." }
      style: { type: string, description: "A style's id from the catalog." }
      filmDuration: { type: number, minimum: 0, description: "长度 (M4-3), read only: the song's verse and chorus, once its analysis is done." }
  VideoCutFilm:
    type: object
    additionalProperties: false
    required: [duration]
    properties:
      duration: { type: number, minimum: 0, description: Seconds. }
      exportedAt: { type: string, format: date-time, description: "When the file to download was made; absent before the first export." }
      size: { type: integer, minimum: 0, description: "Bytes of that file." }
  VideoCutProjectSummary:
    type: object
    additionalProperties: false
    required: [id, name, sample, state, createdAt, updatedAt, fileCount, progress]
    properties:
      id: { type: string, minLength: 1 }
      name: { type: string }
      sample: { type: boolean, description: "示例作品: one for every member, read only, and last in the list." }
      state: { $ref: "#/schemas/VideoCutProjectState" }
      createdAt: { type: string, format: date-time }
      updatedAt: { type: string, format: date-time }
      fileCount: { type: integer, minimum: 0, maximum: 200 }
      progress: { $ref: "#/schemas/VideoCutProgress" }
      failure: { $ref: "#/schemas/VideoCutFailure" }
      film: { $ref: "#/schemas/VideoCutFilm" }
      coverAssetId: { type: string, description: "The video whose frame is the card's cover, once one is uploaded; before that the page shows the first frame it read." }
  VideoCutProjectList:
    type: object
    additionalProperties: false
    required: [items]
    properties:
      items: { type: array, description: "The caller's projects, newest first, then the sample.", maxItems: 1000, items: { $ref: "#/schemas/VideoCutProjectSummary" } }
  VideoCutProject:
    type: object
    additionalProperties: false
    required: [id, name, sample, state, createdAt, updatedAt, fileCount, progress, settings, files]
    properties:
      id: { type: string, minLength: 1 }
      name: { type: string }
      sample: { type: boolean }
      state: { $ref: "#/schemas/VideoCutProjectState" }
      createdAt: { type: string, format: date-time }
      updatedAt: { type: string, format: date-time }
      fileCount: { type: integer, minimum: 0, maximum: 200 }
      progress: { $ref: "#/schemas/VideoCutProgress" }
      failure: { $ref: "#/schemas/VideoCutFailure" }
      exportFailure: { $ref: "#/schemas/VideoCutExportFailure", description: "The last export's failure; the state is ready again." }
      film: { $ref: "#/schemas/VideoCutFilm" }
      coverAssetId: { type: string }
      settings: { $ref: "#/schemas/VideoCutSettings", description: "From uploading on, the snapshot taken when generating was asked for." }
      files: { type: array, maxItems: 200, items: { $ref: "#/schemas/VideoCutProjectFile" } }
  VideoCutCatalogItem:
    type: object
    additionalProperties: false
    required: [id, label]
    properties:
      id: { type: string, minLength: 1 }
      label: { type: string }
  VideoCutCatalogSong:
    type: object
    additionalProperties: false
    required: [id, title, duration]
    properties:
      id: { type: string, minLength: 1 }
      title: { type: string }
      duration: { type: number, minimum: 0 }
  VideoCutCatalog:
    type: object
    additionalProperties: false
    required: [songs, aspects, styles, defaults]
    properties:
      songs: { type: array, maxItems: 3, description: "The three songs VideoCut has (M4-1).", items: { $ref: "#/schemas/VideoCutCatalogSong" } }
      aspects: { type: array, minItems: 1, items: { $ref: "#/schemas/VideoCutCatalogItem" } }
      styles: { type: array, minItems: 1, items: { $ref: "#/schemas/VideoCutCatalogItem" } }
      defaults:
        type: object
        additionalProperties: false
        required: [song, aspect, style]
        description: "What a new project starts with."
        properties:
          song: { type: string, description: "A builtin song's id." }
          aspect: { type: string }
          style: { type: string }
  VideoCutSlotSpan:
    type: object
    additionalProperties: false
    required: [slot, start, end]
    properties:
      slot: { type: integer, minimum: 1, description: "From 1 over the whole film." }
      start: { type: number, minimum: 0, description: "Seconds into the film." }
      end: { type: number, minimum: 0 }
  VideoCutPart:
    type: object
    additionalProperties: false
    required: [index, label, start, end, slots]
    properties:
      index: { type: integer, minimum: 1 }
      label: { type: string, description: "前奏, 主歌, 副歌, 尾奏: the song's section." }
      start: { type: number, minimum: 0, description: "Seconds into the film." }
      end: { type: number, minimum: 0 }
      slots: { type: array, minItems: 1, items: { $ref: "#/schemas/VideoCutSlotSpan" } }
  VideoCutSongStructure:
    type: object
    additionalProperties: false
    required: [song, from, to, parts]
    description: "The film's parts and slots as the song makes them, known before the timeline is: the tracks of 生成中 draw them."
    properties:
      song: { $ref: "#/schemas/VideoCutProjectSong" }
      from: { type: number, minimum: 0, description: "Seconds into the song the film starts at." }
      to: { type: number, minimum: 0 }
      parts: { type: array, minItems: 1, items: { $ref: "#/schemas/VideoCutPart" } }
  VideoCutShot:
    type: object
    additionalProperties: false
    required: [slot, part, start, end, beat, assetId, from, to, speed, anchor, fitted]
    properties:
      slot: { type: integer, minimum: 1 }
      part: { type: integer, minimum: 1 }
      start: { type: number, minimum: 0, description: "Seconds into the film; the slot's." }
      end: { type: number, minimum: 0 }
      beat: { type: string, description: "The beat in the slot." }
      assetId: { type: string, description: "The video it comes from." }
      from: { type: number, minimum: 0, description: "Seconds into the video it plays from." }
      to: { type: number, minimum: 0 }
      speed: { type: number, minimum: 0.5, maximum: 1, description: "Below 1 where the beat is slowed to fill the slot." }
      anchor: { type: boolean, description: "锚点: changed by the member, so automatic changes leave it." }
      fitted: { type: boolean, description: "Its video's orientation is not the film's: shown in the middle on a blurred fill." }
      takenAt: { type: string, format: date-time }
  VideoCutTimeline:
    type: object
    additionalProperties: false
    required: [revision, duration, parts, shots, canUndo]
    properties:
      revision: { type: integer, minimum: 1, description: "Every edit names the revision it was made on." }
      duration: { type: number, minimum: 0 }
      parts: { type: array, minItems: 1, items: { $ref: "#/schemas/VideoCutPart" } }
      shots: { type: array, minItems: 1, description: "One a slot, in order.", items: { $ref: "#/schemas/VideoCutShot" } }
      canUndo: { type: boolean, description: "One step back, in this opening of the project only." }
      changedSlots: { type: array, description: "The slots the last edit or undo changed: the preview plays again from the first.", items: { type: integer, minimum: 1 } }
  VideoCutCandidate:
    type: object
    additionalProperties: false
    required: [beat, assetId, from, to, duration, fitted]
    properties:
      beat: { type: string }
      assetId: { type: string }
      from: { type: number, minimum: 0, description: "The part of its video it would play." }
      to: { type: number, minimum: 0 }
      duration: { type: number, minimum: 0 }
      fitted: { type: boolean }
      takenAt: { type: string, format: date-time }
  VideoCutCandidates:
    type: object
    additionalProperties: false
    required: [slot, items]
    properties:
      slot: { type: integer, minimum: 1 }
      items: { type: array, maxItems: 6, description: "Best first; the beat a replace took out comes first.", items: { $ref: "#/schemas/VideoCutCandidate" } }
  VideoCutEdit:
    description: "One edit of the timeline, by music slot (docs/specs/venus.md#镜头操作)."
    oneOf:
      - type: object
        additionalProperties: false
        required: [kind, slot, beat]
        description: "Replace the slot's beat with a candidate or a search result (M7-1, M8-2, M8-3)."
        properties: { kind: { const: replace }, slot: { type: integer, minimum: 1 }, beat: { type: string, minLength: 1 } }
      - type: object
        additionalProperties: false
        required: [kind, slot]
        description: "Delete the shot: its slot takes the next candidate (M7-3)."
        properties: { kind: { const: remove }, slot: { type: integer, minimum: 1 } }
      - type: object
        additionalProperties: false
        required: [kind, slot, from]
        description: "Play the same video from another time (M7-2)."
        properties: { kind: { const: set_in_point }, slot: { type: integer, minimum: 1 }, from: { type: number, minimum: 0 } }
      - type: object
        additionalProperties: false
        required: [kind, from, to]
        description: "Move a part's shots to another part's place (M6-3); the slots stay."
        properties: { kind: { const: reorder_parts }, from: { type: integer, minimum: 1 }, to: { type: integer, minimum: 1 } }
      - type: object
        additionalProperties: false
        required: [kind, slot, assetId]
        description: "Put one of the project's analysed videos in the slot (M7-4)."
        properties: { kind: { const: place }, slot: { type: integer, minimum: 1 }, assetId: { type: string, minLength: 1 } }
  VideoCutProjectAsset:
    type: object
    additionalProperties: false
    required: [assetId, analysis, addedAt]
    properties:
      assetId: { type: string }
      fileId: { type: string, description: "The file of the list it was uploaded from; absent for one added on the film page." }
      analysis: { type: string, enum: [running, done, skipped] }
      duration: { type: number, minimum: 0 }
      width: { type: integer, minimum: 1 }
      height: { type: integer, minimum: 1 }
      takenAt: { type: string, format: date-time }
      addedAt: { type: string, format: date-time }
  VideoCutProjectAssets:
    type: object
    additionalProperties: false
    required: [items]
    properties:
      items: { type: array, maxItems: 1000, items: { $ref: "#/schemas/VideoCutProjectAsset" } }
  VideoCutAssistantReply:
    type: object
    additionalProperties: false
    required: [text, groups]
    properties:
      text: { type: string, description: "What the assistant says back." }
      groups:
        type: array
        description: "Beats it found, by what they answer; empty for a reply in words only."
        items:
          type: object
          additionalProperties: false
          required: [title, items]
          properties:
            title: { type: string }
            slot: { type: integer, minimum: 1, description: "The slot they are for, where the member asked about one." }
            items: { type: array, maxItems: 12, items: { $ref: "#/schemas/VideoCutCandidate" } }
  VideoCutAssistantStatus:
    type: object
    additionalProperties: false
    required: [search]
    properties:
      search: { type: boolean, description: "Whether searching the member's videos works now; the page turns its box off while it does not." }
  VideoCutNotice:
    type: object
    additionalProperties: false
    required: [kind, jobId, projectId, project, at]
    properties:
      kind: { type: string, enum: [waiting_for_planning, planning, needs_input, saved, failed] }
      jobId: { type: string }
      projectId: { type: string }
      project: { type: string, description: The project's name. }
      reason: { type: string, description: "The job's waitReason; for failed, plan_failed is one the member plans again (replan)." }
      detail: { type: string, description: "Why the job still waits for VNAS, for waiting_for_planning: VNAS is off, the planning grant ran out, or no round has taken it yet. For failed, the job's error." }
      filmAssetId: { type: string, description: "The film saved, for saved." }
      at: { type: string, format: date-time }
  VideoCutNotices:
    type: object
    additionalProperties: false
    required: [items]
    properties:
      items: { type: array, items: { $ref: "#/schemas/VideoCutNotice" } }
