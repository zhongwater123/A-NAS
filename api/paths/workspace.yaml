/api/v1/workspace:
  get:
    operationId: getWorkspaceAccess
    summary: "Whether the caller may use 共享工作区 (ADR 0040): 200 for administrators and the members they added, 404 for everyone else. The desktop shows the app only while this answers 200"
    responses:
      "200": { description: The caller may use the workspace, content: { application/json: { schema: { $ref: "../components/workspace.yaml#/schemas/WorkspaceAccess" } } } }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "503": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/workspace/pages:
  get:
    operationId: listWorkspacePages
    summary: The shared pages, the most recently saved first. Accounts an administrator has not added answer 403 workspace_forbidden, here and on every operation below
    responses:
      "200": { description: The pages, content: { application/json: { schema: { $ref: "../components/workspace.yaml#/schemas/WorkspacePageList" } } } }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "503": { $ref: "../components/common.yaml#/responses/ProductError" }
  post:
    operationId: createWorkspacePage
    summary: "Upload a UTF-8 HTML file as a new page, its version 1. Its title is the page's <title>, else the file's name. At most 20 MB (413 request_too_large); not UTF-8 or empty is 422 validation_failed"
    parameters:
      - { $ref: "../components/common.yaml#/parameters/CSRFToken" }
      - { name: name, in: query, required: false, schema: { type: string, maxLength: 255 }, description: The uploaded file's name }
    requestBody: { required: true, content: { text/html: { schema: { type: string } } } }
    responses:
      "201": { description: The new page, content: { application/json: { schema: { $ref: "../components/workspace.yaml#/schemas/WorkspacePage" } } } }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "413": { $ref: "../components/common.yaml#/responses/ProductError" }
      "422": { $ref: "../components/common.yaml#/responses/ProductError" }
      "507": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/workspace/pages/{pageId}:
  parameters: [{ $ref: "../components/workspace.yaml#/parameters/WorkspacePageID" }]
  get:
    operationId: getWorkspacePage
    summary: A page with all its versions, newest first, and who has it open. The page's tab reads it every 3 seconds while it can be seen, to follow new versions and who is there
    responses:
      "200": { description: The page, content: { application/json: { schema: { $ref: "../components/workspace.yaml#/schemas/WorkspacePage" } } } }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
  patch:
    operationId: renameWorkspacePage
    summary: Change a page's title (1–200 characters after folding white space, else 422 validation_failed)
    parameters: [{ $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    requestBody:
      required: true
      content:
        application/json:
          schema: { type: object, additionalProperties: false, required: [title], properties: { title: { type: string } } }
    responses:
      "200": { description: The renamed page, content: { application/json: { schema: { $ref: "../components/workspace.yaml#/schemas/WorkspacePageSummary" } } } }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "422": { $ref: "../components/common.yaml#/responses/ProductError" }
  delete:
    operationId: deleteWorkspacePage
    summary: Delete a page and all its versions for everyone. Only the account that uploaded it and administrators may (403 forbidden)
    parameters: [{ $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    responses:
      "204": { description: Deleted }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/workspace/pages/{pageId}/versions:
  parameters: [{ $ref: "../components/workspace.yaml#/parameters/WorkspacePageID" }]
  post:
    operationId: saveWorkspacePageVersion
    summary: "Upload a whole page as its next version. baseVersion is the version it replaces; when another was saved since, nothing is saved and 409 page_changed names the latest"
    parameters:
      - { $ref: "../components/common.yaml#/parameters/CSRFToken" }
      - { name: baseVersion, in: query, required: true, schema: { type: integer, minimum: 1 } }
    requestBody: { required: true, content: { text/html: { schema: { type: string } } } }
    responses:
      "201": { description: The new version, content: { application/json: { schema: { $ref: "../components/workspace.yaml#/schemas/WorkspaceVersion" } } } }
      "400": { $ref: "../components/common.yaml#/responses/ProductError" }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "409": { description: page_changed, content: { application/json: { schema: { $ref: "../components/workspace.yaml#/schemas/WorkspacePageChanged" } } } }
      "413": { $ref: "../components/common.yaml#/responses/ProductError" }
      "422": { $ref: "../components/common.yaml#/responses/ProductError" }
      "507": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/workspace/pages/{pageId}/versions/{version}/view:
  parameters:
    - { $ref: "../components/workspace.yaml#/parameters/WorkspacePageID" }
    - { $ref: "../components/workspace.yaml#/parameters/WorkspaceVersionRef" }
  get:
    operationId: viewWorkspacePage
    summary: >-
      A version for the desktop's <iframe sandbox="allow-scripts">: the page with every written element marked
      data-anas-at (its start tag's byte offset in the source) and the frame helper script, under
      Content-Security-Policy "sandbox allow-scripts; default-src 'none'; …", so it runs in an opaque origin that
      reaches nothing. highlight lists element offsets to point at, scroll the vertical position to keep
    parameters:
      - { name: highlight, in: query, required: false, schema: { type: string, pattern: "^[0-9,]*$" } }
      - { name: scroll, in: query, required: false, schema: { type: string, pattern: "^[0-9]*$" } }
    responses:
      "200": { description: The marked page, content: { text/html: { schema: { type: string } } } }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/workspace/pages/{pageId}/versions/{version}/file:
  parameters:
    - { $ref: "../components/workspace.yaml#/parameters/WorkspacePageID" }
    - { $ref: "../components/workspace.yaml#/parameters/WorkspaceVersionRef" }
  get:
    operationId: exportWorkspacePage
    summary: A version exactly as it was saved, as an attachment named "<title>-v<version>.html", under a sandbox policy
    responses:
      "200": { description: The page's file, content: { text/html: { schema: { type: string } } } }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/workspace/viewing:
  put:
    operationId: setWorkspaceViewing
    summary: "The page and version one of the caller's tabs shows: the tab the caller used last is the page their agents read (workspace_context), and every member sees who has a page open (presence). Kept in memory only; a tab says it again every minute while it can be seen and it lapses after 3 minutes without. No tab name is 400 invalid_request"
    parameters: [{ $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    requestBody: { required: true, content: { application/json: { schema: { $ref: "../components/workspace.yaml#/schemas/WorkspaceViewing" } } } }
    responses:
      "204": { description: Recorded }
      "400": { $ref: "../components/common.yaml#/responses/ProductError" }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/workspace/viewing/{tab}:
  parameters: [{ name: tab, in: path, required: true, schema: { type: string }, description: The tab's name as it reported itself }]
  delete:
    operationId: clearWorkspaceViewing
    summary: This tab of the caller's closed or went to the background; the caller's other tabs stay
    parameters: [{ $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    responses:
      "204": { description: Forgotten }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/workspace/selection:
  put:
    operationId: setWorkspaceSelection
    summary: "The element the caller picked on a page, as the frame helper measured it, for the caller's agents alone; it lasts 30 minutes. The screenshot is a JPEG data URL of at most 512 KB and 4096 pixels a side (422 validation_failed)"
    parameters: [{ $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    requestBody: { required: true, content: { application/json: { schema: { $ref: "../components/workspace.yaml#/schemas/WorkspaceSelection" } } } }
    responses:
      "204": { description: Recorded }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "422": { $ref: "../components/common.yaml#/responses/ProductError" }
  delete:
    operationId: clearWorkspaceSelection
    summary: Forget the caller's selection
    parameters: [{ $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    responses:
      "204": { description: Forgotten }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/workspace/admin/members:
  get:
    operationId: listWorkspaceMembers
    summary: Every active account and whether an administrator let it use the workspace. Administrators always may
    x-anas-posture: admin
    responses:
      "200": { description: The accounts, content: { application/json: { schema: { $ref: "../components/workspace.yaml#/schemas/WorkspaceMemberList" } } } }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "503": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/workspace/admin/members/{accountId}:
  parameters: [{ name: accountId, in: path, required: true, schema: { type: string } }]
  put:
    operationId: addWorkspaceMember
    summary: Let an account use the workspace; adding it again changes nothing
    x-anas-posture: admin
    parameters: [{ $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    responses:
      "204": { description: Added }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
  delete:
    operationId: removeWorkspaceMember
    summary: Stop an account using the workspace. Its pages stay; its agents' calls are refused while it is not a member
    x-anas-posture: admin
    parameters: [{ $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    responses:
      "204": { description: Removed }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/workspace/mcp:
  post:
    operationId: callWorkspaceMCP
    summary: >-
      The shared workspace's MCP endpoint for members' coding agents (stateless streamable HTTP, JSON responses;
      docs/architecture/shared-workspace.md lists the tools). It takes an agent token as a bearer token and never a
      session cookie; a request carrying Origin (a browser's) or not naming the device in Host is 403 forbidden, a
      missing or bad token 401 with WWW-Authenticate, and a client that keeps presenting bad tokens 429
      too_many_attempts. At most 4 MiB a request
    security: [{ bearerAuth: [] }]
    x-anas-posture: agent
    requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
    responses:
      "200": { description: A JSON-RPC answer, content: { application/json: { schema: { type: object } } } }
      "202": { description: A notification was accepted }
      "400": { description: Not a JSON-RPC request, content: { text/plain: { schema: { type: string } } } }
      "401": { $ref: "../components/common.yaml#/responses/ProductError" }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "429": { $ref: "../components/common.yaml#/responses/ProductError" }
  get:
    operationId: openWorkspaceMCPStream
    summary: A stateless server keeps no stream for an agent to open; 405 after the agent's token is checked
    security: [{ bearerAuth: [] }]
    x-anas-posture: agent
    responses:
      "401": { $ref: "../components/common.yaml#/responses/ProductError" }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "405": { description: Not offered, content: { text/plain: { schema: { type: string } } } }
      "429": { $ref: "../components/common.yaml#/responses/ProductError" }
  delete:
    operationId: endWorkspaceMCPSession
    summary: A stateless server keeps no session for an agent to end; 405 after the agent's token is checked
    security: [{ bearerAuth: [] }]
    x-anas-posture: agent
    responses:
      "401": { $ref: "../components/common.yaml#/responses/ProductError" }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "405": { description: Not offered, content: { text/plain: { schema: { type: string } } } }
      "429": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/workspace/transfers/{key}:
  parameters: [{ name: key, in: path, required: true, schema: { type: string } }]
  get:
    operationId: downloadWorkspaceTransfer
    summary: >-
      A page version an agent's workspace_checkout asked for, once, within 10 minutes of asking. The link is the
      authority, together with the agent token that asked for it, which must still work (401) for an account that
      may still use the workspace (403 workspace_forbidden); an unknown, used or expired link is 404
    security: []
    responses:
      "200": { description: The page's file, content: { text/html: { schema: { type: string } } } }
      "401": { $ref: "../components/common.yaml#/responses/ProductError" }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "503": { $ref: "../components/common.yaml#/responses/ProductError" }
  put:
    operationId: uploadWorkspaceTransfer
    summary: >-
      A whole page an agent's workspace_upload asked to send, once, within 10 minutes: the next version of its page,
      refused with 409 page_changed when another was saved after its base version, or a new page. Checked as the
      download is
    security: []
    requestBody: { required: true, content: { text/html: { schema: { type: string } } } }
    responses:
      "201": { description: Saved, content: { application/json: { schema: { $ref: "../components/workspace.yaml#/schemas/WorkspaceTransferSaved" } } } }
      "401": { $ref: "../components/common.yaml#/responses/ProductError" }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "409": { description: page_changed, content: { application/json: { schema: { $ref: "../components/workspace.yaml#/schemas/WorkspacePageChanged" } } } }
      "413": { $ref: "../components/common.yaml#/responses/ProductError" }
      "422": { $ref: "../components/common.yaml#/responses/ProductError" }
      "503": { $ref: "../components/common.yaml#/responses/ProductError" }
      "507": { $ref: "../components/common.yaml#/responses/ProductError" }
