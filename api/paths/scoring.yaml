# Photo scoring, a removable module (docs/specs/photo-scoring.md, ADR 0037).
# The Product Service forwards these to the module, which answers
# module_not_installed (404) while it is not installed and module_unavailable
# (503) while it is installed but not running.
/api/v1/modules/scoring/me:
  get:
    operationId: getScoringMe
    summary: "Whether the caller administers photo scoring and whether an administrator chose them as a rater"
    responses:
      "200": { description: The caller's roles, content: { application/json: { schema: { $ref: "../components/scoring.yaml#/schemas/ScoringMe" } } } }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "503": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/modules/scoring/batches:
  get:
    operationId: listScoringBatches
    summary: "The open batches for a rater, each with only the rater's own count of answers"
    responses:
      "200":
        description: The open batches
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, items: { $ref: "../components/scoring.yaml#/schemas/ScoringRaterBatch" } } } } } }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/modules/scoring/batches/{batchId}/anchors:
  get:
    operationId: listScoringAnchors
    summary: "A batch's reference photos with their scores, lowest first, for raters and administrators"
    parameters: [{ $ref: "../components/scoring.yaml#/parameters/ScoringBatchID" }]
    responses:
      "200":
        description: The reference photos
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, items: { $ref: "../components/scoring.yaml#/schemas/ScoringAnchor" } } } } } }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/modules/scoring/batches/{batchId}/anchors/{anchorId}/image:
  get:
    operationId: getScoringAnchorImage
    summary: The preview of a reference photo
    parameters: [{ $ref: "../components/scoring.yaml#/parameters/ScoringBatchID" }, { $ref: "../components/scoring.yaml#/parameters/ScoringAnchorID" }]
    responses:
      "200": { description: The preview, content: { image/jpeg: { schema: { type: string, format: binary } } } }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/modules/scoring/batches/{batchId}/recent:
  get:
    operationId: listScoringRecent
    summary: "The rater's own latest twelve scores in the batch, oldest first, for the ruler; skips and marks are left out"
    parameters: [{ $ref: "../components/scoring.yaml#/parameters/ScoringBatchID" }]
    responses:
      "200":
        description: The latest scores
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, maxItems: 12, items: { $ref: "../components/scoring.yaml#/schemas/ScoringRecentScore" } } } } } }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/modules/scoring/batches/{batchId}/claims:
  post:
    operationId: claimScoringPhotos
    summary: "The photos the rater holds in the batch, oldest first, topped up to three; each is held for ten minutes"
    parameters: [{ $ref: "../components/scoring.yaml#/parameters/ScoringBatchID" }, { $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    responses:
      "200": { description: The held photos, content: { application/json: { schema: { $ref: "../components/scoring.yaml#/schemas/ScoringClaims" } } } }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/modules/scoring/claims/{token}/image:
  get:
    operationId: getScoringClaimImage
    summary: "The preview behind one of the caller's own claims, answered or not"
    parameters: [{ $ref: "../components/scoring.yaml#/parameters/ScoringClaimToken" }]
    responses:
      "200": { description: The preview, content: { image/jpeg: { schema: { type: string, format: binary } } } }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/modules/scoring/claims/{token}/full:
  get:
    operationId: getScoringClaimFull
    summary: "The photo behind one of the caller's own claims at its full size, for judging sharpness: only in batches that score sharpness"
    description: "Decoded from the original and encoded again as a JPEG without any of its metadata, in the original's stored orientation; X-Image-Orientation (1 to 8, EXIF) tells how to turn it upright. original_changed (410) when the original is gone or no longer the photo that was imported."
    parameters: [{ $ref: "../components/scoring.yaml#/parameters/ScoringClaimToken" }]
    responses:
      "200":
        description: The photo at full size
        headers:
          X-Image-Orientation: { description: "The EXIF orientation, 1 to 8, to apply for display.", schema: { type: integer, minimum: 1, maximum: 8 } }
        content: { image/jpeg: { schema: { type: string, format: binary } } }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "410": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/modules/scoring/claims/{token}/thumbnail:
  get:
    operationId: getScoringClaimThumbnail
    summary: "A small JPEG, at most 320 px on its longer side, of the photo behind one of the caller's own claims"
    parameters: [{ $ref: "../components/scoring.yaml#/parameters/ScoringClaimToken" }]
    responses:
      "200": { description: The thumbnail, content: { image/jpeg: { schema: { type: string, format: binary } } } }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/modules/scoring/claims/{token}/rating:
  put:
    operationId: rateScoringPhoto
    summary: "Answer a claim: a score, a skip or a mark. The same submission again is harmless; a new answer replaces only the rater's latest (rating_locked)"
    parameters: [{ $ref: "../components/scoring.yaml#/parameters/ScoringClaimToken" }, { $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    requestBody: { required: true, content: { application/json: { schema: { $ref: "../components/scoring.yaml#/schemas/ScoringRatingInput" } } } }
    responses:
      "200":
        description: How many photos of the batch the rater answered
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [rated], properties: { rated: { type: integer, minimum: 0 } } } } }
      "400": { $ref: "../components/common.yaml#/responses/ProductError" }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "409": { $ref: "../components/common.yaml#/responses/ProductError" }
      "422": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/modules/scoring/admin/sources:
  get:
    operationId: listScoringSources
    summary: "The folders in the Shared folder 照片打分 that can become a batch"
    x-anas-posture: admin
    responses:
      "200":
        description: The folders
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, items: { type: object, additionalProperties: false, required: [name], properties: { name: { type: string } } } } } } } }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "503": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/modules/scoring/admin/batches:
  get:
    operationId: listScoringAdminBatches
    summary: Every batch with its import progress and coverage, newest first
    x-anas-posture: admin
    responses:
      "200":
        description: The batches
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, items: { $ref: "../components/scoring.yaml#/schemas/ScoringBatch" } } } } } }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
  post:
    operationId: createScoringBatch
    summary: Start importing a folder as a new batch
    x-anas-posture: admin
    parameters: [{ $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    requestBody: { required: true, content: { application/json: { schema: { $ref: "../components/scoring.yaml#/schemas/ScoringBatchInput" } } } }
    responses:
      "201": { description: The new batch, content: { application/json: { schema: { $ref: "../components/scoring.yaml#/schemas/ScoringBatch" } } } }
      "400": { $ref: "../components/common.yaml#/responses/ProductError" }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "422": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/modules/scoring/admin/batches/{batchId}:
  parameters: [{ $ref: "../components/scoring.yaml#/parameters/ScoringBatchID" }]
  patch:
    operationId: updateScoringBatch
    summary: "Rename a batch, change its guide, number of raters or, before its first answer, 打分项, or close and reopen it"
    x-anas-posture: admin
    parameters: [{ $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    requestBody: { required: true, content: { application/json: { schema: { $ref: "../components/scoring.yaml#/schemas/ScoringBatchPatch" } } } }
    responses:
      "200": { description: The batch, content: { application/json: { schema: { $ref: "../components/scoring.yaml#/schemas/ScoringBatch" } } } }
      "400": { $ref: "../components/common.yaml#/responses/ProductError" }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "409": { $ref: "../components/common.yaml#/responses/ProductError" }
      "422": { $ref: "../components/common.yaml#/responses/ProductError" }
  delete:
    operationId: deleteScoringBatch
    summary: "Delete a batch nobody answered yet (batch_in_use otherwise)"
    x-anas-posture: admin
    parameters: [{ $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    responses:
      "204": { description: Deleted }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "409": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/modules/scoring/admin/batches/{batchId}/stats:
  get:
    operationId: getScoringStats
    summary: "Each rater's counts, timing, spread, agreement with the others and consistency on repeated photos"
    x-anas-posture: admin
    parameters: [{ $ref: "../components/scoring.yaml#/parameters/ScoringBatchID" }]
    responses:
      "200":
        description: The raters' statistics
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, items: { $ref: "../components/scoring.yaml#/schemas/ScoringRaterStats" } } } } } }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/modules/scoring/admin/batches/{batchId}/cover:
  get:
    operationId: getScoringBatchCover
    summary: "A small JPEG, at most 320 px on its longer side, of the photo that stands for the batch: the first in its random order, anchors excluded"
    x-anas-posture: admin
    parameters: [{ $ref: "../components/scoring.yaml#/parameters/ScoringBatchID" }]
    responses:
      "200": { description: The thumbnail, content: { image/jpeg: { schema: { type: string, format: binary } } } }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/modules/scoring/admin/batches/{batchId}/export:
  get:
    operationId: exportScoringBatch
    summary: "A zip of one table, ratings.csv or ratings.jsonl, with a row per answer (a photo and a rater), and manifest.json describing the batch, the rows and every column"
    x-anas-posture: admin
    parameters:
      - { $ref: "../components/scoring.yaml#/parameters/ScoringBatchID" }
      - { name: format, in: query, description: "csv (UTF-8 with a byte order mark, for spreadsheets; the default) or jsonl.", schema: { type: string, enum: [csv, jsonl] } }
      - name: fields
        in: query
        style: form
        explode: false
        description: "Columns beside image_id, image_path and rater, comma-separated; a 打分项 the batch does not score is refused (validation_failed)."
        schema: { type: array, uniqueItems: true, items: { $ref: "../components/scoring.yaml#/schemas/ScoringExportField" } }
      - name: include
        in: query
        style: form
        explode: false
        description: "Rows beside current scores, comma-separated: skips (skips and marks), superseded (answers replaced later), repeats (answers to photos shown again)."
        schema: { type: array, uniqueItems: true, items: { type: string, enum: [skips, superseded, repeats] } }
    responses:
      "200": { description: The export, content: { application/zip: { schema: { type: string, format: binary } } } }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "422": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/modules/scoring/admin/batches/{batchId}/export/summary:
  get:
    operationId: getScoringExportSummary
    summary: "How many rows an export has: current scores, and those each include adds"
    x-anas-posture: admin
    parameters: [{ $ref: "../components/scoring.yaml#/parameters/ScoringBatchID" }]
    responses:
      "200": { description: The counts, content: { application/json: { schema: { $ref: "../components/scoring.yaml#/schemas/ScoringExportSummary" } } } }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/modules/scoring/admin/raters:
  get:
    operationId: listScoringRaters
    summary: Every active account and whether it is a rater
    x-anas-posture: admin
    responses:
      "200":
        description: The accounts
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, items: { $ref: "../components/scoring.yaml#/schemas/ScoringRaterEntry" } } } } } }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/modules/scoring/admin/raters/{accountId}:
  parameters: [{ $ref: "../components/scoring.yaml#/parameters/ScoringAccountID" }]
  put:
    operationId: addScoringRater
    summary: Choose an active account as a rater
    x-anas-posture: admin
    parameters: [{ $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    responses:
      "204": { description: Chosen }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
  delete:
    operationId: removeScoringRater
    summary: "Stop an account rating; its answers stay"
    x-anas-posture: admin
    parameters: [{ $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    responses:
      "204": { description: Removed }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
