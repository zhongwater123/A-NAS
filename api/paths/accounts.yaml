/api/v1/setup/status:
  get:
    security: []
    operationId: getSetupStatus
    responses:
      "200": { description: Setup state, content: { application/json: { schema: { $ref: "../components/accounts.yaml#/schemas/SetupStatus" } } } }
/api/v1/setup/admin:
  post:
    security: []
    operationId: setupAdministrator
    description: Create the first administrator. Only a direct loopback connection may (403 setup_local_only otherwise); a concurrent or later setup answers 409 setup_complete.
    requestBody: { required: true, content: { application/json: { schema: { $ref: "../components/accounts.yaml#/schemas/SetupRequest" } } } }
    responses:
      "201": { description: Administrator created, content: { application/json: { schema: { $ref: "../components/accounts.yaml#/schemas/Session" } } } }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "409": { $ref: "../components/common.yaml#/responses/ProductError" }
      "422": { $ref: "../components/common.yaml#/responses/ProductError" }
      "503": { description: "credential_provision_failed: the Host Agent could not enable the account for SMB", content: { application/json: { schema: { $ref: "../components/common.yaml#/schemas/ErrorResponse" } } } }
/api/v1/session:
  post:
    security: []
    operationId: createSession
    requestBody: { required: true, content: { application/json: { schema: { $ref: "../components/accounts.yaml#/schemas/LoginRequest" } } } }
    responses:
      "200": { description: Authenticated session, content: { application/json: { schema: { $ref: "../components/accounts.yaml#/schemas/Session" } } } }
      "401": { $ref: "../components/common.yaml#/responses/ProductError" }
  get:
    operationId: getSession
    responses:
      "200": { description: Current session, content: { application/json: { schema: { $ref: "../components/accounts.yaml#/schemas/Session" } } } }
      "401": { $ref: "../components/common.yaml#/responses/ProductError" }
  delete:
    operationId: deleteSession
    parameters: [{ $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    responses:
      "204": { description: Session ended }
/api/v1/session/password:
  post:
    operationId: changePassword
    description: Replace the signed-in user's password. Required before anything else after an administrator reset it.
    parameters: [{ $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    requestBody: { required: true, content: { application/json: { schema: { $ref: "../components/accounts.yaml#/schemas/PasswordChange" } } } }
    responses:
      "204": { description: Password changed and SMB re-enabled }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "422": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/session/profile:
  patch:
    operationId: updateProfile
    description: >-
      Change the name the signed-in user is shown by. Pages show the nickname instead of the username everywhere
      except where the account name itself matters (sign-in, SMB, the terminal). An empty nickname shows the
      username again.
    parameters: [{ $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    requestBody: { required: true, content: { application/json: { schema: { $ref: "../components/accounts.yaml#/schemas/ProfileChange" } } } }
    responses:
      "200": { description: The updated account, content: { application/json: { schema: { $ref: "../components/accounts.yaml#/schemas/User" } } } }
      "400": { $ref: "../components/common.yaml#/responses/ProductError" }
      "409": { $ref: "../components/common.yaml#/responses/ProductError" }
      "422": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/session/avatar:
  put:
    operationId: setAvatar
    description: >-
      Replace the signed-in user's avatar with the picture in the body. The server turns it upright, crops the
      centre square, scales it to at most 256 pixels and stores it as a JPEG of a few dozen kilobytes; the
      original is not kept. Clients crop first and send the square they want.
    parameters: [{ $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    requestBody:
      required: true
      content:
        image/jpeg: { schema: { type: string, format: binary } }
        image/png: { schema: { type: string, format: binary } }
        image/gif: { schema: { type: string, format: binary } }
        image/webp: { schema: { type: string, format: binary } }
    responses:
      "200": { description: The updated account with its new avatarVersion, content: { application/json: { schema: { $ref: "../components/accounts.yaml#/schemas/User" } } } }
      "413": { description: "image_too_large: more than 12 MiB or 25 million pixels", content: { application/json: { schema: { $ref: "../components/common.yaml#/schemas/ErrorResponse" } } } }
      "415": { description: "unsupported_image: not a JPEG, PNG, GIF or WebP picture", content: { application/json: { schema: { $ref: "../components/common.yaml#/schemas/ErrorResponse" } } } }
  delete:
    operationId: removeAvatar
    description: Go back to the initial on a coloured disc.
    parameters: [{ $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    responses:
      "200": { description: The updated account, content: { application/json: { schema: { $ref: "../components/accounts.yaml#/schemas/User" } } } }
/api/v1/profiles:
  get:
    operationId: listProfiles
    description: >-
      How every account appears, disabled ones included, for any signed-in user: the name to show and the avatar.
      Role and status stay with listUsers, which only administrators may call.
    responses:
      "200": { description: Profiles, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "../components/accounts.yaml#/schemas/Profile" } } } } } } }
/api/v1/users/{userId}/avatar:
  get:
    operationId: getAvatar
    description: >-
      An account's avatar for any signed-in user. Ask with v set to the account's avatarVersion: that URL never
      changes content and is cached for a year; without it the answer must be revalidated (ETag).
    parameters:
      - { $ref: "../components/accounts.yaml#/parameters/UserID" }
      - { name: v, in: query, schema: { type: string } }
    responses:
      "200": { description: Square JPEG avatar, content: { image/jpeg: { schema: { type: string, format: binary } } } }
      "304": { description: The cached avatar is current }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/notifications:
  get:
    operationId: listNotifications
    description: Unacknowledged notices such as an administrator viewing the user's private space or resetting the password.
    responses:
      "200": { description: Notifications, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "../components/accounts.yaml#/schemas/Notification" } } } } } } }
/api/v1/notifications/{notificationId}/acknowledge:
  post:
    operationId: acknowledgeNotification
    parameters: [{ name: notificationId, in: path, required: true, schema: { type: string } }, { $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    responses:
      "204": { description: Notification acknowledged }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/users/{userId}/viewing:
  post:
    operationId: startViewing
    x-anas-posture: admin
    description: Administrative Viewing Mode. An administrator re-enters their password and a reason to read another account's private space for 24 hours; the access is audited and the owner is notified.
    parameters: [{ $ref: "../components/accounts.yaml#/parameters/UserID" }, { $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    requestBody: { required: true, content: { application/json: { schema: { $ref: "../components/accounts.yaml#/schemas/ViewingRequest" } } } }
    responses:
      "201": { description: Read-only access granted, content: { application/json: { schema: { $ref: "../components/accounts.yaml#/schemas/ViewingGrant" } } } }
      "400": { $ref: "../components/common.yaml#/responses/ProductError" }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "409": { $ref: "../components/common.yaml#/responses/ProductError" }
      "422": { $ref: "../components/common.yaml#/responses/ProductError" }
      "423": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/viewing/{grantId}:
  delete:
    operationId: endViewing
    x-anas-posture: admin
    parameters: [{ name: grantId, in: path, required: true, schema: { type: string } }, { $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    responses:
      "204": { description: Viewing ended and access revoked }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/users:
  get:
    operationId: listUsers
    x-anas-posture: admin
    responses:
      "200": { description: Users, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "../components/accounts.yaml#/schemas/User" } } } } } } }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
  post:
    operationId: createUser
    x-anas-posture: admin
    parameters: [{ $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    requestBody: { required: true, content: { application/json: { schema: { $ref: "../components/accounts.yaml#/schemas/CredentialInput" } } } }
    responses:
      "201": { description: Member created, content: { application/json: { schema: { $ref: "../components/accounts.yaml#/schemas/User" } } } }
      "409": { $ref: "../components/common.yaml#/responses/ProductError" }
      "422": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/users/{userId}:
  delete:
    operationId: disableUser
    x-anas-posture: admin
    parameters: [{ $ref: "../components/accounts.yaml#/parameters/UserID" }, { $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    description: Disable an account. Web sign-in ends first; when the Host Agent then fails to disable the SMB credential the answer is 503 smb_disable_pending, and disabling again retries only that step.
    responses:
      "204": { description: User disabled }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "503": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/users/{userId}/credential:
  patch:
    operationId: resetUserCredential
    x-anas-posture: admin
    parameters: [{ $ref: "../components/accounts.yaml#/parameters/UserID" }, { $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    description: Choose a temporary password for another account; administrators change their own with changePassword.
    requestBody: { required: true, content: { application/json: { schema: { type: object, required: [password], properties: { password: { $ref: "../components/accounts.yaml#/schemas/NewPassword" } } } } } }
    responses:
      "204": { description: Credential reset }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "422": { $ref: "../components/common.yaml#/responses/ProductError" }
