/api/v1/family:
  get:
    operationId: getFamily
    summary: "The caller's standing in the family and, for members, the family: members, babies and, for guardians, join requests and babies they can restore"
    responses:
      "200": { description: The family as the caller sees it, content: { application/json: { schema: { $ref: "../components/family.yaml#/schemas/FamilyOverview" } } } }
      "503": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/family/catalog:
  get:
    operationId: getFamilyCatalog
    summary: "What pages offer when adding: preset family roles, suggested milestones, the vaccine catalog and the growth standard's name"
    responses:
      "200": { description: The catalog, content: { application/json: { schema: { $ref: "../components/family.yaml#/schemas/FamilyCatalog" } } } }
      "503": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/family/join:
  post:
    operationId: joinFamily
    summary: "Ask to join with a family role; the first account, or the first after everyone has gone, founds the family as its guardian"
    parameters: [{ $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [role], properties: { role: { type: string, minLength: 1, maxLength: 8 } } } } } }
    responses:
      "200": { description: The caller's standing now, content: { application/json: { schema: { $ref: "../components/family.yaml#/schemas/FamilyMe" } } } }
      "400": { $ref: "../components/common.yaml#/responses/ProductError" }
      "409": { $ref: "../components/common.yaml#/responses/ProductError" }
      "422": { $ref: "../components/common.yaml#/responses/ProductError" }
  delete:
    operationId: cancelFamilyJoin
    summary: Withdraw the caller's own join request
    parameters: [{ $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    responses:
      "204": { description: Withdrawn }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/family/leave:
  post:
    operationId: leaveFamily
    summary: "Leave the family; what the caller added stays. The last guardian must name another first (last_guardian)"
    parameters: [{ $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    responses:
      "204": { description: Left }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "409": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/family/me:
  patch:
    operationId: setFamilyRole
    summary: Change the caller's own family role
    parameters: [{ $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [role], properties: { role: { type: string, minLength: 1, maxLength: 8 } } } } } }
    responses:
      "200": { description: The caller as a member, content: { application/json: { schema: { $ref: "../components/family.yaml#/schemas/FamilyMember" } } } }
      "400": { $ref: "../components/common.yaml#/responses/ProductError" }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "422": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/family/requests/{accountId}/approve:
  post:
    operationId: approveFamilyJoin
    summary: "A guardian admits a requester; 爸爸 and 妈妈 become guardians"
    parameters: [{ $ref: "../components/family.yaml#/parameters/FamilyAccountID" }, { $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    responses:
      "200": { description: The new member, content: { application/json: { schema: { $ref: "../components/family.yaml#/schemas/FamilyMember" } } } }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/family/requests/{accountId}:
  delete:
    operationId: rejectFamilyJoin
    summary: A guardian turns a join request down; the account may ask again
    parameters: [{ $ref: "../components/family.yaml#/parameters/FamilyAccountID" }, { $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    responses:
      "204": { description: Rejected }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/family/members/{accountId}:
  parameters: [{ $ref: "../components/family.yaml#/parameters/FamilyAccountID" }]
  patch:
    operationId: setFamilyGuardian
    summary: "A guardian makes a member a guardian or a relative; the family keeps at least one guardian (last_guardian)"
    parameters: [{ $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [guardian], properties: { guardian: { type: boolean } } } } } }
    responses:
      "200": { description: The member, content: { application/json: { schema: { $ref: "../components/family.yaml#/schemas/FamilyMember" } } } }
      "400": { $ref: "../components/common.yaml#/responses/ProductError" }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "409": { $ref: "../components/common.yaml#/responses/ProductError" }
  delete:
    operationId: removeFamilyMember
    summary: "A guardian takes another member out of the family; what they added stays"
    parameters: [{ $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    responses:
      "204": { description: Removed }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "422": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/family/hints:
  get:
    operationId: listFamilyHints
    summary: "What the desktop has not told the caller yet: vaccine doses due or due within 30 days and, for guardians, join requests. Empty outside the family"
    responses:
      "200": { description: Hints, content: { application/json: { schema: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, items: { $ref: "../components/family.yaml#/schemas/FamilyHint" } } } } } } }
      "503": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/family/hints/seen:
  post:
    operationId: markFamilyHintsSeen
    summary: Record that the caller was told, so the desktop does not tell them again
    parameters: [{ $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [keys], properties: { keys: { type: array, maxItems: 200, items: { type: string, minLength: 1, maxLength: 200 } } } } } } }
    responses:
      "204": { description: Recorded }
      "400": { $ref: "../components/common.yaml#/responses/ProductError" }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "422": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/family/babies:
  post:
    operationId: addFamilyBaby
    summary: A guardian adds a baby and so a new channel
    parameters: [{ $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    requestBody: { required: true, content: { application/json: { schema: { $ref: "../components/family.yaml#/schemas/FamilyBabyFields" } } } }
    responses:
      "201": { description: The baby, content: { application/json: { schema: { $ref: "../components/family.yaml#/schemas/FamilyBaby" } } } }
      "400": { $ref: "../components/common.yaml#/responses/ProductError" }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "422": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/family/babies/{babyId}:
  parameters: [{ $ref: "../components/family.yaml#/parameters/FamilyBabyID" }]
  get:
    operationId: getFamilyBaby
    summary: A baby's profile
    responses:
      "200": { description: The baby, content: { application/json: { schema: { $ref: "../components/family.yaml#/schemas/FamilyBaby" } } } }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
  patch:
    operationId: updateFamilyBaby
    summary: "A guardian edits a baby's profile; changed when someone saved first, conflict when records would fall before the new birth date"
    parameters: [{ $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    requestBody: { required: true, content: { application/json: { schema: { $ref: "../components/family.yaml#/schemas/FamilyBabyFields" } } } }
    responses:
      "200": { description: The baby, content: { application/json: { schema: { $ref: "../components/family.yaml#/schemas/FamilyBaby" } } } }
      "400": { $ref: "../components/common.yaml#/responses/ProductError" }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "409": { $ref: "../components/common.yaml#/responses/ProductError" }
      "422": { $ref: "../components/common.yaml#/responses/ProductError" }
  delete:
    operationId: deleteFamilyBaby
    summary: "A guardian moves a baby and the channel into the trash for 15 days; name repeats the baby's name"
    parameters:
      - { $ref: "../components/common.yaml#/parameters/CSRFToken" }
      - { name: name, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 20 } }
    responses:
      "204": { description: Deleted }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "422": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/family/babies/{babyId}/restore:
  post:
    operationId: restoreFamilyBaby
    summary: A guardian brings a deleted baby and the channel back
    parameters: [{ $ref: "../components/family.yaml#/parameters/FamilyBabyID" }, { $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    responses:
      "200": { description: The baby, content: { application/json: { schema: { $ref: "../components/family.yaml#/schemas/FamilyBaby" } } } }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/family/babies/{babyId}/avatar:
  parameters: [{ $ref: "../components/family.yaml#/parameters/FamilyBabyID" }]
  get:
    operationId: getFamilyBabyAvatar
    summary: "The baby's avatar, a square JPEG; cache it by the baby's avatarVersion"
    responses:
      "200": { description: The avatar, content: { image/jpeg: { schema: { type: string, format: binary } } } }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
  put:
    operationId: setFamilyBabyAvatar
    summary: "A guardian sets the avatar from a picture, cropped to a square and shrunk like an account avatar"
    parameters: [{ $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema: { type: object, required: [file], properties: { file: { type: string, format: binary, description: "JPEG, PNG, GIF or WebP; at most 12 MiB." } } }
    responses:
      "200": { description: The baby, content: { application/json: { schema: { $ref: "../components/family.yaml#/schemas/FamilyBaby" } } } }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "413": { $ref: "../components/common.yaml#/responses/ProductError" }
      "422": { $ref: "../components/common.yaml#/responses/ProductError" }
  delete:
    operationId: removeFamilyBabyAvatar
    summary: A guardian removes the avatar
    parameters: [{ $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    responses:
      "200": { description: The baby, content: { application/json: { schema: { $ref: "../components/family.yaml#/schemas/FamilyBaby" } } } }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/family/babies/{babyId}/records:
  parameters: [{ $ref: "../components/family.yaml#/parameters/FamilyBabyID" }]
  get:
    operationId: listFamilyRecords
    summary: "A channel's records, most recently added first, 30 a page; only photos the reader can see, and photo records with none left are skipped"
    parameters:
      - { $ref: "../components/family.yaml#/parameters/FamilyCursor" }
      - { name: kind, in: query, required: false, schema: { type: string, enum: [photos, recording, journal, measurement, vaccine, milestone] } }
    responses:
      "200": { description: A page of records, content: { application/json: { schema: { $ref: "../components/family.yaml#/schemas/FamilyRecordPage" } } } }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "422": { $ref: "../components/common.yaml#/responses/ProductError" }
      "503": { $ref: "../components/common.yaml#/responses/ProductError" }
  post:
    operationId: addFamilyRecord
    summary: "Add a record. Photos and videos are uploaded to the shared library first and named here by asset ID"
    parameters: [{ $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    requestBody: { required: true, content: { application/json: { schema: { $ref: "../components/family.yaml#/schemas/FamilyRecordInput" } } } }
    responses:
      "201": { description: The record, content: { application/json: { schema: { $ref: "../components/family.yaml#/schemas/FamilyRecord" } } } }
      "400": { $ref: "../components/common.yaml#/responses/ProductError" }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "409": { $ref: "../components/common.yaml#/responses/ProductError" }
      "413": { $ref: "../components/common.yaml#/responses/ProductError" }
      "422": { $ref: "../components/common.yaml#/responses/ProductError" }
      "503": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/family/babies/{babyId}/recordings:
  post:
    operationId: addFamilyRecording
    summary: "Add a recording; the text fields come before the file, which is streamed to the store"
    parameters: [{ $ref: "../components/family.yaml#/parameters/FamilyBabyID" }, { $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              requestKey: { type: string, maxLength: 128 }
              title: { type: string, maxLength: 60 }
              occurredOn: { $ref: "../components/family.yaml#/schemas/FamilyDate" }
              file: { type: string, format: binary, description: "MP3, M4A/AAC, WAV, Ogg, WebM, FLAC, AMR or 3GPP audio; at most 200 MiB." }
    responses:
      "201": { description: The record, content: { application/json: { schema: { $ref: "../components/family.yaml#/schemas/FamilyRecord" } } } }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "409": { $ref: "../components/common.yaml#/responses/ProductError" }
      "413": { $ref: "../components/common.yaml#/responses/ProductError" }
      "415": { $ref: "../components/common.yaml#/responses/ProductError" }
      "422": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/family/babies/{babyId}/trash:
  get:
    operationId: listFamilyTrash
    summary: "A channel's recently deleted records the caller may restore: their own, or everyone's for a guardian"
    parameters: [{ $ref: "../components/family.yaml#/parameters/FamilyBabyID" }]
    responses:
      "200": { description: Deleted records, content: { application/json: { schema: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, items: { $ref: "../components/family.yaml#/schemas/FamilyRecord" } } } } } } }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "503": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/family/babies/{babyId}/album:
  get:
    operationId: getFamilyAlbum
    summary: "The cloud album: a channel's photos and videos the reader can see, newest taken first, with the month of life each was taken in"
    parameters: [{ $ref: "../components/family.yaml#/parameters/FamilyBabyID" }, { $ref: "../components/family.yaml#/parameters/FamilyCursor" }]
    responses:
      "200": { description: A page of the album, content: { application/json: { schema: { $ref: "../components/family.yaml#/schemas/FamilyAlbumPage" } } } }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "422": { $ref: "../components/common.yaml#/responses/ProductError" }
      "503": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/family/babies/{babyId}/growth:
  get:
    operationId: getFamilyGrowth
    summary: "成长记录: the measurements, the growth standard's curves for the baby's sex, and where the latest values lie"
    parameters: [{ $ref: "../components/family.yaml#/parameters/FamilyBabyID" }]
    responses:
      "200": { description: Growth, content: { application/json: { schema: { $ref: "../components/family.yaml#/schemas/FamilyGrowth" } } } }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/family/babies/{babyId}/vaccines:
  get:
    operationId: getFamilyVaccines
    summary: "The baby's vaccination schedule: the programme's doses and the planned ones, each with its status, and every dose recorded"
    parameters: [{ $ref: "../components/family.yaml#/parameters/FamilyBabyID" }]
    responses:
      "200": { description: The schedule, content: { application/json: { schema: { $ref: "../components/family.yaml#/schemas/FamilyVaccineSchedule" } } } }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "503": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/family/babies/{babyId}/vaccine-plan:
  put:
    operationId: setFamilyVaccinePlan
    summary: Choose the non-programme vaccines whose doses the schedule lists
    parameters: [{ $ref: "../components/family.yaml#/parameters/FamilyBabyID" }, { $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [codes], properties: { codes: { type: array, items: { type: string } } } } } } }
    responses:
      "200": { description: The schedule, content: { application/json: { schema: { $ref: "../components/family.yaml#/schemas/FamilyVaccineSchedule" } } } }
      "400": { $ref: "../components/common.yaml#/responses/ProductError" }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "422": { $ref: "../components/common.yaml#/responses/ProductError" }
      "503": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/family/babies/{babyId}/milestones:
  get:
    operationId: listFamilyMilestones
    summary: "大事记: milestones oldest first, the automatic ones (birth, 满月, 百天, birthdays) among them and the next one at the end"
    parameters: [{ $ref: "../components/family.yaml#/parameters/FamilyBabyID" }]
    responses:
      "200": { description: The timeline, content: { application/json: { schema: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, items: { $ref: "../components/family.yaml#/schemas/FamilyTimelineEntry" } } } } } } }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "503": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/family/babies/{babyId}/wall:
  parameters: [{ $ref: "../components/family.yaml#/parameters/FamilyBabyID" }]
  get:
    operationId: listFamilyWall
    summary: "The channel's message wall in 亲友团, newest first"
    responses:
      "200": { description: Messages, content: { application/json: { schema: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, items: { $ref: "../components/family.yaml#/schemas/FamilyComment" } } } } } } }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
  post:
    operationId: addFamilyWallMessage
    summary: Leave a message on the wall
    parameters: [{ $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    requestBody: { required: true, content: { application/json: { schema: { $ref: "../components/family.yaml#/schemas/FamilyCommentInput" } } } }
    responses:
      "201": { description: The message, content: { application/json: { schema: { $ref: "../components/family.yaml#/schemas/FamilyComment" } } } }
      "400": { $ref: "../components/common.yaml#/responses/ProductError" }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "422": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/family/records/{recordId}:
  parameters: [{ $ref: "../components/family.yaml#/parameters/FamilyRecordID" }]
  get:
    operationId: getFamilyRecord
    summary: One record that is not in the trash
    responses:
      "200": { description: The record, content: { application/json: { schema: { $ref: "../components/family.yaml#/schemas/FamilyRecord" } } } }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "503": { $ref: "../components/common.yaml#/responses/ProductError" }
  patch:
    operationId: updateFamilyRecord
    summary: "The author edits their record; changed when they edited it elsewhere first"
    parameters: [{ $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    requestBody: { required: true, content: { application/json: { schema: { $ref: "../components/family.yaml#/schemas/FamilyRecordInput" } } } }
    responses:
      "200": { description: The record, content: { application/json: { schema: { $ref: "../components/family.yaml#/schemas/FamilyRecord" } } } }
      "400": { $ref: "../components/common.yaml#/responses/ProductError" }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "409": { $ref: "../components/common.yaml#/responses/ProductError" }
      "422": { $ref: "../components/common.yaml#/responses/ProductError" }
      "503": { $ref: "../components/common.yaml#/responses/ProductError" }
  delete:
    operationId: deleteFamilyRecord
    summary: "Move a record into the channel's recent deletions for 15 days; authors delete their own, guardians anyone's. Photos stay in the shared library"
    parameters: [{ $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    responses:
      "204": { description: Deleted }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/family/records/{recordId}/restore:
  post:
    operationId: restoreFamilyRecord
    summary: Bring a deleted record back with its comments
    parameters: [{ $ref: "../components/family.yaml#/parameters/FamilyRecordID" }, { $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    responses:
      "200": { description: The record, content: { application/json: { schema: { $ref: "../components/family.yaml#/schemas/FamilyRecord" } } } }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "409": { $ref: "../components/common.yaml#/responses/ProductError" }
      "503": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/family/records/{recordId}/audio:
  get:
    operationId: getFamilyRecordingAudio
    summary: "Play a recording: as stored with Range, or converted to FLAC by the media worker for AMR and 3GPP, which cannot seek"
    parameters: [{ $ref: "../components/family.yaml#/parameters/FamilyRecordID" }]
    responses:
      "200": { description: The audio, content: { audio/*: { schema: { type: string, format: binary } } } }
      "206": { description: Part of the audio, content: { audio/*: { schema: { type: string, format: binary } } } }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "416": { description: The requested range is outside the recording }
