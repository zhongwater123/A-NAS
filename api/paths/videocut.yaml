# 剪辑中心 as Venus (docs/specs/venus.md, ADR 0041). The contract came first
# (#694): an operation VideoCut does not serve yet answers 501
# not_implemented, which each such operation declares until it is served
# (drop its 501 then), and the Web answers it from its MSW stand-ins
# (web/src/videocut/mocks) until it does. Served only while
# ANAS_VIDEOCUT_ENABLED is on; otherwise every path answers 404. A sample
# project's id works on every read; anything that changes it is
# sample_read_only (403).
/api/v1/videocut:
  get:
    operationId: getVideoCut
    summary: "Whether 剪辑中心 is on (ADR 0038): 204 while ANAS_VIDEOCUT_ENABLED is on, 404 while it is off. The desktop shows the app only while this answers 204"
    responses:
      "204": { description: VideoCut is on }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/videocut/catalog:
  get:
    operationId: getVideoCutCatalog
    summary: "The three songs VideoCut has, the aspects and styles a film can take, and what a new project starts with (M4)"
    responses:
      "200": { description: The catalog, content: { application/json: { schema: { $ref: "../components/videocut.yaml#/schemas/VideoCutCatalog" } } } }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "501": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/videocut/songs/{songId}/audio:
  get:
    operationId: getVideoCutCatalogSongAudio
    summary: "One of the catalog's songs, to listen to before choosing it (试听), with Range support"
    parameters:
      - { $ref: "../components/videocut.yaml#/parameters/VideoCutSongID" }
      - { name: Range, in: header, schema: { type: string } }
    responses:
      "200": { description: Audio content, content: { audio/*: { schema: { type: string, format: binary } } } }
      "206": { description: Partial audio content, content: { audio/*: { schema: { type: string, format: binary } } } }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "416": { description: The range is outside the song. }
      "501": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/videocut/projects:
  get:
    operationId: listVideoCutProjects
    summary: "The caller's projects, newest first, and last the sample every member has (M1-1)"
    responses:
      "200": { description: The projects, content: { application/json: { schema: { $ref: "../components/videocut.yaml#/schemas/VideoCutProjectList" } } } }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "503": { $ref: "../components/common.yaml#/responses/ProductError" }
      "501": { $ref: "../components/common.yaml#/responses/ProductError" }
  post:
    operationId: createVideoCutProject
    description: >-
      Make a project of the files the browser has (M2-2): their list only, no video (docs/specs/venus.md#本机文件).
      It is importing while a file of the list is not read yet, and pending once all are, with the catalog's defaults
      as its settings. The same requestKey again returns the same project (200); the key of another request is a
      conflict. The same file twice in the list counts once. More than 200 files is too_many_files (422), a file over
      4 GB file_too_large (422).
    parameters: [{ $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [requestKey, files]
            properties:
              requestKey: { $ref: "../components/videocut.yaml#/schemas/VideoCutRequestKey" }
              files: { type: array, minItems: 1, maxItems: 200, items: { $ref: "../components/videocut.yaml#/schemas/VideoCutLocalFile" } }
    responses:
      "200": { description: The project the same requestKey made before, content: { application/json: { schema: { $ref: "../components/videocut.yaml#/schemas/VideoCutProject" } } } }
      "201": { description: The new project, content: { application/json: { schema: { $ref: "../components/videocut.yaml#/schemas/VideoCutProject" } } } }
      "400": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "409": { $ref: "../components/common.yaml#/responses/ProductError" }
      "422": { $ref: "../components/common.yaml#/responses/ProductError" }
      "503": { $ref: "../components/common.yaml#/responses/ProductError" }
      "501": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/videocut/projects/{projectId}:
  get:
    operationId: getVideoCutProject
    summary: "One project: its state, progress, settings and list of files. Another member's project is not_found; so is an importing one the browser stopped reporting for (docs/specs/venus.md#网页报到)"
    parameters: [{ $ref: "../components/videocut.yaml#/parameters/VideoCutProjectID" }]
    responses:
      "200": { description: The project, content: { application/json: { schema: { $ref: "../components/videocut.yaml#/schemas/VideoCutProject" } } } }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "503": { $ref: "../components/common.yaml#/responses/ProductError" }
      "501": { $ref: "../components/common.yaml#/responses/ProductError" }
  delete:
    operationId: deleteVideoCutProject
    summary: "Delete the project, stopping its work first: its film, timeline, candidates, anchors and imported song go with it; the videos uploaded stay in the photo library (ADR 0041). The sample is sample_read_only (403)"
    parameters: [{ $ref: "../components/videocut.yaml#/parameters/VideoCutProjectID" }, { $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    responses:
      "204": { description: Deleted }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "501": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/videocut/projects/{projectId}/files:
  post:
    operationId: addVideoCutProjectFiles
    description: >-
      Add files to the list, or what the browser has read of files already in it, told by name, size and modification
      time: 继续选择 on the start page, and each file as it is read. Only while importing or pending (project_state,
      409); past 200 files is too_many_files (422).
    parameters: [{ $ref: "../components/videocut.yaml#/parameters/VideoCutProjectID" }, { $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [files]
            properties:
              files: { type: array, minItems: 1, maxItems: 200, items: { $ref: "../components/videocut.yaml#/schemas/VideoCutLocalFile" } }
    responses:
      "200": { description: The project, content: { application/json: { schema: { $ref: "../components/videocut.yaml#/schemas/VideoCutProject" } } } }
      "400": { $ref: "../components/common.yaml#/responses/ProductError" }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "409": { $ref: "../components/common.yaml#/responses/ProductError" }
      "422": { $ref: "../components/common.yaml#/responses/ProductError" }
      "501": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/videocut/projects/{projectId}/files/{fileId}:
  delete:
    operationId: deleteVideoCutProjectFile
    summary: "Take a file out of the list, while importing or pending (project_state, 409)"
    parameters:
      - { $ref: "../components/videocut.yaml#/parameters/VideoCutProjectID" }
      - { $ref: "../components/videocut.yaml#/parameters/VideoCutFileID" }
      - { $ref: "../components/common.yaml#/parameters/CSRFToken" }
    responses:
      "200": { description: The project, content: { application/json: { schema: { $ref: "../components/videocut.yaml#/schemas/VideoCutProject" } } } }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "409": { $ref: "../components/common.yaml#/responses/ProductError" }
      "501": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/videocut/projects/{projectId}/selection:
  patch:
    operationId: updateVideoCutSelection
    summary: "勾选 and 星标 (M3-3), saved as they change, while importing or pending (project_state, 409). A sixth star is too_many_stars (422), and changes nothing"
    parameters: [{ $ref: "../components/videocut.yaml#/parameters/VideoCutProjectID" }, { $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [files]
            properties:
              files:
                type: array
                minItems: 1
                maxItems: 200
                items:
                  type: object
                  additionalProperties: false
                  required: [fileId]
                  minProperties: 2
                  properties:
                    fileId: { type: string, minLength: 1 }
                    selected: { type: boolean }
                    starred: { type: boolean }
    responses:
      "200": { description: The project, content: { application/json: { schema: { $ref: "../components/videocut.yaml#/schemas/VideoCutProject" } } } }
      "400": { $ref: "../components/common.yaml#/responses/ProductError" }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "409": { $ref: "../components/common.yaml#/responses/ProductError" }
      "422": { $ref: "../components/common.yaml#/responses/ProductError" }
      "501": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/videocut/projects/{projectId}/settings:
  patch:
    operationId: updateVideoCutSettings
    summary: "The aspect, the style, or one of the catalog's songs (M4), saved as they change, while importing or pending (project_state, 409). An id the catalog does not have is validation_failed (400)"
    parameters: [{ $ref: "../components/videocut.yaml#/parameters/VideoCutProjectID" }, { $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            minProperties: 1
            properties:
              aspect: { type: string, minLength: 1 }
              style: { type: string, minLength: 1 }
              builtinSong: { type: string, minLength: 1, description: "A song of the catalog; songs of the music library and imported ones have their own operations." }
    responses:
      "200": { description: The project, content: { application/json: { schema: { $ref: "../components/videocut.yaml#/schemas/VideoCutProject" } } } }
      "400": { $ref: "../components/common.yaml#/responses/ProductError" }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "409": { $ref: "../components/common.yaml#/responses/ProductError" }
      "501": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/videocut/projects/{projectId}/song:
  put:
    operationId: putVideoCutSong
    description: >-
      Choose a track of the caller's music library as the project's song, while importing or pending. The Product
      Service opens the track through the File Broker as the caller and streams it to VideoCut, which keeps a copy and
      analyses it in the background. Another member's track answers not_found, as a missing one; one the caller may no
      longer open is forbidden (403). More than 100 MiB is song_too_large (413); shorter than 30 seconds or longer than
      8 minutes is song_length (422).
    parameters: [{ $ref: "../components/videocut.yaml#/parameters/VideoCutProjectID" }, { $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [trackId]
            properties:
              trackId: { type: string, minLength: 1, maxLength: 256, description: "A track of GET /api/v1/music/tracks." }
    responses:
      "200": { description: The project with the song, content: { application/json: { schema: { $ref: "../components/videocut.yaml#/schemas/VideoCutProject" } } } }
      "400": { $ref: "../components/common.yaml#/responses/ProductError" }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "409": { $ref: "../components/common.yaml#/responses/ProductError" }
      "413": { $ref: "../components/common.yaml#/responses/ProductError" }
      "422": { $ref: "../components/common.yaml#/responses/ProductError" }
      "503": { $ref: "../components/common.yaml#/responses/ProductError" }
      "501": { $ref: "../components/common.yaml#/responses/ProductError" }
  get:
    operationId: getVideoCutSongStructure
    summary: "The film's parts and slots as the project's song makes them, before the timeline is made (M5-1, M6-3, M6-4). A song still being analysed is song_not_ready (409)"
    parameters: [{ $ref: "../components/videocut.yaml#/parameters/VideoCutProjectID" }]
    responses:
      "200": { description: The song's structure, content: { application/json: { schema: { $ref: "../components/videocut.yaml#/schemas/VideoCutSongStructure" } } } }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "409": { $ref: "../components/common.yaml#/responses/ProductError" }
      "501": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/videocut/projects/{projectId}/song/import:
  post:
    operationId: importVideoCutSong
    summary: "Import a song file from the browser as the project's song (M4-1 导入), while importing or pending. Limits as for a track of the music library; a file with no audio is not_audio (422)"
    parameters:
      - { $ref: "../components/videocut.yaml#/parameters/VideoCutProjectID" }
      - { $ref: "../components/common.yaml#/parameters/CSRFToken" }
      - { name: name, in: query, required: true, description: "The file's name, for the song's title.", schema: { type: string, minLength: 1, maxLength: 255 } }
    requestBody:
      required: true
      content:
        application/octet-stream: { schema: { type: string, format: binary } }
    responses:
      "200": { description: The project with the song, content: { application/json: { schema: { $ref: "../components/videocut.yaml#/schemas/VideoCutProject" } } } }
      "400": { $ref: "../components/common.yaml#/responses/ProductError" }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "409": { $ref: "../components/common.yaml#/responses/ProductError" }
      "413": { $ref: "../components/common.yaml#/responses/ProductError" }
      "422": { $ref: "../components/common.yaml#/responses/ProductError" }
      "501": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/videocut/projects/{projectId}/song/audio:
  get:
    operationId: getVideoCutSongAudio
    summary: "The project's song, to listen to and for the film page's preview, with Range support"
    parameters:
      - { $ref: "../components/videocut.yaml#/parameters/VideoCutProjectID" }
      - { name: Range, in: header, schema: { type: string } }
    responses:
      "200": { description: Audio content, content: { audio/*: { schema: { type: string, format: binary } } } }
      "206": { description: Partial audio content, content: { audio/*: { schema: { type: string, format: binary } } } }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "416": { description: The range is outside the song. }
      "501": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/videocut/projects/{projectId}/heartbeat:
  post:
    operationId: reportVideoCutProject
    description: >-
      报到: the page that has an importing or uploading project open says so every 30 seconds
      (docs/specs/venus.md#网页报到). An importing project two minutes without it is dropped; an uploading one two
      minutes without it or an upload becomes upload_interrupted. Other states take it and change nothing.
    parameters: [{ $ref: "../components/videocut.yaml#/parameters/VideoCutProjectID" }, { $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    responses:
      "204": { description: Noted }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "501": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/videocut/projects/{projectId}/generate:
  post:
    operationId: generateVideoCutFilm
    description: >-
      开始生成 (M4-5): take a snapshot of the settings and start uploading the selected files; the project is
      uploading. Only while pending (project_state, 409), with a file selected (nothing_selected, 422) and a song that
      is not unusable (song_unusable, 422); a song still being analysed does not wait. The same requestKey again
      returns the project (200).
    parameters: [{ $ref: "../components/videocut.yaml#/parameters/VideoCutProjectID" }, { $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [requestKey]
            properties:
              requestKey: { $ref: "../components/videocut.yaml#/schemas/VideoCutRequestKey" }
    responses:
      "200": { description: The project, content: { application/json: { schema: { $ref: "../components/videocut.yaml#/schemas/VideoCutProject" } } } }
      "400": { $ref: "../components/common.yaml#/responses/ProductError" }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "409": { $ref: "../components/common.yaml#/responses/ProductError" }
      "422": { $ref: "../components/common.yaml#/responses/ProductError" }
      "503": { $ref: "../components/common.yaml#/responses/ProductError" }
      "501": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/videocut/projects/{projectId}/resume:
  post:
    operationId: resumeVideoCutUpload
    summary: "Go on uploading an upload_interrupted project once its files are chosen again; it is uploading again. Other states are project_state (409)"
    parameters: [{ $ref: "../components/videocut.yaml#/parameters/VideoCutProjectID" }, { $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    responses:
      "200": { description: The project, content: { application/json: { schema: { $ref: "../components/videocut.yaml#/schemas/VideoCutProject" } } } }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "409": { $ref: "../components/common.yaml#/responses/ProductError" }
      "501": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/videocut/projects/{projectId}/retry:
  post:
    operationId: retryVideoCutProject
    summary: "Go back to the step a failed project failed at. Other states are project_state (409); a fourth retry is too_many_retries (409)"
    parameters: [{ $ref: "../components/videocut.yaml#/parameters/VideoCutProjectID" }, { $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    responses:
      "200": { description: The project, content: { application/json: { schema: { $ref: "../components/videocut.yaml#/schemas/VideoCutProject" } } } }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "409": { $ref: "../components/common.yaml#/responses/ProductError" }
      "503": { $ref: "../components/common.yaml#/responses/ProductError" }
      "501": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/videocut/projects/{projectId}/assets:
  get:
    operationId: listVideoCutProjectAssets
    summary: "The project's videos in the photo library and how their analysis stands: 添加素材 · 已导入素材 (M7-4) lists the analysed ones"
    parameters: [{ $ref: "../components/videocut.yaml#/parameters/VideoCutProjectID" }]
    responses:
      "200": { description: The videos, content: { application/json: { schema: { $ref: "../components/videocut.yaml#/schemas/VideoCutProjectAssets" } } } }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "503": { $ref: "../components/common.yaml#/responses/ProductError" }
      "501": { $ref: "../components/common.yaml#/responses/ProductError" }
  post:
    operationId: addVideoCutProjectAsset
    description: >-
      Give the project a video the browser uploaded to the caller's photo library, and start its analysis. With fileId
      it is that file of the list, while uploading (project_state, 409); without, a video added on the film page
      (M7-4), while ready or exported, which the page puts in a slot with a place edit once analysed. The same
      requestKey again changes nothing more. A video the caller cannot see is assets_unavailable (422).
    parameters: [{ $ref: "../components/videocut.yaml#/parameters/VideoCutProjectID" }, { $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [requestKey, assetId]
            properties:
              requestKey: { $ref: "../components/videocut.yaml#/schemas/VideoCutRequestKey" }
              assetId: { type: string, minLength: 1, maxLength: 64 }
              fileId: { type: string, minLength: 1 }
    responses:
      "200": { description: The video, content: { application/json: { schema: { $ref: "../components/videocut.yaml#/schemas/VideoCutProjectAsset" } } } }
      "400": { $ref: "../components/common.yaml#/responses/ProductError" }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "409": { $ref: "../components/common.yaml#/responses/ProductError" }
      "422": { $ref: "../components/common.yaml#/responses/ProductError" }
      "503": { $ref: "../components/common.yaml#/responses/ProductError" }
      "501": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/videocut/projects/{projectId}/assets/{assetId}/proxy:
  get:
    operationId: getVideoCutProxy
    summary: "The video's proxy, for the film page's preview, which plays the shots' proxies one after another, with Range support"
    parameters:
      - { $ref: "../components/videocut.yaml#/parameters/VideoCutProjectID" }
      - { $ref: "../components/videocut.yaml#/parameters/VideoCutAssetID" }
      - { name: Range, in: header, schema: { type: string } }
    responses:
      "200": { description: The proxy, content: { video/mp4: { schema: { type: string, format: binary } } } }
      "206": { description: Part of the proxy, content: { video/mp4: { schema: { type: string, format: binary } } } }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "416": { description: The range is outside the proxy. }
      "503": { $ref: "../components/common.yaml#/responses/ProductError" }
      "501": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/videocut/projects/{projectId}/assets/{assetId}/frame:
  get:
    operationId: getVideoCutFrame
    summary: "A frame of one of the project's videos, a JPEG 320 on its longer side, for shot cards and candidates; the browser keeps it"
    parameters:
      - { $ref: "../components/videocut.yaml#/parameters/VideoCutProjectID" }
      - { $ref: "../components/videocut.yaml#/parameters/VideoCutAssetID" }
      - { name: t, in: query, required: true, description: Milliseconds into the video., schema: { type: integer, minimum: 0, maximum: 2147483647 } }
    responses:
      "200": { description: The frame, content: { image/jpeg: { schema: { type: string, format: binary } } } }
      "400": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "503": { $ref: "../components/common.yaml#/responses/ProductError" }
      "501": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/videocut/projects/{projectId}/timeline:
  get:
    operationId: getVideoCutTimeline
    summary: "The film as it is: its parts, one shot a slot, its revision and whether one step can be undone. A project whose film is not made yet is project_state (409)"
    parameters: [{ $ref: "../components/videocut.yaml#/parameters/VideoCutProjectID" }]
    responses:
      "200": { description: The timeline, content: { application/json: { schema: { $ref: "../components/videocut.yaml#/schemas/VideoCutTimeline" } } } }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "409": { $ref: "../components/common.yaml#/responses/ProductError" }
      "501": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/videocut/projects/{projectId}/timeline/edits:
  post:
    operationId: editVideoCutTimeline
    description: >-
      One edit, made on baseRevision, at once (docs/specs/venus.md#镜头操作). A timeline that moved on since, as when
      another tab changed it, answers timeline_conflict (409) and changes nothing: read it again. A project that is not
      ready or exported is project_state (409): exporting reads only. An edit the rules do not allow answers
      edit_refused (422) with the reason to show, such as no candidate left to delete with.
    parameters: [{ $ref: "../components/videocut.yaml#/parameters/VideoCutProjectID" }, { $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [baseRevision, edit]
            properties:
              baseRevision: { type: integer, minimum: 1 }
              edit: { $ref: "../components/videocut.yaml#/schemas/VideoCutEdit" }
    responses:
      "200": { description: The timeline after the edit, content: { application/json: { schema: { $ref: "../components/videocut.yaml#/schemas/VideoCutTimeline" } } } }
      "400": { $ref: "../components/common.yaml#/responses/ProductError" }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "409": { $ref: "../components/common.yaml#/responses/ProductError" }
      "422": { $ref: "../components/common.yaml#/responses/ProductError" }
      "503": { $ref: "../components/common.yaml#/responses/ProductError" }
      "501": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/videocut/projects/{projectId}/timeline/undo:
  post:
    operationId: undoVideoCutTimeline
    summary: "Undo the last edit (M6-5), made on baseRevision; its anchors go with it. Nothing to undo is nothing_to_undo (409); conflicts and states as for an edit"
    parameters: [{ $ref: "../components/videocut.yaml#/parameters/VideoCutProjectID" }, { $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [baseRevision]
            properties:
              baseRevision: { type: integer, minimum: 1 }
    responses:
      "200": { description: The timeline after undoing, content: { application/json: { schema: { $ref: "../components/videocut.yaml#/schemas/VideoCutTimeline" } } } }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "409": { $ref: "../components/common.yaml#/responses/ProductError" }
      "501": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/videocut/projects/{projectId}/slots/{slot}/candidates:
  get:
    operationId: listVideoCutCandidates
    summary: "The slot's candidates, at most six (M7-1): none already in the film, of another orientation, or of the same video as a shot beside it"
    parameters: [{ $ref: "../components/videocut.yaml#/parameters/VideoCutProjectID" }, { $ref: "../components/videocut.yaml#/parameters/VideoCutSlot" }]
    responses:
      "200": { description: The candidates, content: { application/json: { schema: { $ref: "../components/videocut.yaml#/schemas/VideoCutCandidates" } } } }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "409": { $ref: "../components/common.yaml#/responses/ProductError" }
      "501": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/videocut/assistant:
  get:
    operationId: getVideoCutAssistant
    summary: "Whether the assistant can search the caller's videos now (M8)"
    responses:
      "200": { description: What works, content: { application/json: { schema: { $ref: "../components/videocut.yaml#/schemas/VideoCutAssistantStatus" } } } }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "501": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/videocut/projects/{projectId}/assistant:
  post:
    operationId: askVideoCutAssistant
    description: >-
      One sentence to the assistant (M8): a search of the project's videos, answered with groups of beats to put in a
      slot, or a question, answered in words. With slot it is about that shot, as from the box under 这一镜 (M8-2,
      M8-3). Nothing changes until the page makes an edit. Searching that does not work now is search_unavailable
      (503).
    parameters: [{ $ref: "../components/videocut.yaml#/parameters/VideoCutProjectID" }, { $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [text]
            properties:
              text: { type: string, minLength: 1, maxLength: 500 }
              slot: { type: integer, minimum: 1 }
    responses:
      "200": { description: The reply, content: { application/json: { schema: { $ref: "../components/videocut.yaml#/schemas/VideoCutAssistantReply" } } } }
      "400": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "409": { $ref: "../components/common.yaml#/responses/ProductError" }
      "503": { $ref: "../components/common.yaml#/responses/ProductError" }
      "501": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/videocut/projects/{projectId}/export:
  post:
    operationId: exportVideoCutFilm
    description: >-
      导出 (M9-1): render the timeline as it is at 1080p; the project is exporting and reads only until it is
      exported, or ready again with exportFailure. The new file takes the place of the last one. Only while ready or
      exported (project_state, 409); the same requestKey again returns the project (200).
    parameters: [{ $ref: "../components/videocut.yaml#/parameters/VideoCutProjectID" }, { $ref: "../components/common.yaml#/parameters/CSRFToken" }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [requestKey]
            properties:
              requestKey: { $ref: "../components/videocut.yaml#/schemas/VideoCutRequestKey" }
    responses:
      "200": { description: The project, content: { application/json: { schema: { $ref: "../components/videocut.yaml#/schemas/VideoCutProject" } } } }
      "400": { $ref: "../components/common.yaml#/responses/ProductError" }
      "403": { $ref: "../components/common.yaml#/responses/ProductError" }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "409": { $ref: "../components/common.yaml#/responses/ProductError" }
      "503": { $ref: "../components/common.yaml#/responses/ProductError" }
      "501": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/videocut/projects/{projectId}/film:
  get:
    operationId: getVideoCutFilm
    summary: "The exported film, to download, with Range support. Before the first export it is not_found"
    parameters:
      - { $ref: "../components/videocut.yaml#/parameters/VideoCutProjectID" }
      - { name: Range, in: header, schema: { type: string } }
    responses:
      "200":
        description: The film
        headers: { Content-Disposition: { description: "attachment, named by the project.", schema: { type: string } } }
        content: { video/mp4: { schema: { type: string, format: binary } } }
      "206": { description: Part of the film, content: { video/mp4: { schema: { type: string, format: binary } } } }
      "404": { $ref: "../components/common.yaml#/responses/ProductError" }
      "416": { description: The range is outside the film. }
      "501": { $ref: "../components/common.yaml#/responses/ProductError" }
/api/v1/videocut/notices:
  get:
    operationId: listVideoCutNotices
    summary: "The desktop's notices of the caller's jobs: waiting for VNAS to plan them (with why, when there is a reason), being planned by a round of VNAS, needing the member, and films saved or jobs failed in the last day"
    responses:
      "200": { description: "The notices, newest first", content: { application/json: { schema: { $ref: "../components/videocut.yaml#/schemas/VideoCutNotices" } } } }
