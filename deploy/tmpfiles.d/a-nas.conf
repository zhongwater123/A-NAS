# Directories and links of the a-nas package (ADR 0034). systemd-tmpfiles
# applies them at boot and the package after it installs, so the result never
# depends on a package script.
#
# The Product Service's state; the Host Agent's own records (issue #176).
d /var/lib/a-nas 0700 a-nas a-nas -
d /var/lib/a-nas/screensavers 0750 root a-nas -
d /var/lib/a-nas-host 0700 root root -
# Configuration the administrator writes, and A-NAS's generated secrets.
d /etc/a-nas 0750 root a-nas -
# The data volume's mount point. Once the volume is mounted the Host Agent
# owns its root, so tmpfiles sets these only when it creates them.
d /srv/a-nas :0750 :root :a-nas -
d /srv/a-nas/data :0750 :root :a-nas -
# The share service's bridge socket inherits the shares-only group (setgid).
d /run/a-nas-share-files 2750 a-nas a-nas-shares -
# All clients of the FFmpeg worker share these eight read-only flock slots.
d /run/a-nas-ffmpeg 0755 root root -
d /run/a-nas-ffmpeg/slots 0750 root a-nas-photos -
f /run/a-nas-ffmpeg/slots/0 0440 root a-nas-photos -
f /run/a-nas-ffmpeg/slots/1 0440 root a-nas-photos -
f /run/a-nas-ffmpeg/slots/2 0440 root a-nas-photos -
f /run/a-nas-ffmpeg/slots/3 0440 root a-nas-photos -
f /run/a-nas-ffmpeg/slots/4 0440 root a-nas-photos -
f /run/a-nas-ffmpeg/slots/5 0440 root a-nas-photos -
f /run/a-nas-ffmpeg/slots/6 0440 root a-nas-photos -
f /run/a-nas-ffmpeg/slots/7 0440 root a-nas-photos -
# The local console reads its Chromium policy and PAM stack from /etc only;
# both stay in /usr, linked from there.
d /etc/chromium/policies/managed 0755 root root -
L+ /etc/chromium/policies/managed/a-nas.json - - - - /usr/share/a-nas/chromium-policy.json
L+ /etc/pam.d/a-nas-kiosk - - - - /usr/share/a-nas/pam/a-nas-kiosk
