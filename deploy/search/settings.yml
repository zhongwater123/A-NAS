# SearXNG's settings for A-NAS web search (ADR 0030, docs/specs/web-search.md).
# The installer copies this file into the release, read-only; nothing on the
# NAS changes it. Only the Product Service reaches the service, through its
# Unix socket: it reads the loaded engines from /config and asks for each
# tab's engines by name, which SearXNG answers whether or not an engine is
# among its own defaults.
use_default_settings:
  engines:
    # Every engine SearXNG ships is loaded, answering or not, except these
    # (docs/research/web-search-engines.md):
    remove:
      # They need an API key or token, which A-NAS does not ask for (ADR 0030).
      - "astrophysics data system"
      - azure
      - braveapi
      - cloudflareai
      - core.ac.uk
      - deepl
      - exaapi
      - flickr_api
      - freesound
      - "github code"
      - jina
      - marginalia
      - "springer nature"
      - wolframalpha_api
      - "yandex api"
      - youtube_api
      # They search .onion sites, which only Tor reaches.
      - ahmia
      - torch
      # They search a service of one's own that A-NAS does not run.
      - "Torznab EZTV"
      - elasticsearch

general:
  instance_name: "A-NAS"

ui:
  # The Product Service reads why an engine gave no results, such as
  # "CAPTCHA" or "access denied", in English (internal/websearch/pace.go).
  default_locale: "en"

search:
  # Moderate, where an engine supports it.
  safe_search: 1
  autocomplete: ""
  # The Product Service reads JSON; SearXNG's own pages are not offered.
  formats:
    - json
  # An engine that times out or fails to connect sits out the next five
  # seconds, SearXNG's default. SearXNG judges each engine on its own, and a
  # moment when SearXNG itself is starved or the NAS's network is down fails
  # every engine at once: at five minutes, such a moment left the whole web
  # tab out for five minutes (docs/investigations/
  # 2026-11-04-web-engines-suspended-after-one-bad-moment.md). The Product
  # Service shows each engine's results as they come and asks each engine at
  # a person's pace, so an engine that never answers costs only the wait for
  # its timeout.
  ban_time_on_fail: 5
  max_ban_time_on_fail: 5
  # A-NAS owns visible, persistent website pauses (one hour to one day).
  # Disable every challenge-specific default, including Cloudflare's 15 days.
  suspended_times:
    SearxEngineAccessDenied: 0
    SearxEngineCaptcha: 0
    SearxEngineTooManyRequests: 0
    cf_SearxEngineCaptcha: 0
    cf_SearxEngineAccessDenied: 0
    recaptcha_SearxEngineCaptcha: 0

server:
  # The secret comes from SEARXNG_SECRET, which the installer generates once
  # and keeps in /etc/a-nas/search.env; it also signs thumbnail addresses.
  limiter: false
  public_instance: false
  image_proxy: true
  method: "POST"

valkey:
  url: false

outgoing:
  request_timeout: 5.0
  max_request_timeout: 10.0

# This list replaces SearXNG's own (searx/settings_loader.py): a plugin not
# named here is not loaded. The tracker URL remover is left out because it
# downloads its rules from a CDN at every start.
plugins:
  searx.plugins.calculator.SXNGPlugin:
    active: true
  searx.plugins.unit_converter.SXNGPlugin:
    active: true
  searx.plugins.time_zone.SXNGPlugin:
    active: true
  searx.plugins.hash_plugin.SXNGPlugin:
    active: true

