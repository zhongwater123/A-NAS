# A-NAS: Docker takes its networks from the address pool that
# /etc/docker/daemon.json gives it (docs/adr/0013). Until the administrator
# writes that file (docs/runbooks/install-container-agent.md), neither
# docker.service nor docker.socket starts. Docker's default pools can overlap
# the networks of the LAN's clients, and their routes would then cut those
# clients off (docs/investigations/2026-10-09-app-network-cut-off-wifi-clients.md).
[Unit]
ConditionPathExists=/etc/docker/daemon.json
