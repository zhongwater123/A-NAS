# The local console's account (anas-kiosk@.service, issue #174), which runs
# Cage and Chromium and nothing else. systemd-sysusers gives it no password,
# and its shell and home leave SSH nothing to accept: no login shell, and no
# home to hold an authorized key. Its unit sets HOME to its state directory.
u a-nas-kiosk - "A-NAS local console" /nonexistent /usr/sbin/nologin
