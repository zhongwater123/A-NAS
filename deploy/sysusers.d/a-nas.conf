# The A-NAS service accounts (ADR 0034), made by systemd-sysusers from the
# a-nas package, at boot as well, so the result never depends on a package
# script. sysusers leaves an existing account as it is; a-nas-check reports
# one whose IDs differ from these.
#
# The Product Service; its group reaches the Host Agent's socket.
u a-nas - "A-NAS Product Service" /var/lib/a-nas /usr/sbin/nologin
# The photo, share and family services own their stores on the data volume
# under fixed IDs, so a reinstalled system disk owns the same files again
# (ADR 0011, ADR 0023, ADR 0029).
u a-nas-photos 31000 "A-NAS photo service" /nonexistent /usr/sbin/nologin
u a-nas-shares 31001 "A-NAS share service" /nonexistent /usr/sbin/nologin
u a-nas-family 31002 "A-NAS family service" /nonexistent /usr/sbin/nologin
# The container agent, which its runbook turns on with Docker
# (docs/runbooks/install-container-agent.md); the Product Service joins its
# group to reach the agent's socket.
u anas-container - "A-NAS container agent" /nonexistent /usr/sbin/nologin
m a-nas anas-container
# Removable modules (ADR 0037) install with their own scripts. The Product
# Service reaches their sockets through a-nas-modules, and module units reach
# the Host Agent's session lookup through a-nas-module-sessions, which only
# they are granted. Neither group owns files, so their IDs may differ.
g a-nas-modules -
g a-nas-module-sessions -
