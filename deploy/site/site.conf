# /etc/a-nas/site.conf: this machine's settings (ADR 0034). The a-nas package
# never writes it; its defaults are in /usr. After a change, run a-nas-site.
# One KEY=VALUE per line; a value is not quoted.

# The network interface Samba serves the LAN on, such as enp2s0. smbd starts
# once it has an IPv4 address.
#ANAS_SMB_INTERFACE=

# The local console's output, rotation (0, 90, 180 or 270) and scale
# (docs/runbooks/operate-local-kiosk.md).
#ANAS_KIOSK_OUTPUT=
#ANAS_KIOSK_TRANSFORM=
#ANAS_KIOSK_SCALE=

# The administrator terminal stays off until the device's operator turns it
# on (docs/runbooks/enable-admin-terminal.md).
#ANAS_TERMINAL=enabled

# App Center: agent once the container agent runs
# (docs/runbooks/install-container-agent.md).
#ANAS_CONTAINERS_MODE=agent

# The directory a development machine pushes the signed repository into, such
# as the staging account's apps/a-nas/repository; the system update service
# takes it from there (docs/specs/system-update.md). Not set: no pushes.
#ANAS_UPDATE_STAGING=/home/anas-dev/apps/a-nas/repository
