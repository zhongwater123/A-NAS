# The A-NAS device image (ADR 0034 decision 2, step 5): Debian 13 with a
# release's a-nas-host and a-nas-console and what they depend on, two /usr
# slots that systemd-sysupdate writes in turn, a persistent root for /etc and
# /var, and systemd-boot with a UKI per version. The product and its content
# are system extensions beside it. scripts/build-image.sh runs mkosi with the
# version and the release's packages (docs/runbooks/build-device-image.md).

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
# Firmware and microcode for the device's hardware.
Repositories=main,non-free-firmware

[Output]
ImageId=a-nas
Format=disk
SplitArtifacts=uki,partitions

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=yes
UnifiedKernelImageFormat=a-nas_%v
# Each version's UKI mounts its own /usr slot by label; the persistent root
# keeps /etc and /var across updates. panic= lets a kernel that dies reboot
# into systemd-boot, which then counts the failed try. The serial console is
# for machines that have one, such as the test VM; tty0 stays the console.
KernelCommandLine=root=PARTLABEL=a-nas-state rw
                  mount.usr=PARTLABEL=a-nas_%v mount.usrfstype=erofs mount.usrflags=ro
                  panic=10 console=ttyS0,115200 console=tty0
# dpkg's records stay as the first image left them on the persistent root;
# nothing on the device reads them (deploy/site/a-nas-check.sh).
Packages=linux-image-amd64
         systemd
         systemd-sysv
         systemd-boot
         # The UKI stub (linuxx64.efi.stub).
         systemd-boot-efi
         # systemd-sysupdate and systemd-pull, and gpg, with which it checks
         # the signature of SHA256SUMS.
         systemd-container
         gpg
         systemd-resolved
         systemd-timesyncd
         udev
         dbus
         ca-certificates
         openssh-server
         dosfstools
         e2fsprogs
         kmod
         less
         # Firmware and microcode: the Experimental NAS is an Intel B760 board.
         intel-microcode
         firmware-misc-nonfree
         firmware-realtek
         # What the release needs from Debian and upstream (ADR 0031): the
         # release's own packages, from the directory build-image.sh gives
         # as --package-directory.
         a-nas-host
         a-nas-console
