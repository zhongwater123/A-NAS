# The image holds no SSH host keys (mkosi.finalize): each device makes its
# own whenever they are missing, not only on its first boot. An empty
# assignment drops the unit's conditions, so the others are given again.
[Unit]
ConditionFirstBoot=
ConditionPathIsReadWrite=/etc/ssh
ConditionPathIsSymbolicLink=!/etc/ssh
ConditionPathExists=!/etc/ssh/ssh_host_ed25519_key
