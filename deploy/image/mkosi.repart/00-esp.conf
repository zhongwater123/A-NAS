# systemd-boot and each version's UKI. Two UKIs of about 136 MiB and the
# temporary file systemd-sysupdate writes beside them filled 512 MiB in the
# step 3 verification (docs/research/sysupdate-image-verification.md).
[Partition]
Type=esp
Label=esp
Format=vfat
CopyFiles=/efi:/
CopyFiles=/boot:/
SizeMinBytes=1G
SizeMaxBytes=1G
