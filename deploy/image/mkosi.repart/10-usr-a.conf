# The /usr slot the image is built with; systemd-sysupdate writes the next
# version into the other slot, so both have the same fixed size. The step 3
# image filled most of a 3 GiB slot.
[Partition]
Type=usr
Label=a-nas_%A
CopyFiles=/usr:/
Format=erofs
Compression=lz4hc
SizeMinBytes=4G
SizeMaxBytes=4G
SplitName=usr
ReadOnly=yes
