# The persistent root: /etc and /var, with /var/lib/a-nas and the system
# extensions, stay when the device switches /usr slots. /usr is only its mount
# point. The image's root holds the first product and content; on the device
# it grows to the end of the disk at the first boot
# (/usr/lib/repart.d/40-root.conf).
[Partition]
Type=root
Label=a-nas-state
Format=ext4
CopyFiles=/:/
ExcludeFiles=/usr/
ExcludeFiles=/efi/
ExcludeFiles=/boot/
SizeMinBytes=12G
# The partition's grow-file-system flag: once systemd-repart has grown the
# partition, systemd-growfs grows the ext4 to it when it is mounted.
GrowFileSystem=yes
