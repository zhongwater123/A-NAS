# The device image of the ADR 0034 step 3 verification (docs/research/
# sysupdate-image-verification.md): Debian 13 with the a-nas-host and
# a-nas-console dependencies, two /usr slots, a persistent root for /etc and
# /var, systemd-boot and a UKI per version. verify.sh sets the version.

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64

[Output]
ImageId=a-nas
Format=disk
SplitArtifacts=uki,partitions

[Build]
Incremental=yes

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=yes
UnifiedKernelImageFormat=a-nas_%v
# Each version's UKI mounts its own /usr slot by label; the persistent root
# keeps /etc and /var across updates. panic= lets a kernel that dies reboot
# into systemd-boot, which then counts the failed try.
KernelCommandLine=root=PARTLABEL=a-nas-state rw
                  mount.usr=PARTLABEL=a-nas_%v mount.usrfstype=erofs mount.usrflags=ro
                  console=ttyS0 panic=10
Packages=linux-image-amd64
         systemd
         systemd-sysv
         systemd-boot
         # systemd-boot pulls in only the signed boot loader; the UKI stub
         # (linuxx64.efi.stub) is in this package.
         systemd-boot-efi
         systemd-container
         systemd-resolved
         udev
         dbus
         openssh-server
         gpg
         ca-certificates
         e2fsprogs
         iproute2
         kmod
# What deploy/debian/a-nas-host and a-nas-console depend on, so the image
# and its download are the size of a real device's.
Packages=acl
         btrfs-progs
         parted
         smartmontools
         samba
         python3
         ffmpeg
         heif-thumbnailer
         libheif-plugin-libde265
         libegl1
         libgles2
         libgomp1
         libssl3t64
         cage
         chromium
         chromium-sandbox
         chromium-l10n
         fonts-noto-cjk
         wlr-randr
         libinput-tools
         intel-media-va-driver
         vainfo
