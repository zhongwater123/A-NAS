  # VideoCut's planning tools (docs/architecture/videocut-planning-session.md):
  # only in the policy of a member's planning instance, which gives the model these
  # tools with memory and skills and nothing else (HERMES_TUI_TOOLSETS). trust: full,
  # for no one is there to approve a call: root's planner refuses every approval the
  # planning asks for; VideoCut checks every answer.
  videocut:
    command: /usr/lib/a-nas/assistant/runtime/venv/bin/python
    args: [/usr/lib/a-nas/assistant/anas_videocut_mcp.py]
    trust: full
    enabled: true
    lazy: false
    timeout: 120
    tools:
      prompts: false
      resources: false
