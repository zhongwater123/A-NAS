// ---------- 3 edit ----------
// text → picture search: EmbeddingGemma 2 in the anas VM (search.py); a beat scores as its best 2 s window
const SEARCH = "search";   // same origin: http-server --proxy hands /search to search.py
const RESULTS = 30;
const searched = new Map();
async function vectorScores(q) {
  if (!searched.has(q)) {
    const began = performance.now();
    const ask = fetch(`${SEARCH}?q=${encodeURIComponent(q)}`)
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(body => ({ scores: body.scores, seconds: (performance.now() - began) / 1000 }));
    searched.set(q, ask);
    ask.catch(() => searched.delete(q));
  }
  return searched.get(q);
}
function levelAt(t) {
  const p = D.song.parts.find(p => t >= p.start - 0.01 && t < p.end - 0.01) || D.song.parts[D.song.parts.length - 1];
  return p.label === "build" ? "build" : p.level;
}
// where a beat's piece starts in its video for a slot of this length: around its key frame, inside the card
function pieceFor(card, beat, len) {
  let start = Math.max(beat.start, beat.key - len / 2);
  start = Math.min(start, card.end - len);
  start = Math.max(start, card.start);
  return { start, end: Math.min(card.end, start + len), short: card.end - card.start < len - 0.05 };
}

// A film's edits, kept per viewer: replaced shots by music slot, and deleted slots with what covers them —
// the shot before or after drawn out over the gap, or the cuts after it pulled earlier off the bar lines.
const FILLED = { prev: "前一镜延长", next: "后一镜延长", ripple: "放弃踩点，后面提前" };
const editsOf = film => ({ edits: store.get("edits:" + film.tag, {}), removed: store.get("removed:" + film.tag, {}) });
// the shots left, in order, with their times in the film: {i: music slot, a, b, pick}
function layoutOf(film, edits, removed) {
  const out = [];
  let shift = 0, pend = 0;
  film.slots.forEach((s, i) => {
    const len = s.slot[1] - s.slot[0], r = removed[i];
    if (r && r.by === "ripple") { shift += len; return; }
    if (r && r.by === "prev" && out.length) { out[out.length - 1].b += len; return; }
    if (r) { pend += len; return; }                          // covered by the shot after it
    out.push({ i, a: s.slot[0] - shift - pend, b: s.slot[1] - shift, pick: edits[i] || { card: s.card, beat: s.beat } });
    pend = 0;
  });
  return out;
}
async function likeness(of, to) {
  const key = p => `${p.card}/${p.beat}`;
  const r = await fetch(`likeness?of=${encodeURIComponent(key(of))}${to.map(p => "&to=" + encodeURIComponent(key(p))).join("")}`);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const { scores } = await r.json();
  return to.map(p => scores[key(p)]);
}

function editPage(fi) {
  const film = D.films[fi];
  let { edits, removed } = editsOf(film);
  let L = [];                               // the shots as laid out now
  let sel = 0, open = false;                // the selected music slot, and whether its card's beats are spread out under its part
  let preview = null;                       // {card, beat} on show in the viewer, not yet in the film
  let size = "", across = false, query = "";
  let dropped = 0;                          // when the last drag ended
  const undo = [];                          // snapshots before each change, for the toast's 撤销
  let locked = new Set(store.get("locked:" + film.tag, []));   // music slots kept as they are when the rest is reshuffled

  const relayout = () => { L = layoutOf(film, edits, removed); if (!L.some(s => s.i === sel)) sel = L[0].i; };
  const shotOf = i => L.find(s => s.i === i);
  const numOf = i => L.findIndex(s => s.i === i) + 1;
  const lenOf = i => { const s = shotOf(i); return s.b - s.a; };
  const now = i => shotOf(i).pick;
  const usedBy = (cid, n, except) => { const k = L.findIndex(s => s.i !== except && s.pick.card === cid && s.pick.beat === n); return k + 1; };
  const save = () => { store.set("edits:" + film.tag, edits); store.set("removed:" + film.tag, removed); store.set("locked:" + film.tag, [...locked]); };
  const remember = () => { undo.push(JSON.stringify({ edits, removed, sel, locked: [...locked] })); if (undo.length > 30) undo.shift(); };
  const back = () => {
    const was = JSON.parse(undo.pop());
    edits = was.edits; removed = was.removed; sel = was.sel; locked = new Set(was.locked); preview = null;
    save(); relayout(); drawTiles(); refreshSide(); toast("已撤销");
  };
  const pickOf = el => ({ card: el.dataset.card, beat: +el.dataset.beat });

  $("#app").innerHTML = `
    <div class="editbar">
      <a class="btn small ghost" href="#/choose">${ICON.back}换一版</a>
      <h1>${NAMES[fi]}<span style="color:var(--faint);font-weight:500"> · 精修镜头</span></h1>
      <span class="grow"></span>
      <span class="tag" id="count"></span>
      <button class="btn small" id="shuffle" title="锁住喜欢的镜头，其余的按规划的画面重新挑一遍">${ICON.shuffle}<span>重洗没锁的</span></button>
      <button class="btn small" id="reset">全部还原</button>
      <button class="btn small" id="play">${ICON.play}预览修改后的成片</button>
      <button class="btn small" id="export">导出镜头清单</button>
      <button class="btn small primary" id="finish">${ICON.check}完成</button>
    </div>
    <div class="edit">
      <div>
        <div class="panel music">
          <div class="head"><span><b>${esc(D.song.title)}</b> · ${esc(D.song.artist)} · ${Math.round(film.seconds)} 秒 · ${film.slots.length} 个音乐槽，副歌每小节一个镜头，其余每两小节一个</span>
          <span class="legend">${Object.entries(LEVEL).map(([k, v]) => `<span><i style="background:var(--${k})"></i>${v}</span>`).join("")}</span></div>
          <div class="bands">${D.song.parts.map(p => {
            const lv = p.label === "build" ? "build" : p.level;
            return `<div style="flex:${p.end - p.start};background:var(--${lv})">${SECTION[p.label] || p.label}<span style="opacity:.6;font-weight:500">&nbsp;${clock(p.start)}</span></div>`;
          }).join("")}</div>
        </div>
        <div id="parts"></div>
      </div>
      <aside class="panel side" id="side"></aside>
    </div>`;

  // ---- changes to the film
  function apply(pick) {
    remember();
    const plan = film.slots[sel];
    if (plan.card === pick.card && plan.beat === pick.beat) delete edits[sel]; else edits[sel] = pick;
    preview = null; save(); relayout();
    $(`.tile[data-i="${sel}"]`).outerHTML = tileHTML(sel);           // only this tile changes
    placeDrawer(); drawCount(); refreshSide();
    toast(`第 ${numOf(sel)} 镜已替换`, { label: "撤销", run: back });
  }

  async function del(i) {
    if (L.length <= 1) return toast("至少要留一个镜头");
    const k = L.findIndex(s => s.i === i), me = L[k], len = me.b - me.a;
    const sides = [["prev", L[k - 1]], ["next", L[k + 1]]].filter(([, s]) => s).map(([side, s]) => {
      const card = D.cards[s.pick.card];
      return { side, s, fits: card.end - card.start >= s.b - s.a + len - 0.05, like: 0 };   // can its card run over the gap too?
    });
    try {
      const likes = await likeness(me.pick, sides.map(c => c.s.pick));
      sides.forEach((c, n) => { c.like = likes[n]; });
    } catch (e) { console.warn("likeness unavailable; the nearer fit wins", e); }
    sides.sort((x, y) => y.like - x.like);                       // the more alike first, among those long enough
    const by = sides.find(c => c.fits);
    const done = (how, cover) => {
      remember();
      removed[i] = { pick: me.pick, by: how };
      delete edits[i]; locked.delete(i);
      sel = cover ? cover.i : (L[k + 1] || L[k - 1]).i; open = false; preview = null;
      save(); relayout(); drawTiles(); refreshSide();
      toast(how === "ripple" ? `已删除，后面的镜头提前了 ${secs(len)}` : `已删除，由${how === "prev" ? "前" : "后"}一镜延长补上`, { label: "撤销", run: back });
    };
    if (by) return done(by.side, by.s);
    ask(`<h2>缺少填补素材</h2>
      <p>${sides.length > 1 ? "前后两个镜头的素材都" : sides[0].side === "prev" ? "前一个镜头的素材" : "后一个镜头的素材"}不够长，补不满这 ${secs(len)}。</p>
      <p>放弃音乐踩点的话，后面的镜头整体提前 ${secs(len)}：切点不再对齐节拍，成片也短 ${secs(len)}。</p>`,
      [{ label: "保留这一镜" }, { label: "放弃踩点并删除", primary: true, run: () => done("ripple") }]);
  }

  // ---- timeline: tiles by story part; the selected shot's card spreads out under its part
  function tileHTML(i) {
    const s = shotOf(i), b = beatOf(s.pick.card, s.pick.beat), card = D.cards[s.pick.card], len = s.b - s.a;
    const longer = len > film.slots[i].slot[1] - film.slots[i].slot[0] + 0.05;
    const lock = locked.has(i);
    return `<button class="tile ${i === sel ? "sel" : ""} ${i === sel && open ? "open" : ""} ${lock ? "locked" : ""}" data-i="${i}" style="width:${Math.round(len * 46)}px">
      <div class="pic"><img class="bg" src="${esc(b.frame)}" alt=""><img class="fg" src="${esc(b.frame)}" alt="${esc(b.what)}"></div>
      <span class="lock" data-lock role="button" title="${lock ? "解锁" : "锁定这一镜，重洗时不动"}">${lock ? ICON.lock : ICON.unlock}</span>
      <span class="num">${numOf(i)}</span>
      <span class="badges">${edits[i] ? '<span class="tag changed">已换</span>' : ""}${longer ? '<span class="tag changed">延长</span>' : ""}${card.upright ? '<span class="tag upright">竖</span>' : ""}</span>
      <div class="lvl" style="background:var(--${levelAt(s.a)})"></div>
      <div class="meta"><span class="t">${clock(s.a)} · ${secs(len)}</span><span class="tag">${esc(b.size)}</span></div>
    </button>`;
  }

  function beatCard(cid, b) {
    const cur = now(sel), isCur = cur.card === cid && cur.beat === b.n;
    const used = usedBy(cid, b.n, sel);
    const isPrev = preview && preview.card === cid && preview.beat === b.n;
    return `<button class="bcard ${isCur ? "cur" : ""} ${isPrev ? "prev" : ""}" data-card="${cid}" data-beat="${b.n}" ${used || isCur ? "disabled" : ""}>
      <div class="bp"><img src="${esc(b.frame)}" alt="">${used ? `<span class="over">已用在第 ${used} 镜</span>` : ""}</div>
      <div class="bw">${esc(b.what)}</div>
    </button>`;
  }

  function drawerHTML() {
    const i = sel, s = shotOf(i), plan = film.slots[i], cur = s.pick, card = D.cards[cur.card], lv = levelAt(s.a);
    const free = card.beats.filter(b => b.n !== cur.beat && !usedBy(cur.card, b.n, i));
    return `<div class="drawer">
      <div class="dh">
        <b>第 ${numOf(i)} 镜</b><span class="tag" style="color:var(--${lv})">● ${LEVEL[lv]}</span>
        <span class="tag">${clock(s.a)}–${clock(s.b)} · ${secs(s.b - s.a)}</span>
        <span class="dq">规划要：${esc(plan.query)}</span>
        <span class="grow"></span>
        <span class="hint">单击预览 · 双击替换</span>
        <button class="btn small ghost" data-lock>${locked.has(i) ? `${ICON.lock}已锁定` : `${ICON.unlock}锁定这一镜`}</button>
        ${edits[i] ? '<button class="btn small ghost" data-undo>还原这一镜</button>' : ""}
        <button class="btn small ghost danger" data-del ${L.length <= 1 ? "disabled" : ""}>删除这一镜</button>
        <button class="btn small ghost" data-close>收起</button>
      </div>
      <div class="drow" style="margin-top:12px">${card.beats.map(b => beatCard(cur.card, b)).join("")}</div>
      ${free.length ? "" : `<div class="note" style="margin-top:10px">这张卡片${card.beats.length > 1 ? "其他节拍都已经用在别的镜头里" : "只有这一个节拍"}，可以在右边搜别的素材。</div>`}
    </div>`;
  }

  function drawTiles() {
    $("#parts").innerHTML = film.parts.map((p, pi) => {
      const idx = L.filter(s => film.slots[s.i].part === pi + 1).map(s => s.i);
      if (!idx.length) return "";
      return `<section class="part"><div class="ph"><span class="n">段落 ${pi + 1}</span><h2>${esc(p.name)}</h2><span class="s">${esc(p.summary)}</span>
        ${idx.length > 1 ? '<span class="hint">↔ 拖动换顺序</span>' : ""}</div>
        <div class="tiles">${idx.map(tileHTML).join("")}</div></section>`;
    }).join("");
    placeDrawer();
    document.querySelectorAll(".tiles").forEach(list => Sortable.create(list, {
      animation: 300, easing: "cubic-bezier(.2, .9, .3, 1)", forceFallback: true, fallbackOnBody: true, fallbackTolerance: 4,
      delay: 150, delayOnTouchOnly: true, swapThreshold: .6, ghostClass: "ghost", chosenClass: "chosen", dragClass: "lifted",
      draggable: ".tile:not(.locked)",                              // a locked shot is not picked up (Sortable's filter stops the others moving too)
      onStart: () => list.classList.add("sorting"),
      onEnd: e => {
        list.classList.remove("sorting");
        dropped = Date.now();
        if (e.oldIndex === e.newIndex) return;
        // locked shots keep their slots; the others take the open slots in their new order
        const tiles = [...list.children].filter(t => !locked.has(+t.dataset.i));
        const slots = [...list.children].map(t => +t.dataset.i).filter(i => !locked.has(i)).sort((a, b) => a - b);
        const shots = tiles.map(t => now(+t.dataset.i));
        const was = +e.item.dataset.i, to = slots[tiles.indexOf(e.item)];
        if (was === to) { drawTiles(); return; }                       // it only went round a locked shot
        remember();
        slots.forEach((slot, k) => {
          const plan = film.slots[slot];
          if (plan.card === shots[k].card && plan.beat === shots[k].beat) delete edits[slot]; else edits[slot] = shots[k];
        });
        const from = numOf(was);
        sel = to; preview = null; save(); relayout(); drawTiles(); refreshSide();
        toast(`第 ${from} 镜挪到了第 ${numOf(sel)} 镜${locked.size ? "，锁住的没动" : ""}`, { label: "撤销", run: back });
      },
    }));
    drawCount();
  }
  // the drawer moves to the selected shot's part; the tiles stay as they are
  function placeDrawer() {
    document.querySelectorAll(".drawer").forEach(d => d.remove());
    document.querySelectorAll(".tile").forEach(t => {
      t.classList.toggle("sel", +t.dataset.i === sel);
      t.classList.toggle("open", +t.dataset.i === sel && open);
    });
    if (open) $(`.tile[data-i="${sel}"]`).closest(".part").insertAdjacentHTML("beforeend", drawerHTML());
  }
  function drawCount() {
    const n = Object.keys(edits).length, m = Object.keys(removed).length;
    $("#count").textContent = n || m ? [n ? `已换 ${n} 处` : "", m ? `删了 ${m} 镜` : ""].filter(Boolean).join(" · ") : "未修改";
    $("#count").className = n || m ? "tag changed" : "tag";
    const free = L.filter(s => !locked.has(s.i)).length;
    $("#shuffle span").textContent = locked.size ? `重洗没锁的 ${free} 镜` : "重洗没锁的";
    $("#shuffle").disabled = !free;
  }

  $("#parts").onclick = e => {
    const lockBtn = e.target.closest("[data-lock]");
    if (lockBtn) {
      const t = lockBtn.closest(".tile"), i = t ? +t.dataset.i : sel;
      locked.has(i) ? locked.delete(i) : locked.add(i);
      save();
      $(`.tile[data-i="${i}"]`).outerHTML = tileHTML(i);
      placeDrawer(); drawCount();
      return toast(locked.has(i) ? `第 ${numOf(i)} 镜已锁定，重洗时不动` : `第 ${numOf(i)} 镜已解锁`);
    }
    const tile = e.target.closest(".tile");
    if (tile) {
      if (Date.now() - dropped < 300) return;                       // the click that ends a drag is not a pick
      const i = +tile.dataset.i;
      open = i === sel ? !open : true; sel = i; preview = null;
      placeDrawer(); refreshSide();
      if (open) $(".drawer").scrollIntoView({ block: "nearest", behavior: "smooth" });
      return;
    }
    const card = e.target.closest(".bcard");
    if (card) return show(pickOf(card));
    if (e.target.closest("[data-close]")) { open = false; preview = null; placeDrawer(); drawViewer(); return; }
    if (e.target.closest("[data-del]")) return del(sel);
    if (e.target.closest("[data-undo]")) {
      remember(); delete edits[sel]; preview = null; save(); relayout();
      $(`.tile[data-i="${sel}"]`).outerHTML = tileHTML(sel); placeDrawer(); drawCount(); refreshSide();
    }
  };
  $("#parts").ondblclick = e => {
    const card = e.target.closest(".bcard");
    if (card && !card.disabled) apply(pickOf(card));
  };

  // show a candidate in the viewer without redrawing the lists, so a double click lands on the same card
  function show(pick) {
    preview = pick;
    document.querySelectorAll("[data-card][data-beat]").forEach(el =>
      el.classList.toggle("prev", el.dataset.card === pick.card && +el.dataset.beat === pick.beat));
    drawViewer();
  }

  // ---- right: search on top, the viewer under it. Built once; a new selection only refreshes it.
  // the service scores every beat; shot size, upright and the slot's own card are filtered here
  async function search(q) {
    const { scores, seconds } = await vectorScores(q);
    const out = [];
    for (const [k, score] of Object.entries(scores)) {
      const [cid, n] = k.split("/"), card = D.cards[cid];
      if (!card || cid === now(sel).card || (across && card.upright)) continue;
      const b = beatOf(cid, +n);
      if (b && (!size || b.size === size)) out.push({ card, b, score });
    }
    return { hits: out.sort((a, b) => b.score - a.score).slice(0, RESULTS), seconds };
  }

  function hitHTML({ card, b }) {
    const used = usedBy(card.id, b.n, sel);
    const isPrev = preview && preview.card === card.id && preview.beat === b.n;
    return `<div class="beat hit ${used ? "off" : ""} ${isPrev ? "prev" : ""}" data-card="${card.id}" data-beat="${b.n}" role="button" tabindex="0">
      <div class="bp"><img src="${esc(b.frame)}" alt=""></div>
      <div class="bt"><div class="w"><b>${esc(card.scene)}</b> · ${esc(b.what)}</div>
        <div class="m"><span class="tag">${esc(b.size)}</span>
          ${card.upright ? '<span class="tag upright">竖拍</span>' : ""}
          ${used ? `<span class="tag">已用在第 ${used} 镜</span>` : ""}
          <button class="btn small primary swap" ${used ? "disabled" : ""}>替换</button></div></div>
    </div>`;
  }

  function buildSide() {
    $("#side").innerHTML = `
      <div class="findbox">
        <h3 style="font-size:14px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline"><span id="shead"></span> <small id="sstat" style="font-weight:400;color:var(--faint);font-size:12px"></small></h3>
        <div class="libsearch" style="margin:0">${ICON.search}<input class="text" type="search" id="q" placeholder="写想要的画面，比如：直升机停在雪地上"></div>
        <div class="chips">${["", ...SIZES].map(z => `<button class="chip ${z === size ? "on" : ""}" data-size="${z}">${z || "全部景别"}</button>`).join("")}
          <label class="toggle"><input type="checkbox" id="across">只看横拍</label></div>
        <div class="beats results" id="results"></div>
      </div>
      <div class="viewer"><video id="pv" muted playsinline autoplay></video><span class="cap" id="cap"></span></div>
      <div class="pvinfo" id="pvinfo"></div>`;
    $("#results").onclick = e => {
      const hit = e.target.closest(".hit"); if (!hit) return;
      if (e.target.closest(".swap")) { if (!hit.classList.contains("off")) apply(pickOf(hit)); return; }
      if (!hit.classList.contains("off")) show(pickOf(hit));
    };
    let typing = 0;
    $("#q").oninput = e => { query = e.target.value; clearTimeout(typing); typing = setTimeout(() => drawResults(false), 300); };
    $("#side").querySelectorAll(".chip").forEach(c => c.onclick = () => {
      size = c.dataset.size; $("#side").querySelectorAll(".chip").forEach(o => o.classList.toggle("on", o === c)); drawResults(false);
    });
    $("#across").onchange = e => { across = e.target.checked; drawResults(false); };
  }
  // a new selection: the box keeps what was typed; an empty box on a card with nothing left to swap gets the plan's words
  function refreshSide() {
    const cur = now(sel), card = D.cards[cur.card];
    const free = card.beats.filter(b => b.n !== cur.beat && !usedBy(cur.card, b.n, sel));
    if (!query.trim() && !free.length) { query = film.slots[sel].query; $("#q").value = query; }
    $("#shead").textContent = `搜索素材，换掉第 ${numOf(sel)} 镜`;
    drawViewer();
    drawResults(true);
  }

  let playing = "";
  function drawViewer() {
    const i = sel, pick = preview || now(i), card = D.cards[pick.card], b = beatOf(pick.card, pick.beat);
    const piece = pieceFor(card, b, lenOf(i)), v = $("#pv");
    const what = `${card.file}@${piece.start.toFixed(2)}-${piece.end.toFixed(2)}`;
    if (what !== playing) { playing = what; v.poster = b.frame; playPiece(v, card, piece); }   // the same piece keeps playing
    $("#cap").textContent = `${preview ? "候选" : "第 " + numOf(i) + " 镜"} · ${secs(piece.end - piece.start)}`;
    $("#pvinfo").innerHTML = preview
      ? `<span class="grow"><b style="color:var(--ink)">候选</b> · ${esc(b.what)}</span>
         <button class="btn small ghost" id="pvno">取消</button><button class="btn small primary" id="pvok">替换第 ${numOf(i)} 镜</button>`
      : `<span class="grow">第 ${numOf(i)} 镜现在用的是：${esc(b.what)}</span>`;
    if (preview) {
      $("#pvno").onclick = () => { preview = null; document.querySelectorAll(".prev").forEach(el => el.classList.remove("prev")); drawViewer(); };
      $("#pvok").onclick = () => apply(preview);
    }
  }

  // the list shows three results and scrolls the rest, so the viewer stays close under it
  function fitThree(box) {
    const third = box.querySelectorAll(".hit")[2];
    box.style.maxHeight = third ? `${third.offsetTop + third.offsetHeight - box.firstElementChild.offsetTop + 2}px` : "";
  }

  let asked = 0;
  async function drawResults(keep) {
    const box = $("#results"), stat = $("#sstat");
    const q = query.trim(), mine = ++asked, scroll = keep ? box.scrollTop : 0;
    if (!q) { box.innerHTML = `<div class="empty">按画面内容找，不看描述文字。单击结果预览，点“替换”直接换掉选中的镜头。</div>`; stat.textContent = ""; return; }
    if (!keep) stat.textContent = "搜索中…";
    try {
      const { hits } = await search(q);
      if (mine !== asked) return;                              // a newer query, or another slot, took over
      stat.textContent = `找到 ${hits.length} 个`;
      box.innerHTML = hits.length ? hits.map(hitHTML).join("") : `<div class="empty">这个景别里没有。放宽景别，或者关掉“只看横拍”。</div>`;
      fitThree(box);
      box.scrollTop = scroll;
    } catch {
      if (mine !== asked) return;
      stat.textContent = "";
      box.innerHTML = `<div class="note">连不上向量搜索服务（${esc(SEARCH)}）。它跑在 anas 虚拟机的容器里，启动方法见本目录的 README.md。</div>`;
    }
  }

  // ---- lock what you like, reshuffle the rest: each open shot gets another beat for the picture the plan asked of
  // its slot (the slot's words through the vector search), one of the few most alike, at random so a second go differs;
  // a beat is used once, a card not twice in a row, the card must run the slot's length, and a landscape shot stays landscape.
  // (The real pipeline would take the spare beats the planner already ranked for each picture first; see README.)
  async function reshuffle(sure) {
    const open = L.filter(s => !locked.has(s.i)).map(s => s.i);
    if (!open.length) return toast("所有镜头都锁住了，先解锁几个");
    if (!locked.size && !sure) return ask(`<h2>还没有锁定镜头</h2>
      <p>重洗会换掉全部 ${open.length} 个镜头。想保留的，先点镜头右下角的锁。</p>`,
      [{ label: "先去锁定" }, { label: "全部重洗", primary: true, run: () => reshuffle(true) }]);
    const btn = $("#shuffle"), label = $("#shuffle span");
    btn.disabled = true;
    open.forEach(i => $(`.tile[data-i="${i}"]`).classList.add("shuffling"));
    const scores = {};
    let got = 0;
    try {
      for (let k = 0; k < open.length; k += 4) {
        await Promise.all(open.slice(k, k + 4).map(async i => {
          scores[i] = (await vectorScores(film.slots[i].query)).scores;
          label.textContent = `重洗中 ${++got}/${open.length}`;
        }));
      }
    } catch {
      document.querySelectorAll(".shuffling").forEach(t => t.classList.remove("shuffling"));
      drawCount();
      return toast("连不上向量搜索服务，重洗不了");
    }
    const taken = new Set(L.filter(s => locked.has(s.i)).map(s => `${s.pick.card}/${s.pick.beat}`));
    const picks = {};
    let before = null;                                              // the card of the shot before, as it now stands
    for (const s of L) {
      if (locked.has(s.i)) { before = s.pick.card; continue; }
      const cur = s.pick, len = s.b - s.a, upright = D.cards[cur.card].upright;
      const ranked = Object.entries(scores[s.i]).filter(([k]) => {
        const [cid] = k.split("/"), c = D.cards[cid];
        return c && !taken.has(k) && k !== `${cur.card}/${cur.beat}` && cid !== before
          && c.end - c.start >= len - 0.05 && (upright || !c.upright);
      }).sort((a, b) => b[1] - a[1]).slice(0, 4);
      const k = ranked.length ? ranked[Math.floor(Math.random() ** 2 * ranked.length)][0] : `${cur.card}/${cur.beat}`;
      taken.add(k);
      const [card, n] = k.split("/");
      if (ranked.length) picks[s.i] = { card, beat: +n };
      before = card;
    }
    remember();
    for (const [i, pick] of Object.entries(picks)) {
      const plan = film.slots[i];
      if (plan.card === pick.card && plan.beat === pick.beat) delete edits[i]; else edits[i] = pick;
    }
    preview = null; save(); relayout(); drawTiles(); refreshSide();
    Object.keys(picks).forEach(i => $(`.tile[data-i="${i}"]`).classList.add("fresh"));
    const n = Object.keys(picks).length;
    toast(`换了 ${n} 个镜头${locked.size ? `，锁住的 ${locked.size} 个没动` : ""}`, { label: "撤销", run: back });
  }
  $("#shuffle").onclick = () => reshuffle(false);

  $("#reset").onclick = () => {
    if (!Object.keys(edits).length && !Object.keys(removed).length) return;
    remember(); edits = {}; removed = {}; preview = null; save(); relayout(); drawTiles(); refreshSide();
    toast("已还原成规划的版本", { label: "撤销", run: back });
  };
  $("#export").onclick = () => {
    const list = L.map((s, k) => {
      const card = D.cards[s.pick.card], b = beatOf(s.pick.card, s.pick.beat), p = pieceFor(card, b, s.b - s.a);
      return { shot: k + 1, slot: s.i + 1, at: [+s.a.toFixed(2), +s.b.toFixed(2)], card: s.pick.card, beat: s.pick.beat, video: card.video,
        start: +p.start.toFixed(2), end: +p.end.toFixed(2), changed: !!edits[s.i] };
    });
    const gone = Object.entries(removed).map(([i, r]) => ({ slot: +i + 1, card: r.pick.card, beat: r.pick.beat, filled: FILLED[r.by] }));
    const blob = new Blob([JSON.stringify({ film: film.tag, song: D.song.title, shots: list, deleted: gone }, null, 1)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `镜头清单-${film.tag}.json`; a.click();
  };
  $("#finish").onclick = e => { e.currentTarget.disabled = true; confirmFilm(fi, "精修页"); };
  $("#play").onclick = () => roughCut(L);

  relayout(); buildSide(); drawTiles(); refreshSide();
}

// a question with buttons, in the page's own style
function ask(html, buttons) {
  const m = document.createElement("div");
  m.className = "modal";
  m.innerHTML = `<div class="panel askbox">${html}<div class="acts">${buttons.map((b, n) =>
    `<button class="btn ${b.primary ? "primary" : ""}" data-n="${n}">${esc(b.label)}</button>`).join("")}</div></div>`;
  document.body.appendChild(m);
  m.onclick = e => {
    const b = e.target.closest("[data-n]");
    if (!b && e.target !== m) return;
    m.remove();
    if (b && buttons[+b.dataset.n].run) buttons[+b.dataset.n].run();
  };
}

// play one piece of a source video on a loop
function playPiece(v, card, piece) {
  v.src = `${card.file}#t=${piece.start.toFixed(2)}`;
  v.ontimeupdate = () => { if (v.currentTime >= piece.end - 0.05) v.currentTime = piece.start; };
  v.onloadedmetadata = () => { v.currentTime = piece.start; v.play().catch(() => {}); };
}

// rough preview of the edited film: the song with each shot's piece of its source video, until the last shot ends
function roughCut(shots) {
  const t0 = D.song.excerpt[0], end = shots[shots.length - 1].b;
  const m = document.createElement("div");
  m.className = "modal rough";
  m.innerHTML = `<div class="box"><div class="viewer"><video id="rv" muted playsinline></video><span class="cap" id="rc"></span></div>
    <div class="bar2"><span>粗预览：按镜头依次播原始视频的片段，切换处可能卡一下；正式成片要重新渲染。</span><button class="btn small" id="rx">关闭</button></div></div>`;
  document.body.appendChild(m);
  const v = $("#rv", m), cap = $("#rc", m), song = new Audio(`${D.song.file}#t=${t0}`);
  let shown = -1, raf = 0;
  const close = () => { cancelAnimationFrame(raf); song.pause(); v.pause(); m.remove(); };
  $("#rx", m).onclick = close;
  m.onclick = e => { if (e.target === m) close(); };
  const step = () => {
    const t = song.currentTime - t0;
    if (t >= end) return close();
    const k = shots.findIndex(s => t >= s.a && t < s.b);
    if (k >= 0 && k !== shown) {
      shown = k;
      const s = shots[k], card = D.cards[s.pick.card], b = beatOf(s.pick.card, s.pick.beat);
      const p = pieceFor(card, b, s.b - s.a);
      if (!v.src.endsWith(card.file)) v.src = card.file;
      const go = () => { v.currentTime = p.start + (t - s.a); v.play().catch(() => {}); };
      if (v.readyState >= 1) go(); else v.onloadedmetadata = go;
      cap.textContent = `第 ${k + 1} 镜`;
    }
    raf = requestAnimationFrame(step);
  };
  song.play().then(() => { raf = requestAnimationFrame(step); }).catch(() => toast("浏览器拦下了自动播放，点一下页面再试"));
}

route();
if (job) { tickJob(); jobTimer = setInterval(tickJob, 120); }   // a job started before a reload carries on
</script>
</body>
</html>
