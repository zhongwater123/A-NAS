<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>旅行成片原型</title>
<style>
:root {
  --bg: #0d0e11; --bg-2: #121418; --panel: #17191e; --panel-2: #1e2128; --line: #272a32; --line-2: #343844;
  --ink: #f1f2f5; --muted: #a0a6b2; --faint: #6c7280;
  --accent: #ff8b4d; --accent-2: #ff5f7e; --accent-ink: #1a0d06; --grad: linear-gradient(135deg, #ff9a4d, #ff5f7e);
  --ok: #4ade80; --ok-soft: rgba(74, 222, 128, .12); --warn: #fbbf24; --warn-soft: rgba(251, 191, 36, .13);
  --quiet: #60a5fa; --mid: #34d399; --build: #fbbf24; --peak: #fb7185;
  --r: 14px; --r-sm: 9px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: radial-gradient(1200px 600px at 85% -10%, rgba(255, 110, 90, .10), transparent 60%),
              radial-gradient(900px 500px at -10% 10%, rgba(96, 165, 250, .08), transparent 60%), var(--bg);
  background-attachment: fixed; color: var(--ink);
  font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased; min-height: 100vh;
}
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
input { font: inherit; color: inherit; }
img { display: block; }

/* buttons, chips */
.btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line-2); background: var(--panel-2); border-radius: 999px; padding: 8px 16px; text-decoration: none; transition: .15s; white-space: nowrap; }
.btn:hover { border-color: var(--faint); background: #252933; }
.btn.primary { background: var(--grad); color: var(--accent-ink); border: 0; font-weight: 650; box-shadow: 0 6px 24px rgba(255, 110, 90, .28); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.big { padding: 13px 28px; font-size: 16px; }
.btn.small { padding: 5px 12px; font-size: 13px; }
.btn.ghost { background: transparent; }
.btn.link { border: 0; background: none; color: var(--accent); padding: 2px 0; }
.btn svg { width: 16px; height: 16px; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: rgba(255,255,255,.06); color: var(--muted); white-space: nowrap; }
.tag.upright { background: var(--warn-soft); color: var(--warn); }
.tag.changed { background: var(--ok-soft); color: var(--ok); }
.tag.hot { background: rgba(255, 110, 90, .15); color: #ffb08a; }
.eyebrow { font-size: 12px; letter-spacing: .14em; color: var(--faint); text-transform: uppercase; }

/* header */
header.top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 28px; padding: 14px 32px; background: rgba(13, 14, 17, .78); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 11px; }
.brand svg { width: 36px; height: 36px; filter: drop-shadow(0 6px 16px rgba(255, 95, 126, .35)); }
.brand b { display: block; font-size: 16px; letter-spacing: .04em; line-height: 1.15; }
.brand span { display: block; font-size: 10px; letter-spacing: .22em; color: var(--faint); text-transform: uppercase; }
main { max-width: 1360px; margin: 0 auto; padding: 32px; }
h1 { font-size: 30px; line-height: 1.25; margin: 0; letter-spacing: -.01em; }
h2 { font-size: 17px; margin: 0; }
.lead { color: var(--muted); margin: 8px 0 0; font-size: 15px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }

/* ---------- upload ---------- */
.hero { position: relative; isolation: isolate; overflow: hidden; display: flex; align-items: flex-end; min-height: 440px; padding: 56px 48px 52px; margin-bottom: 28px; border-radius: 22px; background: #05070a url(hero.jpg) center / cover; box-shadow: 0 30px 60px rgba(0,0,0,.35); }
.hero .hv { position: absolute; inset: 0; z-index: -2; width: 100%; height: 100%; object-fit: cover; }
.hero .shade { position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, rgba(7,8,11,.86) 0%, rgba(7,8,11,.55) 40%, rgba(7,8,11,.05) 75%), linear-gradient(to top, rgba(7,8,11,.75), transparent 55%); }
.hero .hx { max-width: 560px; }
.hero .eyebrow { color: rgba(255,255,255,.75); }
.hero h1 { font-size: 46px; line-height: 1.15; margin-top: 12px; text-shadow: 0 2px 24px rgba(0,0,0,.35); }
.hero .lead { color: rgba(255,255,255,.82); }
.hero h1 em { font-style: normal; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero .lead { max-width: 520px; }
.setup { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.setup .panel { padding: 22px; }
/* each step has its own colour: footage blue, music pink, cut green */
.step { position: relative; --soft: color-mix(in srgb, var(--tone) 14%, transparent);
  border-color: color-mix(in srgb, var(--tone) 32%, var(--line));
  background: linear-gradient(180deg, color-mix(in srgb, var(--tone) 11%, var(--panel)) 0, var(--panel) 190px); }
.step::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; border-radius: var(--r) var(--r) 0 0; background: var(--tone-grad); }
.step.media .drop { display: flex; flex-direction: column; align-items: center; justify-content: center; }
.media { --tone: #4aa8ff; --tone-grad: linear-gradient(135deg, #38d2ff, #5b6cff); }
.tune { --tone: #e36bff; --tone-grad: linear-gradient(135deg, #ff6fb1, #a855f7); }
.cut { --tone: #34d399; --tone-grad: linear-gradient(135deg, #5eead4, #22c55e); }
.step.media { padding: 22px; transition: border-color .15s, box-shadow .15s; }
.step.media.over { border-color: var(--tone); box-shadow: 0 0 0 4px var(--soft); }
.step.media .step-h { margin-bottom: 16px; flex-wrap: wrap; }
.step.media .grow { flex: 1; }
.picked { font-size: 13px; color: var(--muted); }
.picked b { color: var(--ink); font-variant-numeric: tabular-nums; }
.helpwrap { position: relative; }
.help { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--muted); font-weight: 700; display: grid; place-items: center; padding: 0; }
.help:hover, .help.on { border-color: var(--tone); color: var(--tone); }
.pop { position: absolute; right: 0; top: calc(100% + 10px); z-index: 20; width: 320px; padding: 14px 16px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line-2); box-shadow: 0 20px 40px rgba(0,0,0,.45); font-size: 13px; color: var(--muted); }
.pop b { color: var(--ink); font-size: 14px; }
.pop p { margin: 8px 0 0; }
.pop .faint { color: var(--faint); font-size: 12px; }
.folders { display: grid; gap: 10px; }
.fold { border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,.02); transition: border-color .15s; }
.fold.open { border-color: color-mix(in srgb, var(--tone) 45%, var(--line)); }
.fhead { display: flex; align-items: center; gap: 12px; padding: 10px 14px; }
.ftog { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 0; border: 0; background: none; color: inherit; text-align: left; cursor: pointer; font: inherit; }
.ficon { flex: none; width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: var(--soft); color: var(--tone); }
.ficon svg { width: 20px; height: 20px; }
.fname { min-width: 0; display: grid; gap: 3px; }
.fname b { font-size: 15px; color: var(--ink); }
.fname small { font-size: 12px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fstrip { margin-left: auto; flex: none; display: flex; gap: 4px; }
.fstrip img, .fstrip video { width: 50px; height: 32px; object-fit: cover; border-radius: 6px; display: block; background: #000; }
.fstrip .vicon { display: none; }
.fold.open .fstrip { visibility: hidden; }          /* the grid below shows them; hidden, not gone, so nothing jumps */
.fn { flex: none; min-width: 56px; text-align: right; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chev { flex: none; display: grid; color: var(--faint); transition: rotate .2s; }
.chev svg { width: 16px; height: 16px; }
.fold.open .chev { rotate: 90deg; color: var(--tone); }
.fbody:empty { display: none; }
.vscroll { max-height: 340px; overflow: auto; overscroll-behavior: contain; padding: 0 14px 14px; }   /* the scroller is outside the grid, so its rows keep their height */
.vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; padding: 2px; }
.day { grid-column: 1 / -1; justify-self: start; display: flex; align-items: center; gap: 8px; padding: 8px 0 0; border: 0; background: none; color: var(--ink); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
.day small { color: var(--faint); font-weight: 400; font-size: 12px; }
.tick { flex: none; width: 22px; height: 22px; padding: 0; border-radius: 50%; border: 1.5px solid var(--line-2); background: none; display: grid; place-items: center; color: #fff; cursor: pointer; }
.tick svg { width: 12px; height: 12px; visibility: hidden; }
.tick i { display: none; width: 10px; height: 2px; border-radius: 1px; background: #fff; }
.tick.on, .tick.some { background: var(--tone-grad); border-color: transparent; }
.tick.on svg { visibility: visible; }
.tick.some svg { display: none; }
.tick.some i { display: block; }
.day .tick { width: 18px; height: 18px; }
.day .tick svg { width: 10px; height: 10px; }
.day .tick i { width: 8px; }
.fadd { display: flex; align-items: center; justify-content: center; gap: 8px; height: 46px; border-radius: 14px; border: 1.5px dashed color-mix(in srgb, var(--tone) 55%, var(--line)); color: var(--tone); font-size: 14px; cursor: pointer; transition: .15s; }
.fadd b { font-size: 24px; font-weight: 300; line-height: 1; }
.fadd:hover { border-color: var(--tone); background: var(--soft); }
.vt { position: relative; aspect-ratio: 16/10; border-radius: 10px; overflow: hidden; }
.vt { padding: 0; border: 0; background: #000; isolation: isolate; outline: 2px solid transparent; outline-offset: -2px; transition: outline-color .12s, opacity .12s; }
.vt img, .vt video { width: 100%; height: 100%; object-fit: cover; display: block; }
.vt .vicon { position: absolute; inset: 0; display: grid; place-items: center; color: var(--faint); pointer-events: none; }
.vt .vicon svg { width: 22px; height: 22px; }
.vt video + .vicon { z-index: -1; }   /* behind the frame, seen only when the browser cannot decode it */
.vt .ck { position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.75); background: rgba(0,0,0,.35); display: grid; place-items: center; }
.vt .ck svg { width: 11px; height: 11px; color: #fff; visibility: hidden; }
.vt .vm { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; gap: 6px; padding: 14px 7px 4px; font-size: 11px; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.7)); }
.vt .vm span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vt .up, .vt .new { position: absolute; top: 6px; left: 6px; font-size: 10px; padding: 0 6px; border-radius: 999px; background: rgba(0,0,0,.55); color: var(--warn); }
.vt .new { color: var(--tone); }
.vt.on { outline-color: var(--tone); }
.vt.on .ck { background: var(--tone-grad); border-color: transparent; }
.vt.on .ck svg { visibility: visible; }
.vt:not(.on) img, .vt:not(.on) video { opacity: .35; filter: grayscale(.7); }
.pickrow { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 22px; align-items: stretch; }
.pickrow .alt { display: flex; flex-direction: column; justify-content: center; }
.pickrow .or { margin-top: 0; }
/* the two optional choices: a row of links on the upload page, each opening its own page */
.go .opts { display: flex; gap: 12px; flex-wrap: wrap; flex: 1; min-width: 0; }
.opt { display: flex; align-items: center; gap: 12px; padding: 10px 14px 10px 10px; border-radius: 14px; text-decoration: none; min-width: 0; flex: 1 1 240px; max-width: 400px;
  border: 1px solid color-mix(in srgb, var(--tone) 35%, var(--line)); background: color-mix(in srgb, var(--tone) 9%, var(--panel)); transition: .15s; }
.opt:hover { border-color: var(--tone); transform: translateY(-1px); }
.opt .badge { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--tone-grad); color: #fff; flex-shrink: 0; }
.opt .badge svg { width: 19px; height: 19px; }
.opt .tx { min-width: 0; flex: 1; }
.opt small { display: block; font-size: 12px; color: var(--tone); font-weight: 650; letter-spacing: .05em; }
.opt b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.opt .more { color: var(--muted); font-size: 13px; white-space: nowrap; }
.sub { max-width: 820px; margin: 0 auto; }
.sub .back { margin-bottom: 18px; }
.sub .panel { padding: 22px; }
.sub .foot { display: flex; justify-content: flex-end; margin-top: 18px; }
.step-h { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
.step-h .badge { width: 48px; height: 48px; border-radius: 15px; display: grid; place-items: center; background: var(--tone-grad); color: #fff;
  box-shadow: 0 10px 26px color-mix(in srgb, var(--tone) 40%, transparent), inset 0 1px 0 rgba(255,255,255,.35); flex-shrink: 0; }
.step-h .badge svg { width: 24px; height: 24px; }
.step-h .step-n { font-size: 12px; font-weight: 650; letter-spacing: .08em; color: var(--tone); }
.step-h h2 { font-size: 21px; line-height: 1.2; }
.step-h small { margin-left: auto; color: var(--faint); font-size: 12px; text-align: right; }
.label { font-size: 12px; font-weight: 650; color: var(--muted); letter-spacing: .05em; margin-bottom: 10px; }
.cutopts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 32px; align-items: start; }
.step .text:focus { border-color: var(--tone); }
.step .seg button.on { background: var(--tone-grad); color: #06140d; font-weight: 600; }
.step .ideas button:hover { border-color: var(--tone); color: var(--ink); }
.drop { border: 1.5px dashed color-mix(in srgb, var(--tone, var(--accent)) 40%, var(--line)); border-radius: var(--r); padding: 30px 20px; text-align: center; transition: .15s; background: rgba(0,0,0,.18); }
.drop.over { border-color: var(--tone, var(--accent)); background: var(--soft); }
.drop .icon { width: 46px; height: 46px; margin: 0 auto 12px; border-radius: 14px; display: grid; place-items: center; background: var(--soft, var(--panel-2)); color: var(--tone, var(--accent)); }
.drop .icon svg { width: 22px; height: 22px; }
.drop .big { font-size: 16px; font-weight: 600; }
.drop .hint { color: var(--faint); font-size: 13px; margin: 4px 0 16px; }
.or { display: flex; align-items: center; gap: 12px; color: var(--faint); font-size: 12px; margin: 16px 0; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.sample { display: flex; gap: 14px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg-2); width: 100%; text-align: left; transition: .15s; }
.sample:hover { border-color: var(--line-2); }
.sample.on { border-color: var(--tone, var(--accent)); background: var(--soft, var(--bg-2)); }
.sample .thumbs { display: grid; grid-template-columns: repeat(3, 34px); grid-template-rows: repeat(2, 24px); gap: 3px; flex-shrink: 0; }
.sample .thumbs img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; }
.sample .tx { flex: 1; min-width: 0; }
.sample .tx b { display: block; }
.sample .tx span { color: var(--faint); font-size: 13px; }
.check { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line-2); display: grid; place-items: center; flex-shrink: 0; }
.on > .check, .check.on { background: var(--tone-grad, var(--grad)); border: 0; }
.check svg { width: 12px; height: 12px; color: #fff; visibility: hidden; }
.on > .check svg, .check.on svg { visibility: visible; }
.files { margin-top: 14px; max-height: 180px; overflow: auto; font-size: 13px; color: var(--muted); text-align: left; }
.files div { display: flex; justify-content: space-between; padding: 4px 2px; border-bottom: 1px solid var(--line); }
.field { margin-top: 20px; }
.field > label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 13px; color: var(--muted); }
.seg { display: inline-flex; background: var(--bg-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: none; padding: 6px 14px; border-radius: 999px; font-size: 13px; color: var(--muted); }
.seg button.on { background: var(--panel-2); color: var(--ink); box-shadow: 0 1px 0 rgba(255,255,255,.05) inset; }
.text { width: 100%; padding: 10px 14px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--bg-2); outline: none; transition: .15s; }
.text:focus { border-color: var(--accent); }
.ideas { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.ideas button { border: 1px solid var(--line); background: none; border-radius: 999px; font-size: 12px; padding: 3px 10px; color: var(--muted); }
.ideas button:hover { color: var(--ink); border-color: var(--line-2); }

/* songs */
.libsearch { position: relative; margin-bottom: 16px; }
.libsearch svg.mag { position: absolute; left: 13px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%); color: var(--faint); }
.libsearch .text { padding-left: 38px; }
.drop-list { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 10; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 6px; box-shadow: 0 20px 40px rgba(0,0,0,.45); }
.drop-list .empty { padding: 10px; }
.songs { display: flex; flex-direction: column; gap: 8px; }
.song { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 10px; border-radius: 12px; border: 1px solid transparent; background: rgba(0,0,0,.18); transition: .15s; text-align: left; width: 100%; cursor: pointer; }
.song:hover { border-color: var(--line-2); }
.song.on { border-color: var(--tone, var(--accent)); background: var(--soft, rgba(255, 139, 77, .06)); }
.drop-list .song { background: transparent; }
.cover { width: 48px; height: 48px; border-radius: 10px; position: relative; overflow: hidden; display: grid; place-items: center; font-weight: 700; font-size: 18px; color: rgba(255,255,255,.92); }
.cover::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 30% 25%, rgba(255,255,255,.35), transparent 55%); }
.song .tx { min-width: 0; }
.song .tx b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.song .tx .who { color: var(--faint); font-size: 12px; }
.song .tx .why { color: var(--muted); font-size: 12px; margin-top: 2px; }
.song .meta { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.play { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--panel-2); display: grid; place-items: center; }
.play svg { width: 14px; height: 14px; }
.play:disabled { opacity: .35; cursor: not-allowed; }
.play.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.go { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-top: 24px; padding: 18px 22px; }
.go .sum { color: var(--muted); font-size: 14px; }
.go .sum b { color: var(--ink); font-weight: 600; }

/* processing overlay */
.modal { position: fixed; inset: 0; background: rgba(5, 6, 8, .78); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.work { width: min(560px, 100%); padding: 28px; }
.work { max-height: 100%; overflow: auto; }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .22s; }
#donepop { animation: fadein .2s ease; }
@keyframes fadein { from { opacity: 0; } }
.donebox { width: min(520px, 100%); padding: 30px 28px 24px; text-align: center; animation: rise .35s cubic-bezier(.2, .9, .3, 1); }
@keyframes rise { from { opacity: 0; transform: translateY(16px) scale(.97); } }
.donebox .okb { width: 56px; height: 56px; margin: 0 auto 12px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, #5eead4, #22c55e); color: #06140d; box-shadow: 0 10px 26px rgba(34, 197, 94, .3); }
.donebox .okb svg { width: 28px; height: 28px; }
.donebox h2 { font-size: 22px; }
.donebox p { margin: 8px 0 18px; font-size: 14px; color: var(--muted); }
.dthumbs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 22px; }
.dthumbs div { position: relative; aspect-ratio: 16 / 10; border-radius: 10px; overflow: hidden; background: #000; }
.dthumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.dthumbs span { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 8px 5px; font-size: 12px; font-weight: 600; color: #fff; text-align: left; background: linear-gradient(transparent, rgba(0,0,0,.7)); }
.donebox .acts { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.work .stage { margin: 18px 0; height: 150px; display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 16px; align-items: center; }
.stage .pic { height: 100%; border-radius: 10px; overflow: hidden; background: #000; }
.stage .pic img, .stage .keys img { width: 100%; height: 100%; object-fit: cover; display: block; animation: popin .25s ease; }
@keyframes popin { from { opacity: .3; scale: 1.04; } }
.stage .keys { height: 100%; display: flex; gap: 3px; border-radius: 10px; overflow: hidden; }
.stage .keys img { width: 0; flex: 1; }
.stage .say { min-width: 0; max-height: 150px; overflow: hidden; font-size: 13px; line-height: 1.6; color: var(--muted); }
.stage .say b { display: block; margin-bottom: 4px; font-size: 14px; color: var(--ink); }
.stage .say.wide { grid-column: 1 / -1; }
.stage .count { margin-top: 6px; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.stage .typed::after { content: "▍"; color: var(--accent); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.stage .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.stage .chips span { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--ok-soft); color: var(--ok); }
.stage .chips span.bad { background: var(--warn-soft); color: var(--warn); }
.songbar { position: relative; display: flex; gap: 2px; height: 44px; margin-top: 10px; border-radius: 8px; overflow: hidden; }
.songbar span { display: grid; place-items: center; font-size: 11px; font-weight: 600; color: #06140d; opacity: .25; transition: opacity .3s; }
.songbar span.in { opacity: 1; }
.songbar .quiet { background: var(--quiet); } .songbar .mid { background: var(--mid); } .songbar .build { background: var(--build); } .songbar .peak { background: var(--peak); }
.songbar i { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; box-shadow: 0 0 8px #fff; }
.plans { display: grid; gap: 8px; max-height: none; }
.plans div { padding: 8px 12px; border-radius: 10px; background: var(--bg-2); color: var(--faint); transition: color .3s; }
.plans div.in { color: var(--ink); }
.plans b { display: inline; margin: 0 8px 0 0; font-size: 13px; color: var(--accent); }
.renders .row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.renders b { display: inline; flex: none; width: 48px; margin: 0; font-size: 13px; }
.reel2 { position: relative; flex: 1; display: flex; gap: 1px; height: 30px; border-radius: 6px; overflow: hidden; }
.reel2 img { width: 0; min-width: 0; height: 100%; object-fit: cover; }
.reel2::after { content: ""; position: absolute; top: 0; bottom: 0; right: 0; left: var(--done, 0%); background: rgba(5, 6, 8, .78); }
.work .leave { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--faint); }
.jobpill { position: fixed; right: 20px; bottom: 20px; z-index: 45; display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--ink); font: inherit; font-size: 13px; box-shadow: 0 14px 34px rgba(0,0,0,.45); cursor: pointer; }
.jobpill i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--accent); border-top-color: transparent; animation: spin .8s linear infinite; }
.jobpill .pbar { width: 64px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.jobpill .pbar b { display: block; height: 100%; background: var(--grad); }
.jobpill.done { background: linear-gradient(135deg, #5eead4, #22c55e); border-color: transparent; color: #06140d; font-weight: 700; animation: popin .3s ease; }
.jobpill svg { width: 14px; height: 14px; }
.work .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.work .bar div { height: 100%; width: 0; background: var(--grad); transition: width .4s; }
.work ol { list-style: none; padding: 0; margin: 18px 0 0; display: flex; flex-direction: column; gap: 8px; }
.work li { display: flex; gap: 10px; align-items: center; color: var(--faint); font-size: 14px; }
.work li i { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line-2); flex-shrink: 0; display: grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 800; color: #06140d; }
.work li.done i::before { content: "✓"; }
.work li.done { color: var(--muted); }
.work li.done i { background: var(--ok); border-color: var(--ok); }
.work li.now { color: var(--ink); }
.work li.now i { border-color: var(--accent); border-top-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- choose ---------- */
.pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 26px; flex-wrap: wrap; }
.notice { margin-top: 10px; font-size: 13px; color: var(--warn); }
.films { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.film { padding: 0; overflow: hidden; display: flex; flex-direction: column; transition: .2s; }
.film:hover { border-color: var(--line-2); transform: translateY(-2px); box-shadow: 0 18px 40px rgba(0,0,0,.35); }
.film video { width: 100%; aspect-ratio: 16/9; background: #000; display: block; }
.film .strip { display: flex; height: 26px; gap: 1px; }
.film .strip img { height: 100%; width: 0; min-width: 0; object-fit: cover; }
.film .body { padding: 18px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
.film .title { display: flex; align-items: center; justify-content: space-between; }
.film .title h2 { font-size: 19px; }
.chain { display: flex; flex-wrap: wrap; gap: 6px; }
.chain span { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); }
.pitch { margin: 0; font-size: 14px; line-height: 1.6; color: var(--ink); }
.design { display: none; color: var(--muted); font-size: 13px; line-height: 1.65; }
.design.open { display: block; }
.film .vwrap { position: relative; }
.film .busy { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 16px; text-align: center; background: rgba(5, 6, 8, .8); backdrop-filter: blur(3px); font-size: 12px; color: var(--muted); }
.film .busy > b { font-size: 15px; color: var(--ink); }
.film .busy .bar2 { width: 60%; height: 4px; margin-top: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.film .busy .bar2 b { display: block; height: 100%; background: var(--grad); animation: fill 3s linear forwards; }
@keyframes fill { from { width: 0; } to { width: 100%; } }
.tweak { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.tweak .tl { font-size: 12px; color: var(--faint); margin-right: 2px; }
.tweak button { font: inherit; font-size: 12px; padding: 4px 11px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--muted); cursor: pointer; transition: .15s; }
.tweak button:hover:not(:disabled) { border-color: var(--accent); color: var(--ink); }
.tweak button:disabled, .sayit :disabled { opacity: .45; cursor: default; }
.sayit { display: flex; gap: 6px; }
.sayit input { flex: 1; min-width: 0; font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg-2); color: var(--ink); }
.sayit input:focus { outline: none; border-color: var(--accent); }
.tweaked { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 6px; font-size: 12px; color: var(--ok); }
.tweaked[hidden] { display: none; }
.tweaked svg { width: 13px; height: 13px; }
.tweaked span { color: var(--faint); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats div { background: var(--bg-2); border-radius: 10px; padding: 8px 10px; }
.stats b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
.stats span { font-size: 12px; color: var(--faint); }
.stats .warn b { color: var(--warn); }
.film .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; padding-top: 4px; gap: 8px; flex-wrap: wrap; }
.film .foot .acts { display: flex; gap: 8px; }

/* ---------- done, records ---------- */
.finish { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.finish .ok { display: flex; align-items: center; gap: 14px; }
.finish .ok .badge { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, #5eead4, #22c55e); color: #06140d; flex-shrink: 0; box-shadow: 0 10px 26px rgba(34, 197, 94, .3); }
.finish .ok .badge svg { width: 26px; height: 26px; }
.finish video { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: var(--r); display: block; }
.rec { font-size: 13px; color: var(--ok); padding: 10px 14px; border-radius: 10px; background: var(--ok-soft); }
.rec.bad { background: var(--warn-soft); color: var(--warn); }
.finish .acts { display: flex; gap: 10px; flex-wrap: wrap; }
.tablewrap { overflow-x: auto; padding: 6px 14px; }
.records { width: 100%; min-width: 760px; border-collapse: collapse; font-size: 13px; }
.records th, .records td { text-align: left; padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.records tr:last-child td { border-bottom: 0; }
.records th { color: var(--faint); font-weight: 600; font-size: 12px; white-space: nowrap; }
.records td small { display: block; color: var(--faint); font-size: 12px; margin-top: 3px; }

/* ---------- edit ---------- */
.editbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
.editbar .grow { flex: 1; }
.editbar h1 { font-size: 24px; }
.edit { display: grid; grid-template-columns: minmax(0, 1fr) 430px; gap: 22px; align-items: start; }
.music { padding: 16px 18px; margin-bottom: 22px; }
.music .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 13px; color: var(--muted); gap: 12px; flex-wrap: wrap; }
.music .head b { color: var(--ink); }
.bands { display: flex; height: 30px; gap: 3px; }
.bands div { display: flex; align-items: center; padding: 0 10px; border-radius: 6px; font-size: 12px; white-space: nowrap; overflow: hidden; color: #0d0e11; font-weight: 600; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--faint); }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
.part { margin-bottom: 26px; }
.part .ph { display: flex; gap: 12px; align-items: baseline; margin-bottom: 10px; }
.part .ph .n { font-size: 12px; color: var(--faint); letter-spacing: .1em; }
.part .ph h2 { font-size: 16px; }
.part .ph .s { color: var(--faint); font-size: 13px; }
.tiles { display: flex; flex-wrap: wrap; gap: 10px; }
.tile { position: relative; border: 0; border-radius: 11px; padding: 0; background: var(--panel); overflow: hidden; text-align: left; outline: 1px solid var(--line); transition: transform .15s, outline-color .15s; cursor: grab; touch-action: pan-y; }
.tile.ghost { opacity: .25; outline: 2px dashed var(--accent); filter: saturate(.4); }
.tiles.sorting .tile, .tiles.sorting .tile:hover { transition: none; }      /* Sortable moves the tiles itself while sorting */
.tiles.sorting .tile:hover { transform: none; }
/* the copy under the pointer: Sortable reads its computed transform on every move, so no transition may lag it;
   lifted with scale and rotate, which compose with that transform instead of replacing it */
.lifted { opacity: 1 !important; transition: none !important; scale: 1.06; rotate: 1.2deg;
  box-shadow: 0 24px 50px rgba(0,0,0,.55), 0 0 0 2px var(--accent) !important; cursor: grabbing; z-index: 100 !important; }
.part .ph .hint { margin-left: auto; font-size: 12px; color: var(--faint); white-space: nowrap; }
.tile:hover { transform: translateY(-2px); outline-color: var(--line-2); }
.tile.sel { outline: 2px solid var(--accent); box-shadow: 0 0 0 5px rgba(255, 139, 77, .15); }
.tile .pic { position: relative; height: 96px; background: #000; overflow: hidden; }
.tile .pic img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: blur(8px) brightness(.5); transform: scale(1.2); }
.tile .pic img.fg { position: relative; width: 100%; height: 100%; object-fit: contain; }
.tile .pic::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,.35), transparent 35%); }
.tile .lvl { height: 3px; }
.tile .meta { padding: 6px 9px 8px; font-size: 12px; display: flex; gap: 4px; align-items: center; }
.tile .meta .t { color: var(--faint); margin-right: auto; font-variant-numeric: tabular-nums; }
.tile .num { position: absolute; z-index: 1; top: 6px; left: 7px; color: #fff; font-size: 12px; font-weight: 700; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
.tile .lock { position: absolute; z-index: 2; top: 66px; right: 6px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: rgba(0,0,0,.6); color: #fff; opacity: 0; transition: opacity .15s, background .15s; cursor: pointer; }
.tile .lock svg { width: 13px; height: 13px; }
.tile:hover .lock, .tile.sel .lock, .tile.locked .lock { opacity: 1; }
.tile .lock:hover { background: rgba(0,0,0,.85); }
.tile.locked .lock { background: var(--ok); color: #06140d; }
.tile.locked { outline: 2px solid color-mix(in srgb, var(--ok) 70%, transparent); cursor: pointer; }
.tile.locked.sel { outline-color: var(--accent); }
@media (hover: none) { .tile .lock { opacity: .9; } }
.tile.shuffling .pic { animation: shuf .6s ease-in-out infinite alternate; }
@keyframes shuf { to { filter: brightness(.4) blur(1.5px); } }
.tile.fresh .pic img { animation: popin .45s ease; }
.drawer .dh .btn svg, #shuffle svg { width: 14px; height: 14px; }
.tile .badges { position: absolute; z-index: 1; top: 6px; right: 6px; display: flex; gap: 3px; }
.tile .badges .tag { backdrop-filter: blur(6px); background: rgba(0,0,0,.5); }
.tile .badges .tag.changed { color: var(--ok); }
.tile .badges .tag.upright { color: var(--warn); }

.side { position: sticky; top: 84px; padding: 16px; display: flex; flex-direction: column; gap: 16px; max-height: calc(100vh - 104px); overflow: auto; }
.side > * { flex-shrink: 0; }
.side::-webkit-scrollbar { width: 8px; }
.side::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }
.viewer { position: relative; aspect-ratio: 16/9; background: #000; border-radius: 11px; overflow: hidden; }
.viewer video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.viewer .cap { position: absolute; left: 10px; bottom: 10px; background: rgba(0,0,0,.6); backdrop-filter: blur(6px); color: #fff; font-size: 12px; padding: 3px 10px; border-radius: 999px; }
.confirm { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-radius: 11px; background: rgba(255, 139, 77, .1); border: 1px solid rgba(255, 139, 77, .35); }
.confirm .grow { flex: 1; font-size: 13px; }
.slothead { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.slothead h2 { font-size: 18px; }
.kv { font-size: 13px; display: grid; grid-template-columns: 56px 1fr; gap: 5px 12px; margin: 0; }
.kv dt { color: var(--faint); }
.kv dd { margin: 0; color: var(--muted); }
.kv dd.strong { color: var(--ink); }
.sect h3 { font-size: 14px; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: baseline; }
.sect h3 small { font-weight: 400; color: var(--faint); font-size: 12px; }
.beats { display: flex; flex-direction: column; gap: 7px; }
.beat { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 11px; padding: 6px; border: 1px solid var(--line); border-radius: 11px; background: var(--bg-2); text-align: left; align-items: center; transition: .15s; }
.beat:hover:not(:disabled) { border-color: var(--line-2); background: var(--panel-2); }
.beat.cur { border-color: rgba(74, 222, 128, .45); }
.beat.prev { border-color: var(--accent); background: rgba(255, 139, 77, .08); }
.beat:disabled { opacity: .45; cursor: not-allowed; }
.beat .bp { height: 58px; border-radius: 7px; overflow: hidden; background: #000; }
.beat .bp img { width: 100%; height: 100%; object-fit: contain; }
.beat .bt { font-size: 13px; }
.beat .bt .w { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.beat .bt .w b { font-weight: 600; }
.beat .bt .m { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.note { font-size: 13px; padding: 9px 12px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); }
.chips { display: flex; gap: 5px; flex-wrap: wrap; margin: 10px 0; align-items: center; }
.chip { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 3px 11px; font-size: 12px; color: var(--muted); }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.toggle { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.empty { color: var(--faint); font-size: 13px; padding: 10px 2px; }
.findbox { padding: 14px; margin: -4px -4px 0; border-radius: 12px; background: var(--bg-2); border: 1px solid var(--line); }
.findbox .chips { margin-bottom: 0; }
.findbox .results { max-height: 250px; overflow: auto; margin-top: 10px; overscroll-behavior: contain; }
.findbox .results:has(.empty) { max-height: none; }
.findbox .results .empty { padding: 2px; }
/* the selected shot's card, spread out under its part: click to preview, double-click to replace */
.tile.open { box-shadow: 0 0 0 5px rgba(255, 139, 77, .15), 0 10px 0 -2px var(--accent); }
.drawer { margin-top: 14px; padding: 14px; border-radius: 14px; border: 1px solid rgba(255, 139, 77, .4);
  background: linear-gradient(180deg, rgba(255, 139, 77, .09), rgba(255, 139, 77, .03)), var(--panel); }
.drawer .dh { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; }
.drawer .dh b { font-size: 15px; }
.drawer .dq { color: var(--muted); }
.drawer .grow { flex: 1; }
.drawer .hint { font-size: 12px; color: #ffb08a; }
.drawer .dsub { font-size: 12px; color: var(--faint); margin: 6px 0 12px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.drow { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
.bcard { flex: 0 0 210px; display: flex; flex-direction: column; gap: 6px; padding: 6px; border: 1px solid var(--line); border-radius: 11px; background: var(--bg-2); text-align: left; transition: .15s; user-select: none; }
.bcard:hover:not(:disabled) { border-color: var(--line-2); background: var(--panel-2); }
.bcard.cur { border-color: rgba(74, 222, 128, .7); box-shadow: 0 0 0 3px rgba(74, 222, 128, .15); cursor: default; }
.bcard:disabled:not(.cur) { opacity: .45; cursor: not-allowed; }
.bcard.prev { border-color: var(--accent); background: rgba(255, 139, 77, .1); box-shadow: 0 0 0 3px rgba(255, 139, 77, .15); }
.bcard .bp { aspect-ratio: 16/9; border-radius: 7px; overflow: hidden; background: #000; position: relative; }
.bcard .bp .over { position: absolute; left: 6px; bottom: 6px; font-size: 11px; padding: 1px 8px; border-radius: 999px; background: rgba(0,0,0,.65); color: #fff; }
.bcard .bp img { width: 100%; height: 100%; object-fit: contain; }
.bcard .bw { font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.9em; }
.bcard .m { display: flex; gap: 4px; flex-wrap: wrap; }
.beat.hit { cursor: pointer; }
.beat.off { opacity: .45; cursor: not-allowed; }
.beat .swap { margin-left: auto; padding: 2px 12px; }
.pvinfo { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.pvinfo .grow { flex: 1; min-width: 0; }
.rough .box { width: min(980px, 100%); }
.rough .viewer { border-radius: 14px; }
.rough .bar2 { display: flex; justify-content: space-between; align-items: center; color: var(--muted); margin-top: 12px; font-size: 13px; gap: 12px; }
.toast button { margin-left: 14px; border: 0; background: none; color: #c2410c; font-weight: 700; padding: 0; }
.askbox { width: min(460px, 100%); padding: 24px; }
.askbox h2 { font-size: 19px; margin-bottom: 10px; }
.askbox p { color: var(--muted); margin: 6px 0; font-size: 14px; }
.askbox .acts { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
.btn.danger { color: #fb7185; border-color: rgba(251, 113, 133, .35); }
.btn.danger:hover { background: rgba(251, 113, 133, .1); border-color: #fb7185; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 18px; border-radius: 999px; z-index: 60; font-size: 13px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.4); }

@media (max-width: 1100px) {
  .films, .setup, .pickrow { grid-template-columns: minmax(0, 1fr); }
  .hero { min-height: 360px; padding: 28px 20px 26px; border-radius: 18px; }
  .hero .shade { background: linear-gradient(to top, rgba(7,8,11,.9) 10%, rgba(7,8,11,.35) 65%, rgba(7,8,11,.15)); }
  .hero h1 { font-size: 23px; }
  .edit { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; max-height: none; }
}
@media (max-width: 640px) {
  main { padding: 18px 16px; }
  header.top { padding: 12px 16px; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 26px; }
  .music .head, .part .ph { flex-direction: column; align-items: flex-start; gap: 4px; }
  .bands div { padding: 0 4px; font-size: 10px; }
  .tile { width: calc(50% - 5px) !important; }
  .song { grid-template-columns: 44px minmax(0, 1fr) auto; }
  .song .play { grid-row: 1; grid-column: 3; }
  .song .check { display: none; }
  .go { flex-direction: column; align-items: stretch; }
  .opt { max-width: none; }
  .part .ph .hint { margin-left: 0; }
  .helpwrap { position: static; }                /* on a phone the help card spans the footage panel */
  .pop { left: 12px; right: 12px; width: auto; top: 64px; }
  .fstrip { display: none; }
  .work { padding: 20px; }
  .work .stage { grid-template-columns: minmax(0, 1fr); grid-template-rows: 130px auto; height: auto; }
  .stage .say { max-height: 110px; }
  .jobpill { left: 12px; right: 12px; bottom: 12px; justify-content: center; }

<script>
"use strict";
const D = window.PROTO;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const NAMES = ["方案一", "方案二", "方案三"];
const SECTION = { intro: "前奏", verse: "主歌", build: "铺垫", chorus: "副歌", inst: "间奏", outro: "尾声", bridge: "桥段" };
const LEVEL = { quiet: "安静", mid: "中等", build: "铺垫", peak: "高潮" };
const SIZES = ["远景", "全景", "中景", "近景", "特写"];
const ICON = {
  play: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4.5 2.8v10.4L13 8z"/></svg>',
  pause: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5h3v11H4zM9 2.5h3v11H9z"/></svg>',
  check: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M3 8.5l3.2 3L13 4.5"/></svg>',
  upload: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>',
  search: '<svg class="mag" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>',
  back: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 3L5 8l5 5"/></svg>',
  film: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M6.5 6v4l3.5-2z" fill="currentColor"/></svg>',
  reel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="14" height="14" rx="3"/><path d="M17 10l4-2.5v9L17 14"/><path d="M3 9h14M7 5v4M11 5v4"/></svg>',
  note: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l11-2.5v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="15.5" r="2.5"/><path d="M9 10l11-2.5"/></svg>',
  folder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.6l2 2h7.4A2.5 2.5 0 0 1 21 9.5v8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/></svg>',
  chev: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3l5 5-5 5"/></svg>',
  lock: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3.5" y="7" width="9" height="6.5" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>',
  unlock: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3.5" y="7" width="9" height="6.5" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 4.9-.7"/></svg>',
  shuffle: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4.5h2.5c2.5 0 3.5 7 6 7H14M2 11.5h2.5c1 0 1.8-1.2 2.5-2.7M14 4.5h-3.5c-1 0-1.8 1.2-2.5 2.7M12 2.5l2 2-2 2M12 9.5l2 2-2 2"/></svg>',
  scissors: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="7" r="3"/><circle cx="6" cy="17" r="3"/><path d="M8.6 8.6L20 18M8.6 15.4L20 6"/></svg>',
};
const clock = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const secs = s => `${(Math.round(s * 10) / 10).toFixed(1).replace(/\.0$/, "")} 秒`;
const beatOf = (cid, n) => D.cards[cid].beats.find(b => b.n === n);

// per-viewer conveniences only; the page works without them
const store = {
  get(k, d) { try { const v = localStorage.getItem("proto:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("proto:" + k, JSON.stringify(v)); } catch { /* storage off */ } },
};
function toast(msg, action) {
  document.querySelectorAll(".toast").forEach(o => o.remove());
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  if (action) {
    const b = document.createElement("button");
    b.textContent = action.label; b.onclick = () => { t.remove(); action.run(); };
    t.appendChild(b);
  }
  setTimeout(() => t.remove(), action ? 5000 : 2200);
}

// ---------- songs ----------
// recommended for this footage; only the library's songs have been analysed into sections and bars
const RECOMMENDED = [
  { title: "生命里", why: "温暖、有回顾感，适合把一路上的人串起来", missing: true },
  { id: "Forester-Symphony", why: "1:03 鼓点一起进副歌，接起飞、雪山大景" },
  { id: "Forester-All My Days", why: "125 BPM，明快，适合自驾和户外" },
  { id: "keshi-Forever", why: "74 BPM 的慢歌，适合黄昏、海边和收尾" },
];
const songById = id => D.library.find(s => s.id === id);
const songOf = r => r.id ? { ...songById(r.id), why: r.why } : { id: "rec:" + r.title, title: r.title, artist: "", why: r.why, missing: true };
function cover(title) {
  let h = 0; for (const c of title) h = (h * 31 + c.codePointAt(0)) % 360;
  return `background: linear-gradient(135deg, hsl(${h} 70% 55%), hsl(${(h + 50) % 360} 65% 40%))`;
}
const player = new Audio();
let playing = null;
function playSong(song, btn) {
  if (playing === song.id) { player.pause(); return; }
  player.src = song.file;
  player.currentTime = Math.max(0, song.chorus - 2);
  player.play().catch(() => toast("浏览器拦下了播放，再点一次"));
  playing = song.id;
  clearTimeout(playSong.stop);
  playSong.stop = setTimeout(() => player.pause(), 20000);       // a 20 s taste from just before the chorus
  document.querySelectorAll(".play").forEach(b => { b.classList.remove("on"); b.innerHTML = ICON.play; });
  btn.classList.add("on"); btn.innerHTML = ICON.pause;
}
player.addEventListener("pause", () => {
  playing = null;
  document.querySelectorAll(".play.on").forEach(b => { b.classList.remove("on"); b.innerHTML = ICON.play; });
});

// ---------- route ----------
function draw() {
  stopPlayers();
  closeJob(); $("#donepop")?.remove();
  $("#app").onclick = null;
  const [page, arg] = location.hash.replace(/^#\/?/, "").split("/");
  if (page === "music") musicPage();
  else if (page === "ask") askPage();
  else if (page === "choose") { jobSeen(); choosePage(); }
  else if (page === "edit" && D.films[+arg]) editPage(+arg);
  else if (page === "done" && D.films[+arg]) donePage(+arg);
  else if (page === "records") recordsPage();
  else uploadPage();
  scrollTo(0, 0);                                   // after the new page is in: scrolling the old one first showed as a flash
}
// a new page fades in over the old one (where the browser can), once the pictures in view are decoded or a quarter second
// has passed, so it does not blink empty and then fill in
function route() {
  const settle = () => Promise.race([
    Promise.all([...document.querySelectorAll("#app img")].filter(i => i.getBoundingClientRect().top < innerHeight).slice(0, 16)
      .map(i => i.decode().catch(() => {}))),
    new Promise(r => setTimeout(r, 250))]);
  if (document.startViewTransition && !matchMedia("(prefers-reduced-motion: reduce)").matches)
    document.startViewTransition(() => { draw(); return settle(); });
  else draw();
}
window.addEventListener("hashchange", route);
function stopPlayers() {
  player.pause();
  document.querySelectorAll("video").forEach(v => { v.pause(); v.removeAttribute("src"); v.load(); });
}

// ---------- 1 upload ----------
// the upload page holds only the footage and the start; the music and the brief are optional, each on its own page
const getSetup = () => ({ song: "Forester-Symphony", order: "place", ask: "", ...store.get("setup", {}) });
const putSetup = setup => store.set("setup", setup);
const allSongs = () => [...RECOMMENDED.map(songOf), ...D.library.filter(s => !RECOMMENDED.some(r => r.id === s.id))];
const ORDER = { place: "同一地点连在一起", time: "按拍摄时间" };

// the footage to cut: the NAS folders' videos, ticked or not, plus any added here (a mock: nothing is sent)
const NAS = D.folders.map(f => ({ id: f.id, name: f.name, path: f.path, items: f.videos.map(v => ({
  key: `${f.id}/${v.id}`, name: v.name, seconds: v.seconds, at: v.at, upright: v.upright,
  pic: `<img src="${esc(v.thumb)}" alt="" loading="lazy">` })) }));
const nasKeys = new Set(NAS.flatMap(g => g.items.map(i => i.key)));
let picked = new Set(store.get("picked", NAS.find(g => g.id === "pj").items.map(i => i.key)));   // the films are cut from this folder
let opened = new Set(store.get("opened", []));        // folders shown open
let added = [];                                       // groups added on this page, like the NAS ones; gone on reload
const groups = () => [...NAS, ...added];
const onIn = items => items.filter(i => picked.has(i.key));
const footageSummary = () => {
  const folders = NAS.map(g => ({ name: g.name, n: onIn(g.items).length })).filter(x => x.n);
  const nas = folders.reduce((s, x) => s + x.n, 0), mine = added.reduce((s, g) => s + onIn(g.items).length, 0);
  const seconds = groups().reduce((s, g) => s + onIn(g.items).reduce((t, i) => t + i.seconds, 0), 0);
  return { count: nas + mine, nas, mine, seconds, folders };
};
const minutes = s => s >= 3600 ? `${Math.floor(s / 3600)} 小时 ${Math.round(s % 3600 / 60)} 分` : s >= 60 ? `${Math.floor(s / 60)} 分 ${Math.round(s % 60)} 秒` : `${Math.round(s)} 秒`;
const dayOf = at => at ? `${+at.slice(5, 7)}月${+at.slice(8, 10)}日` : "日期未知";
const spanOf = items => {
  const d = items.map(i => i.at).filter(Boolean).sort();
  if (!d.length) return "";
  const a = dayOf(d[0]), b = dayOf(d[d.length - 1]);
  return a === b ? a : `${a} – ${b}`;
};
const localIso = ms => { const t = new Date(ms); return new Date(ms - t.getTimezoneOffset() * 60000).toISOString().slice(0, 16); };
const tri = (n, total) => n === 0 ? "" : n === total ? "on" : "some";
const runsOf = items => {                              // stretches of the same shooting day, in shooting order
  const runs = [];
  items.forEach((it, k) => {
    const d = dayOf(it.at), last = runs[runs.length - 1];
    if (last && last.day === d) last.b = k + 1; else runs.push({ day: d, a: k, b: k + 1 });
  });
  return runs;
};

function uploadPage() {
  const setup = getSetup();
  const song = allSongs().find(s => s.id === setup.song);
  $("#app").innerHTML = `
    <section class="hero">
      <video class="hv" src="hero.mp4" poster="hero.jpg" muted loop playsinline preload="auto" aria-hidden="true"></video>
      <div class="shade"></div>
      <div class="hx">
        <div class="eyebrow">A-NAS · 视频剪辑原型</div>
        <h1>把一次旅行，<br>剪成一支<em>跟着音乐走</em>的短片</h1>
        <p class="lead">从 NAS 的文件夹里勾选这次要剪的视频，点开始剪辑。A-NAS 看懂每段画面，按歌曲的段落和小节规划三个版本，你挑一个，再逐个镜头换成更喜欢的。</p>
      </div>
    </section>
    <div class="panel step media" id="media">
      <div class="step-h">
        <span class="badge">${ICON.reel}</span>
        <div><div class="step-n">素材</div><h2>选这次要剪的视频</h2></div>
        <span class="grow"></span>
        <span class="picked" id="picked"></span>
        <span class="helpwrap">
          <button class="help" id="help" aria-label="说明" aria-expanded="false">?</button>
          <div class="pop" id="pop" hidden>
            <b>怎么选素材</b>
            <p>NAS 里的视频按文件夹列出。点文件夹展开，里面按拍摄时间排好、按天分开。</p>
            <p>文件夹前的圆圈勾选整个文件夹，日期那一行勾选那一天；点一下视频勾选或取消，按住 Shift 点可以连选一段。只剪勾选的视频。</p>
            <p>点 ＋ 添加这台电脑上的视频，也可以把视频或整个文件夹拖进这个框，一个文件夹成为一组。</p>
            <p class="faint">原型是模拟的：添加的文件不会离开这台电脑，三版成片仍用“新西兰 · 品杰手机”里的示例素材剪。</p>
          </div>
        </span>
      </div>
      <div class="folders" id="folders"></div>
    </div>
    <div class="panel go">
      <div class="opts">
        <a class="opt tune" href="#/music"><span class="badge">${ICON.note}</span>
          <span class="tx"><small>配乐</small><b>${esc(song ? song.title : "未选")}</b></span><span class="more">更改 ›</span></a>
        <a class="opt cut" href="#/ask"><span class="badge">${ICON.scissors}</span>
          <span class="tx"><small>剪辑要求</small><b>${esc(ORDER[setup.order] + (setup.ask ? " · " + setup.ask : ""))}</b></span><span class="more">更改 ›</span></a>
      </div>
      <button class="btn primary big" id="go">${ICON.film}开始剪辑</button>
    </div>`;

  // the hero film plays unless the viewer asked for less motion; then its first frame stands still
  const hv = $(".hero .hv");
  hv.currentTime = 0.7;                             // past the fade in from black, which is only for the loop's seam
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) hv.play().catch(() => {});

  const groupOf = id => groups().find(g => g.id === id);
  const fold = id => document.querySelector(`.fold[data-g="${CSS.escape(id)}"]`);
  const tile = it => `
    <button class="vt ${picked.has(it.key) ? "on" : ""}" data-key="${esc(it.key)}" title="${esc(it.name)}">
      ${it.pic}<span class="ck">${ICON.check}</span>
      <span class="vm"><span>${esc(it.at ? it.at.slice(11, 16) : it.name)}</span><span class="len">${it.seconds ? clock(it.seconds) : ""}</span></span>
      ${it.upright ? '<span class="up">竖</span>' : ""}${it.fresh ? '<span class="new">新加</span>' : ""}
    </button>`;
  const bodyHTML = g => `<div class="vscroll"><div class="vgrid">${runsOf(g.items).map(r => `
      <button class="day" data-run="${r.a}-${r.b}"><span class="tick ${tri(onIn(g.items.slice(r.a, r.b)).length, r.b - r.a)}">${ICON.check}<i></i></span>
        ${r.day}<small>${r.b - r.a} 段</small></button>
      ${g.items.slice(r.a, r.b).map(tile).join("")}`).join("")}</div></div>`;
  const subOf = g => {
    const seconds = g.items.reduce((s, i) => s + i.seconds, 0), span = spanOf(g.items);
    return `<span class="fpath">${esc(g.path)} · </span>${g.items.length} 段${seconds ? ` · ${minutes(seconds)}` : ""}${span ? ` · ${span}` : ""}`;
  };
  function groupHTML(g) {
    const n = onIn(g.items).length, open = opened.has(g.id), total = g.items.length;
    const strip = Array.from({ length: Math.min(6, total) }, (_, k) => g.items[Math.floor(k * total / Math.min(6, total))].pic);
    return `<section class="fold ${open ? "open" : ""}" data-g="${esc(g.id)}">
      <div class="fhead">
        <button class="tick ${tri(n, total)}" data-all aria-label="勾选整个文件夹">${ICON.check}<i></i></button>
        <button class="ftog" data-tog aria-expanded="${open}">
          <span class="ficon">${ICON.folder}</span>
          <span class="fname"><b>${esc(g.name)}</b><small>${subOf(g)}</small></span>
          <span class="fstrip">${strip.join("")}</span>
          <span class="fn">${n ? `已选 ${n}` : "未选"}</span>
          <span class="chev">${ICON.chev}</span>
        </button>
      </div>
      <div class="fbody">${open ? bodyHTML(g) : ""}</div>
    </section>`;
  }
  function drawFolders() {
    $("#folders").innerHTML = groups().map(groupHTML).join("") + `
      <label class="fadd" title="添加视频"><b>＋</b>添加视频<input id="pick" type="file" accept="video/*,.mov,.mp4" multiple hidden></label>`;
    $("#pick").onchange = e => { addGroup(null, [...e.target.files]); e.target.value = ""; };
    drawCount();
  }
  function drawCount() {
    const f = footageSummary(), total = groups().reduce((s, g) => s + g.items.length, 0);
    $("#picked").innerHTML = `已选 <b>${f.count}</b> / ${total} 段${f.seconds ? ` · 约 ${minutes(f.seconds)}` : ""}`;
    store.set("picked", [...picked].filter(k => nasKeys.has(k)));
    store.set("opened", [...opened].filter(id => !id.startsWith("+")));
  }
  // after a tick changes: the tiles' marks, each folder's and day's circle and count, the total; nothing is rebuilt
  function refresh() {
    document.querySelectorAll(".vt").forEach(t => t.classList.toggle("on", picked.has(t.dataset.key)));
    for (const g of groups()) {
      const sec = fold(g.id); if (!sec) continue;
      const n = onIn(g.items).length;
      sec.querySelector("[data-all]").className = `tick ${tri(n, g.items.length)}`;
      sec.querySelector(".fn").textContent = n ? `已选 ${n}` : "未选";
      sec.querySelectorAll(".day").forEach(d => {
        const [a, b] = d.dataset.run.split("-").map(Number);
        d.querySelector(".tick").className = `tick ${tri(onIn(g.items.slice(a, b)).length, b - a)}`;
      });
    }
    drawCount();
  }
  const setAll = (items, on) => { items.forEach(i => on ? picked.add(i.key) : picked.delete(i.key)); refresh(); };
  const flip = items => setAll(items, onIn(items).length < items.length);   // all on → all off, otherwise all on

  // one listener for the whole list: open or close a folder, tick a folder, a day, a video, or a run with Shift
  let last = null;
  $("#folders").onclick = e => {
    const sec = e.target.closest(".fold"); if (!sec) return;
    const g = groupOf(sec.dataset.g);
    if (e.target.closest("[data-all]")) return flip(g.items);
    if (e.target.closest("[data-tog]")) {
      const open = !opened.has(g.id);
      open ? opened.add(g.id) : opened.delete(g.id);
      sec.classList.toggle("open", open);
      sec.querySelector("[data-tog]").setAttribute("aria-expanded", open);
      sec.querySelector(".fbody").innerHTML = open ? bodyHTML(g) : "";
      return drawCount();
    }
    const day = e.target.closest(".day");
    if (day) { const [a, b] = day.dataset.run.split("-").map(Number); return flip(g.items.slice(a, b)); }
    const t = e.target.closest(".vt"); if (!t) return;
    const keys = g.items.map(i => i.key), k = keys.indexOf(t.dataset.key), on = !picked.has(t.dataset.key);
    const from = e.shiftKey && last && last.g === g.id ? last.k : k;
    const [a, b] = [from, k].sort((x, y) => x - y);
    last = { g: g.id, k };
    setAll(g.items.slice(a, b + 1), on);
  };

  // added videos: a picked batch joins one "新加的视频" group, a dropped folder becomes a group of its own
  const isVideo = f => f.type.startsWith("video/") || /\.(mov|mp4|m4v|mts|avi|mkv)$/i.test(f.name);
  function addGroup(name, files) {
    const fresh = files.filter(isVideo).sort((a, b) => a.lastModified - b.lastModified || a.name.localeCompare(b.name));
    if (!fresh.length) return toast(name ? `“${name}”里没有可以用的视频` : "没有可以用的视频，支持 MOV、MP4");
    let g = name ? null : added.find(x => x.loose);
    if (!g) {
      g = { id: `+${added.length}`, name: name || "新加的视频", path: "这台电脑", loose: !name, items: [] };
      added.push(g);
    }
    const items = fresh.map((file, n) => {
      const url = URL.createObjectURL(file);
      return { key: `${g.id}/${g.items.length + n}`, name: file.name, seconds: 0, at: localIso(file.lastModified), fresh: true, url,
        pic: `<video src="${url}#t=0.5" muted preload="metadata"></video><span class="vicon">${ICON.film}</span>` };
    });
    g.items.push(...items);
    items.forEach(i => picked.add(i.key));
    opened.add(g.id);
    drawFolders();
    toast(`添加了 ${items.length} 段视频${name ? `（${name}）` : ""}`);
    items.forEach(it => {                              // fill in each length once the browser has read it
      const v = document.createElement("video");
      v.preload = "metadata";
      v.onloadedmetadata = () => {
        it.seconds = v.duration || 0;
        const len = document.querySelector(`.vt[data-key="${CSS.escape(it.key)}"] .len`);
        if (len && it.seconds) len.textContent = clock(it.seconds);
        const sub = fold(g.id)?.querySelector(".fname small");
        if (sub) sub.innerHTML = subOf(g);
        drawCount();
      };
      v.src = it.url;
    });
  }
  async function filesOf(entry) {
    if (entry.isFile) return [await new Promise((res, rej) => entry.file(res, rej))];
    const reader = entry.createReader(), out = [];
    for (;;) {
      const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
      if (!batch.length) return out;
      for (const e of batch) out.push(...await filesOf(e));
    }
  }

  // the explanation behind the question mark
  const pop = $("#pop"), help = $("#help");
  const showHelp = on => { pop.hidden = !on; help.setAttribute("aria-expanded", on); help.classList.toggle("on", on); };
  help.onclick = e => { e.stopPropagation(); showHelp(pop.hidden); };
  document.addEventListener("click", function away(e) {
    if (!$("#pop")) return document.removeEventListener("click", away);
    if (!e.target.closest(".helpwrap")) showHelp(false);
  });
  document.addEventListener("keydown", function esc(e) {
    if (!$("#pop")) return document.removeEventListener("keydown", esc);
    if (e.key === "Escape") showHelp(false);
  });

  // dropping onto the whole panel adds the videos; the entries must be taken before the first await
  const media = $("#media");
  media.ondragover = e => { e.preventDefault(); media.classList.add("over"); };
  media.ondragleave = e => { if (!media.contains(e.relatedTarget)) media.classList.remove("over"); };
  media.ondrop = async e => {
    e.preventDefault(); media.classList.remove("over");
    const entries = [...e.dataTransfer.items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
    if (!entries.length) return addGroup(null, [...e.dataTransfer.files]);
    const loose = [];
    for (const en of entries) {
      if (en.isDirectory) addGroup(en.name, await filesOf(en)); else loose.push(...await filesOf(en));
    }
    if (loose.length) addGroup(null, loose);
  };

  $("#go").onclick = () => {
    const f = footageSummary();
    if (!f.count) return toast("至少勾选一段视频");
    startJob(f);
  };
  drawFolders();
}

// ---------- the cutting job (a mock) ----------
// It runs by the clock from a start time kept in the browser, so the viewer can close the window, go to other pages
// or reload and it carries on; a pill in the corner shows it, and when it ends the page (and the system, where the
// browser allows notifications) says so. While it runs, the window shows what each step is looking at.
const JOB_STEPS = [
  { show: "read", ms: 2400 },
  { show: "frames", ms: 2200, name: "按画面切成卡片，取关键帧" },
  { show: "check", ms: 1800, name: "检查模糊、抖动、遮挡" },
  { show: "describe", ms: 6000, name: "本机模型给每张卡片写描述" },
  { show: "song", ms: 2400, name: "分析歌曲的段落、节拍和小节" },
  { show: "plan", ms: 3600, name: "规划三个版本" },
  { show: "render", ms: 3200, name: "渲染三条成片" },
];
const JOB_TOTAL = JOB_STEPS.reduce((s, x) => s + x.ms, 0);
const TITLE = document.title;
let job = store.get("job", null);                      // {start, first, done}
let jobTimer = 0, jobWin = null, jobShown = "";

function startJob(f) {
  player.pause();
  const first = [f.mine ? `上传 ${f.mine} 段新加的视频` : "", f.nas ? `读取 NAS 里的 ${f.nas} 段视频` : ""].filter(Boolean).join("，");
  job = { start: Date.now(), first };
  store.set("job", job);
  openJob();
  if (!jobTimer) jobTimer = setInterval(tickJob, 120);
  tickJob();
}
function jobAt() {
  let t = Date.now() - job.start;
  for (let i = 0; i < JOB_STEPS.length; i++) {
    if (t < JOB_STEPS[i].ms) return { i, t, frac: t / JOB_STEPS[i].ms, all: (Date.now() - job.start) / JOB_TOTAL };
    t -= JOB_STEPS[i].ms;
  }
  return { i: JOB_STEPS.length, done: true, all: 1 };
}
const stepName = i => JOB_STEPS[i].name || job.first;

function openJob() {
  closeJob();
  jobShown = "";
  const m = document.createElement("div");
  m.className = "modal";
  m.innerHTML = `<div class="panel work">
    <div class="eyebrow">正在剪辑</div><h2 style="margin-top:6px;font-size:20px">A-NAS 正在看你的素材</h2>
    <div class="stage" id="stage"></div>
    <div class="bar"><div></div></div>
    <ol>${JOB_STEPS.map((_, i) => `<li><i></i>${esc(stepName(i))}</li>`).join("")}</ol>
    <div class="leave"><span>剪辑在 NAS 上进行，关掉这个窗口也会继续。</span>
      <button class="btn small" id="away">先去忙别的，好了通知我</button></div></div>`;
  document.body.appendChild(m);
  jobWin = m;
  $("#away", m).onclick = () => {
    closeJob();
    if (window.isSecureContext && "Notification" in window && Notification.permission === "default") Notification.requestPermission();
    toast("好了会在右下角提醒你，也可以随时点开看进度");
    tickJob();
  };
}
function closeJob() { if (jobWin) jobWin.remove(); jobWin = null; }

function tickJob() {
  if (!job) { clearInterval(jobTimer); jobTimer = 0; return; }
  const at = jobAt();
  if (at.done) return finishJob();
  if (jobWin) {
    jobWin.querySelectorAll("li").forEach((li, j) => { li.className = j < at.i ? "done" : j === at.i ? "now" : ""; });
    $(".bar div", jobWin).style.width = `${at.all * 100}%`;
    drawStage(at);
  }
  drawPill(at);
}

// a pill in the corner while the window is closed: the step and the share done; a click opens the window again
// built once and then only its text and bar change: rebuilding it each tick restarted the spinner, which then stuttered
function drawPill(at) {
  let pill = $("#jobpill");
  if (jobWin || !job) return pill && pill.remove();
  if (!pill) {
    pill = document.createElement("button");
    pill.id = "jobpill"; pill.className = "jobpill";
    pill.innerHTML = `<i></i><span class="pt"></span><span class="pbar"><b></b></span>`;
    pill.onclick = () => { if (job && job.done) location.hash = "#/choose"; else openJob(); };
    document.body.appendChild(pill);
  }
  if (job.done) {
    if (!pill.classList.contains("done")) { pill.classList.add("done"); pill.innerHTML = `${ICON.check}三版成片好了 · 去看看`; }
    return;
  }
  $(".pt", pill).textContent = `正在剪辑 · ${at.i + 1}/${JOB_STEPS.length}`;
  $(".pbar b", pill).style.width = `${at.all * 100}%`;
}

function finishJob() {
  clearInterval(jobTimer); jobTimer = 0;
  if (jobWin) {                                        // watched to the end: straight to the films (the page change closes the window)
    job = null; store.set("job", null);
    if (location.hash === "#/choose") route(); else location.hash = "#/choose";
    return;
  }
  if (job.done) return drawPill({});
  job.done = true; store.set("job", job);
  drawPill({});
  document.title = `✓ 成片好了 · ${TITLE}`;
  donePop();
  if (window.isSecureContext && "Notification" in window && Notification.permission === "granted") {
    const n = new Notification("三版成片好了", { body: "点开挑一版，满意就确认，不满意就换镜头。" });
    n.onclick = () => { window.focus(); location.hash = "#/choose"; n.close(); };
  }
}
// the job ended while the viewer was elsewhere: a card in the middle of whatever page they are on
function donePop() {
  $("#donepop")?.remove();
  const m = document.createElement("div");
  m.className = "modal"; m.id = "donepop";
  m.innerHTML = `<div class="panel donebox" role="dialog" aria-labelledby="dpt">
    <span class="okb">${ICON.check}</span>
    <h2 id="dpt">三版成片好了</h2>
    <p>同一批素材、同一首歌，规划了三个版本。<br>挑一个：满意就确认，想换镜头就去改。</p>
    <div class="dthumbs">${D.films.map((f, i) => {
      const s = f.slots[Math.floor(f.slots.length * .6)];
      return `<div><img src="${esc(beatOf(s.card, s.beat).frame)}" alt=""><span>${NAMES[i]}</span></div>`;
    }).join("")}</div>
    <div class="acts"><button class="btn ghost" id="later">等会儿再看</button><button class="btn primary" id="seeit">${ICON.play}去挑一版</button></div>
  </div>`;
  document.body.appendChild(m);
  const later = () => { m.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = e => { if (e.key === "Escape") later(); };
  document.addEventListener("keydown", onKey);
  m.onclick = e => { if (e.target === m) later(); };
  $("#later", m).onclick = later;
  $("#seeit", m).onclick = () => { later(); location.hash = "#/choose"; };
  $("#seeit", m).focus();
}
// the films seen: the job and its reminders are over
function jobSeen() {
  if (job && job.done) { job = null; store.set("job", null); }
  $("#jobpill")?.remove();
  document.title = TITLE;
}

// what the current step is looking at: built when the picture changes, the moving parts (typed text, playhead,
// render progress) updated in place, so nothing flickers
function drawStage(at) {
  const st = $("#stage", jobWin), step = JOB_STEPS[at.i], cards = Object.values(D.cards);
  const every = (ms, n) => Math.min(n - 1, Math.floor(at.t / ms));
  const pic = (src, say, count, extra = "") => `<div class="pic"><img src="${esc(src)}" alt=""></div>
    <div class="say">${say}${extra}<div class="count">${count}</div></div>`;
  let base = step.show, build = () => "", live = () => {};
  if (step.show === "read") {
    const items = groups().flatMap(g => onIn(g.items)).filter(i => !i.url), n = items.length, shown = Math.min(n, 30);
    if (n) {
      const k = every(step.ms / shown, shown), it = items[Math.floor(k * n / shown)];
      base += k;
      build = () => pic(it.pic.match(/src="([^"]+)"/)[1], `<b>读取 ${esc(it.name)}</b>${it.seconds ? clock(it.seconds) : ""}`, `${Math.floor(k * n / shown) + 1} / ${n} 段`);
    } else build = () => `<div class="say wide"><b>${esc(job.first)}</b></div>`;
  } else if (step.show === "frames") {
    const k = every(260, cards.length), c = cards[(k * 7) % cards.length];
    base += k;
    build = () => `<div class="keys">${c.beats.slice(0, 5).map(b => `<img src="${esc(b.frame)}" alt="">`).join("")}</div>
      <div class="say"><b>切出 ${c.beats.length} 个节拍，各取一张关键帧</b><div class="count">${k + 1} / ${cards.length} 张卡片</div></div>`;
  } else if (step.show === "check") {
    const k = every(220, cards.length), c = cards[(k * 7 + 2) % cards.length];
    base += k;
    build = () => pic(c.beats[0].frame, "<b>检查画面</b>", `${k + 1} / ${cards.length} 张卡片`,
      `<div class="chips">${k % 6 === 4 ? '<span class="bad">有点糊，少用</span>' : "<span>清晰</span>"}<span>稳定</span><span>无遮挡</span></div>`);
  } else if (step.show === "describe") {
    const per = 1500, k = every(per, cards.length), c = cards[(k * 11 + 3) % cards.length];
    const text = c.summary || c.beats[0].what;
    base += k;
    build = () => pic(c.beats[0].frame, `<b>${esc(c.scene || "这张卡片")}</b><span class="typed"></span>`, "");
    live = () => {
      $(".typed", st).textContent = text.slice(0, Math.min(text.length, Math.ceil(((at.t - k * per) / (per * .8)) * text.length)));
      $(".count", st).textContent = `已写 ${Math.max(1, Math.round(at.frac * cards.length))} / ${cards.length} 张`;
    };
  } else if (step.show === "song") {
    const parts = D.song.parts, span = parts[parts.length - 1].end - parts[0].start;
    build = () => `<div class="say wide"><b>${esc(D.song.title)} · ${esc(D.song.artist)}</b>
      <div class="songbar">${parts.map(p => `<span class="${p.level}" style="flex:${p.end - p.start}">${esc(p.label)}</span>`).join("")}<i></i></div>
      <div class="count"></div></div>`;
    live = () => {
      const found = parts.filter(p => (p.start - parts[0].start) / span <= at.frac).length;
      st.querySelectorAll(".songbar span").forEach((x, j) => x.classList.toggle("in", j < found));
      $(".songbar i", st).style.left = `${at.frac * 100}%`;
      $(".count", st).textContent = `找到 ${found} 个段落、${Math.round(at.frac * span / D.song.bar)} 个小节`;
    };
  } else if (step.show === "plan") {
    const k = every(step.ms / 3, 3);
    base += k;
    build = () => `<div class="say wide plans">${D.films.map((f, j) => `<div class="${j <= k ? "in" : ""}"><b>${NAMES[j]}</b>${j <= k ? esc(f.pitch) : "规划中…"}</div>`).join("")}</div>`;
  } else {
    build = () => `<div class="say wide renders">${D.films.map((f, j) => `<div class="row"><b>${NAMES[j]}</b><span class="reel2">
      ${f.slots.map(s => `<img src="${esc(beatOf(s.card, s.beat).frame)}" style="flex:${s.slot[1] - s.slot[0]}" alt="">`).join("")}</span></div>`).join("")}</div>`;
    live = () => st.querySelectorAll(".reel2").forEach((r, j) => r.style.setProperty("--done", `${Math.max(0, Math.min(1, at.frac * 1.3 - j * .15)) * 100}%`));
  }
  if (base !== jobShown) { jobShown = base; st.innerHTML = build(); }
  live();
}

function filmStats(f) {

  return { shots: f.slots.length, upright: cards.filter(c => c.upright).length, videos: new Set(cards.map(c => c.video)).size };

          <div class="design">${esc(f.design)}</div>

const RECORD = "record", RECORDS = "records";

async function confirmFilm(fi, from) {
  const film = D.films[fi], setup = getSetup(), song = allSongs().find(s => s.id === setup.song);

  const changed = Object.keys(edits).map(Number).sort((a, b) => a - b);
  const deleted = Object.keys(removed).map(Number).sort((a, b) => a - b);
  const entry = {
    action: changed.length || deleted.length ? "修改后确认" : "直接确认", from, film: film.tag, version: NAMES[fi],
    footage: (f => [...f.folders.map(x => `${x.name} ${x.n} 段`), f.mine ? `新加 ${f.mine} 段` : ""].filter(Boolean).join("、"))(footageSummary()),
    song: song ? song.title : setup.song, order: ORDER[setup.order], ask: setup.ask,
    changed: changed.map(i => ({ shot: number(i), slot: i + 1, card: edits[i].card, beat: edits[i].beat })),
    deleted: deleted.map(i => ({ slot: i + 1, card: removed[i].pick.card, beat: removed[i].pick.beat, filled: FILLED[removed[i].by] })),
    seconds: +(kept.length ? kept[kept.length - 1].b : 0).toFixed(2),

  try {
