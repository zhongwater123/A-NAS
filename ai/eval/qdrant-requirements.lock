# The Qdrant retrieval trial's client (docs/research/qdrant-retrieval-features.md),
# for the development machine only. It is pinned by hash for Debian 13's CPython 3.13
# on x86_64 and layered over anas-ai-dev:trixie (ai/dev.Dockerfile). That image
# keeps numpy, certifi, scikit-learn and MediaPipe, so they are not repeated here.
# The venv lives on WSL's own disk and sees the image's packages through a .pth file:
#   python3 -m venv /qe/venv
#   echo /opt/anas-ai/lib/python3.13/site-packages > /qe/venv/lib/python3.13/site-packages/anas-ai.pth
#   /qe/venv/bin/pip install --no-deps --require-hashes --only-binary=:all: -r eval/qdrant-requirements.lock
