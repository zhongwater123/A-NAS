# A-NAS managed Hermes policy (spike). Root-owned and read-only inside the
# sandbox, so the agent cannot re-enable what is switched off here. setup.sh
# replaces spike-model with the real model's name when SPIKE_MODEL is set.
model:
  provider: custom
  default: spike-model
  base_url: http://127.0.0.1:18001/v1
  api_mode: chat_completions
  # The gateway outside the sandbox adds the real key.
  api_key: spike-not-a-secret
  context_length: 128000
# `hermes serve` builds every session's agent from the cli entry (tui_gateway
# server._load_enabled_toolsets); api_server is the API Server channel. Hermes's
# own tools are on wherever the sandbox already stops what they could break
# (ADR 0024 decision 3): the terminal and code run as the member, with the
# personal space and Shared read-only, no network and nothing of anyone else;
# dangerous commands wait for the member's approval like 提交更改. vision and
# video send images and frames to the model: for testing only, until a local
# model (decision 7).
platform_toolsets:
  cli: [file, terminal, code_execution, delegation, clarify, vision, video, memory, session_search, skills, todo, anas]
  api_server: [file, terminal, code_execution, delegation, clarify, vision, video, memory, session_search, skills, todo, anas]
agent:
  # Every toolset at the pinned commit except the ones above, including the ones tool
  # modules and plugins register at runtime (a2a, browser-cdp, browser-use): what needs the
  # network the sandbox does not have, a desktop, accounts elsewhere, or installs code. The platform
  # lists only cover the platforms named there, and serve also builds agents for others (a
  # triggered cron job got connections and vision); this list applies to all. Composites
  # (debugging, safe) stay out: a disabled toolset removes every tool it resolves to, and
  # debugging includes the file tools. toolsets-check.py (run by probe.sh) checks all this.
  disabled_toolsets: [web, search, x_search, image_gen, video_gen, computer_use,
    browser, cronjob, tts, context_engine, connections, project, bot_room, desktop_ui, onboarding, catalog,
    kanban, discord, discord_admin, yuanbao, feishu_doc, feishu_drive, coding,
    a2a, browser-cdp, browser-use]
  # Never switch to the coding posture (its own toolset and prompt) in a git workspace.
  coding_context: "off"
  # Images in tool results never reach the model as pixels, even with a model configured
  # as vision-capable: Hermes keeps them as a file path (photos-vision.sh, #113). Showing
  # photos to a local multimodal model is a decision of its own (ADR 0024 decision 7).
  image_input_mode: text
  # A question the assistant asks waits as long as a confirmation.
  clarify_timeout: 86400
# Commands start in the assistant's own folder.
terminal:
  backend: local
  cwd: /nas/助手
# How long a session's first agent build waits for MCP discovery (default 1.5 s);
# serve starts discovery when the first /api/ws client connects.
mcp_discovery_timeout: 20
mcp_servers:
  anas:
    command: /opt/a-nas/assistant-runtimes/spike/venv/bin/python
    args: [/spike/anas_mcp.py]
    # Each call of a tool without readOnlyHint (提交更改) waits for the member's
    # in-turn approval; Hermes asks before it reaches the server.
    trust: untrusted
    tools:
      prompts: false
      resources: false
skills:
  external_dirs: [/opt/a-nas/assistant-skills]
  auto_load: [anas-files, anas-member]
tools:
  # List the A-NAS tools directly instead of behind tool_search.
  tool_search:
    enabled: "off"
approvals:
  mode: manual
  # A card waits for the member up to a day (user decision, 2026-10-16); the
  # session gate ends it sooner when the member's session ends. setup.sh
  # replaces it with SPIKE_APPROVAL_TIMEOUT when set.
  timeout: 86400
security:
  allow_lazy_installs: false
  allow_private_urls: false
auth:
  adopt_external_logins: false
updates:
  check: false
model_catalog:
  enabled: false
lsp:
  enabled: false
plugins:
  auto_update_check_hours: 0
gateway:
  multiplex_profiles: false
  auto_multiplex_migration: false
# agent.log in the Hermes home is readable by the agent's own file tools, and at Hermes's default
# INFO it records every member message, so cleared memory could be found again there (#114).
logging:
  level: WARNING
