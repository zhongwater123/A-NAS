# A-NAS managed Hermes policy (spike). Root-owned and read-only inside the
# sandbox, so the agent cannot re-enable what is switched off here. setup.sh
# replaces spike-model with the real model's name when SPIKE_MODEL is set.
model:
  provider: custom
  default: spike-model
  base_url: http://127.0.0.1:18001/v1
  api_mode: chat_completions
  # The gateway outside the sandbox adds the real key.
  api_key: spike-not-a-secret
  context_length: 128000
# `hermes serve` builds every session's agent from the cli entry (tui_gateway
# server._load_enabled_toolsets); api_server is the API Server channel. Hermes's
# own tools are on wherever the sandbox already stops what they could break
# (ADR 0024 decision 3): the terminal and code run as the member, with the
# personal space and Shared read-only, no network and nothing of anyone else;
# dangerous commands wait for the member's approval like 提交更改. vision and
# video send images and frames to the model: for testing only, until a local
# model (decision 7). cronjob schedules tasks (user decision, 2026-10-20); they run
# through anas-assistant-cron@.service, with the cron list: no one is there to answer a
# question, and a job does not schedule more jobs. browser is Hermes's own browser tools,
# served only by the member's VNAS window for the WebOS page it shows (browser control,
# user decision 2026-10-20); with no window attached they are not offered, so a scheduled
# task, which has no window, has none. companion moves the companion on the desktop the
# member is talking on (#412); a scheduled task lists it too, and hears from it that no
# desktop is in use: its unit has no companion socket (assistant-install.sh).
platform_toolsets:
  cli: [file, terminal, code_execution, delegation, clarify, vision, video, memory, session_search, skills, todo, cronjob, browser, anas, companion]
  api_server: [file, terminal, code_execution, delegation, clarify, vision, video, memory, session_search, skills, todo, cronjob, browser, anas, companion]
  cron: [file, terminal, code_execution, delegation, vision, video, memory, session_search, skills, todo, anas, companion]
agent:
  # Every toolset at the pinned commit except the ones above, including the ones tool
  # modules and plugins register at runtime (a2a, browser-cdp, browser-use): what needs the
  # network the sandbox does not have, a desktop, accounts elsewhere, or installs code. The platform
  # lists only cover the platforms named there, and serve also builds agents for others (a
  # triggered cron job got connections and vision); this list applies to all. Composites
  # (debugging, safe) stay out: a disabled toolset removes every tool it resolves to, and
  # debugging includes the file tools. toolsets-check.py (run by probe.sh) checks all this.
  disabled_toolsets: [web, search, x_search, image_gen, video_gen, computer_use,
    tts, context_engine, connections, project, bot_room, desktop_ui, onboarding, catalog,
    kanban, discord, discord_admin, yuanbao, feishu_doc, feishu_drive, coding,
    a2a, browser-cdp, browser-use]
  # Never switch to the coding posture (its own toolset and prompt) in a git workspace.
  coding_context: "off"
  # Images in tool results never reach the model as pixels, even with a model configured
  # as vision-capable: Hermes keeps them as a file path (photos-vision.sh, #113). Showing
  # photos to a local multimodal model is a decision of its own (ADR 0024 decision 7).
  image_input_mode: text
  # A question the assistant asks waits as long as a confirmation.
  clarify_timeout: 86400
# Commands start in the assistant's own folder.
terminal:
  backend: local
  cwd: /nas/助手
# How long a session's first agent build waits for MCP discovery (default 1.5 s);
# serve starts discovery when the first /api/ws client connects.
mcp_discovery_timeout: 20
mcp_servers:
  anas:
    command: /opt/a-nas/assistant-runtimes/spike/venv/bin/python
    args: [/spike/anas_mcp.py]
    # Each call of a tool without readOnlyHint (提交更改) waits for the member's
    # in-turn approval; Hermes asks before it reaches the server.
    trust: untrusted
    tools:
      prompts: false
      resources: false
  companion:
    command: /opt/a-nas/assistant-runtimes/spike/venv/bin/python
    args: [/spike/anas_companion_mcp.py]
    # The companion's tools (#412) run without a card: they move and animate the
    # companion on the screen of the conversation that asked, and change none of
    # the member's data. A separate server, so that a call waiting for the window
    # never holds up 提交更改 (Hermes runs one call per server at a time). Hermes
    # knows only "full" and "untrusted" and reads a YAML boolean as "untrusted",
    # and the managed policy wins only for the keys it writes, so every key is
    # written out. lazy: false takes the tools from the live server, not from a
    # cache the agent can write. Hermes gives up on a call after timeout seconds,
    # past the product service's own 15 s wait for the window.
    trust: full
    enabled: true
    lazy: false
    timeout: 30
    tools:
      prompts: false
      resources: false
skills:
  external_dirs: [/opt/a-nas/assistant-skills]
  auto_load: [anas-files, anas-member, anas-scheduled-tasks, anas-desktop]
tools:
  # List the A-NAS tools directly instead of behind tool_search.
  tool_search:
    enabled: "off"
approvals:
  mode: manual
  # A card waits for the member up to a day (user decision, 2026-10-16); the
  # session gate ends it sooner when the member's session ends. setup.sh
  # replaces it with SPIKE_APPROVAL_TIMEOUT when set.
  timeout: 86400
  # A scheduled task runs with no one there to approve: a dangerous command, a script or
  # 提交更改 in it is refused (Hermes's default, made explicit; user decision, 2026-10-20).
  cron_mode: deny
# Hermes's browser control: a client that logged in (Hermes's own login, assistant-start.sh)
# may register as the browser for its session; the VNAS window does, for the WebOS page.
# The browser tools then reach only that window, which never navigates away from WebOS,
# and refuse otherwise (browser.backend "off" in the member's config: no Browser Use CLI).
browser:
  extension_control:
    enabled: true
security:
  allow_lazy_installs: false
  allow_private_urls: false
auth:
  adopt_external_logins: false
updates:
  check: false
model_catalog:
  enabled: false
lsp:
  enabled: false
plugins:
  auto_update_check_hours: 0
gateway:
  multiplex_profiles: false
  auto_multiplex_migration: false
# agent.log in the Hermes home is readable by the agent's own file tools, and at Hermes's default
# INFO it records every member message, so cleared memory could be found again there (#114).
logging:
  level: WARNING
# Hermes's own Chinese for what it shows the member, the background review's
# summary among it (locales/zh.yaml).
display:
  language: zh
# The curator keeps its defaults (prune unused agent-made skills, no model call);
# an instance never stays idle the two hours it waits for, so a weekly timer
# runs it instead (anas-assistant-curator@.timer).
