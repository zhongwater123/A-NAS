# Drop-in for anas-assistant@.service: the API Server channel used before
# `hermes serve` (setup.sh installs it with SPIKE_CHANNEL=api_server).
[Service]
Environment=ANAS_ASSISTANT_CHANNEL=api_server
Environment=API_SERVER_ENABLED=true API_SERVER_HOST=127.0.0.1 API_SERVER_PORT=8642 API_SERVER_KEY=k7Qx9vT2mR4pL8wNz3Jd-%i
ExecStartPost=
ExecStartPost=/bin/bash /spike/wait-port.sh 8642
