# Ruff for the AI Worker, its evaluations and the assistant spike: `make ai-lint`.
# The rules are Ruff's defaults; requirements-dev.lock pins the version.
target-version = "py313"
line-length = 120
# The spike's scripts import each other from their own folder.
src = [".", "assistant-spike"]

[lint.isort]
combine-as-imports = true
