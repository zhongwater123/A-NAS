version: 2
# Minor and patch updates of an ecosystem arrive as one pull request (web
# packages as a few, below); a major update gets its own.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    groups:
      go:
        update-types: [minor, patch]

  # golangci-lint's own module (Makefile, go-lint). Its tool directive leaves
  # every requirement marked indirect, which Dependabot skips unless allowed.
  - package-ecosystem: gomod
    directory: /tools/golangci-lint
    schedule:
      interval: monthly
    allow:
      - dependency-name: github.com/golangci/golangci-lint/v2

  # Web packages come in three groups, so that an update that needs work does
  # not hold back the others: one group for all of them failed 29 tests on the
  # @assistant-ui bumps (#232). A package joins the first group it matches.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    groups:
      # New findings or formatting, fixed in the same pull request.
      lint:
        patterns: ["@biomejs/*", "oxlint", "eslint-plugin-*"]
        update-types: [minor, patch]
      # Released together and still 0.x, where a minor release changes the
      # API; the @assistant-ui/tap override in package.json follows them.
      assistant-ui:
        patterns: ["@assistant-ui/*"]
        update-types: [minor, patch]
      # The other 0.x packages get a pull request each; add a new one here.
      web:
        patterns: ["*"]
        exclude-patterns: ["@xterm/addon-fit", "dom-accessibility-api"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        update-types: [minor, patch]
