name: Vulnerability check

# `make check` scans every pull request and merge; this run reports advisories
# published since, while nobody pushes. GitHub runs it on main only and sends
# the failure to whoever last changed the cron line.
on:
  schedule:
    - cron: "17 2 * * 1" # Mondays 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: Known vulnerabilities the code can reach
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # The Go release matters as much as the modules: the standard library
      # has advisories of its own.
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: true

      - name: Run govulncheck
        run: make vuln-check
