name: Fuzz

# Every fuzz target runs for five minutes once a week (#223, #278). The targets
# are found in the code, each func Fuzz... in a _test.go file, so a new one
# needs no change here. A failing run uploads the input that failed; copy it
# into the package's testdata/fuzz/<target>/ so that `go test` keeps checking
# it. Like the weekly vulnerability check, this is never a required check:
# other pull requests do not run it.
on:
  schedule:
    - cron: "41 3 * * 6" # Saturdays 03:41 UTC
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/fuzz.yml]

permissions:
  contents: read

jobs:
  targets:
    name: Find the fuzz targets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      targets: ${{ steps.find.outputs.targets }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: true

      # go test -list prints a package's matching tests, then "ok <package>".
      - name: List each package's fuzz targets
        id: find
        shell: bash
        run: |
          mapfile -t packages < <(git grep -l '^func Fuzz' -- '*_test.go' | xargs -r -n 1 dirname | sort -u | sed 's|^|./|')
          targets=$(go test -list '^Fuzz' "${packages[@]}" |
            awk '/^Fuzz/ { names[++n] = $1; next } /^ok / { for (i = 1; i <= n; i++) print $2, names[i]; n = 0 }' |
            jq -cnR '[inputs | split(" ") | {package: .[0], target: .[1]}]')
          echo "$targets" | jq .
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  fuzz:
    name: ${{ matrix.target }} in ${{ matrix.package }}
    needs: targets
    if: ${{ needs.targets.outputs.targets != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.targets) }}
    env:
      PACKAGE: ${{ matrix.package }}
      TARGET: ${{ matrix.target }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: true

      - name: Fuzz for five minutes
        run: go test -run='^$' -fuzz="^${TARGET}\$" -fuzztime=5m "$PACKAGE"

      - name: Find the failing input
        id: failure
        if: ${{ failure() }}
        run: echo "directory=$(go list -f '{{.Dir}}' "$PACKAGE")/testdata/fuzz/$TARGET" >> "$GITHUB_OUTPUT"

      - name: Upload the failing input
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ strategy.job-index }}-${{ matrix.target }}
          path: ${{ steps.failure.outputs.directory }}
          if-no-files-found: ignore
