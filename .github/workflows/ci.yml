name: CI

# A branch is checked through its pull request; main is checked after each merge.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request replaces its running checks. Each commit on
# main has a group of its own, so its run neither waits nor is cancelled
# (a group keeps one pending run): a merge that breaks main shows on its commit.
# The price: merges in quick succession each run every job, system test too.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The main branch's ruleset requires the three jobs below by name: rename one
# there too. A pull request that changes only documentation gets the document
# checks; the two test jobs are skipped by their condition, which GitHub counts
# as passed (path filters on the workflow would leave them pending instead and
# block the merge).
jobs:
  scope:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.scope.outputs.docs-only }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2

      # An explicit bash runs with pipefail, so a failure of the script fails the step.
      - name: Find out whether only documentation changes
        id: scope
        shell: bash
        run: scripts/ci-scope.sh "$GITHUB_EVENT_NAME" | tee -a "$GITHUB_OUTPUT"

  check:
    name: Project checks
    needs: scope
    # Also when the scope job fails: its answer is then empty, and every check runs.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: true
          cache-dependency-path: |
            go.sum
            tools/golangci-lint/go.sum

      # make docs-check, alone or within make check, checks the documents'
      # links with this lychee release: the one the Makefile names, checked
      # against its published SHA-256.
      - name: Install lychee
        run: |
          version="$(sed -n 's/^LYCHEE_VERSION = //p' Makefile)"
          curl -fsSL -o "$RUNNER_TEMP/lychee.tar.gz" "https://github.com/lycheeverse/lychee/releases/download/lychee-v$version/lychee-x86_64-unknown-linux-gnu.tar.gz"
          echo "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a  $RUNNER_TEMP/lychee.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/lychee.tar.gz" -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/lychee-x86_64-unknown-linux-gnu/lychee" /usr/local/bin/lychee
          lychee --version

      - name: Check the documentation
        if: ${{ needs.scope.outputs.docs-only == 'true' }}
        run: make docs-check

      - name: Set up Node.js
        if: ${{ needs.scope.outputs.docs-only != 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tools/openapi/package-lock.json

      # The runner's ShellCheck is older and judges differently; this is the
      # release the Makefile names, checked against its published SHA-256.
      - name: Install ShellCheck
        if: ${{ needs.scope.outputs.docs-only != 'true' }}
        run: |
          version="$(sed -n 's/^SHELLCHECK_VERSION = //p' Makefile)"
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" "https://github.com/koalaman/shellcheck/releases/download/v$version/shellcheck-v$version.linux.x86_64.tar.xz"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/shellcheck-v$version/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      # The AI Worker runs on Debian 13's CPython 3.13 (ai/requirements.txt).
      - name: Set up Python
        if: ${{ needs.scope.outputs.docs-only != 'true' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # Ruff for `make ai-lint`. NumPy, pinned by the runtime's lock (its
      # entry runs to the first line without a continuation), lets the
      # clustering tests run; the real-model tests need model files and stay skipped.
      - name: Install the AI tools and test dependencies
        if: ${{ needs.scope.outputs.docs-only != 'true' }}
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r ai/requirements-dev.txt
          sed -n '/^numpy==/,/[^\\]$/p' ai/requirements.txt |
            python3 -m pip install --require-hashes --only-binary=:all: -r /dev/stdin
          python3 -m pip check

      # The vector index tests run the Qdrant server the release pins
      # (deploy/qdrant/qdrant.json), checked against its SHA-256. The cache
      # holds the checked tarball and binary, so that a run seldom depends on
      # a download from GitHub; the script checks them again either way.
      - name: Restore the pinned Qdrant server
        if: ${{ needs.scope.outputs.docs-only != 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/qdrant
          key: qdrant-${{ hashFiles('deploy/qdrant/qdrant.json') }}

      - name: Fetch the pinned Qdrant server
        if: ${{ needs.scope.outputs.docs-only != 'true' }}
        run: scripts/fetch-qdrant.sh

      - name: Run checks
        if: ${{ needs.scope.outputs.docs-only != 'true' }}
        env:
          ANAS_QDRANT_REQUIRED: "1"
        run: make check

  race:
    name: Go tests with the race detector
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: true

      # The vector index tests run the Qdrant server the release pins
      # (deploy/qdrant/qdrant.json), checked against its SHA-256.
      - name: Restore the pinned Qdrant server
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/qdrant
          key: qdrant-${{ hashFiles('deploy/qdrant/qdrant.json') }}

      - name: Fetch the pinned Qdrant server
        run: scripts/fetch-qdrant.sh

      # No Node.js: make race-test leaves out internal/webui, the one package
      # that needs the built Web assets.
      - name: Run the Go tests with the race detector
        env:
          ANAS_QDRANT_REQUIRED: "1"
        run: make race-test

  system:
    name: System test (Debian 13, systemd)
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Assembling the image with debootstrap took two of the job's six
      # minutes. A cached image serves until its build script changes, or for
      # a week, after which a rebuild takes in Debian's updates; within the
      # week every run tests against the same packages.
      - name: Name the cached Debian 13 systemd image
        id: image
        run: echo "key=system-test-image-$(date -u +%G-W%V)-${{ hashFiles('scripts/build-system-test-image.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the Debian 13 systemd image
        id: image-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/anas-systemd.tar
          key: ${{ steps.image.outputs.key }}

      - name: Load the cached image
        if: ${{ steps.image-cache.outputs.cache-hit == 'true' }}
        run: docker load --quiet --input "$RUNNER_TEMP/anas-systemd.tar"

      - name: Build the Debian 13 systemd image
        if: ${{ steps.image-cache.outputs.cache-hit != 'true' }}
        run: |
          scripts/build-system-test-image.sh anas-systemd:trixie debian:bookworm
          docker save --output "$RUNNER_TEMP/anas-systemd.tar" anas-systemd:trixie

      # Saved at once, so that a failing test does not discard the image.
      - name: Cache the Debian 13 systemd image
        if: ${{ steps.image-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/anas-systemd.tar
          key: ${{ steps.image.outputs.key }}

      - name: Load the Btrfs module for the test's data volume
        run: sudo modprobe btrfs

      # The release stages the pinned Qdrant tarball as deploy-dev.ps1 does.
      - name: Restore the pinned Qdrant server
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/qdrant
          key: qdrant-${{ hashFiles('deploy/qdrant/qdrant.json') }}

      - name: Fetch the pinned Qdrant server
        run: scripts/fetch-qdrant.sh

      - name: Install the release under systemd and check every entry point
        run: make system-test
