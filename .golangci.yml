# golangci-lint v2, pinned by tools/golangci-lint/go.mod; `make go-lint` runs it.
version: "2"

run:
  # Lint the integration tests too, which `go test` builds only on request.
  build-tags: [rootintegration, dockerintegration]

linters:
  default: none
  enable:
    - bodyclose
    - depguard
    - errcheck
    - errorlint
    - gosec
    - ineffassign
    - modernize
    - nolintlint
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unused

  settings:
    depguard:
      # What the root binaries link (#221). Each rule lists every package in
      # one binary's dependency closure and allows only the imports they have
      # today, so a new import there is a reviewed change to this list; shrink
      # the lists as packages split further. Tests are left out: they may run
      # a Product Service client against the root side.
      rules:
        host-agent:
          list-mode: strict
          files:
            - "**/cmd/anas-host-agent/*.go"
            - "**/internal/accountid/*.go"
            - "**/internal/appid/*.go"
            - "**/internal/assistantchanges/*.go"
            - "**/internal/assistantlogin/*.go"
            - "**/internal/capacity/*.go"
            - "**/internal/datavolume/*.go"
            - "**/internal/envconfig/*.go"
            - "**/internal/filebroker/rootbroker/*.go"
            - "**/internal/filebroker/wire/*.go"
            - "**/internal/filesystem/*.go"
            - "**/internal/hostops/linux/*.go"
            - "**/internal/hoststate/*.go"
            - "**/internal/hoststate/agent/rootagent/*.go"
            - "**/internal/hoststate/agent/wire/*.go"
            - "**/internal/hoststate/linux/*.go"
            - "**/internal/httpjson/*.go"
            - "**/internal/ptyshell/*.go"
            - "**/internal/sessiondir/*.go"
            - "**/internal/sessionlookup/*.go"
            - "**/internal/sqlitedb/*.go"
            - "**/internal/systemdscope/*.go"
            - "**/internal/systemlog/*.go"
            - "**/internal/systemlog/journal/*.go"
            - "**/internal/taskmanager/*.go"
            - "**/internal/unixmsg/*.go"
            - "**/internal/websearchswitch/*.go"
            - "!$test"
          allow:
            - "$gostd"
            - "github.com/caarlos0/env/v11"
            - "github.com/coreos/go-systemd/v22/dbus"
            - "github.com/coreos/go-systemd/v22/unit"
            - "github.com/creack/pty"
            - "github.com/godbus/dbus/v5"
            - "github.com/landlock-lsm/go-landlock/landlock"
            - "github.com/mattn/go-sqlite3"
            - "golang.org/x/sync/singleflight"
            - "golang.org/x/sys/unix"
            - "github.com/zhongwater123/A-NAS/internal/accountid$"
            - "github.com/zhongwater123/A-NAS/internal/appid$"
            - "github.com/zhongwater123/A-NAS/internal/assistantchanges$"
            - "github.com/zhongwater123/A-NAS/internal/assistantlogin$"
            - "github.com/zhongwater123/A-NAS/internal/capacity$"
            - "github.com/zhongwater123/A-NAS/internal/datavolume$"
            - "github.com/zhongwater123/A-NAS/internal/envconfig$"
            - "github.com/zhongwater123/A-NAS/internal/filebroker/rootbroker$"
            - "github.com/zhongwater123/A-NAS/internal/filebroker/wire$"
            - "github.com/zhongwater123/A-NAS/internal/filesystem$"
            - "github.com/zhongwater123/A-NAS/internal/hostops/linux$"
            - "github.com/zhongwater123/A-NAS/internal/hoststate$"
            - "github.com/zhongwater123/A-NAS/internal/hoststate/agent/rootagent$"
            - "github.com/zhongwater123/A-NAS/internal/hoststate/agent/wire$"
            - "github.com/zhongwater123/A-NAS/internal/hoststate/linux$"
            - "github.com/zhongwater123/A-NAS/internal/httpjson$"
            - "github.com/zhongwater123/A-NAS/internal/ptyshell$"
            - "github.com/zhongwater123/A-NAS/internal/sessiondir$"
            - "github.com/zhongwater123/A-NAS/internal/sessionlookup$"
            - "github.com/zhongwater123/A-NAS/internal/sqlitedb$"
            - "github.com/zhongwater123/A-NAS/internal/systemdscope$"
            - "github.com/zhongwater123/A-NAS/internal/systemlog$"
            - "github.com/zhongwater123/A-NAS/internal/systemlog/journal$"
            - "github.com/zhongwater123/A-NAS/internal/taskmanager$"
            - "github.com/zhongwater123/A-NAS/internal/unixmsg$"
            - "github.com/zhongwater123/A-NAS/internal/websearchswitch$"
        container-agent:
          list-mode: strict
          files:
            - "**/cmd/anas-container-agent/*.go"
            - "**/internal/appid/*.go"
            - "**/internal/appstore/*.go"
            - "**/internal/appstore/agent/*.go"
            - "**/internal/appstore/engine/*.go"
            - "**/internal/containers/*.go"
            - "**/internal/containers/agent/*.go"
            - "**/internal/containers/docker/*.go"
            - "**/internal/envconfig/*.go"
            - "**/internal/httpjson/*.go"
            - "!$test"
          allow:
            - "$gostd"
            - "github.com/caarlos0/env/v11"
            - "github.com/compose-spec/compose-go/v2/loader"
            - "github.com/compose-spec/compose-go/v2/types"
            - "github.com/containerd/errdefs"
            - "github.com/docker/go-connections/nat$"
            - "github.com/moby/moby/api/pkg/stdcopy"
            - "github.com/moby/moby/api/types/container"
            - "github.com/moby/moby/api/types/image"
            - "github.com/moby/moby/api/types/mount"
            - "github.com/moby/moby/client"
            - "github.com/opencontainers/go-digest$"
            - "go.yaml.in/yaml/v4"
            - "golang.org/x/mod/semver"
            - "github.com/zhongwater123/A-NAS/internal/appid$"
            - "github.com/zhongwater123/A-NAS/internal/appstore$"
            - "github.com/zhongwater123/A-NAS/internal/appstore/agent$"
            - "github.com/zhongwater123/A-NAS/internal/appstore/engine$"
            - "github.com/zhongwater123/A-NAS/internal/containers$"
            - "github.com/zhongwater123/A-NAS/internal/containers/agent$"
            - "github.com/zhongwater123/A-NAS/internal/containers/docker$"
            - "github.com/zhongwater123/A-NAS/internal/envconfig$"
            - "github.com/zhongwater123/A-NAS/internal/httpjson$"
        # The Product Service and its other processes reach the root side only
        # through clients and contract packages.
        product:
          list-mode: lax
          files:
            - "$all"
            - "!$test"
            - "!**/cmd/anas-host-agent/*.go"
            - "!**/internal/filebroker/rootbroker/*.go"
            - "!**/internal/hoststate/agent/rootagent/*.go"
            - "!**/internal/hostops/linux/*.go"
            - "!**/internal/hoststate/linux/*.go"
            - "!**/internal/systemdscope/*.go"
            - "!**/internal/assistantchanges/*.go"
            - "!**/internal/systemlog/journal/*.go"
          deny:
            - pkg: "github.com/zhongwater123/A-NAS/internal/filebroker/rootbroker"
              desc: the root file broker; use internal/filebroker
            - pkg: "github.com/zhongwater123/A-NAS/internal/hoststate/agent/rootagent"
              desc: the Host Agent's handler; use internal/hoststate/agent
            - pkg: "github.com/zhongwater123/A-NAS/internal/hostops"
              desc: privileged executors run in the Host Agent only
            - pkg: "github.com/zhongwater123/A-NAS/internal/hoststate/linux"
              desc: host readers run in the Host Agent only
            - pkg: "github.com/zhongwater123/A-NAS/internal/systemdscope"
              desc: scopes for the broker's processes, in the Host Agent only
            - pkg: "github.com/zhongwater123/A-NAS/internal/assistantchanges"
              desc: the executor runs in the root broker; use filebroker.ErrChange*
            - pkg: "github.com/zhongwater123/A-NAS/internal/systemlog/journal"
              desc: journalctl runs in the Host Agent only
            - pkg: "github.com/landlock-lsm/go-landlock"
              desc: the root broker confines its workers
    errcheck:
      exclude-functions:
        # A query's failure shows in rows.Err after the loop, which
        # rowserrcheck requires: once Next fails, Close returns nil (#269).
        # Close only releases the connection; sqlclosecheck has it deferred.
        - (*database/sql.Rows).Close
        # Deferred so that a failed transaction is undone: after Commit it
        # returns sql.ErrTxDone, and on a failure the caller gets that failure.
        - (*database/sql.Tx).Rollback
        # Streams that are only read: a failed read has already been returned.
        - (io.ReadCloser).Close
        # A socket's Close says nothing about the exchange; its reads and
        # writes do. *net.conn is behind *net.UnixConn and *net.TCPConn.
        - (net.Conn).Close
        - (*net.conn).Close
        # coder/websocket's way to drop a connection, after Close or on failure.
        - (*github.com/coder/websocket.Conn).CloseNow
        # Raw descriptors are directories, O_PATH handles, and descriptors
        # received or not yet wrapped; files are written through *os.File.
        - golang.org/x/sys/unix.Close
        - syscall.Close
    errorlint:
      # Code classifies a failure with a sentinel and keeps the cause as text,
      # fmt.Errorf("%w: %v", ErrUnavailable, err), so that a caller's errors.Is
      # matches the domain error and never the cause. Comparisons, switches and
      # type assertions on errors are still checked.
      errorf: false
    # Rules with few findings stay on, so that new code is checked: each
    # finding they allow carries //nolint:gosec with its reason (#278). The
    # rules below stay off as a whole because they flag what this product does
    # by design, many times over; a sample of each found nothing real (#278).
    gosec:
      excludes:
        - G104 # Unhandled errors: errcheck's subject, with the exclusions above.
        - G115 # Integer conversions (31 findings): sizes, counts and IDs are checked where they come in.
        - G202 # SQL concatenation (20): queries join constant fragments and generated placeholders; values go through args.
        - G204 # Subprocesses (8): the Host Agent runs system tools with argument lists by design, never through a shell.
        - G302 # File permissions with chmod or OpenFile (8): chosen per path (shared spaces, ACL-managed trees).
        - G304 # Paths from variables (22): a NAS opens user paths by design; the file broker enforces access.
        - G704 # SSRF by taint (10): requests go to fixed Unix sockets and loopback hosts.
        - G705 # XSS by taint (6): handlers write JSON or files with an explicit Content-Type.
    # A //nolint names its linter and says why.
    nolintlint:
      require-explanation: true
      require-specific: true

  exclusions:
    generated: strict
    paths:
      # npm packages can carry Go code (flatted), which `./...` then includes.
      - web/node_modules
    rules:
      # Tests start throwaway servers, write fixtures and spawn tools.
      - path: _test\.go
        linters: [gosec]
      # Test helpers close response bodies through t.Cleanup, which bodyclose
      # cannot follow.
      - path: _test\.go
        linters: [bodyclose]
      # coder/websocket documents that the caller never closes Dial's response body.
      - linters: [bodyclose]
        source: websocket\.Dial\(
      # Error strings may start with a name.
      - linters: [staticcheck]
        text: "ST1005: error strings should not be capitalized"
        source: '"(Docker|Linux) '

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
