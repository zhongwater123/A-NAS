# golangci-lint v2, pinned by tools/golangci-lint/go.mod; `make go-lint` runs it.
version: "2"

run:
  # Lint the integration tests too, which `go test` builds only on request.
  build-tags: [rootintegration, dockerintegration]

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - gosec
    - ineffassign
    - modernize
    - nolintlint
    - staticcheck
    - unused

  settings:
    errcheck:
      exclude-functions:
        # A query's failure shows in rows.Err after the loop; Close only
        # releases the connection.
        - (*database/sql.Rows).Close
        # Deferred so that a failed transaction is undone: after Commit it
        # returns sql.ErrTxDone, and on a failure the caller gets that failure.
        - (*database/sql.Tx).Rollback
        # Streams that are only read: a failed read has already been returned.
        - (io.ReadCloser).Close
        # A socket's Close says nothing about the exchange; its reads and
        # writes do. *net.conn is behind *net.UnixConn and *net.TCPConn.
        - (net.Conn).Close
        - (*net.conn).Close
        # coder/websocket's way to drop a connection, after Close or on failure.
        - (*github.com/coder/websocket.Conn).CloseNow
        # Raw descriptors are directories, O_PATH handles, and descriptors
        # received or not yet wrapped; files are written through *os.File.
        - golang.org/x/sys/unix.Close
        - syscall.Close
    errorlint:
      # Code classifies a failure with a sentinel and keeps the cause as text,
      # fmt.Errorf("%w: %v", ErrUnavailable, err), so that a caller's errors.Is
      # matches the domain error and never the cause. Comparisons, switches and
      # type assertions on errors are still checked.
      errorf: false
    # Rules with few findings stay on, so that new code is checked: each
    # finding they allow carries //nolint:gosec with its reason (#278). The
    # rules below stay off as a whole because they flag what this product does
    # by design, many times over; a sample of each found nothing real (#278).
    gosec:
      excludes:
        - G104 # Unhandled errors: errcheck's subject, with the exclusions above.
        - G115 # Integer conversions (31 findings): sizes, counts and IDs are checked where they come in.
        - G202 # SQL concatenation (20): queries join constant fragments and generated placeholders; values go through args.
        - G204 # Subprocesses (8): the Host Agent runs system tools with argument lists by design, never through a shell.
        - G302 # File permissions with chmod or OpenFile (8): chosen per path (shared spaces, ACL-managed trees).
        - G304 # Paths from variables (22): a NAS opens user paths by design; the file broker enforces access.
        - G704 # SSRF by taint (10): requests go to fixed Unix sockets and loopback hosts.
        - G705 # XSS by taint (6): handlers write JSON or files with an explicit Content-Type.
    # A //nolint names its linter and says why.
    nolintlint:
      require-explanation: true
      require-specific: true

  exclusions:
    generated: strict
    paths:
      # npm packages can carry Go code (flatted), which `./...` then includes.
      - web/node_modules
    rules:
      # Tests start throwaway servers, write fixtures and spawn tools.
      - path: _test\.go
        linters: [gosec]
      # Test helpers close response bodies through t.Cleanup, which bodyclose
      # cannot follow.
      - path: _test\.go
        linters: [bodyclose]
      # coder/websocket documents that the caller never closes Dial's response body.
      - linters: [bodyclose]
        source: websocket\.Dial\(
      # Error strings may start with a name.
      - linters: [staticcheck]
        text: "ST1005: error strings should not be capitalized"
        source: '"(Docker|Linux) '

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
