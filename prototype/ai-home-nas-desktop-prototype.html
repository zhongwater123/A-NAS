<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">

  <title>AI 家庭 NAS · 桌面 OS 原型</title>
  <!--
    THROWAWAY PROTOTYPE
    Validated direction: browser-based desktop OS shell, based on user reference.
    This is not production code and stores no state.
  -->
  <style>
    :root {
      --text: #18202c;
      --muted: #6d7581;
      --line: rgba(27, 36, 48, .11);
      --glass: rgba(248, 250, 255, .78);
      --glass-strong: rgba(255, 255, 255, .92);
      --blue: #3478f6;
      --green: #2fc865;
      --orange: #ff9d3d;
      --red: #ff5d62;
      --purple: #8067e8;
      --shadow: 0 26px 80px rgba(15, 22, 44, .28);
      --font: Inter, "SF Pro Display", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; margin: 0; font-family: var(--font); }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    svg.icon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .desktop {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      color: white;
      background:
        radial-gradient(circle at 77% 12%, rgba(255,239,181,.98) 0 6%, rgba(255,202,128,.78) 20%, transparent 38%),
        radial-gradient(ellipse at 92% 80%, #12285c 0 17%, #0870a2 26%, transparent 45%),
        radial-gradient(ellipse at 24% 39%, #8e3fbc 0 18%, #ca407d 34%, transparent 53%),
        linear-gradient(135deg, #633bb0 0%, #e24f78 35%, #f49162 58%, #f2b574 73%, #1c7eaa 100%);
    }
    .desktop:before,
    .desktop:after {
      content: "";
      position: absolute;
      pointer-events: none;
      border-radius: 48% 52% 61% 39% / 58% 43% 57% 42%;
      filter: blur(1px);
      opacity: .78;
      transform-origin: center;
    }
    .desktop:before {
      width: 78vw;
      height: 47vh;
      right: -15vw;
      bottom: -11vh;
      transform: rotate(-10deg);
      background:
        radial-gradient(ellipse at 54% 20%, transparent 0 27%, rgba(82,227,205,.88) 28% 31%, rgba(254,235,151,.92) 34% 39%, rgba(239,92,100,.8) 41% 47%, #182667 50% 64%, transparent 66%);
      box-shadow: 0 -28px 0 rgba(255,216,123,.58), 0 -55px 0 rgba(255,119,99,.32);
    }
    .desktop:after {
      width: 68vw;
      height: 43vh;
      left: 8vw;
      bottom: -22vh;
      transform: rotate(9deg);
      background:
        radial-gradient(ellipse at 45% 8%, transparent 0 24%, rgba(255,211,108,.92) 26% 33%, rgba(244,105,91,.92) 35% 43%, #40345d 46% 63%, transparent 66%);
      box-shadow: 0 -20px 0 rgba(255,165,83,.52);
    }
    .wallpaper-glow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 61% 48%, rgba(255,255,255,.16), transparent 22%),
        linear-gradient(115deg, transparent 15%, rgba(255,255,255,.09) 47%, transparent 72%);
      mix-blend-mode: screen;
    }

    .rail {
      position: absolute;
      z-index: 80;
      left: 16px;
      top: 18px;
      bottom: 18px;
      width: 60px;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 9px 0;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: 0 18px 50px rgba(33,24,72,.18);
      backdrop-filter: blur(28px) saturate(130%);
    }
    .rail-group { display: grid; gap: 7px; }
    .rail-spacer { flex: 1; }
    .rail-rule { width: 36px; height: 1px; background: rgba(255,255,255,.18); margin: 7px 0; }
    .rail-btn {
      position: relative;
      border: 0;
      width: 43px;
      height: 43px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      background: transparent;
      color: rgba(255,255,255,.82);
      transition: .18s ease;
    }
    .rail-btn:hover,
    .rail-btn.active { background: rgba(255,255,255,.18); color: #fff; transform: translateY(-1px); }
    .rail-btn .icon { width: 20px; height: 20px; }
    .badge {
      position: absolute;
      right: -3px;
      top: -3px;
      min-width: 17px;
      height: 17px;
      padding: 0 4px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: #ff4e4e;
      color: white;
      font-size: 9px;
      font-weight: 850;
      border: 2px solid rgba(91,60,146,.75);
    }
    .rail-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #ffd0a8, #e69d78);
      color: #67422d;
      font-weight: 850;
      font-size: 12px;
    }

    .desktop-grid {
      position: absolute;
      z-index: 4;
      left: 100px;
      top: 34px;
      bottom: 34px;
      width: min(370px, 31vw);
      display: grid;
      grid-template-columns: repeat(3, 92px);
      grid-auto-rows: 117px;
      gap: 9px 19px;
      align-content: start;
      overflow-y: auto;
      padding: 4px 12px 34px 2px;
      scrollbar-width: none;
    }
    .desktop-grid::-webkit-scrollbar { display: none; }
    .app-shortcut {
      height: 110px;
      border: 0;
      border-radius: 14px;
      padding: 7px 5px 5px;
      background: transparent;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      text-shadow: 0 2px 6px rgba(17,19,46,.55);
      transition: background .15s ease, transform .15s ease;
      user-select: none;
    }
    .app-shortcut:hover,
    .app-shortcut.selected { background: rgba(255,255,255,.13); transform: translateY(-1px); }
    .app-shortcut.running .app-icon:after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -8px;
      transform: translateX(-50%);
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 8px rgba(255,255,255,.9);
    }
    .app-icon {
      position: relative;
      width: 58px;
      height: 58px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      color: white;
      box-shadow: inset 0 1px 1px rgba(255,255,255,.42), 0 9px 24px rgba(30,25,66,.24);
      overflow: visible;
    }
    .app-icon:before {
      content: "";
      position: absolute;
      inset: 1px 1px 50%;
      border-radius: 15px 15px 48% 48%;
      background: linear-gradient(rgba(255,255,255,.35), transparent);
      pointer-events: none;
    }
    .app-icon .icon { width: 31px; height: 31px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.14)); }
    .app-shortcut span { font-size: 12px; font-weight: 720; white-space: nowrap; }
    .icon-files { background: linear-gradient(155deg, #48ceff, #3174ed); }
    .icon-trash { background: linear-gradient(155deg, #c8ced7, #7e8792); }
    .icon-settings { background: linear-gradient(155deg, #c9cdd3, #777e89); }
    .icon-resources { background: linear-gradient(155deg, #253346, #05090f); }
    .icon-store { background: linear-gradient(155deg, #798dff, #4f52dd); }
    .icon-video { background: linear-gradient(155deg, #43c9ff, #3568ed); }
    .icon-download { background: linear-gradient(155deg, #66eb83, #11b944); }
    .icon-snapshot { background: linear-gradient(155deg, #4bd1ff, #2981df); }
    .icon-docker { background: linear-gradient(155deg, #5ba2ff, #3152d4); }
    .icon-photos { background: linear-gradient(155deg, #ffffff, #e4e8f1); color: #7f5ed8; }
    .icon-logs { background: linear-gradient(155deg, #657282, #252c36); }
    .icon-vm { background: linear-gradient(155deg, #7e9cff, #4e69de); }
    .icon-backup { background: linear-gradient(155deg, #56d7ff, #3189d9); }
    .icon-music { background: linear-gradient(155deg, #ff506d, #d92471); }
    .icon-ai { background: linear-gradient(155deg, #8c7cff, #5544c4); }

    .resource-pill {
      position: absolute;
      z-index: 70;
      top: 26px;
      right: 25px;
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 18px;
      background: rgba(255,255,255,.86);
      color: #26303b;
      padding: 8px 11px 8px 13px;
      display: flex;
      align-items: center;
      gap: 13px;
      box-shadow: 0 12px 34px rgba(49,41,75,.16);
      backdrop-filter: blur(20px);
    }
    .resource-pill button { border: 0; background: transparent; padding: 0; color: #2c3741; display: grid; place-items: center; }
    .net-lines { display: grid; gap: 2px; font: 10px/1.1 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .net-line { display: grid; grid-template-columns: 11px 48px 12px 48px; align-items: center; }
    .net-line b { color: #178d9e; }
    .net-line b:last-of-type { color: #3478f6; }
    .resource-stats { display: grid; grid-template-columns: auto auto; gap: 2px 8px; font-size: 10px; color: #66707a; }
    .resource-stats strong { color: #313942; }

    .window-layer { position: absolute; inset: 0; pointer-events: none; z-index: 72; }
    .app-window {
      position: absolute;
      min-width: 520px;
      min-height: 330px;
      width: min(880px, 68vw);
      height: min(610px, 74vh);
      top: 12vh;
      left: 24vw;
      border-radius: 18px;
      overflow: hidden;
      background: var(--glass-strong);
      color: var(--text);
      border: 1px solid rgba(255,255,255,.62);
      box-shadow: var(--shadow);
      backdrop-filter: blur(30px) saturate(125%);
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      transform-origin: center;
      animation: windowIn .18s ease-out;
    }
    @keyframes windowIn { from { opacity: 0; transform: scale(.975) translateY(8px); } to { opacity: 1; transform: none; } }
    .app-window.focused { box-shadow: 0 30px 95px rgba(12,19,43,.38); }
    .app-window.minimized { display: none; }
    .app-window.maximized {
      inset: 12px 12px 12px 88px !important;
      width: auto !important;
      height: auto !important;
      border-radius: 15px;
    }
    .window-titlebar {
      height: 49px;
      flex: none;
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      align-items: center;
      padding: 0 0 0 17px;
      background: rgba(248,250,253,.86);
      border-bottom: 1px solid var(--line);
      user-select: none;
      cursor: grab;
    }
    .window-titlebar:active { cursor: grabbing; }
    .window-controls { height: 100%; display: flex; justify-self: end; }
    .window-control {
      width: 46px;
      height: 100%;
      border: 0;
      border-radius: 0;
      padding: 0;
      position: relative;
      background: transparent;
      color: #171b20;
    }
    .window-control:hover { background: rgba(33,42,52,.08); }
    .window-control.close:hover { background: #e81123; color: white; }
    .window-control.minimize:before { content: ""; position: absolute; width: 11px; height: 1px; background: currentColor; left: 50%; top: 54%; transform: translate(-50%,-50%); }
    .window-control.maximize:before { content: ""; position: absolute; width: 10px; height: 9px; border: 1.4px solid currentColor; left: 50%; top: 50%; transform: translate(-50%,-50%); }
    .window-control.close:before,
    .window-control.close:after { content: ""; position: absolute; width: 13px; height: 1.4px; background: currentColor; left: 50%; top: 50%; }
    .window-control.close:before { transform: translate(-50%,-50%) rotate(45deg); }
    .window-control.close:after { transform: translate(-50%,-50%) rotate(-45deg); }
    .window-title { min-width: 0; display: flex; align-items: center; justify-content: flex-start; gap: 9px; font-size: 13px; font-weight: 750; }
    .window-title .mini-app-icon { width: 23px; height: 23px; border-radius: 7px; display: grid; place-items: center; color: white; }
    .window-title .mini-app-icon .icon { width: 14px; height: 14px; }
    .window-content { flex: 1; min-height: 0; overflow: auto; background: rgba(249,250,253,.72); }
    .window-resize {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 18px;
      height: 18px;
      cursor: nwse-resize;
      background: linear-gradient(135deg, transparent 45%, rgba(63,72,83,.24) 46% 52%, transparent 53% 62%, rgba(63,72,83,.24) 63% 69%, transparent 70%);
    }

    .task-shelf {
      position: absolute;
      z-index: 75;
      left: 50%;
      bottom: 17px;
      transform: translateX(-50%);
      min-height: 54px;
      display: none;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border-radius: 18px;
      background: rgba(255,255,255,.18);
      border: 1px solid rgba(255,255,255,.25);
      box-shadow: 0 14px 42px rgba(26,20,54,.22);
      backdrop-filter: blur(24px) saturate(140%);
    }
    .task-shelf.visible { display: flex; }
    .task-item {
      position: relative;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: white;
      box-shadow: inset 0 1px 1px rgba(255,255,255,.32);
    }
    .task-item:after {
      content: "";
      position: absolute;
      bottom: -5px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: white;
    }
    .task-item.minimized:after { background: rgba(255,255,255,.5); }
    .task-item .icon { width: 21px; height: 21px; }

    .launcher,
    .notification-panel,
    .quick-ai,
    .resource-panel,
    .state-panel {
      position: absolute;
      z-index: 100;
      display: none;
      color: var(--text);
      background: rgba(249,250,253,.91);
      border: 1px solid rgba(255,255,255,.65);
      box-shadow: var(--shadow);
      backdrop-filter: blur(34px) saturate(130%);
    }
    .launcher.open,
    .notification-panel.open,
    .quick-ai.open,
    .resource-panel.open,
    .state-panel.open { display: block; animation: panelIn .16s ease; }
    @keyframes panelIn { from { opacity: 0; transform: translateY(6px) scale(.985); } to { opacity: 1; transform: none; } }
    .launcher {
      left: 87px;
      top: 70px;
      width: 460px;
      border-radius: 22px;
      padding: 20px;
    }
    .launcher h2,
    .notification-panel h2,
    .quick-ai h2,
    .resource-panel h2 { margin: 0; font-size: 17px; }
    .launcher-search { margin: 15px 0; display: flex; gap: 8px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.78); padding: 9px 11px; color: #7a8490; }
    .launcher-search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); }
    .launcher-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; }
    .launcher-app { border: 0; background: transparent; border-radius: 13px; padding: 9px 5px; display: grid; justify-items: center; gap: 6px; color: var(--text); font-size: 10px; }
    .launcher-app:hover { background: rgba(53,83,113,.08); }
    .launcher-app .app-icon { width: 42px; height: 42px; border-radius: 12px; }
    .launcher-app .icon { width: 23px; height: 23px; }
    .notification-panel { left: 87px; bottom: 84px; width: 370px; border-radius: 20px; padding: 18px; }
    .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 13px; }
    .panel-head button { border: 0; background: transparent; color: #557083; font-size: 11px; }
    .notice { display: grid; grid-template-columns: 35px 1fr; gap: 10px; padding: 11px 0; border-top: 1px solid var(--line); }
    .notice-icon { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: #fff0d8; color: #a65e16; }
    .notice.good .notice-icon { background: #e1f4e8; color: #2d8651; }
    .notice.security .notice-icon { background: #e9ecff; color: #5c63b9; }
    .notice strong { display: block; font-size: 12px; }
    .notice p { margin: 4px 0 0; color: var(--muted); font-size: 10px; line-height: 1.45; }
    .quick-ai { left: 87px; top: 154px; width: 420px; border-radius: 21px; padding: 18px; }
    .ai-status { display: flex; align-items: center; gap: 7px; color: #4f6b5d; font-size: 10px; margin-top: 5px; }
    .ai-status i { width: 7px; height: 7px; border-radius: 50%; background: #32c36b; box-shadow: 0 0 8px #32c36b; }
    .ai-query { display: flex; margin: 15px 0 12px; border: 1px solid #d9d6ef; background: white; border-radius: 14px; padding: 6px; }
    .ai-query input { flex: 1; min-width: 0; border: 0; outline: 0; padding: 8px; }
    .ai-query button { border: 0; border-radius: 10px; padding: 0 12px; color: white; background: #6656d8; font-weight: 750; }
    .ai-suggestion { width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); background: transparent; padding: 10px 3px; color: #5e6077; font-size: 11px; }
    .resource-panel { right: 25px; top: 82px; width: 310px; border-radius: 18px; padding: 17px; }
    .metric { margin-top: 13px; }
    .metric-row { display: flex; justify-content: space-between; font-size: 10px; color: #697681; margin-bottom: 6px; }
    .metric-row strong { color: #2f3a43; }
    .bar { height: 6px; border-radius: 999px; background: #e8edf1; overflow: hidden; }
    .bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #38b879, #72d674); }
    .resource-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; }
    .soft-btn { border: 0; border-radius: 11px; padding: 10px; background: #edf2f6; color: #425565; font-size: 10px; font-weight: 750; }
    .state-panel { right: 25px; bottom: 24px; width: 330px; border-radius: 17px; padding: 15px; }
    .state-panel pre { margin: 10px 0 0; white-space: pre-wrap; word-break: break-word; color: #5d6c78; font: 9px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; }

    /* shared app content */
    .app-layout { min-height: 100%; display: grid; grid-template-columns: 190px 1fr; }
    .app-sidebar { padding: 15px 10px; background: rgba(237,241,246,.8); border-right: 1px solid var(--line); }
    .app-sidebar .side-title { padding: 5px 10px 8px; color: #8b949e; font-size: 9px; text-transform: uppercase; letter-spacing: .12em; }
    .side-link { width: 100%; border: 0; background: transparent; color: #52606c; border-radius: 9px; padding: 8px 10px; display: flex; align-items: center; gap: 9px; text-align: left; font-size: 11px; }
    .side-link:hover,
    .side-link.active { background: rgba(255,255,255,.9); color: #245fb5; }
    .side-link .icon { width: 16px; height: 16px; }
    .app-main { min-width: 0; padding: 18px; overflow: auto; }
    .app-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 15px; }
    .app-toolbar h2 { margin: 0; font-size: 19px; }
    .toolbar-actions { display: flex; gap: 7px; }
    .primary-btn,
    .ghost-btn,
    .danger-btn { border: 0; border-radius: 10px; padding: 9px 12px; font-size: 10px; font-weight: 750; display: inline-flex; align-items: center; gap: 6px; }
    .primary-btn { background: #3478f6; color: white; }
    .ghost-btn { background: #edf1f5; color: #4f5e6a; }
    .danger-btn { background: #ffebe9; color: #c53d35; }
    .inline-action { border: 0; border-radius: 8px; padding: 6px 8px; background: #edf2f7; color: #52616e; font-size: 9px; font-weight: 700; }
    .inline-action.danger { background: #ffebe9; color: #c53d35; }
    .row-actions { display: flex; gap: 5px; justify-content: flex-end; }
    .empty-table-row td { padding: 34px 10px; color: #98a1aa; text-align: center; }
    .content-card { border: 1px solid var(--line); background: rgba(255,255,255,.72); border-radius: 14px; padding: 14px; }
    .file-table { width: 100%; border-collapse: collapse; font-size: 10px; }
    .file-table th { color: #89929c; text-align: left; font-weight: 650; padding: 9px; border-bottom: 1px solid var(--line); }
    .file-table td { padding: 10px 9px; border-bottom: 1px solid rgba(25,37,50,.07); }
    .file-table tbody tr { transition: background .12s ease; }
    .file-table tbody tr:hover { background: rgba(235,242,252,.72); }
    .file-table tbody tr.selected { background: #e8f1ff; }
    .file-table tr[hidden] { display: none; }
    .file-table tr[data-folder-row] { cursor: pointer; }
    .file-child-row td:first-child { padding-left: 38px; }
    .file-name { display: flex; align-items: center; gap: 9px; font-weight: 650; }
    .row-chevron { width: 18px; height: 24px; flex: none; border: 0; padding: 0; background: transparent; color: #788590; display: grid; place-items: center; font-size: 15px; transition: transform .15s ease; }
    tr.expanded .row-chevron { transform: rotate(90deg); }
    .file-entry { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tiny-icon { width: 27px; height: 27px; border-radius: 8px; display: grid; place-items: center; background: #e5efff; color: #3478f6; }
    .tiny-icon .icon { width: 15px; height: 15px; }
    .file-sidebar { display: flex; flex-direction: column; overflow-y: auto; }
    .file-sidebar .side-link { padding: 10px; }
    .tree-root { font-weight: 700; }
    .tree-chevron { width: 12px; height: 12px; flex: none; display: grid; place-items: center; color: #7a8792; transition: transform .15s ease; }
    .tree-chevron .icon { width: 12px; height: 12px; transform: rotate(-90deg); }
    .tree-root.expanded .tree-chevron .icon,
    .tree-item.expanded .tree-chevron .icon { transform: rotate(0); }
    .tree-children { display: grid; gap: 2px; margin: 2px 0 5px 22px; }
    .tree-children[hidden] { display: none; }
    .tree-children.nested { margin-left: 25px; }
    .tree-item { width: 100%; min-width: 0; border: 0; border-radius: 8px; padding: 7px 8px; display: flex; align-items: center; gap: 7px; color: #5e6b76; background: transparent; text-align: left; font-size: 10px; }
    .tree-item:hover,
    .tree-item.active { background: rgba(255,255,255,.82); color: #245fb5; }
    .tree-item .icon { width: 14px; height: 14px; flex: none; }
    .tree-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-main { display: flex; flex-direction: column; overflow: hidden; }
    .file-nav { display: grid; grid-template-columns: auto minmax(160px,1fr) minmax(150px,220px); gap: 9px; align-items: center; margin-bottom: 14px; }
    .file-nav-buttons { display: flex; gap: 5px; }
    .file-nav-button { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 9px; background: rgba(255,255,255,.72); color: #56636f; display: grid; place-items: center; font-size: 17px; }
    .file-path,
    .file-search { height: 34px; border: 1px solid var(--line); border-radius: 9px; background: rgba(255,255,255,.72); display: flex; align-items: center; gap: 8px; padding: 0 11px; color: #4e5964; font-size: 10px; }
    .file-path .icon,
    .file-search .icon { width: 14px; height: 14px; color: #7c8791; }
    .file-search input { min-width: 0; width: 100%; border: 0; outline: 0; background: transparent; color: #3e4954; font: inherit; }
    .file-view { min-height: 0; }
    .file-view[hidden] { display: none; }
    .file-view-heading { display: flex; align-items: center; gap: 9px; }
    .scope-chip { border-radius: 999px; padding: 4px 7px; background: #eef3fa; color: #57708a; font-size: 8px; font-weight: 750; white-space: nowrap; }
    .scope-chip.shared { background: #e8f3ff; color: #2767a8; }
    .scope-chip.remote { background: #ede9ff; color: #6550b3; }
    .file-source-tabs { display: none; gap: 6px; margin-bottom: 12px; overflow-x: auto; }
    .file-source-tabs .side-link { width: auto; flex: none; background: #eef2f6; }
    .file-source-tabs .side-link.active { background: #3478f6; color: white; }
    .remote-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; }
    .remote-card { border: 1px solid var(--line); border-radius: 13px; background: rgba(255,255,255,.8); padding: 13px; cursor: pointer; transition: .15s ease; }
    .remote-card:hover { transform: translateY(-1px); border-color: rgba(52,120,246,.35); box-shadow: 0 8px 24px rgba(40,73,112,.08); }
    .remote-card.selected { border-color: #3478f6; box-shadow: 0 0 0 2px rgba(52,120,246,.13); }
    .remote-card-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
    .remote-name { display: flex; gap: 9px; min-width: 0; }
    .remote-name .tiny-icon { flex: none; background: #eeeaff; color: #6951bc; }
    .remote-name strong { display: block; font-size: 11px; }
    .remote-name small { display: block; margin-top: 3px; color: #89939c; font-size: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .remote-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
    .remote-meta span { color: #89939c; font-size: 8px; }
    .remote-meta strong { display: block; margin-top: 3px; color: #485560; font-size: 9px; }
    .file-toast { position: absolute; right: 18px; bottom: 18px; z-index: 8; max-width: 260px; border-radius: 10px; padding: 9px 12px; color: white; background: rgba(37,48,58,.92); box-shadow: 0 10px 30px rgba(20,30,42,.2); font-size: 10px; opacity: 0; transform: translateY(7px); pointer-events: none; transition: .16s ease; }
    .file-toast.show { opacity: 1; transform: none; }
    .file-dialog-backdrop { position: absolute; inset: 49px 0 0; z-index: 7; display: grid; place-items: center; padding: 18px; background: rgba(27,36,46,.24); backdrop-filter: blur(3px); }
    .file-dialog-backdrop[hidden] { display: none; }
    .file-dialog { width: min(390px,100%); border: 1px solid rgba(255,255,255,.7); border-radius: 15px; padding: 17px; background: rgba(250,251,253,.97); box-shadow: 0 24px 70px rgba(24,33,45,.28); }
    .file-dialog h3 { margin: 0 0 14px; font-size: 15px; }
    .dialog-fields { display: grid; gap: 10px; }
    .dialog-field { display: grid; gap: 5px; color: #6b7782; font-size: 9px; }
    .dialog-field input,
    .dialog-field select { width: 100%; box-sizing: border-box; border: 1px solid #d9dfe7; border-radius: 9px; padding: 9px 10px; outline: 0; background: white; color: #34414c; font: inherit; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 7px; margin-top: 15px; }
    .file-nav-button:disabled { opacity: .35; cursor: default; }
    .file-nav-button.refreshing { animation: spin .55s linear; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-pill { border-radius: 999px; padding: 5px 8px; background: #e4f3e9; color: #267249; font-size: 9px; font-weight: 750; }
    .status-pill.warn { background: #fff0d9; color: #9a5d1c; }
    .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .stat-card { border: 1px solid var(--line); border-radius: 13px; background: white; padding: 13px; }
    .stat-card span { display: block; color: #7d8790; font-size: 9px; }
    .stat-card strong { display: block; font-size: 21px; margin-top: 7px; letter-spacing: -.03em; }
    .chart { margin-top: 12px; height: 145px; border: 1px solid var(--line); border-radius: 14px; position: relative; overflow: hidden; background: linear-gradient(180deg, #f9fbfd, #eef3f7); }
    .chart:before { content: ""; position: absolute; inset: 18px; background: repeating-linear-gradient(0deg, transparent 0 25px, rgba(71,88,104,.08) 26px), repeating-linear-gradient(90deg, transparent 0 80px, rgba(71,88,104,.05) 81px); }
    .chart-line { position: absolute; left: 5%; right: 5%; top: 48%; height: 3px; background: linear-gradient(90deg, #3478f6, #37c476); transform: skewY(-6deg); box-shadow: 0 22px 0 rgba(52,120,246,.22), 0 -18px 0 rgba(55,196,118,.22); }
    .photo-search { display: flex; gap: 8px; border: 1px solid #dbe0e8; background: white; border-radius: 12px; padding: 7px 10px; margin-bottom: 13px; }
    .photo-search input { flex: 1; border: 0; outline: 0; min-width: 0; }
    .photo-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .photo { aspect-ratio: 1.15; border-radius: 12px; overflow: hidden; position: relative; background: linear-gradient(145deg, #9ec7cf, #e6bf9f 53%, #677e73); }
    .photo:nth-child(2n) { background: linear-gradient(145deg, #87a6ca, #d6c4de 58%, #59677c); }
    .photo:nth-child(3n) { background: linear-gradient(145deg, #8fa371, #edc78c 58%, #705c49); }
    .photo span { position: absolute; left: 8px; bottom: 7px; color: white; font-size: 9px; text-shadow: 0 1px 4px rgba(0,0,0,.65); }
    .docker-row { display: grid; grid-template-columns: 1.4fr .7fr .7fr .7fr auto; gap: 12px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); font-size: 10px; }
    .docker-name { display: flex; align-items: center; gap: 9px; font-weight: 700; }
    .docker-dot { width: 9px; height: 9px; border-radius: 50%; background: #39c36c; box-shadow: 0 0 0 4px #e1f4e8; }
    .settings-list { display: grid; gap: 9px; }
    .setting-row { border: 1px solid var(--line); background: white; border-radius: 13px; padding: 12px; display: flex; justify-content: space-between; align-items: center; gap: 14px; }
    .setting-copy strong { display: block; font-size: 11px; }
    .setting-copy span { display: block; color: var(--muted); font-size: 9px; margin-top: 4px; }
    .switch { width: 38px; height: 21px; border-radius: 999px; padding: 3px; background: #36ba67; }
    .switch:after { content: ""; display: block; width: 15px; height: 15px; border-radius: 50%; background: white; margin-left: 17px; box-shadow: 0 2px 5px rgba(0,0,0,.18); }
    .ai-app { height: 100%; display: grid; grid-template-columns: 210px 1fr; }
    .ai-history { background: #f0effa; border-right: 1px solid #dedcec; padding: 14px; }
    .ai-history button { width: 100%; border: 0; border-radius: 10px; padding: 9px; background: white; color: #5f5b75; text-align: left; margin-bottom: 7px; font-size: 10px; }
    .ai-chat { display: flex; flex-direction: column; min-height: 0; }
    .chat-body { flex: 1; overflow: auto; padding: 22px; }
    .message { max-width: 78%; border-radius: 14px; padding: 11px 13px; margin-bottom: 10px; font-size: 11px; line-height: 1.6; }
    .message.user { margin-left: auto; background: #6656d8; color: white; }
    .message.agent { background: white; border: 1px solid var(--line); }
    .citation { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); color: #596bb2; font-size: 9px; }
    .chat-input { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); background: rgba(249,250,253,.9); }
    .chat-input input { flex: 1; min-width: 0; border: 1px solid #d9dce8; border-radius: 11px; padding: 10px; outline: 0; }

    .welcome-toast {
      position: absolute;
      z-index: 65;
      right: 25px;
      bottom: 25px;
      width: 310px;
      border-radius: 17px;
      padding: 15px;
      background: rgba(255,255,255,.88);
      color: var(--text);
      border: 1px solid rgba(255,255,255,.6);
      box-shadow: 0 18px 55px rgba(30,25,67,.24);
      backdrop-filter: blur(25px);
      transition: .2s ease;
    }
    .welcome-toast.hidden { opacity: 0; transform: translateY(10px); pointer-events: none; }
    .welcome-toast h3 { margin: 0 0 6px; font-size: 13px; }
    .welcome-toast p { margin: 0 0 11px; color: var(--muted); font-size: 10px; line-height: 1.5; }
    .welcome-actions { display: flex; gap: 7px; }

    @media (max-width: 900px) {
      .desktop-grid { grid-template-columns: repeat(2, 88px); width: 215px; }
      .resource-pill { right: 14px; top: 14px; }
      .app-window { left: 18vw; width: 76vw; }
    }
    @media (max-width: 620px) {
      .rail { inset: auto 10px 10px; width: auto; height: 58px; flex-direction: row; padding: 7px; }
      .rail-group { display: flex; }
      .rail-rule, .rail-spacer, .rail-group.secondary .rail-btn:not(:last-child) { display: none; }
      .desktop-grid { left: 18px; right: 18px; top: 78px; width: auto; bottom: 78px; grid-template-columns: repeat(3, 1fr); justify-items: center; }
      .resource-pill { left: 18px; right: 18px; justify-content: center; }
      .app-window,
      .app-window.maximized { inset: 8px 8px 75px !important; width: auto !important; height: auto !important; min-width: 0; min-height: 0; border-radius: 14px; }
      .window-titlebar { grid-template-columns: minmax(0,1fr) auto; padding-left: 12px; }
      .window-control { width: 42px; }
      .window-resize { display: none; }
      .app-layout { grid-template-columns: 1fr; }
      .app-sidebar { display: none; }
      .file-main { padding-top: 64px; }
      .file-nav { grid-template-columns: 1fr; }
      .file-nav-buttons, .file-path { display: none; }
      .file-source-tabs { display: flex; }
      .remote-grid { grid-template-columns: 1fr; }
      .file-table th:nth-child(2), .file-table td:nth-child(2) { display: none; }
      .stat-grid { grid-template-columns: repeat(2, 1fr); }
      .photo-grid { grid-template-columns: repeat(2, 1fr); }
      .ai-app { grid-template-columns: 1fr; }
      .ai-history { display: none; }
      .launcher, .quick-ai, .notification-panel { left: 12px; right: 12px; width: auto; }
      .launcher { top: 75px; }
      .launcher-grid { grid-template-columns: repeat(4, 1fr); }
      .resource-panel { left: 12px; right: 12px; width: auto; }
      .task-shelf { bottom: 77px; }
      .welcome-toast { display: none; }
    }
  </style>
</head>

  <main id="desktop" class="desktop">
    <div class="wallpaper-glow"></div>

    <aside class="rail" aria-label="系统快捷栏">
      <div class="rail-group">
        <button class="rail-btn active" data-action="show-desktop" title="显示桌面"><svg class="icon"><use href="#i-home"/></svg></button>
        <button class="rail-btn" data-toggle="launcher" title="全部应用"><svg class="icon"><use href="#i-grid"/></svg></button>
      </div>
      <div class="rail-rule"></div>
      <div class="rail-group">
        <button class="rail-btn" data-toggle="quick-ai" title="AI 助手"><svg class="icon"><use href="#i-ai"/></svg></button>

      <div class="rail-spacer"></div>

      <button class="app-shortcut" data-action="open-app" data-app="resources"><span class="app-icon icon-resources"><svg class="icon"><use href="#i-activity"/></svg></span><span>资源管理</span></button>

  <script>
    (function () {
      var appMeta = {
        files: { name: '文件管理', icon: 'i-folder', color: 'icon-files', template: 'app-files' },
        trash: { name: '回收站', icon: 'i-trash', color: 'icon-trash', template: 'app-generic' },
        settings: { name: '系统设置', icon: 'i-settings', color: 'icon-settings', template: 'app-settings' },
        resources: { name: '资源管理', icon: 'i-activity', color: 'icon-resources', template: 'app-resources' },
        store: { name: '应用中心', icon: 'i-store', color: 'icon-store', template: 'app-generic' },
        video: { name: '影视', icon: 'i-video', color: 'icon-video', template: 'app-generic' },
        download: { name: '下载', icon: 'i-download', color: 'icon-download', template: 'app-generic' },
        snapshot: { name: '文件快照', icon: 'i-snapshot', color: 'icon-snapshot', template: 'app-generic' },
        docker: { name: 'Docker', icon: 'i-docker', color: 'icon-docker', template: 'app-docker' },
        photos: { name: '相册', icon: 'i-image', color: 'icon-photos', template: 'app-photos' },
        logs: { name: '日志', icon: 'i-log', color: 'icon-logs', template: 'app-generic' },
        vm: { name: '虚拟机', icon: 'i-vm', color: 'icon-vm', template: 'app-generic' },
        backup: { name: '备份', icon: 'i-backup', color: 'icon-backup', template: 'app-backup' },
        music: { name: '音乐', icon: 'i-music', color: 'icon-music', template: 'app-generic' },
        ai: { name: 'AI 助手', icon: 'i-ai', color: 'icon-ai', template: 'app-ai' }
      };
      var windows = {};
      var zCounter = 30;
      var cascade = 0;
      var state = {
        activeApp: null,
        openApps: [],
        minimizedApps: [],
        unreadNotifications: 2,
        lastAction: '进入桌面',
        storage: { mode: 'RAID1', status: '可用，2 号盘温度偏高' },
        ai: { location: '本机', externalNetwork: false, indexing: 81 },
        fileManager: {
          viewKey: 'personal',
          view: '我的文件',
          visibility: '仅当前个人用户租户',
          path: '我的文件',
          history: ['我的文件'],
          historyIndex: 0,
          expandedTrees: ['personal'],
          expandedRows: []
        }
      };

      var desktop = document.getElementById('desktop');
      var layer = document.getElementById('window-layer');
      var shelf = document.getElementById('task-shelf');
      var launcherGrid = document.getElementById('launcher-grid');
      var stateJson = document.getElementById('state-json');
      var panels = {
        launcher: document.getElementById('launcher'),
        notifications: document.getElementById('notifications'),
        'quick-ai': document.getElementById('quick-ai'),
        'resource-panel': document.getElementById('resource-panel'),
        'state-panel': document.getElementById('state-panel')
      };

      function iconMarkup(id) {
        return '<svg class="icon"><use href="#' + id + '"></use></svg>';
      }

      function closePanels(except) {
        Object.keys(panels).forEach(function (key) {
          if (key !== except) panels[key].classList.remove('open');
        });
      }

      function togglePanel(key) {
        var panel = panels[key];
        if (!panel) return;
        var willOpen = !panel.classList.contains('open');
        closePanels(willOpen ? key : null);
        panel.classList.toggle('open', willOpen);
        state.lastAction = (willOpen ? '打开' : '关闭') + '面板：' + key;
        syncState();
      }

      function syncState() {
        state.openApps = Object.keys(windows);
        state.minimizedApps = Object.keys(windows).filter(function (id) { return windows[id].classList.contains('minimized'); });
        stateJson.textContent = JSON.stringify(state, null, 2);
        document.querySelectorAll('.app-shortcut').forEach(function (button) {
          button.classList.toggle('running', !!windows[button.getAttribute('data-app')]);
        });
        renderShelf();
      }

      function focusWindow(appId) {
        var win = windows[appId];
        if (!win) return;
        Object.keys(windows).forEach(function (id) { windows[id].classList.remove('focused'); });
        win.classList.remove('minimized');
        win.classList.add('focused');
        win.style.zIndex = String(++zCounter);
        state.activeApp = appId;
        state.lastAction = '聚焦应用：' + appMeta[appId].name;
        syncState();
      }

      function makeWindow(appId) {
        var meta = appMeta[appId];
        var template = document.getElementById(meta.template);
        var win = document.createElement('section');
        var offset = cascade % 6;
        cascade += 1;
        win.className = 'app-window';
        win.setAttribute('data-window', appId);
        win.style.left = 'calc(22vw + ' + (offset * 22) + 'px)';
        win.style.top = 'calc(10vh + ' + (offset * 18) + 'px)';
        win.innerHTML =
          '<header class="window-titlebar">' +
            '<div class="window-title"><span class="mini-app-icon ' + meta.color + '">' + iconMarkup(meta.icon) + '</span>' + meta.name + '</div>' +
            '<div class="window-controls">' +
              '<button class="window-control minimize" data-window-action="minimize" aria-label="返回桌面" title="返回桌面"></button>' +
              '<button class="window-control maximize" data-window-action="maximize" aria-label="全屏" title="全屏"></button>' +
              '<button class="window-control close" data-window-action="close" aria-label="退出" title="退出"></button>' +
            '</div>' +
          '</header>' +
          '<div class="window-content"></div>' +
          '<div class="window-resize"></div>';
        var content = win.querySelector('.window-content');
        content.appendChild(template.content.cloneNode(true));
        var genericTitle = content.querySelector('[data-generic-title]');
        if (genericTitle) genericTitle.textContent = meta.name;
        layer.appendChild(win);
        windows[appId] = win;
        if (appId === 'files') switchFileView(win, state.fileManager.viewKey || 'personal');
        bindDrag(win);
        bindResize(win);
        win.addEventListener('pointerdown', function () { focusWindow(appId); });
        return win;
      }

      function openApp(appId) {
        closePanels();
        if (!appMeta[appId]) return;
        if (!windows[appId]) makeWindow(appId);
        focusWindow(appId);
      }

      var fileViewMeta = {
        personal: { label: '我的文件', visibility: '仅当前个人用户租户' },
        shared: { label: '共享文件', visibility: '当前 NAS 的全部团队成员' },
        remote: { label: '远程挂载', visibility: '由挂载配置和远端权限决定' },
        recent: { label: '最近访问', visibility: '仅当前用户' },
        favorites: { label: '我的收藏', visibility: '仅当前用户' },
        trash: { label: '回收站', visibility: '仅当前用户' }
      };

      function copyFileState(current) {
        return {
          viewKey: current.viewKey,
          view: current.view,
          visibility: current.visibility,
          path: current.path,
          history: current.history.slice(),
          historyIndex: current.historyIndex,
          expandedTrees: current.expandedTrees.slice(),
          expandedRows: current.expandedRows.slice()
        };
      }

      function fileManagerReducer(current, action) {
        var next = copyFileState(current);
        var index;
        if (action.type === 'SWITCH_VIEW') {
          next.viewKey = action.view;
          next.view = fileViewMeta[action.view].label;
          next.visibility = fileViewMeta[action.view].visibility;
          next.path = next.view;
          next.history = [next.path];
          next.historyIndex = 0;
        }
        if (action.type === 'NAVIGATE' && action.path !== next.path) {
          next.history = next.history.slice(0, next.historyIndex + 1);
          next.history.push(action.path);
          next.historyIndex = next.history.length - 1;
          next.path = action.path;
        }
        if (action.type === 'BACK' && next.historyIndex > 0) {
          next.historyIndex -= 1;
          next.path = next.history[next.historyIndex];
        }
        if (action.type === 'FORWARD' && next.historyIndex < next.history.length - 1) {
          next.historyIndex += 1;
          next.path = next.history[next.historyIndex];
        }
        if (action.type === 'TOGGLE_TREE') {
          index = next.expandedTrees.indexOf(action.key);
          if (index >= 0) next.expandedTrees.splice(index, 1);
          else next.expandedTrees.push(action.key);
        }
        if (action.type === 'TOGGLE_ROW') {
          index = next.expandedRows.indexOf(action.key);
          if (index >= 0) next.expandedRows.splice(index, 1);
          else next.expandedRows.push(action.key);
        }
        return next;
      }

      function dispatchFileState(action) {
        state.fileManager = fileManagerReducer(state.fileManager, action);
        syncState();
      }

      function renderFileNavigation(win) {
        var path = win.querySelector('[data-file-path]');
        var back = win.querySelector('[data-file-action="back"]');
        var forward = win.querySelector('[data-file-action="forward"]');
        if (path) path.textContent = state.fileManager.path;
        if (back) back.disabled = state.fileManager.historyIndex <= 0;
        if (forward) forward.disabled = state.fileManager.historyIndex >= state.fileManager.history.length - 1;
        win.querySelectorAll('[data-file-node]').forEach(function (node) {
          node.classList.toggle('active', node.getAttribute('data-path') === state.fileManager.path);
        });
      }

      function navigateFile(win, path) {
        dispatchFileState({ type: 'NAVIGATE', path: path });
        renderFileNavigation(win);
      }

      function switchFileView(win, view) {
        if (!fileViewMeta[view]) return;
        win.querySelectorAll('[data-file-view]').forEach(function (button) {
          button.classList.toggle('active', button.getAttribute('data-file-view') === view);
        });
        win.querySelectorAll('[data-file-view-content]').forEach(function (section) {
          section.hidden = section.getAttribute('data-file-view-content') !== view;
        });
        var search = win.querySelector('.file-search input');
        if (search) {
          search.value = '';
          search.placeholder = '搜索' + fileViewMeta[view].label;
        }
        dispatchFileState({ type: 'SWITCH_VIEW', view: view });
        state.lastAction = '切换文件空间：' + fileViewMeta[view].label;
        renderFileNavigation(win);
      }

      function toggleTreeGroup(win, button) {
        var key = button.getAttribute('data-tree-toggle');
        var children = win.querySelector('[data-tree-children="' + key + '"]');
        if (!children) return;
        var expanded = children.hidden;
        children.hidden = !expanded;
        button.classList.toggle('expanded', expanded);
        button.setAttribute('aria-expanded', String(expanded));
        dispatchFileState({ type: 'TOGGLE_TREE', key: key });
      }

      function toggleTreeBranch(win, button) {
        var key = button.getAttribute('data-branch-toggle');
        var children = win.querySelector('[data-branch-children="' + key + '"]');
        if (!children) return;
        var expanded = children.hidden;
        children.hidden = !expanded;
        button.classList.toggle('expanded', expanded);
      }

      function toggleTableFolder(win, row) {
        var key = row.getAttribute('data-folder-row');
        var children = win.querySelectorAll('[data-row-child="' + key + '"]');
        var expanding = !row.classList.contains('expanded');
        row.classList.toggle('expanded', expanding);
        row.classList.add('selected');
        win.querySelectorAll('[data-folder-row]').forEach(function (other) {
          if (other !== row) other.classList.remove('selected');
        });
        children.forEach(function (child) { child.hidden = !expanding; });
        dispatchFileState({ type: 'TOGGLE_ROW', key: key });
        navigateFile(win, row.getAttribute('data-path'));
      }

      function showFileToast(win, message) {
        var toast = win.querySelector('.file-toast');
        if (!toast) return;
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(win.fileToastTimer);
        win.fileToastTimer = setTimeout(function () { toast.classList.remove('show'); }, 1800);
      }

      function escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, function (character) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character];
        });
      }

      function openFileDialog(win, type) {
        var backdrop = win.querySelector('[data-file-dialog-backdrop]');
        var title = backdrop.querySelector('[data-dialog-title]');
        var fields = backdrop.querySelector('[data-dialog-fields]');
        backdrop.setAttribute('data-dialog-type', type);
        if (type === 'new-folder') {
          title.textContent = '新建文件夹';
          fields.innerHTML = '<label class="dialog-field">名称<input data-dialog-input="name" value="新建文件夹" autofocus></label>';
        }
        if (type === 'permissions') {
          title.textContent = '成员权限';
          fields.innerHTML = '<label class="dialog-field">成员<select data-dialog-input="member"><option>全部成员</option><option>林先生</option><option>小满</option></select></label><label class="dialog-field">权限<select data-dialog-input="permission"><option>可编辑</option><option>只读</option><option>不可见</option></select></label>';
        }
        if (type === 'add-mount') {
          title.textContent = '添加远程挂载';
          fields.innerHTML = '<label class="dialog-field">名称<input data-dialog-input="name" value="远程存储"></label><label class="dialog-field">协议<select data-dialog-input="protocol"><option>SMB</option><option>WebDAV</option><option>NFS</option></select></label><label class="dialog-field">地址<input data-dialog-input="address" value="smb://192.168.31.30/share"></label>';
        }
        backdrop.hidden = false;
        setTimeout(function () { var input = backdrop.querySelector('input'); if (input) { input.focus(); input.select(); } }, 20);
      }

      function closeFileDialog(win) {
        var backdrop = win.querySelector('[data-file-dialog-backdrop]');
        if (backdrop) backdrop.hidden = true;
      }

      function addFileRow(win, name, typeLabel) {
        var section = win.querySelector('[data-file-view-content]:not([hidden])');
        var body = section && section.querySelector('tbody');
        if (!body) return;
        var row = document.createElement('tr');
        row.setAttribute('data-search', name.toLowerCase());
        row.innerHTML = '<td><span class="file-name"><span class="tiny-icon">' + iconMarkup(typeLabel === '文件夹' ? 'i-folder' : 'i-log') + '</span><span class="file-entry">' + escapeHTML(name) + '</span></span></td><td>' + typeLabel + '</td><td>刚刚</td><td>—</td>';
        body.insertBefore(row, body.firstChild);
      }

      function renderEmptyTable(body, label) {
        if (body.querySelector('tr')) return;
        var row = document.createElement('tr');
        row.className = 'empty-table-row';
        row.innerHTML = '<td colspan="4">' + label + '</td>';
        body.appendChild(row);
      }

      function updateUtilityCount(win, view) {
        var body = win.querySelector('[data-' + view + '-list]');
        var count = win.querySelector('[data-' + view + '-count]');
        if (count && body) count.textContent = String(body.querySelectorAll('tr:not(.empty-table-row)').length);
      }

      function removeUtilityRow(win, button, view, message, emptyLabel) {
        var body = win.querySelector('[data-' + view + '-list]');
        var row = button.closest('tr');
        if (row) row.remove();
        updateUtilityCount(win, view);
        renderEmptyTable(body, emptyLabel);
        showFileToast(win, message);
      }

      function recordRecentItem(win, row) {
        if (['recent', 'favorites', 'trash'].indexOf(state.fileManager.viewKey) >= 0) return;
        var nameNode = row.querySelector('.file-entry');
        if (!nameNode) return;
        var name = nameNode.textContent.trim();
        var body = win.querySelector('[data-recent-list]');
        if (!body) return;
        body.querySelectorAll('[data-recent-name]').forEach(function (existing) {
          if (existing.getAttribute('data-recent-name') === name) existing.remove();
        });
        var recent = document.createElement('tr');
        recent.setAttribute('data-search', name.toLowerCase());
        recent.setAttribute('data-recent-name', name);
        recent.innerHTML = '<td><span class="file-name"><span class="tiny-icon">' + iconMarkup('i-log') + '</span><span class="file-entry">' + escapeHTML(name) + '</span></span></td><td>' + escapeHTML(state.fileManager.view) + '</td><td>刚刚</td><td>—</td>';
        body.insertBefore(recent, body.firstChild);
        var rows = body.querySelectorAll('tr:not(.empty-table-row)');
        if (rows.length > 12) rows[rows.length - 1].remove();
      }

      function confirmFileDialog(win) {
        var backdrop = win.querySelector('[data-file-dialog-backdrop]');
        var type = backdrop.getAttribute('data-dialog-type');
        if (type === 'new-folder') {
          var name = backdrop.querySelector('[data-dialog-input="name"]').value.trim() || '新建文件夹';
          addFileRow(win, name, '文件夹');
          var tree = win.querySelector('[data-tree-children="' + state.fileManager.viewKey + '"]');
          if (tree) {
            var treeItem = document.createElement('button');
            treeItem.className = 'tree-item';
            treeItem.setAttribute('data-file-node', '');
            treeItem.setAttribute('data-path', state.fileManager.view + ' / ' + name);
            treeItem.innerHTML = iconMarkup('i-folder') + '<span class="tree-label">' + escapeHTML(name) + '</span>';
            tree.appendChild(treeItem);
          }
          showFileToast(win, '已创建“' + name + '”');
        }
        if (type === 'permissions') {
          var member = backdrop.querySelector('[data-dialog-input="member"]').value;
          var permission = backdrop.querySelector('[data-dialog-input="permission"]').value;
          showFileToast(win, member + '：' + permission);
        }
        if (type === 'add-mount') {
          var mountName = backdrop.querySelector('[data-dialog-input="name"]').value.trim() || '远程存储';
          var protocol = backdrop.querySelector('[data-dialog-input="protocol"]').value;
          var address = backdrop.querySelector('[data-dialog-input="address"]').value.trim();
          var grid = win.querySelector('.remote-grid');
          var card = document.createElement('article');
          card.className = 'remote-card';
          card.tabIndex = 0;
          card.setAttribute('data-open-mount', '远程挂载 / ' + mountName);
          card.innerHTML = '<div class="remote-card-head"><div class="remote-name"><span class="tiny-icon">' + iconMarkup('i-network') + '</span><div><strong>' + escapeHTML(mountName) + '</strong><small>' + escapeHTML(address) + '</small></div></div><span class="status-pill">已连接</span></div><div class="remote-meta"><span>协议<strong>' + escapeHTML(protocol) + '</strong></span><span>可用空间<strong>待获取</strong></span><span>挂载身份<strong>家庭管理员</strong></span><span>最近同步<strong>刚刚</strong></span></div>';
          grid.appendChild(card);
          var remoteTree = win.querySelector('[data-tree-children="remote"]');
          var remoteItem = document.createElement('button');
          remoteItem.className = 'tree-item';
          remoteItem.setAttribute('data-file-node', '');
          remoteItem.setAttribute('data-path', '远程挂载 / ' + mountName);
          remoteItem.innerHTML = iconMarkup('i-network') + '<span class="tree-label">' + escapeHTML(mountName) + '</span>';
          remoteTree.appendChild(remoteItem);
          var count = win.querySelector('[data-mount-count]');
          count.textContent = String(grid.querySelectorAll('.remote-card').length);
          showFileToast(win, '已添加“' + mountName + '”');
        }
        closeFileDialog(win);
        state.lastAction = '文件管理操作：' + type;
        syncState();
      }

      function closeApp(appId) {
        if (!windows[appId]) return;
        windows[appId].remove();
        delete windows[appId];
        state.activeApp = null;
        state.lastAction = '关闭应用：' + appMeta[appId].name;
        syncState();
      }

      function minimizeApp(appId) {
        if (!windows[appId]) return;
        windows[appId].classList.add('minimized');
        state.activeApp = null;
        state.lastAction = '最小化应用：' + appMeta[appId].name;
        syncState();
      }

      function maximizeApp(appId) {
        if (!windows[appId]) return;
        windows[appId].classList.toggle('maximized');
        state.lastAction = (windows[appId].classList.contains('maximized') ? '最大化应用：' : '还原应用：') + appMeta[appId].name;
        focusWindow(appId);
      }

      function showDesktop() {
        Object.keys(windows).forEach(function (id) { windows[id].classList.add('minimized'); });
        state.activeApp = null;
        state.lastAction = '显示桌面';
        closePanels();
        syncState();
      }

      function renderShelf() {
        var ids = Object.keys(windows);
        shelf.classList.toggle('visible', ids.length > 0);
        shelf.innerHTML = '';
        ids.forEach(function (id) {
          var meta = appMeta[id];
          var button = document.createElement('button');
          button.className = 'task-item ' + meta.color + (windows[id].classList.contains('minimized') ? ' minimized' : '');
          button.setAttribute('data-action', 'focus-app');
          button.setAttribute('data-app', id);
          button.title = meta.name;
          button.innerHTML = iconMarkup(meta.icon);
          shelf.appendChild(button);
        });
      }

      function bindDrag(win) {
        var bar = win.querySelector('.window-titlebar');
        var dragging = false;
        var startX = 0;
        var startY = 0;
        var startLeft = 0;
        var startTop = 0;
        bar.addEventListener('pointerdown', function (event) {
          if (event.target.closest('button') || win.classList.contains('maximized')) return;
          dragging = true;
          startX = event.clientX;
          startY = event.clientY;
          startLeft = win.offsetLeft;
          startTop = win.offsetTop;
          bar.setPointerCapture(event.pointerId);
        });
        bar.addEventListener('pointermove', function (event) {
          if (!dragging) return;
          var nextLeft = Math.max(80, Math.min(window.innerWidth - 180, startLeft + event.clientX - startX));
          var nextTop = Math.max(8, Math.min(window.innerHeight - 70, startTop + event.clientY - startY));
          win.style.left = nextLeft + 'px';
          win.style.top = nextTop + 'px';
        });
        bar.addEventListener('pointerup', function () { dragging = false; });
      }

      function bindResize(win) {
        var handle = win.querySelector('.window-resize');
        var resizing = false;
        var startX = 0;
        var startY = 0;
        var startWidth = 0;
        var startHeight = 0;
        handle.addEventListener('pointerdown', function (event) {
          if (win.classList.contains('maximized')) return;
          resizing = true;
          startX = event.clientX;
          startY = event.clientY;
          startWidth = win.offsetWidth;
          startHeight = win.offsetHeight;
          handle.setPointerCapture(event.pointerId);
          event.stopPropagation();
        });
        handle.addEventListener('pointermove', function (event) {
          if (!resizing) return;
          win.style.width = Math.max(520, startWidth + event.clientX - startX) + 'px';
          win.style.height = Math.max(330, startHeight + event.clientY - startY) + 'px';
        });
        handle.addEventListener('pointerup', function () { resizing = false; });
      }

      function buildLauncher() {
        Object.keys(appMeta).forEach(function (id) {
          var meta = appMeta[id];
          var button = document.createElement('button');
          button.className = 'launcher-app';
          button.setAttribute('data-action', 'open-app');
          button.setAttribute('data-app', id);
          button.setAttribute('data-search-name', meta.name.toLowerCase());
          button.innerHTML = '<span class="app-icon ' + meta.color + '">' + iconMarkup(meta.icon) + '</span><span>' + meta.name + '</span>';
          launcherGrid.appendChild(button);
        });
      }

      document.addEventListener('click', function (event) {
        var toggle = event.target.closest('[data-toggle]');
        if (toggle) {
          togglePanel(toggle.getAttribute('data-toggle'));
          return;
        }
        var trigger = event.target.closest('[data-action]');
        if (!trigger) {
          if (!event.target.closest('.launcher, .notification-panel, .quick-ai, .resource-panel, .rail, .resource-pill')) closePanels();
          return;
        }
        var action = trigger.getAttribute('data-action');
        var appId = trigger.getAttribute('data-app');
        if (action === 'open-app') openApp(appId);
        if (action === 'focus-app') focusWindow(appId);
        if (action === 'show-desktop') showDesktop();
        if (action === 'close-panels') closePanels();
        if (action === 'toggle-state') togglePanel('state-panel');
        if (action === 'clear-notices') {
          state.unreadNotifications = 0;
          document.querySelectorAll('.badge').forEach(function (badge) { badge.style.display = 'none'; });
          panels.notifications.querySelectorAll('.notice').forEach(function (notice) { notice.style.opacity = '.5'; });
          state.lastAction = '标记全部通知已读';
          syncState();
        }
        if (action === 'profile') {
          state.lastAction = '查看当前用户：林女士（家庭管理员）';
          togglePanel('state-panel');
        }
      });

      layer.addEventListener('click', function (event) {
        var win = event.target.closest('[data-window]');
        var dialogAction = event.target.closest('[data-dialog-action]');
        if (dialogAction && win) {
          if (dialogAction.getAttribute('data-dialog-action') === 'confirm') confirmFileDialog(win);
          else closeFileDialog(win);
          event.stopPropagation();
          return;
        }
        var backdrop = event.target.closest('[data-file-dialog-backdrop]');
        if (backdrop && event.target === backdrop && win) {
          closeFileDialog(win);
          event.stopPropagation();
          return;
        }
        var fileAction = event.target.closest('[data-file-action]');
        if (fileAction && win) {
          var fileActionName = fileAction.getAttribute('data-file-action');
          if (fileActionName === 'back') dispatchFileState({ type: 'BACK' });
          if (fileActionName === 'forward') dispatchFileState({ type: 'FORWARD' });
          if (fileActionName === 'back' || fileActionName === 'forward') renderFileNavigation(win);
          if (fileActionName === 'refresh') {
            fileAction.classList.add('refreshing');
            setTimeout(function () { fileAction.classList.remove('refreshing'); }, 550);
            showFileToast(win, '已刷新');
          }
          if (fileActionName === 'new-folder') openFileDialog(win, 'new-folder');
          if (fileActionName === 'permissions') openFileDialog(win, 'permissions');
          if (fileActionName === 'add-mount') openFileDialog(win, 'add-mount');
          if (fileActionName === 'upload') win.querySelector('[data-file-upload]').click();
          if (fileActionName === 'clear-recent') {
            var recentList = win.querySelector('[data-recent-list]');
            recentList.innerHTML = '';
            renderEmptyTable(recentList, '暂无最近访问记录');
            showFileToast(win, '最近访问记录已清除');
          }
          if (fileActionName === 'unfavorite') removeUtilityRow(win, fileAction, 'favorite', '已取消收藏', '暂无收藏');
          if (fileActionName === 'restore-trash') removeUtilityRow(win, fileAction, 'trash', '已还原', '回收站为空');
          if (fileActionName === 'delete-forever') removeUtilityRow(win, fileAction, 'trash', '已彻底删除', '回收站为空');
          if (fileActionName === 'empty-trash') {
            var trashList = win.querySelector('[data-trash-list]');
            trashList.innerHTML = '';
            updateUtilityCount(win, 'trash');
            renderEmptyTable(trashList, '回收站为空');
            showFileToast(win, '回收站已清空');
          }
          state.lastAction = '文件管理按钮：' + fileActionName;
          syncState();
          event.stopPropagation();
          return;
        }
        var treeToggle = event.target.closest('[data-tree-toggle]');
        if (treeToggle && win) {
          toggleTreeGroup(win, treeToggle);
          switchFileView(win, treeToggle.getAttribute('data-file-view'));
          event.stopPropagation();
          return;
        }
        var treeNode = event.target.closest('[data-file-node]');
        if (treeNode && win) {
          if (treeNode.hasAttribute('data-branch-toggle')) toggleTreeBranch(win, treeNode);
          navigateFile(win, treeNode.getAttribute('data-path'));
          event.stopPropagation();
          return;
        }
        var folderRow = event.target.closest('[data-folder-row]');
        if (folderRow && win) {
          toggleTableFolder(win, folderRow);
          event.stopPropagation();
          return;
        }
        var mount = event.target.closest('[data-open-mount]');
        if (mount && win) {
          win.querySelectorAll('.remote-card').forEach(function (card) { card.classList.toggle('selected', card === mount); });
          navigateFile(win, mount.getAttribute('data-open-mount'));
          event.stopPropagation();
          return;
        }
        var fileView = event.target.closest('[data-file-view]');
        if (fileView) {
          switchFileView(win, fileView.getAttribute('data-file-view'));
          event.stopPropagation();
          return;
        }
        var fileRow = event.target.closest('.file-table tbody tr');
        if (fileRow && win) {
          win.querySelectorAll('.file-table tbody tr').forEach(function (row) { row.classList.toggle('selected', row === fileRow); });
          recordRecentItem(win, fileRow);
          state.lastAction = '选择文件：' + (fileRow.getAttribute('data-search') || '文件');
          syncState();
          event.stopPropagation();
          return;
        }
        var control = event.target.closest('[data-window-action]');
        if (!control) return;
        var appId = win.getAttribute('data-window');
        var action = control.getAttribute('data-window-action');
        if (action === 'close') closeApp(appId);
        if (action === 'minimize') minimizeApp(appId);
        if (action === 'maximize') maximizeApp(appId);
        event.stopPropagation();
      });

      layer.addEventListener('input', function (event) {
        if (!event.target.matches('.file-search input')) return;
        var win = event.target.closest('[data-window]');
        var section = win.querySelector('[data-file-view-content]:not([hidden])');
        if (!section) return;
        var query = event.target.value.trim().toLowerCase();
        section.querySelectorAll('.file-table tbody tr').forEach(function (row) {
          if (query) row.hidden = (row.getAttribute('data-search') || row.textContent).toLowerCase().indexOf(query) < 0;
          else if (row.hasAttribute('data-row-child')) {
            var parent = section.querySelector('[data-folder-row="' + row.getAttribute('data-row-child') + '"]');
            row.hidden = !(parent && parent.classList.contains('expanded'));
          } else row.hidden = false;
        });
        state.lastAction = query ? '搜索文件：' + query : '清除文件搜索';
        syncState();
      });

      layer.addEventListener('change', function (event) {
        if (!event.target.matches('[data-file-upload]')) return;
        var win = event.target.closest('[data-window]');
        Array.prototype.forEach.call(event.target.files, function (file) { addFileRow(win, file.name, '文件'); });
        if (event.target.files.length) showFileToast(win, '已添加 ' + event.target.files.length + ' 个文件');
        event.target.value = '';
      });

      layer.addEventListener('keydown', function (event) {
        var mount = event.target.closest('[data-open-mount]');
        if (mount && (event.key === 'Enter' || event.key === ' ')) {
          event.preventDefault();
          mount.click();
        }
        if (event.key === 'Enter' && event.target.closest('[data-file-dialog-backdrop]')) {
          event.preventDefault();
          confirmFileDialog(event.target.closest('[data-window]'));
        }
      });

      document.getElementById('launcher-search').addEventListener('input', function (event) {
        var query = event.target.value.trim().toLowerCase();
        launcherGrid.querySelectorAll('[data-search-name]').forEach(function (button) {
          button.style.display = button.getAttribute('data-search-name').indexOf(query) >= 0 ? '' : 'none';
        });
      });

      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') {
          closePanels();
          var openDialog = layer.querySelector('[data-file-dialog-backdrop]:not([hidden])');
          if (openDialog) closeFileDialog(openDialog.closest('[data-window]'));
        }
        if (event.key === 'Meta' || event.key === 'Control') return;
        if (event.key.toLowerCase() === 'k' && (event.ctrlKey || event.metaKey)) {
          event.preventDefault();
          togglePanel('launcher');
          setTimeout(function () { document.getElementById('launcher-search').focus(); }, 50);
        }
      });

      buildLauncher();
      syncState();
    }());
  </script>
</body>
</html>
