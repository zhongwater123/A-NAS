<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A-NAS 移动端 · 布局预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef0ec;color:#202320;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft Yahei",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}header.preview{text-align:center;padding:28px 16px 18px;font-size:13px;color:#656a65}.phone{width:390px;height:844px;margin:0 auto 30px;background:#fcfcfa;border:7px solid #202320;border-radius:46px;overflow:hidden;display:flex;flex-direction:column;position:relative}.system{height:51px;padding:17px 25px 0;display:flex;justify-content:space-between;font-size:13px;font-weight:600}.island{position:absolute;top:12px;width:112px;height:28px;border-radius:20px;background:#202320;left:132px}.top{display:flex;align-items:center;padding:0 10px;gap:12px;min-height:60px}.top h1{font-size:18px;font-weight:600;flex:1;text-align:center;margin:0}.icon{border:0;background:none;min-width:48px;min-height:48px;display:grid;place-items:center;color:#202320}.avatar{border:1px solid #e5e7e2;border-radius:50%;object-fit:cover}.status{padding:0 22px 10px;color:#656a65;font-size:13px;line-height:22px}.screen{display:none;flex:1;min-height:0}.screen.active{display:flex;flex-direction:column}.conversation{flex:1;padding:30px 22px 15px;display:flex;flex-direction:column;justify-content:center;gap:16px}.conversation h2,.transfers h2{font-size:27px;font-weight:600;line-height:1.35;margin:0}.muted{font-size:14px;line-height:23px;color:#656a65;margin:0}.suggestion{background:#f0f2ed;color:#202320;border:0;border-radius:12px;min-height:46px;text-align:left;padding:12px 16px;width:fit-content;font-size:15px}.composer{display:flex;align-items:end;gap:6px;border:1px solid #e5e7e2;background:white;border-radius:22px;margin:20px 18px 12px;padding:6px}.composer textarea{background:none;border:0;resize:none;flex:1;min-width:0;padding:11px 8px;height:44px;color:#202320;outline:none;font-size:16px}.send{height:44px;min-width:44px;border-radius:50%;background:#202320;border:0;color:white;display:grid;place-items:center}.tabs{display:flex;border-top:1px solid #e5e7e2;padding:9px 0 23px;background:#fcfcfa}.tab{flex:1;min-height:49px;background:none;border:0;color:#656a65;font-size:12px;display:flex;align-items:center;flex-direction:column;justify-content:center;gap:5px}.tab[aria-selected=true]{color:#202320;font-weight:600}.home{position:absolute;bottom:8px;left:129px;width:118px;height:4px;background:#202320;border-radius:9px}.transfers{padding:22px;gap:18px}.actions{display:flex;gap:10px;margin-top:4px}.actions button{flex:1;padding:13px 8px;min-height:48px;border:0;border-radius:12px;background:#202320;color:white;font-size:14px}.actions button+button{background:#f0f2ed;color:#202320}.empty{border:1px solid #e5e7e2;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}.empty p{margin:0;font-size:16px}.label{font-size:14px;font-weight:600;margin-top:12px}.toast{margin:0 22px;color:#656a65;font-size:13px;min-height:22px}svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.menu{display:none;position:absolute;inset:90px 16px auto;background:#fff;border:1px solid #e5e7e2;border-radius:16px;padding:18px;z-index:2;box-shadow:0 8px 30px #0001}.menu.active{display:grid;gap:12px}.menu button{background:#f0f2ed;border:0;border-radius:10px;min-height:46px}.menu p{font-size:14px;color:#656a65;line-height:23px}button:focus-visible,textarea:focus-visible{outline:2px solid #357757;outline-offset:2px}@media(max-width:440px){header.preview{padding:12px;font-size:11px}.phone{width:100%;max-width:390px;height:calc(100dvh - 48px);min-height:670px;border:0;border-radius:0;margin:0 auto}.island{display:none}.system{display:none}.home{display:none}.tabs{padding-bottom:14px}}
</style></head><body><header class="preview">A-NAS · 两个入口的布局预览（不连接真实 NAS）</header><main class="phone"><div class="system"><span>9:41</span><span>▰</span></div><div class="island"></div><div class="top"><button class="icon" aria-label="历史对话" onclick="menu('history')"><svg viewBox="0 0 24 24"><path d="M3 11a9 9 0 1 1 2 7M3 4v7h7M12 7v5l3 2"/></svg></button><h1 id="title">VNAS</h1><button class="icon" aria-label="连接与账号" onclick="menu('account')"><img class="avatar" width="32" height="32" alt="VNAS" src="../../web/src/assets/assistant-logo.webp"></button></div><section id="chat" class="screen active"><div class="status">已连接 NAS 上的 VNAS · 状态示例</div><div class="conversation"><img class="avatar" width="60" height="60" alt="VNAS" src="../../web/src/assets/assistant-logo.webp"><h2>有什么交给我？</h2><p class="muted">查找 NAS 里的资料，或接着聊上次的事。</p><div style="height:8px"></div><button class="suggestion" onclick="draft(this.textContent)">帮我找一份文件</button><button class="suggestion" onclick="draft(this.textContent)">你能帮我做些什么？</button></div><div class="toast" id="chatnotice" role="status"></div><div class="composer"><textarea id="message" aria-label="发给 VNAS 的消息" placeholder="发消息给 VNAS"></textarea><button class="send" aria-label="发送消息" onclick="document.getElementById('chatnotice').textContent='布局预览不会发送消息，请在 APP 中连接 NAS。'"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div></section><section id="transfer" class="screen transfers"><h2>文件，随身往来</h2><p class="muted">从手机存到 NAS，也从 NAS 带到身边。</p><div class="actions"><button onclick="transferNotice('在 APP 中选择 NAS 目标文件夹，再选择手机文件。')">上传到 NAS</button><button onclick="transferNotice('在 APP 中浏览 NAS 文件，选择后下载至手机。')">从 NAS 下载</button></div><div class="label">本机传输</div><div class="empty"><p>还没有传输记录</p><p class="muted" style="font-size:14px">选择手机文件上传，或从 NAS 下载一份资料。传输进度会显示在这里。</p></div><p id="transfernotice" class="muted" role="status"></p></section><nav class="tabs" aria-label="主导航"><button class="tab" id="chat-tab" aria-selected="true" onclick="tab('chat')"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/></svg>聊天</button><button class="tab" id="transfer-tab" aria-selected="false" onclick="tab('transfer')"><svg viewBox="0 0 24 24"><path d="M7 3v17m-4-4 4 4 4-4m6 5V4m-4 4 4-4 4 4"/></svg>传输</button></nav><div class="home"></div><div id="menu" class="menu" role="dialog" aria-label="辅助页面预览"></div></main><script>
function tab(id){for(const name of ['chat','transfer']){document.getElementById(name).classList.toggle('active',id===name);document.getElementById(name+'-tab').setAttribute('aria-selected',String(id===name))}document.getElementById('title').textContent=id==='chat'?'VNAS':'传输';document.getElementById('menu').classList.remove('active')}
function draft(value){const input=document.getElementById('message');input.value=value;input.focus()}
function transferNotice(text){document.getElementById('transfernotice').textContent=text}
function menu(which){const el=document.getElementById('menu');el.innerHTML=which==='history'?'<strong>历史对话</strong><p>连接 NAS 后，这里显示本人账号的历史对话。</p><button onclick="tab(\'chat\')">新对话</button>':'<strong>连接与账号</strong><p>局域网测试地址<br>http://172.18.45.48</p><p>登录与账号切换在原生 APP 中完成。</p>';el.innerHTML+='<button onclick="document.getElementById(\'menu\').classList.remove(\'active\')">关闭</button>';el.classList.toggle('active')}
if(new URLSearchParams(location.search).get('tab')==='transfer')tab('transfer');
</script></body></html>
